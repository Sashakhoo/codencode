<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Session 07 — Statistics & Probability</title><style>
:root{--accent:#f97583;--bg:#0f0f1a;--text:#e8e8f0;--muted:#8888aa;--code-bg:#0d1117;--card:#1e2240;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;user-select:none;}
#deck{width:100%;height:100vh;display:flex;flex-direction:column;}
#topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.06);flex-shrink:0;gap:12px;}
#session-label{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--accent);text-transform:uppercase;white-space:nowrap;}
#slide-title-bar{font-size:12px;color:var(--muted);flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#topbar-right{display:flex;gap:8px;align-items:center;flex-shrink:0;}
#counter{font-size:12px;color:var(--muted);white-space:nowrap;}
.btn{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);color:var(--text);border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer;transition:all 0.15s;}
.btn:hover{background:var(--accent);border-color:var(--accent);color:#000;}
#progress-wrap{height:3px;background:rgba(255,255,255,0.05);flex-shrink:0;}
#progress-bar{height:100%;background:var(--accent);transition:width 0.3s ease;}
#slides-wrap{flex:1;position:relative;overflow:hidden;}
.slide{position:absolute;inset:0;display:none;flex-direction:column;padding:32px 48px 24px;overflow-y:auto;animation:fadeIn 0.25s ease;}
.slide.active{display:flex;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
#nav{display:flex;align-items:center;justify-content:center;gap:16px;padding:10px 24px;flex-shrink:0;border-top:1px solid rgba(255,255,255,0.06);}
.nav-btn{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);color:var(--text);padding:7px 26px;border-radius:8px;font-size:14px;cursor:pointer;transition:all 0.15s;}
.nav-btn:hover:not(:disabled){background:var(--accent);border-color:var(--accent);color:#000;}
.nav-btn:disabled{opacity:0.3;cursor:default;}
#dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:600px;}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.2);cursor:pointer;transition:all 0.2s;}
.dot.active{background:var(--accent);transform:scale(1.5);}
.slide-title{align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at 50% 40%,#1e2a4a 0%,#0f0f1a 70%);}
.session-badge{font-size:11px;font-weight:800;letter-spacing:3px;color:var(--accent);text-transform:uppercase;margin-bottom:20px;padding:5px 16px;border:1px solid var(--accent);border-radius:20px;display:inline-block;}
.slide-title h1{font-size:clamp(26px,3.4vw,46px);font-weight:800;line-height:1.15;margin-bottom:16px;background:linear-gradient(135deg,#fff 30%,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;white-space:pre-line;}
.slide-title .sub{font-size:14px;color:var(--muted);max-width:580px;line-height:1.6;margin-bottom:28px;}
.academy-tag{font-size:12px;color:var(--muted);letter-spacing:1px;}
.section-tag{font-size:10px;font-weight:700;letter-spacing:2.5px;color:var(--accent);text-transform:uppercase;margin-bottom:6px;}
.slide-heading{font-size:clamp(17px,2.2vw,28px);font-weight:700;margin-bottom:14px;line-height:1.25;}
.cards{display:grid;gap:11px;}
.cards-2{grid-template-columns:1fr 1fr;}
.cards-3{grid-template-columns:1fr 1fr 1fr;}
.cards-4{grid-template-columns:1fr 1fr 1fr 1fr;}
.card{background:var(--card);border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:14px 16px;}
.card-accent{border-left:3px solid var(--accent);}
.card-icon{font-size:22px;margin-bottom:6px;}
.card h3{font-size:13px;font-weight:700;margin-bottom:4px;color:#fff;}
.card p{font-size:12px;color:var(--muted);line-height:1.55;}
.steps{display:flex;flex-direction:column;gap:9px;}
.step{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:10px;padding:11px 14px;border:1px solid rgba(255,255,255,0.06);}
.step-num{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#000;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.step-body h4{font-size:13px;font-weight:700;margin-bottom:2px;}
.step-body p{font-size:12px;color:var(--muted);line-height:1.5;}
.code-wrap{background:var(--code-bg);border-radius:10px;border:1px solid rgba(255,255,255,0.08);overflow:hidden;margin:8px 0;}
.code-header{background:rgba(255,255,255,0.05);padding:5px 13px;font-size:11px;color:var(--muted);font-family:monospace;display:flex;justify-content:space-between;align-items:center;}
pre{padding:11px 15px;overflow-x:auto;font-family:'Cascadia Code','Fira Code',Consolas,monospace;font-size:12px;line-height:1.7;color:#c9d1d9;}
.kw{color:#ff7b72;}.fn{color:#d2a8ff;}.st{color:#a5d6ff;}.cm{color:#8b949e;font-style:italic;}.nm{color:#79c0ff;}.op{color:#ff9e64;}
.highlight{background:rgba(255,255,255,0.04);border-left:4px solid var(--accent);border-radius:0 8px 8px 0;padding:10px 14px;margin:8px 0;font-size:13px;line-height:1.6;}
.highlight strong{color:var(--accent);}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;flex:1;}
.warn{background:rgba(255,100,50,0.1);border:1px solid rgba(255,100,50,0.3);border-radius:8px;padding:9px 13px;font-size:12px;margin:6px 0;}
.tip{background:rgba(80,220,100,0.1);border:1px solid rgba(80,220,100,0.3);border-radius:8px;padding:9px 13px;font-size:12px;margin:6px 0;}
.roadmap{display:grid;grid-template-columns:1fr 1fr;gap:9px;flex:1;}
.roadmap-item{background:var(--card);border-radius:12px;padding:12px;border:1px solid rgba(255,255,255,0.06);display:flex;gap:9px;align-items:flex-start;}
.rm-num{font-size:18px;font-weight:900;color:var(--accent);opacity:0.4;line-height:1;flex-shrink:0;width:22px;}
.rm-icon{font-size:17px;flex-shrink:0;}
.rm-text h4{font-size:12px;font-weight:700;margin-bottom:2px;}
.rm-text p{font-size:11px;color:var(--muted);line-height:1.5;}
.recap-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;flex:1;}
.recap-item{background:var(--card);border-radius:10px;padding:12px;border-left:3px solid var(--accent);display:flex;gap:8px;align-items:flex-start;}
.recap-icon{font-size:17px;flex-shrink:0;}
.recap-text h4{font-size:13px;font-weight:700;margin-bottom:2px;}
.recap-text p{font-size:11px;color:var(--muted);line-height:1.5;}
.e-list{display:flex;flex-direction:column;gap:8px;}
.e-item{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.55;}
.e-icon{font-size:15px;flex-shrink:0;}
table{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0;}
th{background:rgba(255,255,255,0.06);padding:7px 10px;text-align:left;font-weight:700;color:var(--accent);}
td{padding:6px 10px;border-top:1px solid rgba(255,255,255,0.05);color:var(--muted);}
.slide::-webkit-scrollbar{width:4px;}
.slide::-webkit-scrollbar-track{background:transparent;}
.slide::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:2px;}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:700;margin:2px;}
.tag-green{background:rgba(80,200,80,0.2);color:#50c850;border:1px solid rgba(80,200,80,0.3);}
.tag-blue{background:rgba(80,150,255,0.2);color:#79c0ff;border:1px solid rgba(80,150,255,0.3);}
.tag-orange{background:rgba(255,150,50,0.2);color:#ff9e64;border:1px solid rgba(255,150,50,0.3);}
.big-concept{background:linear-gradient(135deg,#1e2a4a,#1e2240);border:1px solid rgba(249,117,131,0.3);border-radius:14px;padding:20px 24px;margin:10px 0;text-align:center;}
.big-concept .bc-emoji{font-size:36px;margin-bottom:8px;}
.big-concept h2{font-size:20px;font-weight:800;color:#fff;margin-bottom:6px;}
.big-concept p{font-size:13px;color:var(--muted);line-height:1.6;}

@media(max-width:700px){
  body{overflow:auto;}
  #deck{height:auto;min-height:100vh;}
  #slides-wrap{height:auto;min-height:60vh;}
  .slide{position:relative;inset:auto;display:none;padding:16px 16px 12px;}
  .slide.active{display:flex;}
  .cards-2,.cards-3,.cards-4{grid-template-columns:1fr;}
  .two-col,.roadmap,.recap-grid{grid-template-columns:1fr;}
  #session-label{display:none;}
  #slide-title-bar{display:none;}
  pre{font-size:10px;line-height:1.6;}
  .nav-btn{padding:6px 14px;font-size:13px;}
  #dots{max-width:100%;}
  .dot{width:5px;height:5px;}
  .big-concept{padding:14px 16px;}
  .big-concept h2{font-size:16px;}
  .big-concept .bc-emoji{font-size:28px;}
  .slide-heading{font-size:18px;}
  #topbar{padding:8px 12px;gap:6px;}
  #nav{padding:8px 12px;gap:10px;}
  table{font-size:10px;}
  th,td{padding:5px 6px;}
  .card h3{font-size:12px;}
  .card p{font-size:11px;}
  .highlight,.tip,.warn{font-size:11px;}
  .step-body h4{font-size:12px;}
  .step-body p{font-size:11px;}
}
</style></head><body>
<div id="deck">
<div id="topbar"><div id="session-label">Session 07 · codencode Academy</div><div id="slide-title-bar"></div><div id="topbar-right"><span id="counter"></span><button class="btn" onclick="toggleFS()">⛶ Fullscreen</button></div></div>
<div id="progress-wrap"><div id="progress-bar"></div></div>
<div id="slides-wrap"></div>
<div id="nav"><button class="nav-btn" id="prev-btn" onclick="go(-1)">← Prev</button><div id="dots"></div><button class="nav-btn" id="next-btn" onclick="go(1)">Next →</button></div>
</div><script>
const SLIDES_DATA = [{"label": "Title", "html": "<div class=\"slide-title\" style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;\"><div class=\"session-badge\">Session 07 of 15</div><div style=\"font-size:48px;margin-bottom:12px;\">📐</div><h1>Statistics &amp; Probability</h1><p class=\"sub\">The mathematical foundation of data science — understand what your data is actually saying before you model it</p><div style=\"display:flex;gap:12px;justify-content:center;margin-top:14px;flex-wrap:wrap;\"><span class=\"tag tag-blue\">Descriptive Stats</span><span class=\"tag tag-green\">Distributions</span><span class=\"tag tag-orange\">Correlation</span><span class=\"tag tag-blue\">Probability</span><span class=\"tag tag-green\">Hypothesis Testing</span></div><div class=\"academy-tag\" style=\"margin-top:20px;\">codencode Academy · Python + Data Science</div></div>"}, {"label": "Today's Roadmap", "html": "<div class=\"section-tag\">Roadmap</div><div class=\"slide-heading\">What We'll Cover Today 🗺️</div><div class=\"roadmap\"><div class=\"roadmap-item\"><div class=\"rm-num\">01</div><div class=\"rm-icon\">📏</div><div class=\"rm-text\"><h4>Descriptive Statistics</h4><p>Mean, median, mode — when to use each, and how outliers affect them</p></div></div><div class=\"roadmap-item\"><div class=\"rm-num\">02</div><div class=\"rm-icon\">📉</div><div class=\"rm-text\"><h4>Spread: Variance &amp; Std Dev</h4><p>How spread out is data? Why std dev matters more than variance in practice</p></div></div><div class=\"roadmap-item\"><div class=\"rm-num\">03</div><div class=\"rm-icon\">🔔</div><div class=\"rm-text\"><h4>Distributions</h4><p>Normal, skewed, uniform — recognise them, test for normality</p></div></div><div class=\"roadmap-item\"><div class=\"rm-num\">04</div><div class=\"rm-icon\">🔗</div><div class=\"rm-text\"><h4>Correlation</h4><p>Pearson vs Spearman, heatmaps, correlation ≠ causation</p></div></div><div class=\"roadmap-item\"><div class=\"rm-num\">05</div><div class=\"rm-icon\">🎲</div><div class=\"rm-text\"><h4>Probability Basics</h4><p>P(event), conditional probability, Bayes intuition</p></div></div><div class=\"roadmap-item\"><div class=\"rm-num\">06</div><div class=\"rm-icon\">🧪</div><div class=\"rm-text\"><h4>Hypothesis Testing</h4><p>t-test, p-value, when to reject the null hypothesis</p></div></div></div>"}, {"label": "Why Statistics?", "html": "<div class=\"section-tag\">Motivation</div><div class=\"slide-heading\">Why Statistics? The Foundation of ML 🏗️</div><div class=\"big-concept\"><div class=\"bc-emoji\">🏗️</div><h2>Every ML algorithm is statistics in disguise</h2><p>Linear regression = minimising variance. Decision trees = information gain (entropy). Neural networks = gradient descent on a loss function. If you don't understand statistics, you can't debug models or interpret results.</p></div><div class=\"cards cards-3\" style=\"margin-top:10px;\"><div class=\"card card-accent\"><div class=\"card-icon\">🔍</div><h3>Before Modelling</h3><p>Understand your data distribution. Are features normally distributed? Are there outliers? These affect which algorithms work.</p></div><div class=\"card card-accent\"><div class=\"card-icon\">🎯</div><h3>Choosing Metrics</h3><p>RMSE vs MAE? Accuracy vs F1? The right metric depends on the statistical properties of your target variable.</p></div><div class=\"card card-accent\"><div class=\"card-icon\">✅</div><h3>Validating Results</h3><p>Is your model improvement real or luck? Hypothesis testing and confidence intervals answer this question.</p></div></div>"}, {"label": "Mean, Median, Mode", "html": "<div class=\"section-tag\">Descriptive Stats</div><div class=\"slide-heading\">Mean, Median, Mode — When to Use Each 📏</div><div class=\"code-wrap\"><div class=\"code-header\"><span>central_tendency.py</span><span>python</span></div><pre><span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n<span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\nsalaries = pd.Series([<span class=\"nm\">3000</span>, <span class=\"nm\">3200</span>, <span class=\"nm\">3100</span>, <span class=\"nm\">3500</span>, <span class=\"nm\">3300</span>,\n                       <span class=\"nm\">3400</span>, <span class=\"nm\">3250</span>, <span class=\"nm\">15000</span>])  <span class=\"cm\"># one CEO!</span>\n\n<span class=\"fn\">print</span>(<span class=\"st\">f\"Mean:   {salaries.mean():.0f}\"</span>)   <span class=\"cm\"># 4844 — pulled by CEO</span>\n<span class=\"fn\">print</span>(<span class=\"st\">f\"Median: {salaries.median():.0f}\"</span>) <span class=\"cm\"># 3325 — better here</span>\n<span class=\"fn\">print</span>(<span class=\"st\">f\"Mode:   {salaries.mode()[0]}\"</span>)   <span class=\"cm\"># most frequent value</span>\n\n<span class=\"cm\"># Quantiles / percentiles</span>\n<span class=\"fn\">print</span>(salaries.quantile(<span class=\"nm\">0.25</span>))  <span class=\"cm\"># Q1 (25th percentile)</span>\n<span class=\"fn\">print</span>(salaries.quantile(<span class=\"nm\">0.75</span>))  <span class=\"cm\"># Q3 (75th percentile)</span>\niqr = salaries.quantile(<span class=\"nm\">0.75</span>) - salaries.quantile(<span class=\"nm\">0.25</span>)\n<span class=\"fn\">print</span>(<span class=\"st\">f\"IQR: {iqr}\"</span>)              <span class=\"cm\"># interquartile range</span></pre></div><div class=\"cards cards-3\" style=\"margin-top:8px;\"><div class=\"card card-accent\"><h3>Use Mean when…</h3><p>Data is symmetric (no outliers). Household electricity usage, test scores, heights. Sensitive to extreme values.</p></div><div class=\"card card-accent\"><h3>Use Median when…</h3><p>Data has outliers or is skewed. Income, house prices, response times. Outlier-resistant.</p></div><div class=\"card card-accent\"><h3>Use Mode when…</h3><p>Categorical data or discrete counts. Most common shoe size, most frequent transaction category.</p></div></div>"}, {"label": "Variance and Std Dev", "html": "<div class=\"section-tag\">Key Concept</div><div class=\"slide-heading\">Variance &amp; Std Deviation — How Spread Out Is Your Data? 📏</div><svg viewBox=\"0 0 540 260\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:540px;display:block;margin:6px auto;\">\n  <rect width=\"540\" height=\"260\" fill=\"rgba(0,0,0,0.45)\" rx=\"10\"/>\n  <text x=\"270\" y=\"22\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"13\" font-weight=\"bold\" font-family=\"monospace\">Variance &amp; Std Deviation — Same Mean, Different Spread</text>\n  <!-- Dataset A: tight -->\n  <text x=\"270\" y=\"48\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.6)\" font-size=\"11\" font-family=\"monospace\">Both datasets have mean = 50 ——— but they feel completely different</text>\n  <!-- Number line A -->\n  <text x=\"20\" y=\"82\" fill=\"#4facfe\" font-size=\"11\" font-weight=\"bold\" font-family=\"monospace\">Dataset A</text>\n  <text x=\"20\" y=\"95\" fill=\"rgba(79,172,254,0.6)\" font-size=\"9\" font-family=\"monospace\">(low variance)</text>\n  <line x1=\"110\" y1=\"90\" x2=\"520\" y2=\"90\" stroke=\"rgba(255,255,255,0.2)\" stroke-width=\"1.5\"/>\n  <!-- Axis ticks -->\n  <line x1=\"160\" y1=\"86\" x2=\"160\" y2=\"94\" stroke=\"rgba(255,255,255,0.3)\" stroke-width=\"1\"/>\n  <line x1=\"235\" y1=\"86\" x2=\"235\" y2=\"94\" stroke=\"rgba(255,255,255,0.3)\" stroke-width=\"1\"/>\n  <line x1=\"310\" y1=\"86\" x2=\"310\" y2=\"94\" stroke=\"rgba(255,255,255,0.3)\" stroke-width=\"1\"/>\n  <line x1=\"385\" y1=\"86\" x2=\"385\" y2=\"94\" stroke=\"rgba(255,255,255,0.3)\" stroke-width=\"1\"/>\n  <line x1=\"460\" y1=\"86\" x2=\"460\" y2=\"94\" stroke=\"rgba(255,255,255,0.3)\" stroke-width=\"1\"/>\n  <text x=\"160\" y=\"107\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.4)\" font-size=\"9\" font-family=\"monospace\">20</text>\n  <text x=\"235\" y=\"107\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.4)\" font-size=\"9\" font-family=\"monospace\">35</text>\n  <text x=\"310\" y=\"107\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.4)\" font-size=\"9\" font-family=\"monospace\">50</text>\n  <text x=\"385\" y=\"107\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.4)\" font-size=\"9\" font-family=\"monospace\">65</text>\n  <text x=\"460\" y=\"107\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.4)\" font-size=\"9\" font-family=\"monospace\">80</text>\n  <!-- Dots A: clustered near 50 — values 46,48,49,50,50,51,52,54 -->\n  <circle cx=\"280\" cy=\"90\" r=\"6\" fill=\"#4facfe\" opacity=\"0.9\"/>\n  <circle cx=\"295\" cy=\"90\" r=\"6\" fill=\"#4facfe\" opacity=\"0.9\"/>\n  <circle cx=\"305\" cy=\"90\" r=\"6\" fill=\"#4facfe\" opacity=\"0.9\"/>\n  <circle cx=\"315\" cy=\"90\" r=\"6\" fill=\"#4facfe\" opacity=\"0.9\"/>\n  <circle cx=\"325\" cy=\"90\" r=\"6\" fill=\"#4facfe\" opacity=\"0.9\"/>\n  <circle cx=\"265\" cy=\"90\" r=\"6\" fill=\"#4facfe\" opacity=\"0.9\"/>\n  <circle cx=\"252\" cy=\"90\" r=\"6\" fill=\"#4facfe\" opacity=\"0.9\"/>\n  <circle cx=\"338\" cy=\"90\" r=\"6\" fill=\"#4facfe\" opacity=\"0.9\"/>\n  <!-- Mean line A -->\n  <line x1=\"310\" y1=\"70\" x2=\"310\" y2=\"112\" stroke=\"#FFD166\" stroke-width=\"2\" stroke-dasharray=\"4,3\"/>\n  <text x=\"310\" y=\"68\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"9\" font-family=\"monospace\">μ=50</text>\n  <!-- Std dev bracket A -->\n  <line x1=\"270\" y1=\"118\" x2=\"350\" y2=\"118\" stroke=\"#4facfe\" stroke-width=\"1.5\"/>\n  <line x1=\"270\" y1=\"114\" x2=\"270\" y2=\"122\" stroke=\"#4facfe\" stroke-width=\"1.5\"/>\n  <line x1=\"350\" y1=\"114\" x2=\"350\" y2=\"122\" stroke=\"#4facfe\" stroke-width=\"1.5\"/>\n  <text x=\"310\" y=\"133\" text-anchor=\"middle\" fill=\"#4facfe\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">σ = 3.5  (tight cluster)</text>\n\n  <!-- Dataset B: spread -->\n  <text x=\"20\" y=\"162\" fill=\"#f5576c\" font-size=\"11\" font-weight=\"bold\" font-family=\"monospace\">Dataset B</text>\n  <text x=\"20\" y=\"175\" fill=\"rgba(245,87,108,0.6)\" font-size=\"9\" font-family=\"monospace\">(high variance)</text>\n  <line x1=\"110\" y1=\"168\" x2=\"520\" y2=\"168\" stroke=\"rgba(255,255,255,0.2)\" stroke-width=\"1.5\"/>\n  <line x1=\"160\" y1=\"164\" x2=\"160\" y2=\"172\" stroke=\"rgba(255,255,255,0.3)\" stroke-width=\"1\"/>\n  <line x1=\"235\" y1=\"164\" x2=\"235\" y2=\"172\" stroke=\"rgba(255,255,255,0.3)\" stroke-width=\"1\"/>\n  <line x1=\"310\" y1=\"164\" x2=\"310\" y2=\"172\" stroke=\"rgba(255,255,255,0.3)\" stroke-width=\"1\"/>\n  <line x1=\"385\" y1=\"164\" x2=\"385\" y2=\"172\" stroke=\"rgba(255,255,255,0.3)\" stroke-width=\"1\"/>\n  <line x1=\"460\" y1=\"164\" x2=\"460\" y2=\"172\" stroke=\"rgba(255,255,255,0.3)\" stroke-width=\"1\"/>\n  <text x=\"160\" y=\"185\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.4)\" font-size=\"9\" font-family=\"monospace\">20</text>\n  <text x=\"235\" y=\"185\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.4)\" font-size=\"9\" font-family=\"monospace\">35</text>\n  <text x=\"310\" y=\"185\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.4)\" font-size=\"9\" font-family=\"monospace\">50</text>\n  <text x=\"385\" y=\"185\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.4)\" font-size=\"9\" font-family=\"monospace\">65</text>\n  <text x=\"460\" y=\"185\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.4)\" font-size=\"9\" font-family=\"monospace\">80</text>\n  <!-- Dots B: spread wide — values 10,22,35,45,50,55,65,78,90 -->\n  <circle cx=\"128\" cy=\"168\" r=\"6\" fill=\"#f5576c\" opacity=\"0.9\"/>\n  <circle cx=\"166\" cy=\"168\" r=\"6\" fill=\"#f5576c\" opacity=\"0.9\"/>\n  <circle cx=\"215\" cy=\"168\" r=\"6\" fill=\"#f5576c\" opacity=\"0.9\"/>\n  <circle cx=\"260\" cy=\"168\" r=\"6\" fill=\"#f5576c\" opacity=\"0.9\"/>\n  <circle cx=\"310\" cy=\"168\" r=\"6\" fill=\"#f5576c\" opacity=\"0.9\"/>\n  <circle cx=\"358\" cy=\"168\" r=\"6\" fill=\"#f5576c\" opacity=\"0.9\"/>\n  <circle cx=\"405\" cy=\"168\" r=\"6\" fill=\"#f5576c\" opacity=\"0.9\"/>\n  <circle cx=\"458\" cy=\"168\" r=\"6\" fill=\"#f5576c\" opacity=\"0.9\"/>\n  <circle cx=\"492\" cy=\"168\" r=\"6\" fill=\"#f5576c\" opacity=\"0.9\"/>\n  <!-- Mean line B -->\n  <line x1=\"310\" y1=\"148\" x2=\"310\" y2=\"190\" stroke=\"#FFD166\" stroke-width=\"2\" stroke-dasharray=\"4,3\"/>\n  <text x=\"310\" y=\"146\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"9\" font-family=\"monospace\">μ=50</text>\n  <!-- Std dev bracket B -->\n  <line x1=\"160\" y1=\"196\" x2=\"460\" y2=\"196\" stroke=\"#f5576c\" stroke-width=\"1.5\"/>\n  <line x1=\"160\" y1=\"192\" x2=\"160\" y2=\"200\" stroke=\"#f5576c\" stroke-width=\"1.5\"/>\n  <line x1=\"460\" y1=\"192\" x2=\"460\" y2=\"200\" stroke=\"#f5576c\" stroke-width=\"1.5\"/>\n  <text x=\"310\" y=\"212\" text-anchor=\"middle\" fill=\"#f5576c\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">σ = 27  (wide spread)</text>\n  <!-- Summary -->\n  <text x=\"270\" y=\"238\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.7)\" font-size=\"10\" font-family=\"monospace\">Variance = σ²  |  Std Dev σ = √variance  |  Low σ = predictable  |  High σ = unpredictable</text>\n</svg><div class=\"code-wrap\" style=\"margin-top:6px;\"><div class=\"code-header\"><span>std_dev.py</span><span>python</span></div><pre><span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n<span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n\nA = np.array([<span class=\"nm\">46</span>, <span class=\"nm\">48</span>, <span class=\"nm\">49</span>, <span class=\"nm\">50</span>, <span class=\"nm\">51</span>, <span class=\"nm\">52</span>, <span class=\"nm\">54</span>])\nB = np.array([<span class=\"nm\">10</span>, <span class=\"nm\">22</span>, <span class=\"nm\">35</span>, <span class=\"nm\">50</span>, <span class=\"nm\">65</span>, <span class=\"nm\">78</span>, <span class=\"nm\">90</span>])\n\n<span class=\"kw\">for</span> name, arr <span class=\"kw\">in</span> [(<span class=\"st\">\"A (tight)\"</span>, A), (<span class=\"st\">\"B (spread)\"</span>, B)]:\n    <span class=\"fn\">print</span>(<span class=\"st\">f\"{name}:\"</span>)\n    <span class=\"fn\">print</span>(<span class=\"st\">f\"  Mean:     {arr.mean():.1f}\"</span>)\n    <span class=\"fn\">print</span>(<span class=\"st\">f\"  Variance: {arr.var():.1f}\"</span>)   <span class=\"cm\"># avg squared distance from mean</span>\n    <span class=\"fn\">print</span>(<span class=\"st\">f\"  Std Dev:  {arr.std():.1f}\"</span>)   <span class=\"cm\"># sqrt(variance) — same units as data</span>\n\n<span class=\"cm\"># On a DataFrame column</span>\ndf = pd.DataFrame({<span class=\"st\">\"salary\"</span>: [<span class=\"nm\">45000</span>, <span class=\"nm\">52000</span>, <span class=\"nm\">48000</span>, <span class=\"nm\">95000</span>, <span class=\"nm\">51000</span>]})\n<span class=\"fn\">print</span>(df[<span class=\"st\">\"salary\"</span>].std())   <span class=\"cm\"># ddof=1 by default (sample std dev)</span></pre></div><div class=\"tip\">💡 <strong>High std dev = high risk.</strong> A stock with σ=$50/day is much riskier than one with σ=$2/day — even if both have the same average price.</div>"}, {"label": "Distributions", "html": "<div class=\"section-tag\">Visualised</div><div class=\"slide-heading\">Distribution Shapes — Know What Your Data Looks Like 📊</div><svg viewBox=\"0 0 560 290\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:560px;display:block;margin:6px auto;\">\n  <rect width=\"560\" height=\"290\" fill=\"rgba(0,0,0,0.45)\" rx=\"10\"/>\n  <text x=\"280\" y=\"22\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"13\" font-weight=\"bold\" font-family=\"monospace\">Distribution Shapes — What They Look Like</text>\n  <!-- PANEL 1: Normal / Bell curve -->\n  <rect x=\"10\" y=\"32\" width=\"168\" height=\"190\" fill=\"rgba(79,172,254,0.05)\" stroke=\"rgba(79,172,254,0.2)\" rx=\"8\"/>\n  <text x=\"94\" y=\"50\" text-anchor=\"middle\" fill=\"#4facfe\" font-size=\"11\" font-weight=\"bold\" font-family=\"monospace\">Normal</text>\n  <text x=\"94\" y=\"63\" text-anchor=\"middle\" fill=\"rgba(79,172,254,0.7)\" font-size=\"9\" font-family=\"monospace\">(Bell Curve)</text>\n  <!-- Bell curve path approximated -->\n  <path d=\"M 18 195 Q 30 195 40 190 Q 55 180 65 158 Q 75 130 85 110 Q 90 100 94 95 Q 98 100 103 110 Q 113 130 123 158 Q 133 180 148 190 Q 158 195 170 195\" fill=\"rgba(79,172,254,0.2)\" stroke=\"#4facfe\" stroke-width=\"2\" fill-opacity=\"0.3\"/>\n  <line x1=\"18\" y1=\"195\" x2=\"170\" y2=\"195\" stroke=\"rgba(255,255,255,0.2)\" stroke-width=\"1\"/>\n  <!-- Mean line -->\n  <line x1=\"94\" y1=\"95\" x2=\"94\" y2=\"198\" stroke=\"#FFD166\" stroke-width=\"1.5\" stroke-dasharray=\"3,3\"/>\n  <text x=\"94\" y=\"210\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"9\" font-family=\"monospace\">mean</text>\n  <!-- ±1σ lines -->\n  <line x1=\"69\" y1=\"115\" x2=\"69\" y2=\"198\" stroke=\"rgba(79,172,254,0.4)\" stroke-width=\"1\" stroke-dasharray=\"2,3\"/>\n  <line x1=\"119\" y1=\"115\" x2=\"119\" y2=\"198\" stroke=\"rgba(79,172,254,0.4)\" stroke-width=\"1\" stroke-dasharray=\"2,3\"/>\n  <text x=\"94\" y=\"223\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.5)\" font-size=\"8.5\" font-family=\"monospace\">68% within ±1σ</text>\n  <text x=\"94\" y=\"235\" text-anchor=\"middle\" fill=\"#4facfe\" font-size=\"9\" font-family=\"monospace\">Mean = Median = Mode</text>\n\n  <!-- PANEL 2: Right-skewed -->\n  <rect x=\"196\" y=\"32\" width=\"168\" height=\"190\" fill=\"rgba(255,209,102,0.05)\" stroke=\"rgba(255,209,102,0.2)\" rx=\"8\"/>\n  <text x=\"280\" y=\"50\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"11\" font-weight=\"bold\" font-family=\"monospace\">Right-Skewed</text>\n  <text x=\"280\" y=\"63\" text-anchor=\"middle\" fill=\"rgba(255,209,102,0.7)\" font-size=\"9\" font-family=\"monospace\">(positive skew)</text>\n  <!-- Right-skewed curve: peak on left, long tail to right -->\n  <path d=\"M 204 195 Q 215 195 225 165 Q 232 135 240 110 Q 248 90 252 85 Q 258 90 268 120 Q 285 155 310 178 Q 330 188 355 193 Q 360 195 364 195\" fill=\"rgba(255,209,102,0.2)\" stroke=\"#FFD166\" stroke-width=\"2\" fill-opacity=\"0.3\"/>\n  <line x1=\"204\" y1=\"195\" x2=\"364\" y2=\"195\" stroke=\"rgba(255,255,255,0.2)\" stroke-width=\"1\"/>\n  <!-- Mode, median, mean positions -->\n  <line x1=\"252\" y1=\"85\" x2=\"252\" y2=\"198\" stroke=\"#43e97b\" stroke-width=\"1.5\" stroke-dasharray=\"3,3\"/>\n  <line x1=\"270\" y1=\"110\" x2=\"270\" y2=\"198\" stroke=\"#4facfe\" stroke-width=\"1.5\" stroke-dasharray=\"3,3\"/>\n  <line x1=\"295\" y1=\"140\" x2=\"295\" y2=\"198\" stroke=\"#f5576c\" stroke-width=\"1.5\" stroke-dasharray=\"3,3\"/>\n  <text x=\"252\" y=\"210\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"8\" font-family=\"monospace\">mode</text>\n  <text x=\"270\" y=\"222\" text-anchor=\"middle\" fill=\"#4facfe\" font-size=\"8\" font-family=\"monospace\">med</text>\n  <text x=\"295\" y=\"210\" text-anchor=\"middle\" fill=\"#f5576c\" font-size=\"8\" font-family=\"monospace\">mean</text>\n  <text x=\"280\" y=\"238\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.5)\" font-size=\"8.5\" font-family=\"monospace\">e.g. income, house prices</text>\n\n  <!-- PANEL 3: Left-skewed -->\n  <rect x=\"382\" y=\"32\" width=\"168\" height=\"190\" fill=\"rgba(245,87,108,0.05)\" stroke=\"rgba(245,87,108,0.2)\" rx=\"8\"/>\n  <text x=\"466\" y=\"50\" text-anchor=\"middle\" fill=\"#f5576c\" font-size=\"11\" font-weight=\"bold\" font-family=\"monospace\">Left-Skewed</text>\n  <text x=\"466\" y=\"63\" text-anchor=\"middle\" fill=\"rgba(245,87,108,0.7)\" font-size=\"9\" font-family=\"monospace\">(negative skew)</text>\n  <!-- Left-skewed: long tail to left, peak on right -->\n  <path d=\"M 390 195 Q 395 195 420 193 Q 445 188 465 178 Q 490 155 507 120 Q 515 90 520 90 Q 525 85 528 85 Q 532 90 538 110 Q 542 130 544 160 Q 546 182 548 195\" fill=\"rgba(245,87,108,0.2)\" stroke=\"#f5576c\" stroke-width=\"2\" fill-opacity=\"0.3\"/>\n  <line x1=\"390\" y1=\"195\" x2=\"548\" y2=\"195\" stroke=\"rgba(255,255,255,0.2)\" stroke-width=\"1\"/>\n  <!-- Mode, median, mean -->\n  <line x1=\"526\" y1=\"85\" x2=\"526\" y2=\"198\" stroke=\"#43e97b\" stroke-width=\"1.5\" stroke-dasharray=\"3,3\"/>\n  <line x1=\"508\" y1=\"110\" x2=\"508\" y2=\"198\" stroke=\"#4facfe\" stroke-width=\"1.5\" stroke-dasharray=\"3,3\"/>\n  <line x1=\"484\" y1=\"140\" x2=\"484\" y2=\"198\" stroke=\"#FFD166\" stroke-width=\"1.5\" stroke-dasharray=\"3,3\"/>\n  <text x=\"526\" y=\"210\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"8\" font-family=\"monospace\">mode</text>\n  <text x=\"508\" y=\"222\" text-anchor=\"middle\" fill=\"#4facfe\" font-size=\"8\" font-family=\"monospace\">med</text>\n  <text x=\"484\" y=\"210\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"8\" font-family=\"monospace\">mean</text>\n  <text x=\"466\" y=\"238\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.5)\" font-size=\"8.5\" font-family=\"monospace\">e.g. exam scores, age at death</text>\n  <!-- Bottom summary -->\n  <text x=\"280\" y=\"262\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.6)\" font-size=\"10\" font-family=\"monospace\">Right skew → mean pulled RIGHT by outliers   |   Left skew → mean pulled LEFT</text>\n  <text x=\"280\" y=\"278\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.5)\" font-size=\"9.5\" font-family=\"monospace\">Always check: sns.histplot(df[\"col\"], kde=True) before assuming normality!</text>\n</svg><div class=\"code-wrap\" style=\"margin-top:6px;\"><div class=\"code-header\"><span>distributions.py</span><span>python</span></div><pre><span class=\"kw\">import</span> seaborn <span class=\"kw\">as</span> sns\n<span class=\"kw\">import</span> matplotlib.pyplot <span class=\"kw\">as</span> plt\n<span class=\"kw\">from</span> scipy <span class=\"kw\">import</span> stats\n\ndf = sns.load_dataset(<span class=\"st\">\"titanic\"</span>)\n\n<span class=\"cm\"># Plot distribution with KDE curve</span>\nfig, axes = plt.subplots(<span class=\"nm\">1</span>, <span class=\"nm\">2</span>, figsize=(<span class=\"nm\">12</span>, <span class=\"nm\">4</span>))\nsns.histplot(df[<span class=\"st\">\"age\"</span>].dropna(), kde=<span class=\"kw\">True</span>, ax=axes[<span class=\"nm\">0</span>])\naxes[<span class=\"nm\">0</span>].set_title(<span class=\"st\">\"Age — slightly normal\"</span>)\nsns.histplot(df[<span class=\"st\">\"fare\"</span>], kde=<span class=\"kw\">True</span>, ax=axes[<span class=\"nm\">1</span>])\naxes[<span class=\"nm\">1</span>].set_title(<span class=\"st\">\"Fare — right skewed\"</span>)\nplt.tight_layout(); plt.show()\n\n<span class=\"cm\"># Check skewness numerically</span>\n<span class=\"fn\">print</span>(<span class=\"st\">f\"Age skewness:  {df.age.skew():.2f}\"</span>)    <span class=\"cm\"># near 0 = normal</span>\n<span class=\"fn\">print</span>(<span class=\"st\">f\"Fare skewness: {df.fare.skew():.2f}\"</span>)   <span class=\"cm\"># +4.8 = heavily right-skewed</span></pre></div><div class=\"tip\">💡 Right-skewed data (income, prices) → use <strong>log transform</strong> to normalise before regression: <code>df[\"log_fare\"] = np.log1p(df[\"fare\"])</code></div>"}, {"label": "Correlation", "html": "<div class=\"section-tag\">Relationships</div><div class=\"slide-heading\">Correlation — How Related Are Two Variables? 🔗</div><div class=\"code-wrap\"><div class=\"code-header\"><span>correlation.py</span><span>python</span></div><pre><span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n<span class=\"kw\">import</span> seaborn <span class=\"kw\">as</span> sns\n<span class=\"kw\">import</span> matplotlib.pyplot <span class=\"kw\">as</span> plt\n\ndf = pd.read_csv(<span class=\"st\">\"housing.csv\"</span>)\n\n<span class=\"cm\"># Pearson correlation (-1 to +1)</span>\n<span class=\"cm\"># +1 = perfect positive, 0 = none, -1 = perfect negative</span>\ncorr = df.corr(numeric_only=<span class=\"kw\">True</span>)\n<span class=\"fn\">print</span>(corr[<span class=\"st\">\"price\"</span>].sort_values(ascending=<span class=\"kw\">False</span>))\n\n<span class=\"cm\"># Visualise all correlations</span>\nfig, ax = plt.subplots(figsize=(<span class=\"nm\">10</span>,<span class=\"nm\">8</span>))\nsns.heatmap(corr, annot=<span class=\"kw\">True</span>, fmt=<span class=\"st\">\".2f\"</span>, cmap=<span class=\"st\">\"coolwarm\"</span>,\n            center=<span class=\"nm\">0</span>, linewidths=<span class=\"nm\">0.5</span>, ax=ax)\nax.set_title(<span class=\"st\">\"Feature Correlation Heatmap\"</span>)\nplt.tight_layout(); plt.show()\n\n<span class=\"cm\"># Spearman: use when relationship is monotonic but not linear</span>\nspearman = df.corr(method=<span class=\"st\">\"spearman\"</span>, numeric_only=<span class=\"kw\">True</span>)\n\n<span class=\"cm\"># Find top correlated pairs with price</span>\ntop = corr[<span class=\"st\">\"price\"</span>].abs().sort_values(ascending=<span class=\"kw\">False</span>).head(<span class=\"nm\">5</span>)\n<span class=\"fn\">print</span>(top)</pre></div><div class=\"warn\">⚠️ <strong>Correlation ≠ Causation.</strong> Ice cream sales and drowning deaths are highly correlated — both increase in summer. Always seek a logical mechanism.</div>"}, {"label": "Probability Basics", "html": "<div class=\"section-tag\">Probability</div><div class=\"slide-heading\">Probability — The Language of Uncertainty 🎲</div><div class=\"code-wrap\"><div class=\"code-header\"><span>probability.py</span><span>python</span></div><pre><span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\n<span class=\"cm\"># P(event) = favourable outcomes / total outcomes</span>\ncoin_flips = np.random.choice([<span class=\"st\">\"H\"</span>,<span class=\"st\">\"T\"</span>], size=<span class=\"nm\">10000</span>)\np_heads = (coin_flips == <span class=\"st\">\"H\"</span>).mean()\n<span class=\"fn\">print</span>(<span class=\"st\">f\"P(Heads) = {p_heads:.3f}\"</span>)  <span class=\"cm\"># ≈ 0.500</span>\n\n<span class=\"cm\"># ── Normal distribution probability ──────────────────────</span>\nfrom scipy <span class=\"kw\">import</span> stats\n<span class=\"cm\"># If exam scores ~ Normal(mean=70, std=10):</span>\ndist = stats.norm(loc=<span class=\"nm\">70</span>, scale=<span class=\"nm\">10</span>)\n<span class=\"fn\">print</span>(<span class=\"st\">f\"P(score > 85) = {1 - dist.cdf(85):.3f}\"</span>)  <span class=\"cm\"># 0.067</span>\n<span class=\"fn\">print</span>(<span class=\"st\">f\"P(60 < score < 80) = {dist.cdf(80) - dist.cdf(60):.3f}\"</span>)\n\n<span class=\"cm\"># 68-95-99.7 rule for Normal distribution</span>\n<span class=\"cm\"># 68% of values within 1 std dev of mean</span>\n<span class=\"cm\"># 95% within 2 std devs</span>\n<span class=\"cm\"># 99.7% within 3 std devs</span>\n<span class=\"fn\">print</span>(<span class=\"st\">f\"P(within 1 std) = {dist.cdf(80) - dist.cdf(60):.3f}\"</span>)\n<span class=\"fn\">print</span>(<span class=\"st\">f\"P(within 2 std) = {dist.cdf(90) - dist.cdf(50):.3f}\"</span>)</pre></div><div class=\"tip\">💡 The 68-95-99.7 rule: In a normal distribution, 68% of data falls within 1 std dev, 95% within 2, 99.7% within 3. Anomaly detection uses this.</div>"}, {"label": "Hypothesis Testing", "html": "<div class=\"section-tag\">Inference</div><div class=\"slide-heading\">Hypothesis Testing — Is Your Finding Real? 🧪</div><div class=\"highlight\">A hypothesis test answers: <strong>\"Is this difference statistically significant or just random chance?\"</strong><br>p-value &lt; 0.05 = reject null hypothesis = result is likely real (not luck).</div><div class=\"code-wrap\"><div class=\"code-header\"><span>hypothesis_test.py</span><span>python</span></div><pre><span class=\"kw\">import</span> scipy.stats <span class=\"kw\">as</span> stats\n<span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\n<span class=\"cm\"># Did Group A score higher than Group B on the test?</span>\ngroup_a = np.array([<span class=\"nm\">82</span>, <span class=\"nm\">88</span>, <span class=\"nm\">79</span>, <span class=\"nm\">85</span>, <span class=\"nm\">90</span>, <span class=\"nm\">77</span>, <span class=\"nm\">83</span>])\ngroup_b = np.array([<span class=\"nm\">74</span>, <span class=\"nm\">70</span>, <span class=\"nm\">78</span>, <span class=\"nm\">72</span>, <span class=\"nm\">76</span>, <span class=\"nm\">68</span>, <span class=\"nm\">73</span>])\n\n<span class=\"cm\"># Independent t-test</span>\nt_stat, p_value = stats.ttest_ind(group_a, group_b)\n<span class=\"fn\">print</span>(<span class=\"st\">f\"t-statistic: {t_stat:.3f}\"</span>)\n<span class=\"fn\">print</span>(<span class=\"st\">f\"p-value:     {p_value:.4f}\"</span>)\n\n<span class=\"kw\">if</span> p_value &lt; <span class=\"nm\">0.05</span>:\n    <span class=\"fn\">print</span>(<span class=\"st\">\"Reject null ✅ — difference is statistically significant\"</span>)\n<span class=\"kw\">else</span>:\n    <span class=\"fn\">print</span>(<span class=\"st\">\"Fail to reject null — could be random chance\"</span>)\n\n<span class=\"cm\"># Chi-square: for categorical data</span>\n<span class=\"cm\"># Does passing rate differ between class A and B?</span>\ncontingency = [[<span class=\"nm\">12</span>, <span class=\"nm\">3</span>], [<span class=\"nm\">7</span>, <span class=\"nm\">8</span>]]  <span class=\"cm\"># [[pass,fail],[pass,fail]]</span>\nchi2, p, dof, expected = stats.chi2_contingency(contingency)\n<span class=\"fn\">print</span>(<span class=\"st\">f\"Chi2 p-value: {p:.4f}\"</span>)</pre></div><div class=\"tip\">💡 <strong>p-value</strong> is the probability of seeing your result if the null hypothesis (no difference) were true. Small p = unlikely to be random.</div>"}, {"label": "Code Lab — Stats on Real Data", "html": "<div class=\"section-tag\">Hands-On</div><div class=\"slide-heading\">Code Lab — Full Statistical Analysis 💻</div><div class=\"code-wrap\"><div class=\"code-header\"><span>lab_07_stats.py</span><span>python</span></div><pre><span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n<span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n<span class=\"kw\">import</span> matplotlib.pyplot <span class=\"kw\">as</span> plt\n<span class=\"kw\">import</span> seaborn <span class=\"kw\">as</span> sns\nfrom scipy <span class=\"kw\">import</span> stats\n\ndf = sns.load_dataset(<span class=\"st\">\"tips\"</span>)  <span class=\"cm\"># restaurant tips data</span>\n\n<span class=\"cm\"># 1. Descriptive stats</span>\n<span class=\"fn\">print</span>(df.describe())\n<span class=\"fn\">print</span>(df.groupby(<span class=\"st\">\"day\"</span>)[<span class=\"st\">\"tip\"</span>].agg([<span class=\"st\">\"mean\"</span>,<span class=\"st\">\"median\"</span>,<span class=\"st\">\"std\"</span>]))\n\n<span class=\"cm\"># 2. Do smokers tip differently?</span>\nsmoker = df[df[<span class=\"st\">\"smoker\"</span>]==<span class=\"st\">\"Yes\"</span>][<span class=\"st\">\"tip\"</span>]\nnon_smoker = df[df[<span class=\"st\">\"smoker\"</span>]==<span class=\"st\">\"No\"</span>][<span class=\"st\">\"tip\"</span>]\nt_stat, p = stats.ttest_ind(smoker, non_smoker)\n<span class=\"fn\">print</span>(<span class=\"st\">f\"Smoker vs Non-smoker tips p={p:.4f}\"</span>)\n\n<span class=\"cm\"># 3. Correlation: bill size vs tip</span>\nr, p = stats.pearsonr(df[<span class=\"st\">\"total_bill\"</span>], df[<span class=\"st\">\"tip\"</span>])\n<span class=\"fn\">print</span>(<span class=\"st\">f\"Correlation r={r:.3f}, p={p:.4f}\"</span>)\n\n<span class=\"cm\"># 4. Z-score outlier detection</span>\ndf[<span class=\"st\">\"tip_z\"</span>] = np.abs(stats.zscore(df[<span class=\"st\">\"tip\"</span>]))\noutliers = df[df[<span class=\"st\">\"tip_z\"</span>] > <span class=\"nm\">3</span>]\n<span class=\"fn\">print</span>(<span class=\"st\">f\"Tip outliers: {len(outliers)}\"</span>)</pre></div><div class=\"tip\">🚀 <strong>Challenge:</strong> Is the tip percentage (tip/total_bill) normally distributed? Plot a histogram and run a Shapiro-Wilk test.</div>"}, {"label": "Common Mistakes", "html": "<div class=\"section-tag\">Watch Out!</div><div class=\"slide-heading\">Common Statistics Mistakes ⚠️</div><div class=\"e-list\"><div class=\"e-item\"><div class=\"e-icon\">❌</div><div><strong>Using mean when data is skewed</strong><br>Mean income of $80K sounds good, but if 1 billionaire skews it, median is the honest measure.<br>✅ Fix: Always visualise distribution first. Use median for skewed data (income, house prices, response times).</div></div><div class=\"e-item\"><div class=\"e-icon\">❌</div><div><strong>Confusing correlation with causation</strong><br>Two things moving together doesn't mean one causes the other. Shoe size and reading ability are correlated in children (both increase with age).<br>✅ Fix: Always ask \"what's the logical mechanism?\" before inferring causation.</div></div><div class=\"e-item\"><div class=\"e-icon\">❌</div><div><strong>p-value ≠ effect size</strong><br>A tiny, useless difference can be \"statistically significant\" with enough data.<br>✅ Fix: Report Cohen's d or other effect size alongside p-value.</div></div><div class=\"e-item\"><div class=\"e-icon\">❌</div><div><strong>Not checking assumptions before t-test</strong><br>t-test assumes roughly normal distributions. Extremely skewed data needs non-parametric tests.<br>✅ Fix: Run Shapiro-Wilk first. Use Mann-Whitney U test for non-normal data.</div></div></div>"}, {"label": "Session Recap", "html": "<div class=\"section-tag\">Session Recap</div><div class=\"slide-heading\">What You've Learned 🎉</div><div class=\"recap-grid\"><div class=\"recap-item\"><div class=\"recap-icon\">📏</div><div class=\"recap-text\"><h4>Central Tendency</h4><p>Mean for symmetric data, median for skewed/outliers, mode for categories. Always visualise first.</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">📉</div><div class=\"recap-text\"><h4>Spread</h4><p>Std dev = average distance from mean (same units as data). Z-score = how many std devs from mean. |z|&gt;3 = outlier.</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">🔔</div><div class=\"recap-text\"><h4>Distributions</h4><p>Normal (bell curve), right-skewed (income), uniform (dice). Shapiro-Wilk tests normality. Log-transform skewed data.</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">🔗</div><div class=\"recap-text\"><h4>Correlation</h4><p>Pearson for linear, Spearman for monotonic. Heatmap for all pairs. Always: correlation ≠ causation.</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">🎲</div><div class=\"recap-text\"><h4>Probability</h4><p>P(event) = favourable/total. 68-95-99.7 rule for normal. scipy.stats.norm for probabilities.</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">🧪</div><div class=\"recap-text\"><h4>Hypothesis Testing</h4><p>t-test for numeric comparison. Chi-square for categorical. p&lt;0.05 = likely real. Report effect size too.</p></div></div></div><div class=\"highlight\" style=\"margin-top:auto;\">🚀 <strong>Next:</strong> Session 8 — Feature Engineering: craft better inputs to make your models dramatically more accurate</div>"}];


let cur=0;
const wrap=document.getElementById('slides-wrap');
const dotsEl=document.getElementById('dots');
function renderSlides(){
  wrap.innerHTML='';dotsEl.innerHTML='';
  SLIDES_DATA.forEach((s,i)=>{
    const div=document.createElement('div');
    div.className='slide'+(i===0?' active':'');
    div.innerHTML=s.html;
    wrap.appendChild(div);
    const dot=document.createElement('div');
    dot.className='dot'+(i===0?' active':'');
    dot.onclick=()=>jump(i);
    dotsEl.appendChild(dot);
  });
  updateUI();
}
function updateUI(){
  const t=SLIDES_DATA.length;
  document.getElementById('counter').textContent=(cur+1)+' / '+t;
  document.getElementById('progress-bar').style.width=((cur+1)/t*100)+'%';
  document.getElementById('slide-title-bar').textContent=SLIDES_DATA[cur].label||'';
  document.getElementById('prev-btn').disabled=cur===0;
  document.getElementById('next-btn').disabled=cur===t-1;
  document.querySelectorAll('.slide').forEach((el,i)=>el.classList.toggle('active',i===cur));
  document.querySelectorAll('.dot').forEach((el,i)=>el.classList.toggle('active',i===cur));
}
function go(d){jump(cur+d);}
function jump(i){if(i<0||i>=SLIDES_DATA.length)return;cur=i;updateUI();document.querySelectorAll('.slide')[cur].scrollTop=0;}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(1);}
  if(e.key==='ArrowLeft'){e.preventDefault();go(-1);}
  if(e.key==='f'||e.key==='F')toggleFS();
  if(e.key==='Home')jump(0);
  if(e.key==='End')jump(SLIDES_DATA.length-1);
});
function toggleFS(){if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen();}

let _tx=0;
document.addEventListener('touchstart',e=>{_tx=e.changedTouches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-_tx;
  if(Math.abs(dx)>50){go(dx<0?1:-1);}
},{passive:true});
renderSlides();

<script id="codencode-copy-script">
(function(){
  function addCopy(){
    document.querySelectorAll('.code-wrap').forEach(function(w){
      var hdr=w.querySelector('.code-header'), pre=w.querySelector('pre');
      if(!hdr||!pre||hdr.querySelector('.copy-btn'))return;
      var b=document.createElement('button');
      b.className='copy-btn';b.type='button';b.textContent='Copy';
      b.addEventListener('click',function(ev){
        ev.stopPropagation();
        var t=pre.innerText.replace(/\u00a0/g,' ');
        function ok(){b.textContent='Copied';b.classList.add('done');setTimeout(function(){b.textContent='Copy';b.classList.remove('done');},1400);}
        if(navigator.clipboard&&navigator.clipboard.writeText){
          navigator.clipboard.writeText(t).then(ok).catch(fallback);
        }else{fallback();}
        function fallback(){
          var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
          document.body.appendChild(ta);ta.select();
          try{document.execCommand('copy');ok();}catch(e){}
          document.body.removeChild(ta);
        }
      });
      hdr.appendChild(b);
    });
  }
  if(document.readyState!=='loading')addCopy();
  document.addEventListener('DOMContentLoaded',addCopy);
  setTimeout(addCopy,400);
})();
</script>
