<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Session 14 — Vibe Coding: Building with AI</title><style>
:root{--accent:#f97583;--bg:#0f0f1a;--text:#e8e8f0;--muted:#8888aa;--code-bg:#0d1117;--card:#1e2240;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;user-select:none;}
#deck{width:100%;height:100vh;display:flex;flex-direction:column;}
#topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.06);flex-shrink:0;gap:12px;}
#session-label{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--accent);text-transform:uppercase;white-space:nowrap;}
#slide-title-bar{font-size:12px;color:var(--muted);flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#topbar-right{display:flex;gap:8px;align-items:center;flex-shrink:0;}
#counter{font-size:12px;color:var(--muted);white-space:nowrap;}
.btn{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);color:var(--text);border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer;transition:all 0.15s;}
.btn:hover{background:var(--accent);border-color:var(--accent);color:#000;}
#progress-wrap{height:3px;background:rgba(255,255,255,0.05);flex-shrink:0;}
#progress-bar{height:100%;background:var(--accent);transition:width 0.3s ease;}
#slides-wrap{flex:1;position:relative;overflow:hidden;}
.slide{position:absolute;inset:0;display:none;flex-direction:column;padding:32px 48px 24px;overflow-y:auto;animation:fadeIn 0.25s ease;}
.slide.active{display:flex;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
#nav{display:flex;align-items:center;justify-content:center;gap:16px;padding:10px 24px;flex-shrink:0;border-top:1px solid rgba(255,255,255,0.06);}
.nav-btn{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);color:var(--text);padding:7px 26px;border-radius:8px;font-size:14px;cursor:pointer;transition:all 0.15s;}
.nav-btn:hover:not(:disabled){background:var(--accent);border-color:var(--accent);color:#000;}
.nav-btn:disabled{opacity:0.3;cursor:default;}
#dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:600px;}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.2);cursor:pointer;transition:all 0.2s;}
.dot.active{background:var(--accent);transform:scale(1.5);}
.slide-title{align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at 50% 40%,#1e2a4a 0%,#0f0f1a 70%);}
.session-badge{font-size:11px;font-weight:800;letter-spacing:3px;color:var(--accent);text-transform:uppercase;margin-bottom:20px;padding:5px 16px;border:1px solid var(--accent);border-radius:20px;display:inline-block;}
.slide-title h1{font-size:clamp(26px,3.4vw,46px);font-weight:800;line-height:1.15;margin-bottom:16px;background:linear-gradient(135deg,#fff 30%,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;white-space:pre-line;}
.slide-title .sub{font-size:14px;color:var(--muted);max-width:580px;line-height:1.6;margin-bottom:28px;}
.academy-tag{font-size:12px;color:var(--muted);letter-spacing:1px;}
.section-tag{font-size:10px;font-weight:700;letter-spacing:2.5px;color:var(--accent);text-transform:uppercase;margin-bottom:6px;}
.slide-heading{font-size:clamp(17px,2.2vw,28px);font-weight:700;margin-bottom:14px;line-height:1.25;}
.cards{display:grid;gap:11px;}
.cards-2{grid-template-columns:1fr 1fr;}
.cards-3{grid-template-columns:1fr 1fr 1fr;}
.cards-4{grid-template-columns:1fr 1fr 1fr 1fr;}
.card{background:var(--card);border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:14px 16px;}
.card-accent{border-left:3px solid var(--accent);}
.card-icon{font-size:22px;margin-bottom:6px;}
.card h3{font-size:13px;font-weight:700;margin-bottom:4px;color:#fff;}
.card p{font-size:12px;color:var(--muted);line-height:1.55;}
.steps{display:flex;flex-direction:column;gap:9px;}
.step{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:10px;padding:11px 14px;border:1px solid rgba(255,255,255,0.06);}
.step-num{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#000;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.step-body h4{font-size:13px;font-weight:700;margin-bottom:2px;}
.step-body p{font-size:12px;color:var(--muted);line-height:1.5;}
.code-wrap{background:var(--code-bg);border-radius:10px;border:1px solid rgba(255,255,255,0.08);overflow:hidden;margin:8px 0;}
.code-header{background:rgba(255,255,255,0.05);padding:5px 13px;font-size:11px;color:var(--muted);font-family:monospace;display:flex;justify-content:space-between;align-items:center;}
pre{padding:11px 15px;overflow-x:auto;font-family:'Cascadia Code','Fira Code',Consolas,monospace;font-size:12px;line-height:1.7;color:#c9d1d9;}
.kw{color:#ff7b72;}.fn{color:#d2a8ff;}.st{color:#a5d6ff;}.cm{color:#8b949e;font-style:italic;}.nm{color:#79c0ff;}.op{color:#ff9e64;}
.highlight{background:rgba(255,255,255,0.04);border-left:4px solid var(--accent);border-radius:0 8px 8px 0;padding:10px 14px;margin:8px 0;font-size:13px;line-height:1.6;}
.highlight strong{color:var(--accent);}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;flex:1;}
.warn{background:rgba(255,100,50,0.1);border:1px solid rgba(255,100,50,0.3);border-radius:8px;padding:9px 13px;font-size:12px;margin:6px 0;}
.tip{background:rgba(80,220,100,0.1);border:1px solid rgba(80,220,100,0.3);border-radius:8px;padding:9px 13px;font-size:12px;margin:6px 0;}
.roadmap{display:grid;grid-template-columns:1fr 1fr;gap:9px;flex:1;}
.roadmap-item{background:var(--card);border-radius:12px;padding:12px;border:1px solid rgba(255,255,255,0.06);display:flex;gap:9px;align-items:flex-start;}
.rm-num{font-size:18px;font-weight:900;color:var(--accent);opacity:0.4;line-height:1;flex-shrink:0;width:22px;}
.rm-icon{font-size:17px;flex-shrink:0;}
.rm-text h4{font-size:12px;font-weight:700;margin-bottom:2px;}
.rm-text p{font-size:11px;color:var(--muted);line-height:1.5;}
.recap-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;flex:1;}
.recap-item{background:var(--card);border-radius:10px;padding:12px;border-left:3px solid var(--accent);display:flex;gap:8px;align-items:flex-start;}
.recap-icon{font-size:17px;flex-shrink:0;}
.recap-text h4{font-size:13px;font-weight:700;margin-bottom:2px;}
.recap-text p{font-size:11px;color:var(--muted);line-height:1.5;}
.e-list{display:flex;flex-direction:column;gap:8px;}
.e-item{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.55;}
.e-icon{font-size:15px;flex-shrink:0;}
table{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0;}
th{background:rgba(255,255,255,0.06);padding:7px 10px;text-align:left;font-weight:700;color:var(--accent);}
td{padding:6px 10px;border-top:1px solid rgba(255,255,255,0.05);color:var(--muted);}
.slide::-webkit-scrollbar{width:4px;}
.slide::-webkit-scrollbar-track{background:transparent;}
.slide::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:2px;}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:700;margin:2px;}
.tag-green{background:rgba(80,200,80,0.2);color:#50c850;border:1px solid rgba(80,200,80,0.3);}
.tag-blue{background:rgba(80,150,255,0.2);color:#79c0ff;border:1px solid rgba(80,150,255,0.3);}
.tag-orange{background:rgba(255,150,50,0.2);color:#ff9e64;border:1px solid rgba(255,150,50,0.3);}
.big-concept{background:linear-gradient(135deg,#1e2a4a,#1e2240);border:1px solid rgba(249,117,131,0.3);border-radius:14px;padding:20px 24px;margin:10px 0;text-align:center;}
.big-concept .bc-emoji{font-size:36px;margin-bottom:8px;}
.big-concept h2{font-size:20px;font-weight:800;color:#fff;margin-bottom:6px;}
.big-concept p{font-size:13px;color:var(--muted);line-height:1.6;}

@media(max-width:700px){
  body{overflow:auto;}
  #deck{height:auto;min-height:100vh;}
  #slides-wrap{height:auto;min-height:60vh;}
  .slide{position:relative;inset:auto;display:none;padding:16px 16px 12px;}
  .slide.active{display:flex;}
  .cards-2,.cards-3,.cards-4{grid-template-columns:1fr;}
  .two-col,.roadmap,.recap-grid{grid-template-columns:1fr;}
  #session-label{display:none;}
  #slide-title-bar{display:none;}
  pre{font-size:10px;line-height:1.6;}
  .nav-btn{padding:6px 14px;font-size:13px;}
  #dots{max-width:100%;}
  .dot{width:5px;height:5px;}
  .big-concept{padding:14px 16px;}
  .big-concept h2{font-size:16px;}
  .big-concept .bc-emoji{font-size:28px;}
  .slide-heading{font-size:18px;}
  #topbar{padding:8px 12px;gap:6px;}
  #nav{padding:8px 12px;gap:10px;}
  table{font-size:10px;}
  th,td{padding:5px 6px;}
  .card h3{font-size:12px;}
  .card p{font-size:11px;}
  .highlight,.tip,.warn{font-size:11px;}
  .step-body h4{font-size:12px;}
  .step-body p{font-size:11px;}
}
</style></head><body>
<div id="deck">
<div id="topbar"><div id="session-label">Session 14 · codencode Academy</div><div id="slide-title-bar"></div><div id="topbar-right"><span id="counter"></span><button class="btn" onclick="toggleFS()">⛶ Fullscreen</button></div></div>
<div id="progress-wrap"><div id="progress-bar"></div></div>
<div id="slides-wrap"></div>
<div id="nav"><button class="nav-btn" id="prev-btn" onclick="go(-1)">← Prev</button><div id="dots"></div><button class="nav-btn" id="next-btn" onclick="go(1)">Next →</button></div>
</div><script>
const SLIDES_DATA = [{"label": "Title", "note": "Session 14 — Vibe Coding. The shift from writing code manually to describing what you want and having AI generate it. Open with: 'Today I'll show you something that will change how you code forever.'", "html": "<div class=\"slide-title\" style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;\"><div class=\"session-badge\">Session 14 of 15</div><div style=\"font-size:46px;margin-bottom:10px;\">🤖⚡</div><h1>Vibe Coding:<br>Building with AI</h1><p class=\"sub\">Stop writing code from scratch. Start describing what you want — and let AI generate it, debug it, and explain it. This is how the best developers work today.</p><div style=\"display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap;\"><span class=\"tag tag-blue\">AI Tools for DS</span><span class=\"tag tag-green\">Prompt Engineering</span><span class=\"tag tag-orange\">AI-Assisted Pipeline</span><span class=\"tag tag-blue\">AI Limits & Hallucinations</span><span class=\"tag tag-green\">Build a Pipeline Live</span></div><div class=\"academy-tag\" style=\"margin-top:18px;\">codencode Academy · Python + Data Science</div></div>"}, {"label": "What is Vibe Coding?", "note": "Introduce the mindset shift. The student already knows Python. The best developers describe intent, verify output, and iterate — they don't type every character manually.", "html": "<div class=\"section-tag\">The New Way Pros Build</div><div class=\"slide-heading\">🎵 What is Vibe Coding?</div><div class=\"two-col\"><div><div class=\"card card-accent\"><div class=\"card-icon\">😤</div><h3>Old Way — write every line manually</h3><p>Google every syntax error. Copy-paste from StackOverflow and pray. Spend 2 hours debugging a missing bracket. Consult docs for every function signature. <strong>Slow, frustrating, burnout-inducing.</strong></p></div></div><div><div class=\"card card-accent\"><div class=\"card-icon\">🚀</div><h3>Vibe Coding Way — Describe → Generate → Verify → Ship</h3><p>You say: \"Load Titanic, clean nulls, encode categoricals, train a Random Forest, print feature importances.\" AI writes 40 lines in 10 seconds. You read it, test it, ship it. <strong>10× faster — you learn by reading, not struggling.</strong></p></div></div></div><div class=\"highlight\">🔑 <strong>The key mindset shift:</strong> You are NOT asking AI to code <em>for</em> you — you direct AI like a senior engineer directs a junior. You must understand what it produces, verify it works, and catch its mistakes.</div>"}, {"label": "The AI Toolkit", "note": "Walk through the actual tools. Demo ChatGPT and GitHub Copilot live if possible. Show ChatGPT as a coding tool, not a chatbot.", "html": "<div class=\"section-tag\">What Data Scientists Actually Use</div><div class=\"slide-heading\">🛠️ The AI Toolkit</div><div class=\"cards cards-3\"><div class=\"card card-accent\"><div class=\"card-icon\">🤖</div><h3>ChatGPT / Claude</h3><p>Writing full pipelines, explaining error messages, generating feature ideas, code review. Paste your error → fix in 10 seconds. <em>chat.openai.com · claude.ai</em></p></div><div class=\"card card-accent\"><div class=\"card-icon\">⚡</div><h3>GitHub Copilot</h3><p>Autocompletes code as you type in VS Code. Write a comment like <em># load and scale features</em> and Copilot writes the next 10 lines. <em>github.com/features/copilot</em></p></div><div class=\"card card-accent\"><div class=\"card-icon\">🖱️</div><h3>Cursor IDE</h3><p>VS Code + AI built in. Select a block → Cmd+K → describe the change. Refactors functions and adds error handling in one command. <em>cursor.sh — free tier</em></p></div><div class=\"card card-accent\"><div class=\"card-icon\">📓</div><h3>Jupyter AI</h3><p>AI inside your notebook. <em>%%ai</em> cell magic — describe a plot or transformation, AI generates the cell. Great for EDA. <em>pip install jupyter-ai</em></p></div><div class=\"card card-accent\"><div class=\"card-icon\">🔍</div><h3>Perplexity / Phind</h3><p>AI search for code questions. Ask \"handle class imbalance with SMOTE in sklearn\" → current docs + working examples. Better than Googling. <em>perplexity.ai · phind.com</em></p></div><div class=\"card card-accent\"><div class=\"card-icon\">📊</div><h3>Kaggle + AI</h3><p>Kaggle's built-in assistant suggests code for cleaning, visualisation and tuning based on your dataset. <em>kaggle.com — free GPUs</em></p></div></div><div class=\"highlight\">💡 <strong>Professional workflow:</strong> ChatGPT/Claude for planning &amp; big questions → Copilot/Cursor for writing code live → Perplexity when you need current documentation. Use all three together.</div>"}, {"label": "Effective Prompting", "note": "The most practical slide. Prompting well is a skill. A well-structured prompt gets a well-structured answer every time.", "html": "<div class=\"section-tag\">5 Techniques That Get Perfect Code</div><div class=\"slide-heading\">✍️ Effective Prompting</div><div class=\"steps\"><div class=\"step\"><div class=\"step-num\">1</div><div class=\"step-body\"><h4>Be specific about context</h4><p>❌ \"write a model\" → ✅ \"Random Forest classifier in sklearn on Titanic. Features: age, pclass, sex (encoded). Target: survived. Print accuracy + feature importances.\"</p></div></div><div class=\"step\"><div class=\"step-num\">2</div><div class=\"step-body\"><h4>Paste the error message</h4><p>Always paste the full traceback. \"I got this error: [paste]. Here is my code: [paste]. What is wrong and how do I fix it?\"</p></div></div><div class=\"step\"><div class=\"step-num\">3</div><div class=\"step-body\"><h4>Ask for explanations</h4><p>Add \"explain each step with comments\" to any request. You learn by reading good code — understanding &gt; output.</p></div></div><div class=\"step\"><div class=\"step-num\">4</div><div class=\"step-body\"><h4>Iterate, don't start over</h4><p>\"Now add cross-validation\" or \"change this to XGBoost\" — AI remembers the conversation. Build on what you have.</p></div></div><div class=\"step\"><div class=\"step-num\">5</div><div class=\"step-body\"><h4>Always verify the output</h4><p>Run it. Check the numbers make sense. R² = 0.99 on first try? Something is wrong (data leakage?). AI is confident even when wrong.</p></div></div></div><div class=\"code-wrap\"><div class=\"code-header\"><span>perfect_ml_prompt.txt</span><span>prompt</span></div><pre>ROLE:  You are a senior data scientist using Python and sklearn.\nTASK:  Build a complete classification pipeline for the Titanic dataset.\nDATA:  CSV with columns: age (float, has nulls), pclass (int), sex (str),\n       fare (float), survived (0/1 target).\nSTEPS: 1) Load  2) Clean nulls  3) Encode sex  4) Split 80/20\n       5) Scale  6) Train Random Forest  7) Print accuracy + confusion matrix\nFORMAT: One runnable Python file with comments explaining each step. sklearn only.\nEXTRA:  Do NOT fit the scaler on test data.</pre></div><div class=\"highlight\">🎯 <strong>Why this works:</strong> Role → context. Task → goal. Data → what you have. Steps → what to do. Format → how to present it. Constraints → guardrails. A specific prompt = a specific, useful answer.</div>"}, {"label": "Prompt Templates", "note": "Reusable templates students can copy-paste into ChatGPT right now for their capstone. Live demo one of these.", "html": "<div class=\"section-tag\">Copy, Paste, Win</div><div class=\"slide-heading\">📋 Prompt Templates</div><div class=\"two-col\"><div><div class=\"code-wrap\"><div class=\"code-header\"><span>eda_template.txt</span><span>prompt</span></div><pre>I have a dataset called df with columns:\n[list your columns and types here].\nTarget column: [target].\n\nGenerate complete EDA code that:\n1. Shows shape, dtypes, null counts\n2. Plots distribution of each numeric col\n3. Shows correlation heatmap\n4. Plots target class balance\n5. Identifies potential outliers\nAdd comments explaining what to look for.</pre></div><div class=\"code-wrap\"><div class=\"code-header\"><span>debug_template.txt</span><span>prompt</span></div><pre>I'm getting this error in Python:\n[PASTE FULL TRACEBACK]\n\nHere is the relevant code:\n[PASTE YOUR CODE]\n\nWhat is causing this error? Fix it and\nexplain WHY it happened so I won't\nmake the same mistake again.</pre></div></div><div><div class=\"code-wrap\"><div class=\"code-header\"><span>model_comparison.txt</span><span>prompt</span></div><pre>I have X_train, X_test, y_train, y_test\nalready prepared and scaled.\n\nTrain and compare these 3 models:\n1. Random Forest\n2. XGBoost\n3. Logistic Regression\n\nFor each print: Accuracy, F1 (macro),\ntraining time. Then show which won and why.</pre></div><div class=\"code-wrap\"><div class=\"code-header\"><span>feature_engineering.txt</span><span>prompt</span></div><pre>I have a dataset about [topic].\nCurrent features: [list them].\nTarget: [target].\n\nSuggest 5 creative new features I could\nengineer from the existing columns.\nFor each: what it is, why it helps,\nPython code, which models benefit most.</pre></div></div></div>"}, {"label": "AI-Assisted Pipeline Lab", "note": "Live coding session. Pick a dataset together (Titanic, HDB prices, or their capstone dataset). The student writes the prompts, AI generates, they review and run each block.", "html": "<div class=\"section-tag\">Code Lab</div><div class=\"slide-heading\">🔧 Build a Full ML Pipeline with AI</div><div class=\"highlight\">🎯 <strong>Goal:</strong> Using only AI prompts (no typing code yourself), build a complete ML pipeline from raw CSV to evaluated model. Your job: write the prompts, read the output, verify it runs correctly.</div><div class=\"steps\"><div class=\"step\"><div class=\"step-num\">1</div><div class=\"step-body\"><h4>Explore the data  <em>~2 min</em></h4><p>\"Load titanic.csv and run a full EDA — shape, nulls, dtypes, histograms for age and fare, class balance chart.\"</p></div></div><div class=\"step\"><div class=\"step-num\">2</div><div class=\"step-body\"><h4>Clean and encode  <em>~3 min</em></h4><p>\"Fill age nulls with median, drop cabin, encode sex and embarked as numbers, drop irrelevant columns.\"</p></div></div><div class=\"step\"><div class=\"step-num\">3</div><div class=\"step-body\"><h4>Split and scale  <em>~2 min</em></h4><p>\"Split 80/20, apply StandardScaler to X_train and X_test — fit on train only, transform both.\"</p></div></div><div class=\"step\"><div class=\"step-num\">4</div><div class=\"step-body\"><h4>Train and compare  <em>~5 min</em></h4><p>\"Train Random Forest and XGBoost. Print accuracy, F1, confusion matrix for each. Which is better and why?\"</p></div></div><div class=\"step\"><div class=\"step-num\">5</div><div class=\"step-body\"><h4>Verify and critique  <em>critical step</em></h4><p>\"Review this pipeline. Any data leakage risks, missing steps, or better approaches you'd recommend?\"</p></div></div></div>"}, {"label": "AI Limits", "note": "Critical thinking slide. AI is powerful but not magic. Hallucinations are the biggest danger — AI will confidently give wrong answers. The verification mindset is the key skill.", "html": "<div class=\"section-tag\">What It Cannot Do (And What Will Go Wrong)</div><div class=\"slide-heading\">⚠️ AI Limits</div><div class=\"cards cards-3\"><div class=\"card card-accent\"><div class=\"card-icon\">🤥</div><h3>Hallucination — the biggest risk</h3><p>AI invents answers with total confidence — a sklearn function that doesn't exist, a paper never published, code that looks right but crashes at line 7. <strong>Always run the code.</strong></p></div><div class=\"card card-accent\"><div class=\"card-icon\">📅</div><h3>Stale knowledge cutoff</h3><p>Training data has a cutoff date. It may miss the latest library version, a new dataset, or a recent API change. Check the official docs for version-specific syntax.</p></div><div class=\"card card-accent\"><div class=\"card-icon\">🔒</div><h3>No access to your data</h3><p>AI can't see your CSV unless you paste it. It writes code from column names you describe. Wrong description = wrong code. Garbage in = garbage out.</p></div><div class=\"card card-accent\"><div class=\"card-icon\">🐛</div><h3>Subtle bugs it misses</h3><p>Data leakage (fitting scaler on all data), wrong train/test logic, wrong metric for the problem type, off-by-one windowing errors. You must understand the code to catch these.</p></div><div class=\"card card-accent\"><div class=\"card-icon\">🎯</div><h3>Domain knowledge gap</h3><p>AI doesn't know your business problem — whether predicting 3 days vs 7 days ahead matters. Domain decisions are yours; AI only implements them.</p></div><div class=\"card card-accent\"><div class=\"card-icon\">🧠</div><h3>It amplifies what you know</h3><p>If you know the concepts, AI makes you 10× faster. If you know nothing, AI generates impressive-looking nonsense you can't evaluate.</p></div></div><div class=\"highlight\">✅ <strong>The Golden Rule of Vibe Coding:</strong> AI is a junior developer that works at superhuman speed but makes human mistakes. You are the senior engineer. Review every output. Test edge cases. Never ship AI code you don't fully understand.</div>"}, {"label": "Capstone Prep with AI", "note": "Bridge slide — connect today's AI tools directly to the Session 15 capstone. Students should leave knowing exactly how to use AI to build their project.", "html": "<div class=\"section-tag\">Use AI at Every Stage — Without Letting It Think For You</div><div class=\"slide-heading\">🚀 Building Your Capstone with AI</div><div class=\"cards cards-3\"><div class=\"card card-accent\"><div class=\"card-icon\">🔍</div><h3>Ideation</h3><p>\"I want to predict [X]. Suggest 5 free datasets for this problem. For each: where to download, key features, best model.\"</p></div><div class=\"card card-accent\"><div class=\"card-icon\">🧹</div><h3>Data cleaning</h3><p>\"Here is my df.info() and df.describe() output [paste]. What cleaning steps do I need? Write the cleaning code.\"</p></div><div class=\"card card-accent\"><div class=\"card-icon\">🤖</div><h3>Modelling</h3><p>\"RF gave R²=0.72, XGBoost R²=0.78. What hyperparameters should I tune next? Write the GridSearchCV code.\"</p></div><div class=\"card card-accent\"><div class=\"card-icon\">📊</div><h3>Evaluation</h3><p>\"Confusion matrix: FP=42, FN=8. Interpret for a medical diagnosis problem. Which matters more? How do I tune the threshold?\"</p></div><div class=\"card card-accent\"><div class=\"card-icon\">📝</div><h3>Presentation</h3><p>\"LSTM stock model, R²=0.85, RMSE=$4.20. Write a 3-paragraph summary for a non-technical audience.\"</p></div><div class=\"card card-accent\"><div class=\"card-icon\">🔎</div><h3>Code review</h3><p>\"Review this pipeline for data leakage, wrong metric choice, or sklearn best-practice violations. Be critical.\" [paste script]</p></div></div>"}, {"label": "Common Mistakes", "note": "Quick-fire round of mistakes — all things that have happened to real students using AI for coding. Each one is a lesson.", "html": "<div class=\"section-tag\">Don't Do These</div><div class=\"slide-heading\">🚫 Common Vibe Coding Mistakes</div><div class=\"two-col\"><div><div class=\"warn\">❌ <strong>Accepting output without running it.</strong> AI code that looks correct often has a subtle bug. Always run it, always check the output values.</div><div class=\"warn\">❌ <strong>Vague prompts = vague code.</strong> \"Make a model\" produces a toy example. Describe your exact data, goal, libraries, and output format.</div><div class=\"warn\">❌ <strong>Using AI to skip understanding.</strong> If you submit AI code you can't explain, you'll fail the next question. AI is for speed, not for avoiding learning.</div><div class=\"warn\">❌ <strong>Not pasting the full error.</strong> \"It doesn't work\" tells AI nothing. The last 3 lines of a traceback tell you everything.</div></div><div><div class=\"tip\">✅ <strong>Run → Error → Paste → Fix → Understand.</strong> This is the loop. ~30 seconds per cycle. Do it 20 times a session and you're a professional debugger.</div><div class=\"tip\">✅ <strong>Ask AI to review its own output.</strong> \"Now review the code you just wrote — any bugs, data leakage risks, or things you'd change?\" It often finds its own mistakes.</div><div class=\"tip\">✅ <strong>Understand, then delete its code.</strong> Read what AI wrote, understand it, then re-write it yourself from memory. Fastest way to learn any concept.</div></div></div><div class=\"highlight\">🏆 <strong>The best data scientists today</strong> aren't the ones who know the most syntax — they're the ones who think clearly about a problem, write a precise prompt, verify the output, and iterate fast. That's what you're becoming.</div>"}, {"label": "Recap", "note": "Session 14 wrap-up. Next session is the capstone project execution. Leave the student energised and clear on how to use AI for their project.", "html": "<div class=\"section-tag\">You Code at AI Speed Now</div><div class=\"slide-heading\">🤖⚡ Session 14 Complete</div><div class=\"recap-grid\"><div class=\"recap-item\"><div class=\"recap-icon\">🎵</div><div class=\"recap-text\"><h4>Vibe Coding</h4><p>Describe intent → AI builds → you verify → iterate.</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">🛠️</div><div class=\"recap-text\"><h4>AI Toolkit</h4><p>ChatGPT, Claude, Copilot, Cursor, Jupyter AI, Perplexity.</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">✍️</div><div class=\"recap-text\"><h4>Effective Prompting</h4><p>Role + Task + Data + Steps + Format + Constraints.</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">📋</div><div class=\"recap-text\"><h4>Prompt Templates</h4><p>EDA, debugging, model comparison, feature engineering.</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">🔧</div><div class=\"recap-text\"><h4>Pipeline Lab</h4><p>Built a full ML pipeline using only AI prompts.</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">⚠️</div><div class=\"recap-text\"><h4>AI Limits</h4><p>Hallucination, stale knowledge, subtle bugs, domain gaps.</p></div></div></div><div class=\"highlight\">📅 <strong>Next — Session 15: Project Planning &amp; Capstone Execution.</strong> You'll plan, build, and present your full end-to-end ML project. 🎓</div><div class=\"academy-tag\" style=\"margin-top:12px;\">codencode · codencode.my · hello@codencode.my · +60 19-681 1628 · KL · JB · Online</div>"}];


let cur=0;
const wrap=document.getElementById('slides-wrap');
const dotsEl=document.getElementById('dots');
function renderSlides(){
  wrap.innerHTML='';dotsEl.innerHTML='';
  SLIDES_DATA.forEach((s,i)=>{
    const div=document.createElement('div');
    div.className='slide'+(i===0?' active':'');
    div.innerHTML=s.html;if(s.note)div.dataset.notes=s.note;
    wrap.appendChild(div);
    const dot=document.createElement('div');
    dot.className='dot'+(i===0?' active':'');
    dot.onclick=()=>jump(i);
    dotsEl.appendChild(dot);
  });
  updateUI();
}
function updateUI(){
  const t=SLIDES_DATA.length;
  document.getElementById('counter').textContent=(cur+1)+' / '+t;
  document.getElementById('progress-bar').style.width=((cur+1)/t*100)+'%';
  document.getElementById('slide-title-bar').textContent=SLIDES_DATA[cur].label||'';
  document.getElementById('prev-btn').disabled=cur===0;
  document.getElementById('next-btn').disabled=cur===t-1;
  document.querySelectorAll('.slide').forEach((el,i)=>el.classList.toggle('active',i===cur));
  document.querySelectorAll('.dot').forEach((el,i)=>el.classList.toggle('active',i===cur));
}
function go(d){jump(cur+d);}
function jump(i){if(i<0||i>=SLIDES_DATA.length)return;cur=i;updateUI();document.querySelectorAll('.slide')[cur].scrollTop=0;}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(1);}
  if(e.key==='ArrowLeft'){e.preventDefault();go(-1);}
  if(e.key==='f'||e.key==='F')toggleFS();
  if(e.key==='Home')jump(0);
  if(e.key==='End')jump(SLIDES_DATA.length-1);
});
function toggleFS(){if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen();}

let _tx=0;
document.addEventListener('touchstart',e=>{_tx=e.changedTouches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-_tx;
  if(Math.abs(dx)>50){go(dx<0?1:-1);}
},{passive:true});
renderSlides();

<script id="codencode-copy-script">
(function(){
  function addCopy(){
    document.querySelectorAll('.code-wrap').forEach(function(w){
      var hdr=w.querySelector('.code-header'), pre=w.querySelector('pre');
      if(!hdr||!pre||hdr.querySelector('.copy-btn'))return;
      var b=document.createElement('button');
      b.className='copy-btn';b.type='button';b.textContent='Copy';
      b.addEventListener('click',function(ev){
        ev.stopPropagation();
        var t=pre.innerText.replace(/\u00a0/g,' ');
        function ok(){b.textContent='Copied';b.classList.add('done');setTimeout(function(){b.textContent='Copy';b.classList.remove('done');},1400);}
        if(navigator.clipboard&&navigator.clipboard.writeText){
          navigator.clipboard.writeText(t).then(ok).catch(fallback);
        }else{fallback();}
        function fallback(){
          var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
          document.body.appendChild(ta);ta.select();
          try{document.execCommand('copy');ok();}catch(e){}
          document.body.removeChild(ta);
        }
      });
      hdr.appendChild(b);
    });
  }
  if(document.readyState!=='loading')addCopy();
  document.addEventListener('DOMContentLoaded',addCopy);
  setTimeout(addCopy,400);
})();
</script>
