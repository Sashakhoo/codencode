<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Session 08 — Feature Engineering</title><style>
:root{--accent:#f97583;--bg:#0f0f1a;--text:#e8e8f0;--muted:#8888aa;--code-bg:#0d1117;--card:#1e2240;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;user-select:none;}
#deck{width:100%;height:100vh;display:flex;flex-direction:column;}
#topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.06);flex-shrink:0;gap:12px;}
#session-label{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--accent);text-transform:uppercase;white-space:nowrap;}
#slide-title-bar{font-size:12px;color:var(--muted);flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#topbar-right{display:flex;gap:8px;align-items:center;flex-shrink:0;}
#counter{font-size:12px;color:var(--muted);white-space:nowrap;}
.btn{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);color:var(--text);border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer;transition:all 0.15s;}
.btn:hover{background:var(--accent);border-color:var(--accent);color:#000;}
#progress-wrap{height:3px;background:rgba(255,255,255,0.05);flex-shrink:0;}
#progress-bar{height:100%;background:var(--accent);transition:width 0.3s ease;}
#slides-wrap{flex:1;position:relative;overflow:hidden;}
.slide{position:absolute;inset:0;display:none;flex-direction:column;padding:32px 48px 24px;overflow-y:auto;animation:fadeIn 0.25s ease;}
.slide.active{display:flex;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
#nav{display:flex;align-items:center;justify-content:center;gap:16px;padding:10px 24px;flex-shrink:0;border-top:1px solid rgba(255,255,255,0.06);}
.nav-btn{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);color:var(--text);padding:7px 26px;border-radius:8px;font-size:14px;cursor:pointer;transition:all 0.15s;}
.nav-btn:hover:not(:disabled){background:var(--accent);border-color:var(--accent);color:#000;}
.nav-btn:disabled{opacity:0.3;cursor:default;}
#dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:600px;}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.2);cursor:pointer;transition:all 0.2s;}
.dot.active{background:var(--accent);transform:scale(1.5);}
.slide-title{align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at 50% 40%,#1e2a4a 0%,#0f0f1a 70%);}
.session-badge{font-size:11px;font-weight:800;letter-spacing:3px;color:var(--accent);text-transform:uppercase;margin-bottom:20px;padding:5px 16px;border:1px solid var(--accent);border-radius:20px;display:inline-block;}
.slide-title h1{font-size:clamp(26px,3.4vw,46px);font-weight:800;line-height:1.15;margin-bottom:16px;background:linear-gradient(135deg,#fff 30%,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;white-space:pre-line;}
.slide-title .sub{font-size:14px;color:var(--muted);max-width:580px;line-height:1.6;margin-bottom:28px;}
.academy-tag{font-size:12px;color:var(--muted);letter-spacing:1px;}
.section-tag{font-size:10px;font-weight:700;letter-spacing:2.5px;color:var(--accent);text-transform:uppercase;margin-bottom:6px;}
.slide-heading{font-size:clamp(17px,2.2vw,28px);font-weight:700;margin-bottom:14px;line-height:1.25;}
.cards{display:grid;gap:11px;}
.cards-2{grid-template-columns:1fr 1fr;}
.cards-3{grid-template-columns:1fr 1fr 1fr;}
.cards-4{grid-template-columns:1fr 1fr 1fr 1fr;}
.card{background:var(--card);border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:14px 16px;}
.card-accent{border-left:3px solid var(--accent);}
.card-icon{font-size:22px;margin-bottom:6px;}
.card h3{font-size:13px;font-weight:700;margin-bottom:4px;color:#fff;}
.card p{font-size:12px;color:var(--muted);line-height:1.55;}
.steps{display:flex;flex-direction:column;gap:9px;}
.step{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:10px;padding:11px 14px;border:1px solid rgba(255,255,255,0.06);}
.step-num{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#000;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.step-body h4{font-size:13px;font-weight:700;margin-bottom:2px;}
.step-body p{font-size:12px;color:var(--muted);line-height:1.5;}
.code-wrap{background:var(--code-bg);border-radius:10px;border:1px solid rgba(255,255,255,0.08);overflow:hidden;margin:8px 0;}
.code-header{background:rgba(255,255,255,0.05);padding:5px 13px;font-size:11px;color:var(--muted);font-family:monospace;display:flex;justify-content:space-between;align-items:center;}
pre{padding:11px 15px;overflow-x:auto;font-family:'Cascadia Code','Fira Code',Consolas,monospace;font-size:12px;line-height:1.7;color:#c9d1d9;}
.kw{color:#ff7b72;}.fn{color:#d2a8ff;}.st{color:#a5d6ff;}.cm{color:#8b949e;font-style:italic;}.nm{color:#79c0ff;}.op{color:#ff9e64;}
.highlight{background:rgba(255,255,255,0.04);border-left:4px solid var(--accent);border-radius:0 8px 8px 0;padding:10px 14px;margin:8px 0;font-size:13px;line-height:1.6;}
.highlight strong{color:var(--accent);}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;flex:1;}
.warn{background:rgba(255,100,50,0.1);border:1px solid rgba(255,100,50,0.3);border-radius:8px;padding:9px 13px;font-size:12px;margin:6px 0;}
.tip{background:rgba(80,220,100,0.1);border:1px solid rgba(80,220,100,0.3);border-radius:8px;padding:9px 13px;font-size:12px;margin:6px 0;}
.roadmap{display:grid;grid-template-columns:1fr 1fr;gap:9px;flex:1;}
.roadmap-item{background:var(--card);border-radius:12px;padding:12px;border:1px solid rgba(255,255,255,0.06);display:flex;gap:9px;align-items:flex-start;}
.rm-num{font-size:18px;font-weight:900;color:var(--accent);opacity:0.4;line-height:1;flex-shrink:0;width:22px;}
.rm-icon{font-size:17px;flex-shrink:0;}
.rm-text h4{font-size:12px;font-weight:700;margin-bottom:2px;}
.rm-text p{font-size:11px;color:var(--muted);line-height:1.5;}
.recap-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;flex:1;}
.recap-item{background:var(--card);border-radius:10px;padding:12px;border-left:3px solid var(--accent);display:flex;gap:8px;align-items:flex-start;}
.recap-icon{font-size:17px;flex-shrink:0;}
.recap-text h4{font-size:13px;font-weight:700;margin-bottom:2px;}
.recap-text p{font-size:11px;color:var(--muted);line-height:1.5;}
.e-list{display:flex;flex-direction:column;gap:8px;}
.e-item{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.55;}
.e-icon{font-size:15px;flex-shrink:0;}
table{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0;}
th{background:rgba(255,255,255,0.06);padding:7px 10px;text-align:left;font-weight:700;color:var(--accent);}
td{padding:6px 10px;border-top:1px solid rgba(255,255,255,0.05);color:var(--muted);}
.slide::-webkit-scrollbar{width:4px;}
.slide::-webkit-scrollbar-track{background:transparent;}
.slide::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:2px;}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:700;margin:2px;}
.tag-green{background:rgba(80,200,80,0.2);color:#50c850;border:1px solid rgba(80,200,80,0.3);}
.tag-blue{background:rgba(80,150,255,0.2);color:#79c0ff;border:1px solid rgba(80,150,255,0.3);}
.tag-orange{background:rgba(255,150,50,0.2);color:#ff9e64;border:1px solid rgba(255,150,50,0.3);}
.big-concept{background:linear-gradient(135deg,#1e2a4a,#1e2240);border:1px solid rgba(249,117,131,0.3);border-radius:14px;padding:20px 24px;margin:10px 0;text-align:center;}
.big-concept .bc-emoji{font-size:36px;margin-bottom:8px;}
.big-concept h2{font-size:20px;font-weight:800;color:#fff;margin-bottom:6px;}
.big-concept p{font-size:13px;color:var(--muted);line-height:1.6;}

@media(max-width:700px){
  body{overflow:auto;}
  #deck{height:auto;min-height:100vh;}
  #slides-wrap{height:auto;min-height:60vh;}
  .slide{position:relative;inset:auto;display:none;padding:16px 16px 12px;}
  .slide.active{display:flex;}
  .cards-2,.cards-3,.cards-4{grid-template-columns:1fr;}
  .two-col,.roadmap,.recap-grid{grid-template-columns:1fr;}
  #session-label{display:none;}
  #slide-title-bar{display:none;}
  pre{font-size:10px;line-height:1.6;}
  .nav-btn{padding:6px 14px;font-size:13px;}
  #dots{max-width:100%;}
  .dot{width:5px;height:5px;}
  .big-concept{padding:14px 16px;}
  .big-concept h2{font-size:16px;}
  .big-concept .bc-emoji{font-size:28px;}
  .slide-heading{font-size:18px;}
  #topbar{padding:8px 12px;gap:6px;}
  #nav{padding:8px 12px;gap:10px;}
  table{font-size:10px;}
  th,td{padding:5px 6px;}
  .card h3{font-size:12px;}
  .card p{font-size:11px;}
  .highlight,.tip,.warn{font-size:11px;}
  .step-body h4{font-size:12px;}
  .step-body p{font-size:11px;}
}
</style></head><body>
<div id="deck">
<div id="topbar"><div id="session-label">Session 08 · codencode Academy</div><div id="slide-title-bar"></div><div id="topbar-right"><span id="counter"></span><button class="btn" onclick="toggleFS()">⛶ Fullscreen</button></div></div>
<div id="progress-wrap"><div id="progress-bar"></div></div>

</div><script>
const SLIDES_DATA = [{"label": "Title", "html": "<div class=\"slide-title\" style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;\"><div class=\"session-badge\">Session 08 of 15</div><div style=\"font-size:48px;margin-bottom:12px;\">⚙️</div><h1>Feature Engineering</h1><p class=\"sub\">The most impactful skill in ML — better features beat better algorithms every time</p><div style=\"display:flex;gap:12px;justify-content:center;margin-top:14px;flex-wrap:wrap;\"><span class=\"tag tag-blue\">Cleaning</span><span class=\"tag tag-green\">Encoding</span><span class=\"tag tag-orange\">Scaling</span><span class=\"tag tag-blue\">New Features</span><span class=\"tag tag-green\">Selection</span></div><div class=\"academy-tag\" style=\"margin-top:20px;\">codencode Academy · Python + Data Science</div></div>"}, {"label": "Today's Roadmap", "html": "<div class=\"section-tag\">Roadmap</div><div class=\"slide-heading\">What We'll Cover Today 🗺️</div><div class=\"roadmap\"><div class=\"roadmap-item\"><div class=\"rm-num\">01</div><div class=\"rm-icon\">🎯</div><div class=\"rm-text\"><h4>What Are Features?</h4><p>Inputs to ML models — raw data is rarely in the right format</p></div></div><div class=\"roadmap-item\"><div class=\"rm-num\">02</div><div class=\"rm-icon\">🧹</div><div class=\"rm-text\"><h4>Data Cleaning</h4><p>Handle missing values, fix data types, remove duplicates, outlier treatment</p></div></div><div class=\"roadmap-item\"><div class=\"rm-num\">03</div><div class=\"rm-icon\">🔤</div><div class=\"rm-text\"><h4>Encoding Categoricals</h4><p>One-hot encoding, label encoding — when to use which</p></div></div><div class=\"roadmap-item\"><div class=\"rm-num\">04</div><div class=\"rm-icon\">📏</div><div class=\"rm-text\"><h4>Scaling Numerics</h4><p>StandardScaler vs MinMaxScaler — why models care about scale</p></div></div><div class=\"roadmap-item\"><div class=\"rm-num\">05</div><div class=\"rm-icon\">✨</div><div class=\"rm-text\"><h4>Creating New Features</h4><p>Interactions, date parts, log transform, domain-specific features</p></div></div><div class=\"roadmap-item\"><div class=\"rm-num\">06</div><div class=\"rm-icon\">📊</div><div class=\"rm-text\"><h4>Feature Selection</h4><p>Correlation, feature importance, removing redundant features</p></div></div></div>"}, {"label": "What Are Features?", "html": "<div class=\"section-tag\">Fundamentals</div><div class=\"slide-heading\">What Are Features? Why Do They Matter? 🎯</div><div class=\"big-concept\"><div class=\"bc-emoji\">🏆</div><h2>\"Garbage in, garbage out\" — the quality of features determines model performance</h2><p>A feature is any measurable property used as input to a model. Raw data is rarely ML-ready. Feature engineering transforms raw columns into signals that models can learn from.</p></div><div class=\"cards cards-3\" style=\"margin-top:10px;\"><div class=\"card card-accent\"><div class=\"card-icon\">📋</div><h3>Raw Feature</h3><p>Date of birth: \"1990-05-15\"<br>Category: \"Electronics\"<br>Address: \"123 Orchard Rd\"</p></div><div class=\"card card-accent\"><div class=\"card-icon\">✨</div><h3>Engineered Feature</h3><p>Age: 34<br>One-hot: [0,1,0,0,0]<br>Postal district: 9</p></div><div class=\"card card-accent\"><div class=\"card-icon\">🚀</div><h3>Created Feature</h3><p>price_per_sqm = price/area<br>days_since_purchase<br>rolling_30d_avg_spend</p></div></div><div class=\"tip\">💡 <strong>Rule:</strong> Spend more time on feature engineering than on trying different algorithms. A simple logistic regression with great features beats a neural network with bad features.</div>"}, {"label": "Why Features Matter", "html": "<div class=\"section-tag\">Impact</div><div class=\"slide-heading\">Why Feature Engineering Dominates 🏆</div><div class=\"two-col\"><div><div class=\"highlight\"><strong>Kaggle winning insight:</strong><br>In most competitions, the top solutions use essentially the same algorithms (XGBoost, LightGBM). What separates winners is <strong>which features they created</strong>.</div><div class=\"cards\" style=\"margin-top:10px;gap:8px;\"><div class=\"card card-accent\"><h3>Scales / Distances</h3><p>Most distance-based algorithms (KNN, SVM, linear regression) treat all features as equal. Salary (50000) dominates Age (30) without scaling.</p></div><div class=\"card card-accent\"><h3>Categorical Encoding</h3><p>ML models need numbers. \"Singapore\", \"Malaysia\", \"Thailand\" must become numerical before any model can use them.</p></div><div class=\"card card-accent\"><h3>Missing Data</h3><p>Most sklearn models raise errors on NaN values. You MUST handle missing data before fitting any model.</p></div></div></div><div><div class=\"code-wrap\"><div class=\"code-header\"><span>impact_example.py</span><span>python</span></div><pre><span class=\"kw\">from</span> sklearn.linear_model <span class=\"kw\">import</span> LogisticRegression\n<span class=\"kw\">from</span> sklearn.model_selection <span class=\"kw\">import</span> cross_val_score\n\n<span class=\"cm\"># Without feature engineering</span>\nX_raw = df[[<span class=\"st\">\"age\"</span>, <span class=\"st\">\"salary\"</span>, <span class=\"st\">\"category\"</span>]]\n<span class=\"cm\"># Error: can't use strings in sklearn!</span>\n\n<span class=\"cm\"># With feature engineering</span>\nX_eng = df.copy()\nX_eng = pd.get_dummies(X_eng, columns=[<span class=\"st\">\"category\"</span>])\nX_eng[<span class=\"st\">\"salary_scaled\"</span>] = (X_eng[<span class=\"st\">\"salary\"</span>] - X_eng[<span class=\"st\">\"salary\"</span>].mean()) / X_eng[<span class=\"st\">\"salary\"</span>].std()\n\nscores = cross_val_score(LogisticRegression(), X_eng, y, cv=<span class=\"nm\">5</span>)\n<span class=\"fn\">print</span>(<span class=\"st\">f\"Accuracy: {scores.mean():.3f}\"</span>)</pre></div></div></div>"}, {"label": "Feature Types", "html": "<div class=\"section-tag\">Concept 1</div><div class=\"slide-heading\">Feature Types — Know What You're Working With 🗂️</div><table><tr><th>Type</th><th>Examples</th><th>What to Do</th></tr><tr><td>Numeric (continuous)</td><td>age, salary, price, area</td><td>Scale, handle outliers, check distribution</td></tr><tr><td>Numeric (discrete)</td><td>num_rooms, count, rank</td><td>Sometimes encode as categorical if low cardinality</td></tr><tr><td>Categorical (nominal)</td><td>colour, city, product type</td><td>One-hot encode (no ordering)</td></tr><tr><td>Categorical (ordinal)</td><td>size: S/M/L/XL, rating: 1–5</td><td>Label encode preserving order</td></tr><tr><td>Date/time</td><td>purchase_date, created_at</td><td>Extract: year, month, day, day-of-week, hour</td></tr><tr><td>Text</td><td>product description, reviews</td><td>TF-IDF, embeddings, sentiment score</td></tr><tr><td>Boolean</td><td>is_active, has_warranty</td><td>Often already 0/1, or convert with .astype(int)</td></tr></table><div class=\"tip\">💡 First step for any new dataset: print <code>df.dtypes</code> and categorise every column. This dictates your entire preprocessing pipeline.</div>"}, {"label": "Cleaning Data", "html": "<div class=\"section-tag\">Concept 2</div><div class=\"slide-heading\">Data Cleaning Pipeline 🧹</div><div class=\"code-wrap\"><div class=\"code-header\"><span>cleaning.py</span><span>python</span></div><pre><span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n<span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\ndf = pd.read_csv(<span class=\"st\">\"raw_data.csv\"</span>)\n\n<span class=\"cm\"># ── 1. Fix column names ────────────────────────────────────</span>\ndf.columns = df.columns.str.strip().str.lower().str.replace(<span class=\"st\">\" \"</span>, <span class=\"st\">\"_\"</span>)\n\n<span class=\"cm\"># ── 2. Fix data types ─────────────────────────────────────</span>\ndf[<span class=\"st\">\"price\"</span>] = pd.to_numeric(df[<span class=\"st\">\"price\"</span>], errors=<span class=\"st\">\"coerce\"</span>)  <span class=\"cm\"># \"$1,200\" → NaN</span>\ndf[<span class=\"st\">\"date\"</span>] = pd.to_datetime(df[<span class=\"st\">\"date\"</span>], errors=<span class=\"st\">\"coerce\"</span>)\n\n<span class=\"cm\"># ── 3. Handle missing values ──────────────────────────────</span>\ndf[<span class=\"st\">\"age\"</span>] = df[<span class=\"st\">\"age\"</span>].fillna(df[<span class=\"st\">\"age\"</span>].median())\ndf[<span class=\"st\">\"category\"</span>] = df[<span class=\"st\">\"category\"</span>].fillna(<span class=\"st\">\"Unknown\"</span>)\ndf = df.dropna(subset=[<span class=\"st\">\"target\"</span>])  <span class=\"cm\"># must have target</span>\n\n<span class=\"cm\"># ── 4. Remove duplicates ──────────────────────────────────</span>\ndf = df.drop_duplicates()\n\n<span class=\"cm\"># ── 5. Cap outliers (IQR method) ──────────────────────────</span>\nQ1 = df[<span class=\"st\">\"price\"</span>].quantile(<span class=\"nm\">0.25</span>)\nQ3 = df[<span class=\"st\">\"price\"</span>].quantile(<span class=\"nm\">0.75</span>)\nIQR = Q3 - Q1\nlower, upper = Q1 - <span class=\"nm\">1.5</span> * IQR, Q3 + <span class=\"nm\">1.5</span> * IQR\ndf[<span class=\"st\">\"price\"</span>] = df[<span class=\"st\">\"price\"</span>].clip(lower, upper)</pre></div>"}, {"label": "Why Cleaning Matters", "html": "<div class=\"section-tag\">Real Consequences</div><div class=\"slide-heading\">What Happens If You Don't Clean? 💥</div><svg viewBox=\"0 0 560 260\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:560px;display:block;margin:6px auto;\">\n  <rect width=\"560\" height=\"260\" fill=\"rgba(0,0,0,0.45)\" rx=\"10\"/>\n  <text x=\"280\" y=\"22\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"13\" font-weight=\"bold\" font-family=\"monospace\">What Happens If You Don't Clean Your Data?</text>\n  <!-- 4 consequence cards -->\n  <!-- Card 1: NaN -->\n  <rect x=\"12\" y=\"34\" width=\"124\" height=\"110\" fill=\"rgba(239,68,68,0.1)\" stroke=\"rgba(239,68,68,0.3)\" rx=\"8\"/>\n  <text x=\"74\" y=\"52\" text-anchor=\"middle\" fill=\"#EF4444\" font-size=\"18\">💥</text>\n  <text x=\"74\" y=\"68\" text-anchor=\"middle\" fill=\"#EF4444\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">NaN values</text>\n  <text x=\"74\" y=\"84\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.6)\" font-size=\"9\" font-family=\"monospace\">sklearn crashes</text>\n  <text x=\"74\" y=\"97\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.6)\" font-size=\"9\" font-family=\"monospace\">with ValueError:</text>\n  <text x=\"74\" y=\"110\" text-anchor=\"middle\" fill=\"rgba(239,68,68,0.8)\" font-size=\"8.5\" font-family=\"monospace\">\"Input contains NaN\"</text>\n  <text x=\"74\" y=\"135\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.45)\" font-size=\"8\" font-family=\"monospace\">Fix: fillna() or dropna()</text>\n  <!-- Card 2: Wrong types -->\n  <rect x=\"144\" y=\"34\" width=\"124\" height=\"110\" fill=\"rgba(249,115,22,0.1)\" stroke=\"rgba(249,115,22,0.3)\" rx=\"8\"/>\n  <text x=\"206\" y=\"52\" text-anchor=\"middle\" fill=\"#F97316\" font-size=\"18\">⚠️</text>\n  <text x=\"206\" y=\"68\" text-anchor=\"middle\" fill=\"#F97316\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">Wrong dtypes</text>\n  <text x=\"206\" y=\"84\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.6)\" font-size=\"9\" font-family=\"monospace\">salary = \"50,000\"</text>\n  <text x=\"206\" y=\"97\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.6)\" font-size=\"9\" font-family=\"monospace\">(string not int)</text>\n  <text x=\"206\" y=\"110\" text-anchor=\"middle\" fill=\"rgba(249,115,22,0.8)\" font-size=\"8.5\" font-family=\"monospace\">mean() returns NaN</text>\n  <text x=\"206\" y=\"135\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.45)\" font-size=\"8\" font-family=\"monospace\">Fix: astype(), pd.to_numeric()</text>\n  <!-- Card 3: Outliers -->\n  <rect x=\"276\" y=\"34\" width=\"124\" height=\"110\" fill=\"rgba(255,209,102,0.08)\" stroke=\"rgba(255,209,102,0.28)\" rx=\"8\"/>\n  <text x=\"338\" y=\"52\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"18\">📊</text>\n  <text x=\"338\" y=\"68\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">Outliers</text>\n  <text x=\"338\" y=\"84\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.6)\" font-size=\"9\" font-family=\"monospace\">One fare = $512</text>\n  <text x=\"338\" y=\"97\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.6)\" font-size=\"9\" font-family=\"monospace\">pulls mean from</text>\n  <text x=\"338\" y=\"110\" text-anchor=\"middle\" fill=\"rgba(255,209,102,0.8)\" font-size=\"8.5\" font-family=\"monospace\">$15 to $32 (2×!)</text>\n  <text x=\"338\" y=\"135\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.45)\" font-size=\"8\" font-family=\"monospace\">Fix: clip, IQR filter</text>\n  <!-- Card 4: Duplicates -->\n  <rect x=\"408\" y=\"34\" width=\"140\" height=\"110\" fill=\"rgba(139,92,246,0.1)\" stroke=\"rgba(139,92,246,0.28)\" rx=\"8\"/>\n  <text x=\"478\" y=\"52\" text-anchor=\"middle\" fill=\"#8B5CF6\" font-size=\"18\">🔁</text>\n  <text x=\"478\" y=\"68\" text-anchor=\"middle\" fill=\"#C4B5FD\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">Duplicates</text>\n  <text x=\"478\" y=\"84\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.6)\" font-size=\"9\" font-family=\"monospace\">Model sees same</text>\n  <text x=\"478\" y=\"97\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.6)\" font-size=\"9\" font-family=\"monospace\">row 3× → biased</text>\n  <text x=\"478\" y=\"110\" text-anchor=\"middle\" fill=\"rgba(196,181,253,0.8)\" font-size=\"8.5\" font-family=\"monospace\">Falsely high accuracy</text>\n  <text x=\"478\" y=\"135\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.45)\" font-size=\"8\" font-family=\"monospace\">Fix: drop_duplicates()</text>\n  <!-- Real example bar chart comparison -->\n  <text x=\"280\" y=\"166\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.65)\" font-size=\"10.5\" font-family=\"monospace\">Real impact: model trained on dirty data vs clean data</text>\n  <!-- Dirty bar -->\n  <rect x=\"80\" y=\"178\" width=\"120\" height=\"24\" fill=\"rgba(239,68,68,0.6)\" rx=\"4\"/>\n  <text x=\"140\" y=\"194\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">Dirty Data — RMSE: $42,000</text>\n  <!-- Clean bar -->\n  <rect x=\"80\" y=\"210\" width=\"68\" height=\"24\" fill=\"rgba(67,233,123,0.6)\" rx=\"4\"/>\n  <text x=\"280\" y=\"226\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">Clean Data — RMSE: $24,000  (43% better!)</text>\n  <text x=\"280\" y=\"252\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.45)\" font-size=\"9.5\" font-family=\"monospace\">Same model, same features — only difference is proper cleaning</text>\n</svg><div class=\"code-wrap\" style=\"margin-top:8px;\"><div class=\"code-header\"><span>cleaning_consequences.py</span><span>python</span></div><pre><span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n<span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\ndf = pd.read_csv(<span class=\"st\">\"employees.csv\"</span>)\n<span class=\"fn\">print</span>(df.isnull().sum())        <span class=\"cm\"># spot NaN per column</span>\n<span class=\"fn\">print</span>(df.dtypes)               <span class=\"cm\"># spot wrong types</span>\n<span class=\"fn\">print</span>(df.duplicated().sum())   <span class=\"cm\"># count duplicate rows</span>\n\n<span class=\"cm\"># Fix: salary stored as \"55,000\" (string)</span>\ndf[<span class=\"st\">\"salary\"</span>] = pd.to_numeric(df[<span class=\"st\">\"salary\"</span>].str.replace(<span class=\"st\">\",\"</span>, <span class=\"st\">\"\"</span>), errors=<span class=\"st\">\"coerce\"</span>)\n\n<span class=\"cm\"># Fix: outliers — cap at 99th percentile</span>\ncap = df[<span class=\"st\">\"salary\"</span>].quantile(<span class=\"nm\">0.99</span>)\ndf[<span class=\"st\">\"salary\"</span>] = df[<span class=\"st\">\"salary\"</span>].clip(upper=cap)\n\n<span class=\"cm\"># Fix: all issues in a pipeline</span>\ndf = (df\n    .drop_duplicates()\n    .fillna({<span class=\"st\">\"age\"</span>: df[<span class=\"st\">\"age\"</span>].median(), <span class=\"st\">\"salary\"</span>: df[<span class=\"st\">\"salary\"</span>].median()})\n)</pre></div><div class=\"warn\">⚠️ <strong>Garbage in = Garbage out.</strong> A perfect model trained on dirty data will still produce wrong predictions. Cleaning is not optional — it is the foundation.</div>"}, {"label": "Encoding Categoricals", "html": "<div class=\"section-tag\">Concept 3</div><div class=\"slide-heading\">Encoding Categorical Variables 🔤</div><div class=\"code-wrap\"><div class=\"code-header\"><span>encoding.py</span><span>python</span></div><pre><span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\nfrom sklearn.preprocessing <span class=\"kw\">import</span> LabelEncoder\n\ndf = pd.DataFrame({<span class=\"st\">\"size\"</span>:[<span class=\"st\">\"S\"</span>,<span class=\"st\">\"L\"</span>,<span class=\"st\">\"M\"</span>,<span class=\"st\">\"XL\"</span>],\n                   <span class=\"st\">\"city\"</span>:[<span class=\"st\">\"SG\"</span>,<span class=\"st\">\"MY\"</span>,<span class=\"st\">\"SG\"</span>,<span class=\"st\">\"TH\"</span>]})\n\n<span class=\"cm\"># ── One-hot encoding (NOMINAL — no order) ─────────────────</span>\n<span class=\"cm\"># Use when: categories have no natural ordering</span>\ndf_ohe = pd.get_dummies(df, columns=[<span class=\"st\">\"city\"</span>])\n<span class=\"cm\"># Creates: city_MY, city_SG, city_TH (0/1 columns)</span>\n\n<span class=\"cm\"># ── Label encoding (ORDINAL — has order) ──────────────────</span>\n<span class=\"cm\"># Use when: categories have a meaningful order</span>\nsize_map = {<span class=\"st\">\"S\"</span>: <span class=\"nm\">0</span>, <span class=\"st\">\"M\"</span>: <span class=\"nm\">1</span>, <span class=\"st\">\"L\"</span>: <span class=\"nm\">2</span>, <span class=\"st\">\"XL\"</span>: <span class=\"nm\">3</span>}\ndf[<span class=\"st\">\"size_encoded\"</span>] = df[<span class=\"st\">\"size\"</span>].map(size_map)\n\n<span class=\"cm\"># ── Frequency encoding (HIGH CARDINALITY) ─────────────────</span>\n<span class=\"cm\"># Use when: too many unique values for OHE (e.g. 500 zip codes)</span>\nfreq = df[<span class=\"st\">\"city\"</span>].value_counts() / len(df)\ndf[<span class=\"st\">\"city_freq\"</span>] = df[<span class=\"st\">\"city\"</span>].map(freq)</pre></div><table style=\"margin-top:8px;\"><tr><th>Method</th><th>When to Use</th><th>Drawback</th></tr><tr><td>One-Hot</td><td>Nominal, &lt;20 unique values</td><td>Many columns with high cardinality</td></tr><tr><td>Label / Map</td><td>Ordinal (ordered) categories</td><td>Implies order if used on nominal data</td></tr><tr><td>Frequency</td><td>High cardinality (&gt;50 unique)</td><td>Different frequencies might get same value</td></tr></table>"}, {"label": "Scaling Features", "html": "<div class=\"section-tag\">Concept 4</div><div class=\"slide-heading\">Scaling Features — Why Models Care About Scale 📏</div><div class=\"code-wrap\"><div class=\"code-header\"><span>scaling.py</span><span>python</span></div><pre><span class=\"kw\">from</span> sklearn.preprocessing <span class=\"kw\">import</span> StandardScaler, MinMaxScaler\n<span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n<span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\nX = pd.DataFrame({\n    <span class=\"st\">\"age\"</span>: [<span class=\"nm\">25</span>, <span class=\"nm\">35</span>, <span class=\"nm\">45</span>, <span class=\"nm\">55</span>],\n    <span class=\"st\">\"salary\"</span>: [<span class=\"nm\">30000</span>, <span class=\"nm\">50000</span>, <span class=\"nm\">70000</span>, <span class=\"nm\">90000</span>],\n})\n\n<span class=\"cm\"># ── StandardScaler: mean=0, std=1 (Z-score) ──────────────</span>\n<span class=\"cm\"># Use when: normal-ish distribution, no hard bounds</span>\n<span class=\"cm\"># Works with: linear models, SVM, neural networks, PCA</span>\nscaler_std = StandardScaler()\nX_std = scaler_std.fit_transform(X)\n\n<span class=\"cm\"># ── MinMaxScaler: all values → [0, 1] ────────────────────</span>\n<span class=\"cm\"># Use when: bounded range needed, no extreme outliers</span>\n<span class=\"cm\"># Works with: neural networks (pixel values), KNN</span>\nscaler_mm = MinMaxScaler()\nX_mm = scaler_mm.fit_transform(X)\n\n<span class=\"cm\"># CRITICAL: fit on TRAIN, transform both train and test</span>\nfrom sklearn.model_selection <span class=\"kw\">import</span> train_test_split\nX_train, X_test, y_train, y_test = train_test_split(X, y)\nscaler = StandardScaler()\nX_train_s = scaler.fit_transform(X_train)   <span class=\"cm\"># fit + transform train</span>\nX_test_s  = scaler.transform(X_test)        <span class=\"cm\"># transform only (no fit!)</span></pre></div><div class=\"warn\">⚠️ <strong>Data leakage:</strong> Never fit the scaler on all data before the split — that leaks test set statistics into training. Always: fit on train, transform both.</div>"}, {"label": "Why Scaling Matters", "html": "<div class=\"section-tag\">Real Consequences</div><div class=\"slide-heading\">What Happens If You Don't Scale? ⚖️</div><svg viewBox=\"0 0 560 270\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:560px;display:block;margin:6px auto;\">\n  <rect width=\"560\" height=\"270\" fill=\"rgba(0,0,0,0.45)\" rx=\"10\"/>\n  <text x=\"280\" y=\"22\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"13\" font-weight=\"bold\" font-family=\"monospace\">What Happens If You Don't Scale?</text>\n  <!-- LEFT: unscaled -->\n  <rect x=\"10\" y=\"32\" width=\"258\" height=\"200\" fill=\"rgba(239,68,68,0.05)\" stroke=\"rgba(239,68,68,0.25)\" rx=\"8\"/>\n  <text x=\"139\" y=\"50\" text-anchor=\"middle\" fill=\"#EF4444\" font-size=\"11\" font-weight=\"bold\" font-family=\"monospace\">❌ Without Scaling</text>\n  <!-- Feature bars (raw values) -->\n  <text x=\"22\" y=\"72\" fill=\"rgba(255,255,255,0.6)\" font-size=\"9.5\" font-family=\"monospace\">salary (avg: 55,000)</text>\n  <rect x=\"22\" y=\"76\" width=\"220\" height=\"16\" fill=\"rgba(239,68,68,0.6)\" rx=\"3\"/>\n  <text x=\"245\" y=\"88\" fill=\"#EF4444\" font-size=\"9\" font-family=\"monospace\">55000</text>\n  <text x=\"22\" y=\"108\" fill=\"rgba(255,255,255,0.6)\" font-size=\"9.5\" font-family=\"monospace\">age (avg: 35)</text>\n  <rect x=\"22\" y=\"112\" width=\"1\" height=\"16\" fill=\"rgba(67,233,123,0.6)\" rx=\"3\"/>\n  <text x=\"27\" y=\"124\" fill=\"#43e97b\" font-size=\"9\" font-family=\"monospace\">35 — invisible!</text>\n  <text x=\"22\" y=\"144\" fill=\"rgba(255,255,255,0.6)\" font-size=\"9.5\" font-family=\"monospace\">years_exp (avg: 5)</text>\n  <rect x=\"22\" y=\"148\" width=\"1\" height=\"16\" fill=\"rgba(255,209,102,0.6)\" rx=\"3\"/>\n  <text x=\"27\" y=\"160\" fill=\"#FFD166\" font-size=\"9\" font-family=\"monospace\">5 — invisible!</text>\n  <text x=\"22\" y=\"180\" fill=\"rgba(255,255,255,0.6)\" font-size=\"9.5\" font-family=\"monospace\">distance_km (avg: 12)</text>\n  <rect x=\"22\" y=\"184\" width=\"1\" height=\"16\" fill=\"rgba(139,92,246,0.6)\" rx=\"3\"/>\n  <text x=\"27\" y=\"196\" fill=\"#C4B5FD\" font-size=\"9\" font-family=\"monospace\">12 — invisible!</text>\n  <text x=\"139\" y=\"222\" text-anchor=\"middle\" fill=\"#EF4444\" font-size=\"9\" font-family=\"monospace\">Model thinks salary is</text>\n  <text x=\"139\" y=\"234\" text-anchor=\"middle\" fill=\"#EF4444\" font-size=\"9\" font-family=\"monospace\">10,000× more important!</text>\n  <!-- RIGHT: scaled -->\n  <rect x=\"292\" y=\"32\" width=\"258\" height=\"200\" fill=\"rgba(67,233,123,0.05)\" stroke=\"rgba(67,233,123,0.25)\" rx=\"8\"/>\n  <text x=\"421\" y=\"50\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"11\" font-weight=\"bold\" font-family=\"monospace\">✅ With StandardScaler</text>\n  <!-- Feature bars (scaled 0-1 range) -->\n  <text x=\"302\" y=\"72\" fill=\"rgba(255,255,255,0.6)\" font-size=\"9.5\" font-family=\"monospace\">salary  (scaled)</text>\n  <rect x=\"302\" y=\"76\" width=\"120\" height=\"16\" fill=\"rgba(239,68,68,0.6)\" rx=\"3\"/>\n  <text x=\"425\" y=\"88\" fill=\"#EF4444\" font-size=\"9\" font-family=\"monospace\">0.0  (mean)</text>\n  <text x=\"302\" y=\"108\" fill=\"rgba(255,255,255,0.6)\" font-size=\"9.5\" font-family=\"monospace\">age  (scaled)</text>\n  <rect x=\"302\" y=\"112\" width=\"108\" height=\"16\" fill=\"rgba(67,233,123,0.6)\" rx=\"3\"/>\n  <text x=\"413\" y=\"124\" fill=\"#43e97b\" font-size=\"9\" font-family=\"monospace\">now comparable</text>\n  <text x=\"302\" y=\"144\" fill=\"rgba(255,255,255,0.6)\" font-size=\"9.5\" font-family=\"monospace\">years_exp (scaled)</text>\n  <rect x=\"302\" y=\"148\" width=\"95\" height=\"16\" fill=\"rgba(255,209,102,0.6)\" rx=\"3\"/>\n  <text x=\"400\" y=\"160\" fill=\"#FFD166\" font-size=\"9\" font-family=\"monospace\">now comparable</text>\n  <text x=\"302\" y=\"180\" fill=\"rgba(255,255,255,0.6)\" font-size=\"9.5\" font-family=\"monospace\">distance (scaled)</text>\n  <rect x=\"302\" y=\"184\" width=\"112\" height=\"16\" fill=\"rgba(139,92,246,0.6)\" rx=\"3\"/>\n  <text x=\"417\" y=\"196\" fill=\"#C4B5FD\" font-size=\"9\" font-family=\"monospace\">now comparable</text>\n  <text x=\"421\" y=\"222\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"9\" font-family=\"monospace\">All features compete fairly.</text>\n  <text x=\"421\" y=\"234\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"9\" font-family=\"monospace\">Model learns real importance.</text>\n  <!-- Bottom note -->\n  <text x=\"280\" y=\"254\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.5)\" font-size=\"9.5\" font-family=\"monospace\">⚠️  Scaling matters for: Linear Regression, Ridge, Lasso, Neural Networks, KNN, SVM</text>\n  <text x=\"280\" y=\"266\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.4)\" font-size=\"9.5\" font-family=\"monospace\">✅  Scaling NOT needed for: Decision Trees, Random Forest, XGBoost (tree-based models)</text>\n</svg><div class=\"code-wrap\" style=\"margin-top:8px;\"><div class=\"code-header\"><span>scaling_demo.py</span><span>python</span></div><pre><span class=\"kw\">from</span> sklearn.preprocessing <span class=\"kw\">import</span> StandardScaler, MinMaxScaler\n<span class=\"kw\">from</span> sklearn.linear_model <span class=\"kw\">import</span> Ridge\n<span class=\"kw\">from</span> sklearn.metrics <span class=\"kw\">import</span> r2_score\n\n<span class=\"cm\"># Without scaling</span>\nridge_raw = Ridge().fit(X_train, y_train)\n<span class=\"fn\">print</span>(<span class=\"st\">f\"No scaling R²: {r2_score(y_test, ridge_raw.predict(X_test)):.3f}\"</span>)\n\n<span class=\"cm\"># With StandardScaler (mean=0, std=1 — best for Ridge/Lasso/SVM)</span>\nscaler = StandardScaler()\nX_train_s = scaler.fit_transform(X_train)  <span class=\"cm\"># fit+transform on TRAIN only</span>\nX_test_s  = scaler.transform(X_test)        <span class=\"cm\"># transform ONLY on test!</span>\nridge_s = Ridge().fit(X_train_s, y_train)\n<span class=\"fn\">print</span>(<span class=\"st\">f\"With scaling R²: {r2_score(y_test, ridge_s.predict(X_test_s)):.3f}\"</span>)\n\n<span class=\"cm\"># MinMaxScaler: scales to [0,1] — good for Neural Networks</span>\nmm = MinMaxScaler()\nX_mm = mm.fit_transform(X_train)</pre></div><div class=\"tip\">💡 <strong>Rule:</strong> Scale for Linear/Ridge/Lasso/KNN/Neural Networks. Skip for Random Forest/XGBoost/Decision Trees. Always fit the scaler on training data only — <em>never</em> on the full dataset.</div>"}, {"label": "Creating New Features", "html": "<div class=\"section-tag\">Concept 5</div><div class=\"slide-heading\">Creating New Features — Domain Knowledge Wins ✨</div><div class=\"code-wrap\"><div class=\"code-header\"><span>new_features.py</span><span>python</span></div><pre><span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n<span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\ndf = pd.read_csv(<span class=\"st\">\"housing.csv\"</span>)\ndf[<span class=\"st\">\"date\"</span>] = pd.to_datetime(df[<span class=\"st\">\"date\"</span>])\n\n<span class=\"cm\"># ── Ratios and interactions ────────────────────────────────</span>\ndf[<span class=\"st\">\"price_per_sqm\"</span>] = df[<span class=\"st\">\"price\"</span>] / df[<span class=\"st\">\"floor_area\"</span>]\ndf[<span class=\"st\">\"bedroom_ratio\"</span>] = df[<span class=\"st\">\"bedrooms\"</span>] / df[<span class=\"st\">\"floor_area\"</span>]\n\n<span class=\"cm\"># ── Extract date parts ────────────────────────────────────</span>\ndf[<span class=\"st\">\"year\"</span>]      = df[<span class=\"st\">\"date\"</span>].dt.year\ndf[<span class=\"st\">\"month\"</span>]     = df[<span class=\"st\">\"date\"</span>].dt.month\ndf[<span class=\"st\">\"quarter\"</span>]   = df[<span class=\"st\">\"date\"</span>].dt.quarter\ndf[<span class=\"st\">\"dayofweek\"</span>]  = df[<span class=\"st\">\"date\"</span>].dt.dayofweek  <span class=\"cm\"># 0=Mon</span>\ndf[<span class=\"st\">\"is_weekend\"</span>] = df[<span class=\"st\">\"dayofweek\"</span>] >= <span class=\"nm\">5</span>\n\n<span class=\"cm\"># ── Log transform (fix right skew) ───────────────────────</span>\ndf[<span class=\"st\">\"log_price\"</span>]    = np.log1p(df[<span class=\"st\">\"price\"</span>])    <span class=\"cm\"># log(x+1)</span>\ndf[<span class=\"st\">\"log_area\"</span>]     = np.log1p(df[<span class=\"st\">\"floor_area\"</span>])\n\n<span class=\"cm\"># ── Rolling features (time series) ───────────────────────</span>\ndf[<span class=\"st\">\"ma_30d\"</span>] = df[<span class=\"st\">\"price\"</span>].rolling(<span class=\"nm\">30</span>).mean()\ndf[<span class=\"st\">\"ma_7d\"</span>]  = df[<span class=\"st\">\"price\"</span>].rolling(<span class=\"nm\">7</span>).mean()\n\n<span class=\"cm\"># ── Bin continuous into categories ───────────────────────</span>\ndf[<span class=\"st\">\"price_band\"</span>] = pd.cut(df[<span class=\"st\">\"price\"</span>],\n    bins=[<span class=\"nm\">0</span>,<span class=\"nm\">500_000</span>,<span class=\"nm\">1_000_000</span>,<span class=\"nm\">np.inf</span>],\n    labels=[<span class=\"st\">\"Budget\"</span>,<span class=\"st\">\"Mid\"</span>,<span class=\"st\">\"Premium\"</span>])</pre></div>"}, {"label": "Technical Indicators", "html": "<div class=\"section-tag\">Finance Features</div><div class=\"slide-heading\">Technical Indicators — Features for Stock Data 📈</div><div class=\"code-wrap\"><div class=\"code-header\"><span>technical_indicators.py</span><span>python</span></div><pre><span class=\"kw\">import</span> yfinance <span class=\"kw\">as</span> yf\n<span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n\ndf = yf.Ticker(<span class=\"st\">\"MCD\"</span>).history(period=<span class=\"st\">\"2y\"</span>)\n\n<span class=\"cm\"># ── Moving Averages ───────────────────────────────────────</span>\ndf[<span class=\"st\">\"MA_7\"</span>]  = df[<span class=\"st\">\"Close\"</span>].rolling(<span class=\"nm\">7</span>).mean()\ndf[<span class=\"st\">\"MA_20\"</span>] = df[<span class=\"st\">\"Close\"</span>].rolling(<span class=\"nm\">20</span>).mean()\ndf[<span class=\"st\">\"MA_50\"</span>] = df[<span class=\"st\">\"Close\"</span>].rolling(<span class=\"nm\">50</span>).mean()\n\n<span class=\"cm\"># ── Returns ───────────────────────────────────────────────</span>\ndf[<span class=\"st\">\"return_1d\"</span>]  = df[<span class=\"st\">\"Close\"</span>].pct_change(<span class=\"nm\">1</span>)\ndf[<span class=\"st\">\"return_5d\"</span>]  = df[<span class=\"st\">\"Close\"</span>].pct_change(<span class=\"nm\">5</span>)\ndf[<span class=\"st\">\"return_20d\"</span>] = df[<span class=\"st\">\"Close\"</span>].pct_change(<span class=\"nm\">20</span>)\n\n<span class=\"cm\"># ── Bollinger Bands ───────────────────────────────────────</span>\ndf[<span class=\"st\">\"BB_upper\"</span>] = df[<span class=\"st\">\"MA_20\"</span>] + <span class=\"nm\">2</span> * df[<span class=\"st\">\"Close\"</span>].rolling(<span class=\"nm\">20</span>).std()\ndf[<span class=\"st\">\"BB_lower\"</span>] = df[<span class=\"st\">\"MA_20\"</span>] - <span class=\"nm\">2</span> * df[<span class=\"st\">\"Close\"</span>].rolling(<span class=\"nm\">20</span>).std()\ndf[<span class=\"st\">\"BB_width\"</span>] = (df[<span class=\"st\">\"BB_upper\"</span>] - df[<span class=\"st\">\"BB_lower\"</span>]) / df[<span class=\"st\">\"MA_20\"</span>]\n\n<span class=\"cm\"># ── Volatility ────────────────────────────────────────────</span>\ndf[<span class=\"st\">\"vol_30d\"</span>] = df[<span class=\"st\">\"return_1d\"</span>].rolling(<span class=\"nm\">30</span>).std() * (<span class=\"nm\">252</span>**<span class=\"nm\">0.5</span>)\n\ndf = df.dropna()\n<span class=\"fn\">print</span>(df[[<span class=\"st\">\"Close\"</span>,<span class=\"st\">\"MA_20\"</span>,<span class=\"st\">\"BB_upper\"</span>,<span class=\"st\">\"BB_lower\"</span>,<span class=\"st\">\"vol_30d\"</span>]].tail())</pre></div>"}, {"label": "Code Lab", "html": "<div class=\"section-tag\">Hands-On</div><div class=\"slide-heading\">Code Lab — Full Feature Engineering Pipeline 💻</div><div class=\"code-wrap\"><div class=\"code-header\"><span>lab_08_features.py</span><span>python</span></div><pre><span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n<span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\nfrom sklearn.preprocessing <span class=\"kw\">import</span> StandardScaler\nfrom sklearn.model_selection <span class=\"kw\">import</span> train_test_split\n\ndf = sns.load_dataset(<span class=\"st\">\"titanic\"</span>)\n\n<span class=\"cm\"># Step 1: Clean</span>\ndf[<span class=\"st\">\"age\"</span>] = df[<span class=\"st\">\"age\"</span>].fillna(df[<span class=\"st\">\"age\"</span>].median())\ndf[<span class=\"st\">\"embarked\"</span>] = df[<span class=\"st\">\"embarked\"</span>].fillna(<span class=\"st\">\"S\"</span>)\ndf = df.drop(columns=[<span class=\"st\">\"cabin\"</span>,<span class=\"st\">\"name\"</span>,<span class=\"st\">\"ticket\"</span>])\n\n<span class=\"cm\"># Step 2: Engineer new features</span>\ndf[<span class=\"st\">\"family_size\"</span>] = df[<span class=\"st\">\"sibsp\"</span>] + df[<span class=\"st\">\"parch\"</span>] + <span class=\"nm\">1</span>\ndf[<span class=\"st\">\"is_alone\"</span>]    = (df[<span class=\"st\">\"family_size\"</span>] == <span class=\"nm\">1</span>).astype(<span class=\"nm\">int</span>)\ndf[<span class=\"st\">\"fare_per_person\"</span>] = df[<span class=\"st\">\"fare\"</span>] / df[<span class=\"st\">\"family_size\"</span>]\ndf[<span class=\"st\">\"log_fare\"</span>] = np.log1p(df[<span class=\"st\">\"fare\"</span>])\n\n<span class=\"cm\"># Step 3: Encode categoricals</span>\ndf = pd.get_dummies(df, columns=[<span class=\"st\">\"sex\"</span>,<span class=\"st\">\"embarked\"</span>])\n\n<span class=\"cm\"># Step 4: Scale numerics</span>\nfeature_cols = [<span class=\"st\">\"age\"</span>,<span class=\"st\">\"fare\"</span>,<span class=\"st\">\"family_size\"</span>,<span class=\"st\">\"log_fare\"</span>]\nX, y = df[feature_cols + [c <span class=\"kw\">for</span> c <span class=\"kw\">in</span> df.columns <span class=\"kw\">if</span> c.startswith((<span class=\"st\">\"sex_\"</span>,<span class=\"st\">\"emb\"</span>))]], df[<span class=\"st\">\"survived\"</span>]\nX_train, X_test, y_train, y_test = train_test_split(X, y, test_size=<span class=\"nm\">0.2</span>)\nscaler = StandardScaler()\nX_train = scaler.fit_transform(X_train)\nX_test  = scaler.transform(X_test)</pre></div>"}, {"label": "Common Mistakes", "html": "<div class=\"section-tag\">Watch Out!</div><div class=\"slide-heading\">Feature Engineering Mistakes ⚠️</div><div class=\"e-list\"><div class=\"e-item\"><div class=\"e-icon\">❌</div><div><strong>Data leakage — fitting scaler on full dataset</strong><br><code>scaler.fit_transform(X)</code> before the train/test split leaks test statistics into training.<br>✅ Fix: Split FIRST, then <code>scaler.fit(X_train)</code>, <code>scaler.transform(X_test)</code>.</div></div><div class=\"e-item\"><div class=\"e-icon\">❌</div><div><strong>Label encoding nominal categories</strong><br><code>LabelEncoder</code> on \"City\" makes model think Singapore(2) > Malaysia(1). Nonsense ordering.<br>✅ Fix: Use <code>pd.get_dummies()</code> (one-hot) for unordered categories.</div></div><div class=\"e-item\"><div class=\"e-icon\">❌</div><div><strong>Scaling before encoding</strong><br>You can't scale strings. Always encode → then scale.<br>✅ Fix: Clean → Encode categoricals → Split → Scale numerics.</div></div><div class=\"e-item\"><div class=\"e-icon\">❌</div><div><strong>Not handling NaN before model training</strong><br>Most sklearn models raise ValueError on NaN inputs.<br>✅ Fix: <code>df.isnull().sum()</code> → fillna/dropna → then model.</div></div></div>"}, {"label": "Session Recap", "html": "<div class=\"section-tag\">Session Recap</div><div class=\"slide-heading\">What You've Learned 🎉</div><div class=\"recap-grid\"><div class=\"recap-item\"><div class=\"recap-icon\">🧹</div><div class=\"recap-text\"><h4>Data Cleaning</h4><p>Fix column names, data types, missing values (median/fillna), remove duplicates, cap outliers with IQR.</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">🔤</div><div class=\"recap-text\"><h4>Encoding</h4><p>One-hot for nominal (no order). Label/map for ordinal (has order). Frequency encoding for high cardinality.</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">📏</div><div class=\"recap-text\"><h4>Scaling</h4><p>StandardScaler (z-score) for linear models/SVMs. MinMaxScaler for neural nets/KNN. ALWAYS fit on train only.</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">✨</div><div class=\"recap-text\"><h4>Feature Creation</h4><p>Ratios, date parts, log transform (skewed data), rolling averages, binning with pd.cut().</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">📊</div><div class=\"recap-text\"><h4>Order Matters</h4><p>Pipeline: Clean → Engineer → Encode → Split → Scale → Model. Never scale before split.</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">🔥</div><div class=\"recap-text\"><h4>Finance Features</h4><p>Moving averages, pct_change returns, Bollinger Bands, rolling volatility — the vocabulary of quant finance.</p></div></div></div><div class=\"highlight\" style=\"margin-top:auto;\">🚀 <strong>Next:</strong> Session 9 — Intro to Machine Learning: plug your engineered features into real models</div>"}];


let cur=0;
const wrap=document.getElementById('slides-wrap');
const dotsEl=document.getElementById('dots');
function renderSlides(){
  wrap.innerHTML='';dotsEl.innerHTML='';
  SLIDES_DATA.forEach((s,i)=>{
    const div=document.createElement('div');
    div.className='slide'+(i===0?' active':'');
    div.innerHTML=s.html;
    wrap.appendChild(div);
    const dot=document.createElement('div');
    dot.className='dot'+(i===0?' active':'');
    dot.onclick=()=>jump(i);
    dotsEl.appendChild(dot);
  });
  updateUI();
}
function updateUI(){
  const t=SLIDES_DATA.length;
  document.getElementById('counter').textContent=(cur+1)+' / '+t;
  document.getElementById('progress-bar').style.width=((cur+1)/t*100)+'%';
  document.getElementById('slide-title-bar').textContent=SLIDES_DATA[cur].label||'';
  document.getElementById('prev-btn').disabled=cur===0;
  document.getElementById('next-btn').disabled=cur===t-1;
  document.querySelectorAll('.slide').forEach((el,i)=>el.classList.toggle('active',i===cur));
  document.querySelectorAll('.dot').forEach((el,i)=>el.classList.toggle('active',i===cur));
}
function go(d){jump(cur+d);}
function jump(i){if(i<0||i>=SLIDES_DATA.length)return;cur=i;updateUI();document.querySelectorAll('.slide')[cur].scrollTop=0;}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(1);}
  if(e.key==='ArrowLeft'){e.preventDefault();go(-1);}
  if(e.key==='f'||e.key==='F')toggleFS();
  if(e.key==='Home')jump(0);
  if(e.key==='End')jump(SLIDES_DATA.length-1);
});
function toggleFS(){if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen();}

let _tx=0;
document.addEventListener('touchstart',e=>{_tx=e.changedTouches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-_tx;
  if(Math.abs(dx)>50){go(dx<0?1:-1);}
},{passive:true});
renderSlides();

<script id="codencode-copy-script">
(function(){
  function addCopy(){
    document.querySelectorAll('.code-wrap').forEach(function(w){
      var hdr=w.querySelector('.code-header'), pre=w.querySelector('pre');
      if(!hdr||!pre||hdr.querySelector('.copy-btn'))return;
      var b=document.createElement('button');
      b.className='copy-btn';b.type='button';b.textContent='Copy';
      b.addEventListener('click',function(ev){
        ev.stopPropagation();
        var t=pre.innerText.replace(/\u00a0/g,' ');
        function ok(){b.textContent='Copied';b.classList.add('done');setTimeout(function(){b.textContent='Copy';b.classList.remove('done');},1400);}
        if(navigator.clipboard&&navigator.clipboard.writeText){
          navigator.clipboard.writeText(t).then(ok).catch(fallback);
        }else{fallback();}
        function fallback(){
          var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
          document.body.appendChild(ta);ta.select();
          try{document.execCommand('copy');ok();}catch(e){}
          document.body.removeChild(ta);
        }
      });
      hdr.appendChild(b);
    });
  }
  if(document.readyState!=='loading')addCopy();
  document.addEventListener('DOMContentLoaded',addCopy);
  setTimeout(addCopy,400);
})();
</script>
