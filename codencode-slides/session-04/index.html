<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Session 04 — NumPy & Pandas: Data Wrangling</title><style>
:root{--accent:#f97583;--bg:#0f0f1a;--text:#e8e8f0;--muted:#8888aa;--code-bg:#0d1117;--card:#1e2240;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;user-select:none;}
#deck{width:100%;height:100vh;display:flex;flex-direction:column;}
#topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.06);flex-shrink:0;gap:12px;}
#session-label{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--accent);text-transform:uppercase;white-space:nowrap;}
#slide-title-bar{font-size:12px;color:var(--muted);flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#topbar-right{display:flex;gap:8px;align-items:center;flex-shrink:0;}
#counter{font-size:12px;color:var(--muted);white-space:nowrap;}
.btn{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);color:var(--text);border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer;transition:all 0.15s;}
.btn:hover{background:var(--accent);border-color:var(--accent);color:#000;}
#progress-wrap{height:3px;background:rgba(255,255,255,0.05);flex-shrink:0;}
#progress-bar{height:100%;background:var(--accent);transition:width 0.3s ease;}
#slides-wrap{flex:1;position:relative;overflow:hidden;}
.slide{position:absolute;inset:0;display:none;flex-direction:column;padding:32px 48px 24px;overflow-y:auto;animation:fadeIn 0.25s ease;}
.slide.active{display:flex;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
#nav{display:flex;align-items:center;justify-content:center;gap:16px;padding:10px 24px;flex-shrink:0;border-top:1px solid rgba(255,255,255,0.06);}
.nav-btn{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);color:var(--text);padding:7px 26px;border-radius:8px;font-size:14px;cursor:pointer;transition:all 0.15s;}
.nav-btn:hover:not(:disabled){background:var(--accent);border-color:var(--accent);color:#000;}
.nav-btn:disabled{opacity:0.3;cursor:default;}
#dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:600px;}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.2);cursor:pointer;transition:all 0.2s;}
.dot.active{background:var(--accent);transform:scale(1.5);}
.slide-title{align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at 50% 40%,#1e2a4a 0%,#0f0f1a 70%);}
.session-badge{font-size:11px;font-weight:800;letter-spacing:3px;color:var(--accent);text-transform:uppercase;margin-bottom:20px;padding:5px 16px;border:1px solid var(--accent);border-radius:20px;display:inline-block;}
.slide-title h1{font-size:clamp(26px,3.4vw,46px);font-weight:800;line-height:1.15;margin-bottom:16px;background:linear-gradient(135deg,#fff 30%,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;white-space:pre-line;}
.slide-title .sub{font-size:14px;color:var(--muted);max-width:580px;line-height:1.6;margin-bottom:28px;}
.academy-tag{font-size:12px;color:var(--muted);letter-spacing:1px;}
.section-tag{font-size:10px;font-weight:700;letter-spacing:2.5px;color:var(--accent);text-transform:uppercase;margin-bottom:6px;}
.slide-heading{font-size:clamp(17px,2.2vw,28px);font-weight:700;margin-bottom:14px;line-height:1.25;}
.cards{display:grid;gap:11px;}
.cards-2{grid-template-columns:1fr 1fr;}
.cards-3{grid-template-columns:1fr 1fr 1fr;}
.cards-4{grid-template-columns:1fr 1fr 1fr 1fr;}
.card{background:var(--card);border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:14px 16px;}
.card-accent{border-left:3px solid var(--accent);}
.card-icon{font-size:22px;margin-bottom:6px;}
.card h3{font-size:13px;font-weight:700;margin-bottom:4px;color:#fff;}
.card p{font-size:12px;color:var(--muted);line-height:1.55;}
.steps{display:flex;flex-direction:column;gap:9px;}
.step{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:10px;padding:11px 14px;border:1px solid rgba(255,255,255,0.06);}
.step-num{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#000;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.step-body h4{font-size:13px;font-weight:700;margin-bottom:2px;}
.step-body p{font-size:12px;color:var(--muted);line-height:1.5;}
.code-wrap{background:var(--code-bg);border-radius:10px;border:1px solid rgba(255,255,255,0.08);overflow:hidden;margin:8px 0;}
.code-header{background:rgba(255,255,255,0.05);padding:5px 13px;font-size:11px;color:var(--muted);font-family:monospace;display:flex;justify-content:space-between;align-items:center;}
pre{padding:11px 15px;overflow-x:auto;font-family:'Cascadia Code','Fira Code',Consolas,monospace;font-size:12px;line-height:1.7;color:#c9d1d9;}
.kw{color:#ff7b72;}.fn{color:#d2a8ff;}.st{color:#a5d6ff;}.cm{color:#8b949e;font-style:italic;}.nm{color:#79c0ff;}.op{color:#ff9e64;}
.highlight{background:rgba(255,255,255,0.04);border-left:4px solid var(--accent);border-radius:0 8px 8px 0;padding:10px 14px;margin:8px 0;font-size:13px;line-height:1.6;}
.highlight strong{color:var(--accent);}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;flex:1;}
.warn{background:rgba(255,100,50,0.1);border:1px solid rgba(255,100,50,0.3);border-radius:8px;padding:9px 13px;font-size:12px;margin:6px 0;}
.tip{background:rgba(80,220,100,0.1);border:1px solid rgba(80,220,100,0.3);border-radius:8px;padding:9px 13px;font-size:12px;margin:6px 0;}
.roadmap{display:grid;grid-template-columns:1fr 1fr;gap:9px;flex:1;}
.roadmap-item{background:var(--card);border-radius:12px;padding:12px;border:1px solid rgba(255,255,255,0.06);display:flex;gap:9px;align-items:flex-start;}
.rm-num{font-size:18px;font-weight:900;color:var(--accent);opacity:0.4;line-height:1;flex-shrink:0;width:22px;}
.rm-icon{font-size:17px;flex-shrink:0;}
.rm-text h4{font-size:12px;font-weight:700;margin-bottom:2px;}
.rm-text p{font-size:11px;color:var(--muted);line-height:1.5;}
.recap-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;flex:1;}
.recap-item{background:var(--card);border-radius:10px;padding:12px;border-left:3px solid var(--accent);display:flex;gap:8px;align-items:flex-start;}
.recap-icon{font-size:17px;flex-shrink:0;}
.recap-text h4{font-size:13px;font-weight:700;margin-bottom:2px;}
.recap-text p{font-size:11px;color:var(--muted);line-height:1.5;}
.e-list{display:flex;flex-direction:column;gap:8px;}
.e-item{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.55;}
.e-icon{font-size:15px;flex-shrink:0;}
table{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0;}
th{background:rgba(255,255,255,0.06);padding:7px 10px;text-align:left;font-weight:700;color:var(--accent);}
td{padding:6px 10px;border-top:1px solid rgba(255,255,255,0.05);color:var(--muted);}
.slide::-webkit-scrollbar{width:4px;}
.slide::-webkit-scrollbar-track{background:transparent;}
.slide::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:2px;}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:700;margin:2px;}
.tag-green{background:rgba(80,200,80,0.2);color:#50c850;border:1px solid rgba(80,200,80,0.3);}
.tag-blue{background:rgba(80,150,255,0.2);color:#79c0ff;border:1px solid rgba(80,150,255,0.3);}
.tag-orange{background:rgba(255,150,50,0.2);color:#ff9e64;border:1px solid rgba(255,150,50,0.3);}
.big-concept{background:linear-gradient(135deg,#1e2a4a,#1e2240);border:1px solid rgba(249,117,131,0.3);border-radius:14px;padding:20px 24px;margin:10px 0;text-align:center;}
.big-concept .bc-emoji{font-size:36px;margin-bottom:8px;}
.big-concept h2{font-size:20px;font-weight:800;color:#fff;margin-bottom:6px;}
.big-concept p{font-size:13px;color:var(--muted);line-height:1.6;}

@media(max-width:700px){
  body{overflow:auto;}
  #deck{height:auto;min-height:100vh;}
  #slides-wrap{height:auto;min-height:60vh;}
  .slide{position:relative;inset:auto;display:none;padding:16px 16px 12px;}
  .slide.active{display:flex;}
  .cards-2,.cards-3,.cards-4{grid-template-columns:1fr;}
  .two-col,.roadmap,.recap-grid{grid-template-columns:1fr;}
  #session-label{display:none;}
  #slide-title-bar{display:none;}
  pre{font-size:10px;line-height:1.6;}
  .nav-btn{padding:6px 14px;font-size:13px;}
  #dots{max-width:100%;}
  .dot{width:5px;height:5px;}
  .big-concept{padding:14px 16px;}
  .big-concept h2{font-size:16px;}
  .big-concept .bc-emoji{font-size:28px;}
  .slide-heading{font-size:18px;}
  #topbar{padding:8px 12px;gap:6px;}
  #nav{padding:8px 12px;gap:10px;}
  table{font-size:10px;}
  th,td{padding:5px 6px;}
  .card h3{font-size:12px;}
  .card p{font-size:11px;}
  .highlight,.tip,.warn{font-size:11px;}
  .step-body h4{font-size:12px;}
  .step-body p{font-size:11px;}
}
.code-wrap pre,.code-wrap *,.code-wrap{user-select:text !important;-webkit-user-select:text !important;}
</style></head><body>

</div><script>
const SLIDES_DATA = [{"label": "Title", "html": "<div class=\"slide-title\" style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;\">\n<div class=\"session-badge\">Session 04 of 15</div>\n<div style=\"font-size:48px;margin-bottom:12px;\">📊</div>\n<h1>NumPy &amp; Pandas:<br>Data Wrangling</h1>\n<p class=\"sub\">Load, clean, slice, group and analyse any dataset — the two libraries every data scientist uses daily</p>\n<div style=\"display:flex;gap:16px;justify-content:center;margin-top:16px;flex-wrap:wrap;\">\n<span class=\"tag tag-blue\">NumPy Arrays</span><span class=\"tag tag-green\">Pandas Series</span><span class=\"tag tag-orange\">DataFrames</span><span class=\"tag tag-blue\">Data Cleaning</span><span class=\"tag tag-green\">GroupBy</span><span class=\"tag tag-orange\">Merging</span>\n</div>\n<div class=\"academy-tag\" style=\"margin-top:20px;\">codencode Academy · Python + Data Science</div></div>"}, {"label": "Today's Roadmap", "html": "<div class=\"section-tag\">Roadmap</div>\n<div class=\"slide-heading\">What We'll Cover Today 🗺️</div>\n<div class=\"roadmap\">\n<div class=\"roadmap-item\"><div class=\"rm-num\">01</div><div class=\"rm-icon\">⚡</div><div class=\"rm-text\"><h4>NumPy Basics</h4><p>Arrays, vectorised math, 2D arrays, indexing, slicing, boolean masks</p></div></div>\n<div class=\"roadmap-item\"><div class=\"rm-num\">02</div><div class=\"rm-icon\">📋</div><div class=\"rm-text\"><h4>Pandas Series</h4><p>1D labelled data, flexible indexing, built-in stats</p></div></div>\n<div class=\"roadmap-item\"><div class=\"rm-num\">03</div><div class=\"rm-icon\">📊</div><div class=\"rm-text\"><h4>DataFrames</h4><p>Create, load, explore — head/tail/describe/dtypes/isnull</p></div></div>\n<div class=\"roadmap-item\"><div class=\"rm-num\">04</div><div class=\"rm-icon\">🔍</div><div class=\"rm-text\"><h4>Filter, Sort, Add Columns</h4><p>loc vs iloc, boolean filtering, computed columns</p></div></div>\n<div class=\"roadmap-item\"><div class=\"rm-num\">05</div><div class=\"rm-icon\">🧹</div><div class=\"rm-text\"><h4>Cleaning Missing Data</h4><p>dropna, fillna, detecting NaN, data types</p></div></div>\n<div class=\"roadmap-item\"><div class=\"rm-num\">06</div><div class=\"rm-icon\">📦</div><div class=\"rm-text\"><h4>GroupBy &amp; Merging</h4><p>groupby/agg, merge/join, pivot tables</p></div></div>\n</div>\n<div class=\"tip\">💡 <strong>Goal:</strong> By the end you can load any CSV, clean it, and extract insights — the foundation for every ML project.</div>"}, {"label": "Why NumPy?", "html": "<div class=\"section-tag\">Why NumPy?</div>\n<div class=\"slide-heading\">NumPy — Fast Math on Arrays ⚡</div>\n<div class=\"big-concept\"><div class=\"bc-emoji\">⚡</div><h2>NumPy arrays are 50–100× faster than Python lists for math</h2>\n<p>Python lists are general-purpose containers. NumPy arrays are purpose-built for numerical computation — vectorised operations across millions of numbers with no Python loop.</p></div>\n<div class=\"code-wrap\"><div class=\"code-header\"><span>numpy_speed.py</span><span>python</span></div><pre><span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n<span class=\"kw\">import</span> time\n\nprices_list = <span class=\"fn\">list</span>(<span class=\"fn\">range</span>(<span class=\"nm\">1_000_000</span>))\nprices_arr  = np.array(prices_list)\n\n<span class=\"cm\"># Python list — slow (uses a Python loop internally)</span>\nt0 = time.time()\ndoubled_slow = [p * <span class=\"nm\">2</span> <span class=\"kw\">for</span> p <span class=\"kw\">in</span> prices_list]\n<span class=\"fn\">print</span>(<span class=\"st\">f\"List: {time.time()-t0:.3f}s\"</span>)  <span class=\"cm\"># ~0.12s</span>\n\n<span class=\"cm\"># NumPy array — fast (C-compiled loop, no Python overhead)</span>\nt0 = time.time()\ndoubled_fast = prices_arr * <span class=\"nm\">2</span>           <span class=\"cm\"># vectorised!</span>\n<span class=\"fn\">print</span>(<span class=\"st\">f\"NumPy: {time.time()-t0:.3f}s\"</span>)  <span class=\"cm\"># ~0.001s</span></pre></div>\n<div class=\"cards cards-3\" style=\"margin-top:10px;\">\n<div class=\"card card-accent\"><div class=\"card-icon\">✅</div><h3>Use NumPy when…</h3><p>You need fast math on large numerical data: matrix math, signal processing, ML model weights, image pixel arrays.</p></div>\n<div class=\"card card-accent\"><div class=\"card-icon\">❌</div><h3>Don't use NumPy when…</h3><p>Data has mixed types (strings + numbers) or you need labels, filtering by name, or SQL-like operations → use Pandas.</p></div>\n<div class=\"card card-accent\"><div class=\"card-icon\">🤝</div><h3>They work together</h3><p>Pandas DataFrames are built on top of NumPy arrays. You'll use both — NumPy for math, Pandas for data wrangling.</p></div>\n</div>"}, {"label": "NumPy Array Basics", "html": "<div class=\"section-tag\">NumPy Core</div>\n<div class=\"slide-heading\">Creating &amp; Using NumPy Arrays 🔢</div>\n<div class=\"code-wrap\"><div class=\"code-header\"><span>numpy_basics.py</span><span>python</span></div><pre><span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\n<span class=\"cm\"># ── Create arrays ─────────────────────────────────────────</span>\na = np.array([<span class=\"nm\">10.5</span>, <span class=\"nm\">11.2</span>, <span class=\"nm\">9.8</span>, <span class=\"nm\">12.1</span>, <span class=\"nm\">10.9</span>])\nzeros  = np.zeros(<span class=\"nm\">5</span>)               <span class=\"cm\"># [0. 0. 0. 0. 0.]</span>\nones   = np.ones((<span class=\"nm\">3</span>,<span class=\"nm\">4</span>))            <span class=\"cm\"># 3×4 matrix of 1s</span>\nrng    = np.arange(<span class=\"nm\">0</span>, <span class=\"nm\">10</span>, <span class=\"nm\">2</span>)       <span class=\"cm\"># [0, 2, 4, 6, 8]</span>\nlinsp  = np.linspace(<span class=\"nm\">0</span>, <span class=\"nm\">1</span>, <span class=\"nm\">5</span>)      <span class=\"cm\"># [0, .25, .5, .75, 1]</span>\nrand   = np.random.rand(<span class=\"nm\">3</span>)         <span class=\"cm\"># 3 random [0–1) floats</span>\n\n<span class=\"cm\"># ── Array info ────────────────────────────────────────────</span>\n<span class=\"fn\">print</span>(a.shape)    <span class=\"cm\"># (5,)  — 1D, 5 elements</span>\n<span class=\"fn\">print</span>(a.dtype)    <span class=\"cm\"># float64</span>\n<span class=\"fn\">print</span>(a.ndim)     <span class=\"cm\"># 1</span>\n<span class=\"fn\">print</span>(a.size)     <span class=\"cm\"># 5</span>\n\n<span class=\"cm\"># ── Vectorised math (no loops!) ──────────────────────────</span>\n<span class=\"fn\">print</span>(a * <span class=\"nm\">2</span>)              <span class=\"cm\"># each element × 2</span>\n<span class=\"fn\">print</span>(a + <span class=\"nm\">100</span>)            <span class=\"cm\"># add 100 to each</span>\n<span class=\"fn\">print</span>(np.sqrt(a))         <span class=\"cm\"># square root of each</span>\n<span class=\"fn\">print</span>(a ** <span class=\"nm\">2</span>)             <span class=\"cm\"># square each element</span>\n\n<span class=\"cm\"># ── Statistics ───────────────────────────────────────────</span>\n<span class=\"fn\">print</span>(np.mean(a))         <span class=\"cm\"># average</span>\n<span class=\"fn\">print</span>(np.median(a))       <span class=\"cm\"># middle value</span>\n<span class=\"fn\">print</span>(np.std(a))          <span class=\"cm\"># standard deviation</span>\n<span class=\"fn\">print</span>(np.min(a), np.max(a))\n<span class=\"fn\">print</span>(np.argmax(a))       <span class=\"cm\"># index of max value</span></pre></div>"}, {"label": "NumPy 2D Arrays", "html": "<div class=\"section-tag\">NumPy Core</div>\n<div class=\"slide-heading\">2D Arrays — Matrices &amp; Indexing 🔲</div>\n<div class=\"two-col\">\n<div>\n<div class=\"code-wrap\"><div class=\"code-header\"><span>numpy_2d.py</span><span>python</span></div><pre><span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\n<span class=\"cm\"># Create a 3×4 matrix (3 rows, 4 cols)</span>\nm = np.array([\n    [<span class=\"nm\">1</span>,  <span class=\"nm\">2</span>,  <span class=\"nm\">3</span>,  <span class=\"nm\">4</span>],\n    [<span class=\"nm\">5</span>,  <span class=\"nm\">6</span>,  <span class=\"nm\">7</span>,  <span class=\"nm\">8</span>],\n    [<span class=\"nm\">9</span>, <span class=\"nm\">10</span>, <span class=\"nm\">11</span>, <span class=\"nm\">12</span>],\n])\n<span class=\"fn\">print</span>(m.shape)   <span class=\"cm\"># (3, 4)</span>\n\n<span class=\"cm\"># Indexing: [row, col]</span>\n<span class=\"fn\">print</span>(m[<span class=\"nm\">0</span>, <span class=\"nm\">0</span>])   <span class=\"cm\"># 1  (top-left)</span>\n<span class=\"fn\">print</span>(m[<span class=\"nm\">2</span>, <span class=\"nm\">3</span>])   <span class=\"cm\"># 12 (bottom-right)</span>\n<span class=\"fn\">print</span>(m[-<span class=\"nm\">1</span>, -<span class=\"nm\">1</span>]) <span class=\"cm\"># 12 (same, negative)</span>\n\n<span class=\"cm\"># Slicing: [row_slice, col_slice]</span>\n<span class=\"fn\">print</span>(m[<span class=\"nm\">0</span>, :])   <span class=\"cm\"># first row: [1,2,3,4]</span>\n<span class=\"fn\">print</span>(m[:, <span class=\"nm\">1</span>])   <span class=\"cm\"># second col: [2,6,10]</span>\n<span class=\"fn\">print</span>(m[<span class=\"nm\">0</span>:<span class=\"nm\">2</span>, <span class=\"nm\">1</span>:<span class=\"nm\">3</span>]) <span class=\"cm\"># submatrix rows 0-1, cols 1-2</span>\n\n<span class=\"cm\"># Math across axes</span>\n<span class=\"fn\">print</span>(m.sum(axis=<span class=\"nm\">0</span>))  <span class=\"cm\"># sum each column → [15,18,21,24]</span>\n<span class=\"fn\">print</span>(m.sum(axis=<span class=\"nm\">1</span>))  <span class=\"cm\"># sum each row    → [10,26,42]</span>\n<span class=\"fn\">print</span>(m.T)             <span class=\"cm\"># transpose (flip rows/cols)</span>\n<span class=\"fn\">print</span>(m.reshape(<span class=\"nm\">4</span>,<span class=\"nm\">3</span>))  <span class=\"cm\"># reshape to 4×3</span></pre></div>\n</div>\n<div>\n<div class=\"highlight\"><strong>axis=0</strong> → operates <strong>down rows</strong> (result has one value per column)<br><strong>axis=1</strong> → operates <strong>across columns</strong> (result has one value per row)<br><br>Think of it this way: axis=0 collapses rows, axis=1 collapses columns.</div>\n<div class=\"tip\" style=\"margin-top:10px;\">🎯 <strong>When to use 2D arrays:</strong> Image data (height × width pixels), matrices for ML (samples × features), correlation matrices, confusion matrices</div>\n<div class=\"warn\" style=\"margin-top:10px;\">⚠️ <strong>Common mistake:</strong> <code>m[0][1]</code> works but is slower than <code>m[0,1]</code>. Always use comma indexing with NumPy.</div>\n</div>\n</div>"}, {"label": "Boolean Indexing", "html": "<div class=\"section-tag\">NumPy Power Feature</div>\n<div class=\"slide-heading\">Boolean Masking — Filter Without Loops 🎭</div>\n<div class=\"highlight\">Boolean indexing lets you select elements based on a condition — no loops, no if-statements. This is one of NumPy's (and Pandas') most powerful features.</div>\n<div class=\"code-wrap\"><div class=\"code-header\"><span>boolean_indexing.py</span><span>python</span></div><pre><span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\nscores = np.array([<span class=\"nm\">45</span>, <span class=\"nm\">82</span>, <span class=\"nm\">67</span>, <span class=\"nm\">91</span>, <span class=\"nm\">55</span>, <span class=\"nm\">78</span>, <span class=\"nm\">88</span>, <span class=\"nm\">42</span>])\n\n<span class=\"cm\"># Step 1: Create a boolean mask</span>\nmask = scores > <span class=\"nm\">70</span>\n<span class=\"fn\">print</span>(mask)  <span class=\"cm\"># [F, T, F, T, F, T, T, F]</span>\n\n<span class=\"cm\"># Step 2: Apply mask to get matching values</span>\npassing = scores[mask]\n<span class=\"fn\">print</span>(passing)  <span class=\"cm\"># [82, 91, 78, 88]</span>\n\n<span class=\"cm\"># One-liner (most common style)</span>\npassing = scores[scores > <span class=\"nm\">70</span>]\n\n<span class=\"cm\"># Combine conditions with & (and) | (or) ~ (not)</span>\nb_grade = scores[(scores >= <span class=\"nm\">70</span>) &amp; (scores &lt; <span class=\"nm\">90</span>)]  <span class=\"cm\"># [82, 78, 88]</span>\nextremes = scores[(scores &lt; <span class=\"nm\">50</span>) | (scores > <span class=\"nm\">85</span>)]   <span class=\"cm\"># [91, 88, 42]</span>\n\n<span class=\"cm\"># np.where: conditional replacement (like Excel IF)</span>\n<span class=\"cm\"># np.where(condition, value_if_true, value_if_false)</span>\ngrade = np.where(scores >= <span class=\"nm\">70</span>, <span class=\"st\">\"Pass\"</span>, <span class=\"st\">\"Fail\"</span>)\n<span class=\"fn\">print</span>(grade)  <span class=\"cm\"># ['Fail', 'Pass', 'Fail', 'Pass', ...]</span>\n\n<span class=\"cm\"># Count how many passed</span>\n<span class=\"fn\">print</span>(mask.sum())   <span class=\"cm\"># 4  (True counts as 1)</span>\n<span class=\"fn\">print</span>(mask.mean())  <span class=\"cm\"># 0.5 = 50% passed</span></pre></div>\n<div class=\"tip\">💡 <strong>Remember:</strong> Always wrap each condition in parentheses when combining with <code>&amp;</code> or <code>|</code>. Python's operator precedence bites here.</div>"}, {"label": "Pandas Series", "html": "<div class=\"section-tag\">Pandas Building Block</div>\n<div class=\"slide-heading\">Pandas Series — 1D Labelled Data 📋</div>\n<div class=\"highlight\">A <strong>Series</strong> is a single column of data with an index (label). Think of it as a NumPy array with row names. Every DataFrame column is a Series.</div>\n<div class=\"two-col\">\n<div class=\"code-wrap\"><div class=\"code-header\"><span>series_intro.py</span><span>python</span></div><pre><span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n<span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\n<span class=\"cm\"># Create Series</span>\nprices = pd.Series(\n    [<span class=\"nm\">3.50</span>, <span class=\"nm\">12.90</span>, <span class=\"nm\">5.40</span>, <span class=\"nm\">8.20</span>],\n    index=[<span class=\"st\">\"coffee\"</span>, <span class=\"st\">\"burger\"</span>, <span class=\"st\">\"fries\"</span>, <span class=\"st\">\"shake\"</span>]\n)\n<span class=\"fn\">print</span>(prices)\n<span class=\"cm\"># coffee     3.50</span>\n<span class=\"cm\"># burger    12.90</span>\n<span class=\"cm\"># fries      5.40</span>\n<span class=\"cm\"># shake      8.20</span>\n\n<span class=\"cm\"># Access by label</span>\n<span class=\"fn\">print</span>(prices[<span class=\"st\">\"burger\"</span>])   <span class=\"cm\"># 12.90</span>\n<span class=\"fn\">print</span>(prices[[<span class=\"st\">\"coffee\"</span>, <span class=\"st\">\"fries\"</span>]])\n\n<span class=\"cm\"># Vectorised math</span>\n<span class=\"fn\">print</span>(prices * <span class=\"nm\">1.09</span>)     <span class=\"cm\"># add 9% GST</span>\n<span class=\"fn\">print</span>(prices[prices > <span class=\"nm\">5</span>]) <span class=\"cm\"># boolean filter</span>\n\n<span class=\"cm\"># Built-in stats</span>\n<span class=\"fn\">print</span>(prices.mean())   <span class=\"cm\"># 7.5</span>\n<span class=\"fn\">print</span>(prices.max())    <span class=\"cm\"># 12.90</span>\n<span class=\"fn\">print</span>(prices.describe())</pre></div>\n<div>\n<div class=\"cards\" style=\"gap:8px;\">\n<div class=\"card card-accent\"><h3>Series vs List</h3><p>List uses position only. Series uses labels. <code>prices[\"coffee\"]</code> is clearer than <code>prices[0]</code>.</p></div>\n<div class=\"card card-accent\"><h3>Series vs Dict</h3><p>Dict stores key-value pairs. Series adds vectorised math, filtering, and alignment by index on top.</p></div>\n<div class=\"card card-accent\"><h3>When to use?</h3><p>A single column of data that needs labels. Also the result of any single-column DataFrame operation.</p></div>\n</div>\n</div>\n</div>"}, {"label": "What is a DataFrame?", "html": "<div class=\"section-tag\">Core Concept</div>\n<div class=\"slide-heading\">What is a DataFrame? 📊</div>\n<div class=\"big-concept\"><div class=\"bc-emoji\">📊</div><h2>A DataFrame = multiple Series sharing the same index</h2>\n<p>Think: Excel spreadsheet in Python. Rows = observations (one burger, one stock, one customer). Columns = attributes. Handles millions of rows, mixed types, and SQL-like operations.</p></div>\n<div class=\"cards cards-3\" style=\"margin-top:10px;\">\n<div class=\"card card-accent\"><div class=\"card-icon\">🤔</div><h3>What is it?</h3><p>A 2D table from the Pandas library. Rows have an index. Columns have names. Both are accessible by label or position.</p></div>\n<div class=\"card card-accent\"><div class=\"card-icon\">❓</div><h3>Why use it?</h3><p>Sort, filter, group, merge, clean — all in one line. 20 lines of plain Python code becomes 1 line with Pandas.</p></div>\n<div class=\"card card-accent\"><div class=\"card-icon\">🎯</div><h3>When to use it?</h3><p>When data has rows AND columns: CSV files, database query results, API responses with multiple fields.</p></div>\n</div>\n<div class=\"tip\" style=\"margin-top:10px;\">💡 <strong>Rule:</strong> If you're tempted to use a list-of-dicts or a dict-of-lists, use a DataFrame instead — you get 10× the functionality for free.</div>"}, {"label": "Creating DataFrames", "html": "<div class=\"section-tag\">Concept 1</div>\n<div class=\"slide-heading\">Creating DataFrames — 4 Ways 📂</div>\n<div class=\"code-wrap\"><div class=\"code-header\"><span>create_df.py</span><span>python</span></div><pre><span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n\n<span class=\"cm\"># ── Method 1: From a list of dicts (most common from APIs) ──</span>\nrows = [\n    {<span class=\"st\">\"item\"</span>: <span class=\"st\">\"Big Mac\"</span>,  <span class=\"st\">\"cal\"</span>: <span class=\"nm\">563</span>, <span class=\"st\">\"protein\"</span>: <span class=\"nm\">26</span>},\n    {<span class=\"st\">\"item\"</span>: <span class=\"st\">\"McFlurry\"</span>, <span class=\"st\">\"cal\"</span>: <span class=\"nm\">340</span>, <span class=\"st\">\"protein\"</span>: <span class=\"nm\">7</span>},\n    {<span class=\"st\">\"item\"</span>: <span class=\"st\">\"Lg Fries\"</span>, <span class=\"st\">\"cal\"</span>: <span class=\"nm\">490</span>, <span class=\"st\">\"protein\"</span>: <span class=\"nm\">6</span>},\n]\ndf = pd.DataFrame(rows)\n\n<span class=\"cm\"># ── Method 2: From a CSV file (most common source) ──────────</span>\ndf = pd.read_csv(<span class=\"st\">\"data/menu.csv\"</span>)\n\n<span class=\"cm\"># ── Method 3: From a dict of lists ──────────────────────────</span>\ndf = pd.DataFrame({\n    <span class=\"st\">\"item\"</span>:    [<span class=\"st\">\"Big Mac\"</span>, <span class=\"st\">\"McFlurry\"</span>, <span class=\"st\">\"Lg Fries\"</span>],\n    <span class=\"st\">\"cal\"</span>:     [<span class=\"nm\">563</span>,       <span class=\"nm\">340</span>,        <span class=\"nm\">490</span>],\n    <span class=\"st\">\"protein\"</span>: [<span class=\"nm\">26</span>,        <span class=\"nm\">7</span>,          <span class=\"nm\">6</span>],\n})\n\n<span class=\"cm\"># ── Method 4: From yfinance / API (real-world use) ──────────</span>\n<span class=\"kw\">import</span> yfinance <span class=\"kw\">as</span> yf\ndf = yf.Ticker(<span class=\"st\">\"MCD\"</span>).history(period=<span class=\"st\">\"1y\"</span>)\n\n<span class=\"cm\"># ── Always explore immediately after loading ─────────────────</span>\n<span class=\"fn\">print</span>(df.head(<span class=\"nm\">5</span>))        <span class=\"cm\"># first 5 rows</span>\n<span class=\"fn\">print</span>(df.tail(<span class=\"nm\">3</span>))        <span class=\"cm\"># last 3 rows</span>\n<span class=\"fn\">print</span>(df.shape)           <span class=\"cm\"># (rows, columns)</span>\n<span class=\"fn\">print</span>(df.columns.tolist())<span class=\"cm\"># column names as list</span>\n<span class=\"fn\">print</span>(df.dtypes)          <span class=\"cm\"># data type of each column</span>\n<span class=\"fn\">print</span>(df.describe())      <span class=\"cm\"># mean, std, min, max, etc.</span>\n<span class=\"fn\">print</span>(df.isnull().sum())  <span class=\"cm\"># count NaN per column</span></pre></div>\n<div class=\"tip\">💡 <strong>Always run these 5 lines on any new dataset before anything else!</strong></div>"}, {"label": "loc vs iloc", "html": "<div class=\"section-tag\">Concept 2 — Indexing</div>\n<div class=\"slide-heading\">loc vs iloc — Selecting Rows &amp; Columns 🎯</div>\n<div class=\"highlight\">Two ways to index DataFrames: <strong>loc</strong> uses labels, <strong>iloc</strong> uses integer positions. Knowing which to use matters.</div>\n<div class=\"code-wrap\"><div class=\"code-header\"><span>loc_vs_iloc.py</span><span>python</span></div><pre><span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n\ndf = pd.read_csv(<span class=\"st\">\"menu.csv\"</span>)\n<span class=\"cm\"># Assume index: 0,1,2,...  columns: item, cal, protein, category</span>\n\n<span class=\"cm\"># ── .loc[row_label, col_label] — label-based ─────────────</span>\ndf.loc[<span class=\"nm\">0</span>]                       <span class=\"cm\"># row with index 0</span>\ndf.loc[<span class=\"nm\">0</span>, <span class=\"st\">\"cal\"</span>]               <span class=\"cm\"># value at row 0, col \"cal\"</span>\ndf.loc[<span class=\"nm\">0</span>:<span class=\"nm\">3</span>, [<span class=\"st\">\"item\"</span>, <span class=\"st\">\"cal\"</span>]]  <span class=\"cm\"># rows 0-3, two cols</span>\ndf.loc[df[<span class=\"st\">\"cal\"</span>] > <span class=\"nm\">500</span>]        <span class=\"cm\"># filter (boolean)</span>\n\n<span class=\"cm\"># ── .iloc[row_position, col_position] — position-based ──</span>\ndf.iloc[<span class=\"nm\">0</span>]                      <span class=\"cm\"># first row</span>\ndf.iloc[<span class=\"nm\">0</span>, <span class=\"nm\">1</span>]                   <span class=\"cm\"># row 0, column index 1</span>\ndf.iloc[<span class=\"nm\">0</span>:<span class=\"nm\">5</span>, <span class=\"nm\">0</span>:<span class=\"nm\">3</span>]             <span class=\"cm\"># first 5 rows, first 3 cols</span>\ndf.iloc[-<span class=\"nm\">1</span>]                     <span class=\"cm\"># last row</span>\ndf.iloc[:, <span class=\"nm\">0</span>]                   <span class=\"cm\"># first column (all rows)</span></pre></div>\n<table>\n<tr><th></th><th>loc</th><th>iloc</th></tr>\n<tr><td>Uses</td><td>Column/index <strong>names</strong></td><td>Integer <strong>positions</strong></td></tr>\n<tr><td>Row slice</td><td><code>0:3</code> = rows 0, 1, 2, <strong>3</strong> (inclusive)</td><td><code>0:3</code> = rows 0, 1, 2 (exclusive end)</td></tr>\n<tr><td>Best for</td><td>Filtering by condition, named access</td><td>Positional access, looping over chunks</td></tr>\n</table>\n<div class=\"warn\">⚠️ <strong>loc slicing includes the end</strong> — <code>loc[0:3]</code> gives 4 rows. <strong>iloc slicing excludes the end</strong> — <code>iloc[0:3]</code> gives 3 rows. Same as regular Python slicing for iloc.</div>"}, {"label": "Filtering Data", "html": "<div class=\"section-tag\">Concept 3 — Filtering</div>\n<div class=\"slide-heading\">Filtering Rows — Extracting What You Need 🔍</div>\n<div class=\"code-wrap\"><div class=\"code-header\"><span>filtering.py</span><span>python</span></div><pre><span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\ndf = pd.read_csv(<span class=\"st\">\"menu.csv\"</span>)\n\n<span class=\"cm\"># ── Single condition ──────────────────────────────────────</span>\nhigh_cal  = df[df[<span class=\"st\">\"calories\"</span>] > <span class=\"nm\">500</span>]\nburgers   = df[df[<span class=\"st\">\"category\"</span>] == <span class=\"st\">\"Burger\"</span>]\nnot_drink = df[df[<span class=\"st\">\"category\"</span>] != <span class=\"st\">\"Beverage\"</span>]\n\n<span class=\"cm\"># ── Multiple conditions ───────────────────────────────────</span>\n<span class=\"cm\"># Use & (and), | (or), ~ (not) — always wrap in parentheses!</span>\nhealthy = df[(df[<span class=\"st\">\"calories\"</span>] &lt; <span class=\"nm\">400</span>) &amp; (df[<span class=\"st\">\"protein_g\"</span>] > <span class=\"nm\">20</span>)]\nextremes = df[(df[<span class=\"st\">\"calories\"</span>] &lt; <span class=\"nm\">200</span>) | (df[<span class=\"st\">\"calories\"</span>] > <span class=\"nm\">700</span>)]\n\n<span class=\"cm\"># ── .isin() — filter by a list of values ─────────────────</span>\nselected = df[df[<span class=\"st\">\"category\"</span>].isin([<span class=\"st\">\"Burger\"</span>, <span class=\"st\">\"Chicken\"</span>])]\n\n<span class=\"cm\"># ── .str methods — filter by string content ──────────────</span>\nmc_items = df[df[<span class=\"st\">\"item\"</span>].str.startswith(<span class=\"st\">\"Mc\"</span>)]\nbig_ones = df[df[<span class=\"st\">\"item\"</span>].str.contains(<span class=\"st\">\"Big\"</span>, case=<span class=\"kw\">False</span>)]\n\n<span class=\"cm\"># ── .query() — SQL-like syntax (very readable) ───────────</span>\nhealthy2 = df.query(<span class=\"st\">\"calories &lt; 400 and protein_g &gt; 20\"</span>)\nbig2     = df.query(<span class=\"st\">'category == \"Burger\" and calories &gt; 500'</span>)\n\n<span class=\"cm\"># Sort results</span>\ndf.sort_values(<span class=\"st\">\"calories\"</span>, ascending=<span class=\"kw\">False</span>).head(<span class=\"nm\">5</span>)  <span class=\"cm\"># top 5 by cal</span></pre></div>\n<div class=\"tip\">💡 <strong>Best practice:</strong> Assign filtered results to a new variable with a descriptive name. Never modify the original df silently.</div>"}, {"label": "Cleaning Missing Data", "html": "<div class=\"section-tag\">Concept 4 — Data Cleaning</div>\n<div class=\"slide-heading\">Handling Missing Data (NaN) 🧹</div>\n<div class=\"highlight\">Real-world data is always messy. Missing values (<strong>NaN</strong> = Not a Number) break models. You must detect and handle them <strong>before</strong> any analysis or ML.</div>\n<div class=\"code-wrap\"><div class=\"code-header\"><span>missing_data.py</span><span>python</span></div><pre><span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n<span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\ndf = pd.read_csv(<span class=\"st\">\"data.csv\"</span>)\n\n<span class=\"cm\"># ── Step 1: Detect missing values ────────────────────────</span>\n<span class=\"fn\">print</span>(df.isnull().sum())          <span class=\"cm\"># count NaN per column</span>\n<span class=\"fn\">print</span>(df.isnull().mean() * <span class=\"nm\">100</span>)  <span class=\"cm\"># % missing per column</span>\n<span class=\"fn\">print</span>(df.isnull().any(axis=<span class=\"nm\">1</span>))   <span class=\"cm\"># which rows have any NaN</span>\n\n<span class=\"cm\"># ── Step 2: Decide how to handle ─────────────────────────</span>\n\n<span class=\"cm\"># Option A: Drop rows with ANY missing value</span>\ndf_clean = df.dropna()\n\n<span class=\"cm\"># Option B: Drop rows where SPECIFIC column is missing</span>\ndf_clean = df.dropna(subset=[<span class=\"st\">\"age\"</span>, <span class=\"st\">\"salary\"</span>])\n\n<span class=\"cm\"># Option C: Fill with a fixed value</span>\ndf[<span class=\"st\">\"age\"</span>] = df[<span class=\"st\">\"age\"</span>].fillna(<span class=\"nm\">0</span>)\ndf[<span class=\"st\">\"category\"</span>] = df[<span class=\"st\">\"category\"</span>].fillna(<span class=\"st\">\"Unknown\"</span>)\n\n<span class=\"cm\"># Option D: Fill with mean/median (best for numbers)</span>\ndf[<span class=\"st\">\"salary\"</span>] = df[<span class=\"st\">\"salary\"</span>].fillna(df[<span class=\"st\">\"salary\"</span>].mean())\ndf[<span class=\"st\">\"age\"</span>]    = df[<span class=\"st\">\"age\"</span>].fillna(df[<span class=\"st\">\"age\"</span>].median())\n\n<span class=\"cm\"># Option E: Forward-fill (good for time series)</span>\ndf[<span class=\"st\">\"price\"</span>] = df[<span class=\"st\">\"price\"</span>].ffill()</pre></div>\n<div class=\"cards cards-3\">\n<div class=\"card card-accent\"><h3>When to Drop?</h3><p>When &lt;5% of data is missing. Dropping a lot of rows loses signal and can bias results.</p></div>\n<div class=\"card card-accent\"><h3>When to Fill with Mean?</h3><p>Numerical columns with no extreme outliers. Use median if the column has outliers (e.g. salary).</p></div>\n<div class=\"card card-accent\"><h3>When to Forward-Fill?</h3><p>Time series data (stock prices, sensor readings) where the last known value is a good estimate.</p></div>\n</div>"}, {"label": "Adding & Transforming Columns", "html": "<div class=\"section-tag\">Concept 5 — Feature Creation</div>\n<div class=\"slide-heading\">Adding &amp; Transforming Columns ➕</div>\n<div class=\"code-wrap\"><div class=\"code-header\"><span>transform_columns.py</span><span>python</span></div><pre><span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\ndf = pd.read_csv(<span class=\"st\">\"menu.csv\"</span>)\n\n<span class=\"cm\"># ── Add a computed column (vectorised — no loops!) ────────</span>\ndf[<span class=\"st\">\"cal_per_protein\"</span>] = df[<span class=\"st\">\"calories\"</span>] / df[<span class=\"st\">\"protein_g\"</span>]\ndf[<span class=\"st\">\"price_with_gst\"</span>]  = df[<span class=\"st\">\"price\"</span>] * <span class=\"nm\">1.09</span>\ndf[<span class=\"st\">\"is_healthy\"</span>]      = df[<span class=\"st\">\"calories\"</span>] &lt; <span class=\"nm\">400</span>  <span class=\"cm\"># boolean column</span>\n\n<span class=\"cm\"># ── Apply a function to a column ─────────────────────────</span>\ndf[<span class=\"st\">\"item_upper\"</span>] = df[<span class=\"st\">\"item\"</span>].str.upper()\ndf[<span class=\"st\">\"item_len\"</span>]   = df[<span class=\"st\">\"item\"</span>].str.len()\n\n<span class=\"cm\"># ── np.where — conditional column (like Excel IF) ────────</span>\n<span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\ndf[<span class=\"st\">\"grade\"</span>] = np.where(df[<span class=\"st\">\"calories\"</span>] &lt; <span class=\"nm\">400</span>, <span class=\"st\">\"Light\"</span>, <span class=\"st\">\"Heavy\"</span>)\n\n<span class=\"cm\"># ── Apply custom function (use sparingly — slow) ──────────</span>\n<span class=\"kw\">def</span> <span class=\"fn\">calorie_label</span>(cal):\n    <span class=\"kw\">if</span> cal &lt; <span class=\"nm\">300</span>: <span class=\"kw\">return</span> <span class=\"st\">\"Low\"</span>\n    <span class=\"kw\">elif</span> cal &lt; <span class=\"nm\">600</span>: <span class=\"kw\">return</span> <span class=\"st\">\"Medium\"</span>\n    <span class=\"kw\">else</span>: <span class=\"kw\">return</span> <span class=\"st\">\"High\"</span>\n\ndf[<span class=\"st\">\"cal_label\"</span>] = df[<span class=\"st\">\"calories\"</span>].apply(calorie_label)\n\n<span class=\"cm\"># ── Rename columns ────────────────────────────────────────</span>\ndf = df.rename(columns={<span class=\"st\">\"cal\"</span>: <span class=\"st\">\"calories\"</span>, <span class=\"st\">\"prot\"</span>: <span class=\"st\">\"protein_g\"</span>})\n\n<span class=\"cm\"># ── Drop columns ─────────────────────────────────────────</span>\ndf = df.drop(columns=[<span class=\"st\">\"item_upper\"</span>, <span class=\"st\">\"item_len\"</span>])</pre></div>\n<div class=\"tip\">💡 <strong>Use vectorised operations</strong> (direct column math) instead of <code>.apply()</code> wherever possible — vectorised is 10-100× faster.</div>"}, {"label": "GroupBy & Aggregation", "html": "<div class=\"section-tag\">Concept 6 — Aggregation</div>\n<div class=\"slide-heading\">GroupBy — Split → Apply → Combine 📦</div>\n<div class=\"highlight\"><code>df.groupby()</code> is the Pandas equivalent of SQL's GROUP BY. It splits data into groups, applies a function to each, then combines the results.</div>\n<div class=\"code-wrap\"><div class=\"code-header\"><span>groupby.py</span><span>python</span></div><pre><span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\ndf = pd.read_csv(<span class=\"st\">\"menu.csv\"</span>)\n\n<span class=\"cm\"># ── Basic groupby ─────────────────────────────────────────</span>\ndf.groupby(<span class=\"st\">\"category\"</span>)[<span class=\"st\">\"calories\"</span>].mean()\n<span class=\"cm\"># category</span>\n<span class=\"cm\"># Beverage    250</span>\n<span class=\"cm\"># Burger      541</span>\n<span class=\"cm\"># Dessert     390</span>\n\n<span class=\"cm\"># ── Multiple aggregations ─────────────────────────────────</span>\nsummary = df.groupby(<span class=\"st\">\"category\"</span>).agg(\n    avg_cal=(<span class=\"st\">\"calories\"</span>, <span class=\"st\">\"mean\"</span>),\n    max_cal=(<span class=\"st\">\"calories\"</span>, <span class=\"st\">\"max\"</span>),\n    total_items=(<span class=\"st\">\"item\"</span>, <span class=\"st\">\"count\"</span>),\n    avg_protein=(<span class=\"st\">\"protein_g\"</span>, <span class=\"st\">\"mean\"</span>),\n)\n\n<span class=\"cm\"># ── Group by multiple columns ─────────────────────────────</span>\ndf.groupby([<span class=\"st\">\"category\"</span>, <span class=\"st\">\"size\"</span>])[<span class=\"st\">\"calories\"</span>].mean()\n\n<span class=\"cm\"># ── value_counts — count occurrences ─────────────────────</span>\ndf[<span class=\"st\">\"category\"</span>].value_counts()    <span class=\"cm\"># most common first</span>\ndf[<span class=\"st\">\"category\"</span>].value_counts(normalize=<span class=\"kw\">True</span>)  <span class=\"cm\"># as fractions</span>\n\n<span class=\"cm\"># ── Pivot table (like Excel pivot) ───────────────────────</span>\npivot = df.pivot_table(\n    values=<span class=\"st\">\"calories\"</span>,\n    index=<span class=\"st\">\"category\"</span>,\n    columns=<span class=\"st\">\"size\"</span>,\n    aggfunc=<span class=\"st\">\"mean\"</span>\n)</pre></div>\n<div class=\"tip\">💡 <strong>Named aggregations</strong> <code>avg_cal=(\"calories\",\"mean\")</code> give clean column names — use this style for readable code.</div>"}, {"label": "Merging DataFrames", "html": "<div class=\"section-tag\">Concept 7 — Merging</div>\n<div class=\"slide-heading\">Merging DataFrames — Joining Tables 🔗</div>\n<div class=\"highlight\">Real projects always have data spread across multiple tables. <code>pd.merge()</code> is SQL JOIN in Python.</div>\n<div class=\"code-wrap\"><div class=\"code-header\"><span>merging.py</span><span>python</span></div><pre><span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n\norders = pd.DataFrame({\n    <span class=\"st\">\"order_id\"</span>:   [<span class=\"nm\">1</span>, <span class=\"nm\">2</span>, <span class=\"nm\">3</span>, <span class=\"nm\">4</span>],\n    <span class=\"st\">\"item_id\"</span>:    [<span class=\"nm\">101</span>, <span class=\"nm\">102</span>, <span class=\"nm\">101</span>, <span class=\"nm\">103</span>],\n    <span class=\"st\">\"quantity\"</span>:   [<span class=\"nm\">2</span>, <span class=\"nm\">1</span>, <span class=\"nm\">3</span>, <span class=\"nm\">1</span>],\n})\nmenu = pd.DataFrame({\n    <span class=\"st\">\"item_id\"</span>: [<span class=\"nm\">101</span>, <span class=\"nm\">102</span>, <span class=\"nm\">103</span>],\n    <span class=\"st\">\"name\"</span>:    [<span class=\"st\">\"Big Mac\"</span>, <span class=\"st\">\"McFlurry\"</span>, <span class=\"st\">\"Fries\"</span>],\n    <span class=\"st\">\"price\"</span>:   [<span class=\"nm\">7.50</span>, <span class=\"nm\">5.90</span>, <span class=\"nm\">3.50</span>],\n})\n\n<span class=\"cm\"># ── Inner join: keep only matching rows (default) ─────────</span>\ndf = pd.merge(orders, menu, on=<span class=\"st\">\"item_id\"</span>)\n\n<span class=\"cm\"># ── Left join: keep all left rows, NaN for no match ──────</span>\ndf = pd.merge(orders, menu, on=<span class=\"st\">\"item_id\"</span>, how=<span class=\"st\">\"left\"</span>)\n\n<span class=\"cm\"># ── Vertical stack (same columns, more rows) ─────────────</span>\ndf_all = pd.concat([df_jan, df_feb, df_mar])\n\n<span class=\"cm\"># ── Horizontal concat (add more columns) ─────────────────</span>\ndf_wide = pd.concat([df_features, df_labels], axis=<span class=\"nm\">1</span>)</pre></div>\n<table>\n<tr><th>Join Type</th><th>how=</th><th>Keeps</th></tr>\n<tr><td>Inner (default)</td><td><code>\"inner\"</code></td><td>Only rows with matches in BOTH tables</td></tr>\n<tr><td>Left</td><td><code>\"left\"</code></td><td>All rows from left, NaN for right misses</td></tr>\n<tr><td>Right</td><td><code>\"right\"</code></td><td>All rows from right, NaN for left misses</td></tr>\n<tr><td>Outer</td><td><code>\"outer\"</code></td><td>All rows from both, NaN where no match</td></tr>\n</table>"}, {"label": "NumPy vs Pandas Guide", "html": "<div class=\"section-tag\">Decision Guide</div>\n<div class=\"slide-heading\">NumPy vs Pandas — When to Use Which? 🤔</div>\n<table>\n<tr><th>Situation</th><th>Use NumPy</th><th>Use Pandas</th></tr>\n<tr><td>Data has all same type (all floats)</td><td>✅</td><td></td></tr>\n<tr><td>Mixed types (strings + numbers)</td><td></td><td>✅</td></tr>\n<tr><td>Matrix/vector math, linear algebra</td><td>✅</td><td></td></tr>\n<tr><td>Filter by column name</td><td></td><td>✅</td></tr>\n<tr><td>Load a CSV file</td><td></td><td>✅</td></tr>\n<tr><td>GroupBy / pivot table</td><td></td><td>✅</td></tr>\n<tr><td>Feeding data into a ML model</td><td>✅ (convert first)</td><td>✅ (prepare here)</td></tr>\n<tr><td>Image pixel operations</td><td>✅</td><td></td></tr>\n<tr><td>Merging two datasets</td><td></td><td>✅</td></tr>\n</table>\n<div class=\"highlight\" style=\"margin-top:10px;\"><strong>Typical workflow:</strong><br>\n1️⃣ <strong>Load</strong> data into Pandas DataFrame from CSV/API<br>\n2️⃣ <strong>Clean, filter, group</strong> with Pandas<br>\n3️⃣ <strong>Convert</strong> to NumPy array: <code>df.values</code> or <code>df[\"col\"].values</code><br>\n4️⃣ <strong>Feed</strong> NumPy array into scikit-learn / TensorFlow model\n</div>\n<div class=\"tip\">💡 Pandas and NumPy are partners, not competitors. Use Pandas to prepare data, NumPy/sklearn to model it.</div>"}, {"label": "Common Mistakes", "html": "<div class=\"section-tag\">Watch Out!</div>\n<div class=\"slide-heading\">Common Mistakes &amp; How to Fix Them ⚠️</div>\n<div class=\"e-list\">\n<div class=\"e-item\"><div class=\"e-icon\">❌</div><div><strong>SettingWithCopyWarning</strong> — Modifying a slice<br>\n<code style=\"color:#ff7b72\">df[df[\"cal\"] &gt; 400][\"grade\"] = \"High\"</code> — May not change the original!<br>\n✅ Fix: <code>df.loc[df[\"cal\"] &gt; 400, \"grade\"] = \"High\"</code></div></div>\n<div class=\"e-item\"><div class=\"e-icon\">❌</div><div><strong>KeyError: 'column_name'</strong><br>\nTypo in column name or extra spaces in CSV header.<br>\n✅ Fix: Always print <code>df.columns.tolist()</code> and check for spaces: <code>df.columns.str.strip()</code></div></div>\n<div class=\"e-item\"><div class=\"e-icon\">❌</div><div><strong>Operations on NaN propagate NaN</strong><br>\n<code>100 + NaN = NaN</code>. If any row has NaN, computed columns get NaN too.<br>\n✅ Fix: Handle missing values BEFORE adding computed columns.</div></div>\n<div class=\"e-item\"><div class=\"e-icon\">❌</div><div><strong>Forgetting to reassign after operations</strong><br>\n<code>df.drop(\"col\", axis=1)</code> does NOT modify df in place by default!<br>\n✅ Fix: <code>df = df.drop(\"col\", axis=1)</code> or use <code>inplace=True</code></div></div>\n<div class=\"e-item\"><div class=\"e-icon\">❌</div><div><strong>Using & and | instead of \"and\"/\"or\" in conditions</strong><br>\n<code>df[\"cal\"] &gt; 400 and df[\"prot\"] &gt; 20</code> raises ValueError.<br>\n✅ Fix: <code>(df[\"cal\"] &gt; 400) & (df[\"prot\"] &gt; 20)</code> — use & and wrap in parens.</div></div>\n</div>"}, {"label": "Code Lab", "html": "<div class=\"section-tag\">Hands-On</div>\n<div class=\"slide-heading\">Code Lab — Analyse a Real Dataset 💻</div>\n<div class=\"code-wrap\"><div class=\"code-header\"><span>lab_04.py</span><span>python</span></div><pre><span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n<span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\n<span class=\"cm\"># Load Singapore HDB resale data (or any CSV you have)</span>\ndf = pd.read_csv(<span class=\"st\">\"https://data.gov.sg/dataset/resale-flat-prices/download\"</span>)\n\n<span class=\"cm\"># ── 1. First look ─────────────────────────────────────────</span>\n<span class=\"fn\">print</span>(df.shape)\n<span class=\"fn\">print</span>(df.head())\n<span class=\"fn\">print</span>(df.dtypes)\n<span class=\"fn\">print</span>(df.isnull().sum())\n\n<span class=\"cm\"># ── 2. Clean ──────────────────────────────────────────────</span>\ndf = df.dropna(subset=[<span class=\"st\">\"resale_price\"</span>])\ndf[<span class=\"st\">\"floor_area_sqm\"</span>] = pd.to_numeric(df[<span class=\"st\">\"floor_area_sqm\"</span>], errors=<span class=\"st\">\"coerce\"</span>)\n\n<span class=\"cm\"># ── 3. Engineer features ──────────────────────────────────</span>\ndf[<span class=\"st\">\"price_per_sqm\"</span>] = df[<span class=\"st\">\"resale_price\"</span>] / df[<span class=\"st\">\"floor_area_sqm\"</span>]\ndf[<span class=\"st\">\"is_large\"</span>] = df[<span class=\"st\">\"floor_area_sqm\"</span>] > <span class=\"nm\">100</span>\n\n<span class=\"cm\"># ── 4. Analyse ────────────────────────────────────────────</span>\nsummary = df.groupby(<span class=\"st\">\"flat_type\"</span>).agg(\n    avg_price=(<span class=\"st\">\"resale_price\"</span>, <span class=\"st\">\"mean\"</span>),\n    count=(<span class=\"st\">\"resale_price\"</span>, <span class=\"st\">\"count\"</span>),\n    price_per_sqm_avg=(<span class=\"st\">\"price_per_sqm\"</span>, <span class=\"st\">\"mean\"</span>),\n).round(<span class=\"nm\">0</span>)\n<span class=\"fn\">print</span>(summary.sort_values(<span class=\"st\">\"avg_price\"</span>, ascending=<span class=\"kw\">False</span>))\n\n<span class=\"cm\"># ── 5. Save cleaned data ──────────────────────────────────</span>\ndf.to_csv(<span class=\"st\">\"hdb_clean.csv\"</span>, index=<span class=\"kw\">False</span>)</pre></div>\n<div class=\"tip\">🚀 <strong>Challenge:</strong> Find the top 3 towns with the highest average price per sqm for 4-room flats.</div>"}, {"label": "Pandas Cheat Sheet", "html": "<div class=\"section-tag\">Quick Reference</div>\n<div class=\"slide-heading\">📋 Full Pandas Cheat Sheet</div>\n<table>\n<tr><th>Task</th><th>Code</th></tr>\n<tr><td>Load CSV</td><td><code>pd.read_csv(\"file.csv\")</code></td></tr>\n<tr><td>Load Excel</td><td><code>pd.read_excel(\"file.xlsx\")</code></td></tr>\n<tr><td>First/last N rows</td><td><code>df.head(5)</code> / <code>df.tail(3)</code></td></tr>\n<tr><td>Shape &amp; columns</td><td><code>df.shape</code> / <code>df.columns.tolist()</code></td></tr>\n<tr><td>Data types</td><td><code>df.dtypes</code></td></tr>\n<tr><td>Missing values</td><td><code>df.isnull().sum()</code></td></tr>\n<tr><td>Summary stats</td><td><code>df.describe()</code></td></tr>\n<tr><td>Filter rows</td><td><code>df[df[\"col\"] &gt; 100]</code></td></tr>\n<tr><td>Select by label</td><td><code>df.loc[0:5, [\"a\",\"b\"]]</code></td></tr>\n<tr><td>Select by position</td><td><code>df.iloc[0:5, 0:3]</code></td></tr>\n<tr><td>Add column</td><td><code>df[\"new\"] = df[\"a\"] * df[\"b\"]</code></td></tr>\n<tr><td>Drop column</td><td><code>df.drop(\"col\", axis=1)</code></td></tr>\n<tr><td>Sort</td><td><code>df.sort_values(\"col\", ascending=False)</code></td></tr>\n<tr><td>Group &amp; agg</td><td><code>df.groupby(\"col\").agg(n=(\"val\",\"mean\"))</code></td></tr>\n<tr><td>Fill NaN</td><td><code>df[\"col\"].fillna(df[\"col\"].mean())</code></td></tr>\n<tr><td>Drop NaN rows</td><td><code>df.dropna(subset=[\"col\"])</code></td></tr>\n<tr><td>Merge tables</td><td><code>pd.merge(df1, df2, on=\"id\")</code></td></tr>\n<tr><td>Vertical stack</td><td><code>pd.concat([df1, df2])</code></td></tr>\n<tr><td>Value counts</td><td><code>df[\"col\"].value_counts()</code></td></tr>\n<tr><td>Save to CSV</td><td><code>df.to_csv(\"out.csv\", index=False)</code></td></tr>\n</table>"}, {"label": "Session Recap", "html": "<div class=\"section-tag\">Session Recap</div>\n<div class=\"slide-heading\">What You've Learned 🎉</div>\n<div class=\"recap-grid\">\n<div class=\"recap-item\"><div class=\"recap-icon\">⚡</div><div class=\"recap-text\"><h4>NumPy Arrays</h4><p>Fast vectorised math. 50-100× faster than lists. 1D/2D arrays, boolean masking, np.where, statistical functions.</p></div></div>\n<div class=\"recap-item\"><div class=\"recap-icon\">📋</div><div class=\"recap-text\"><h4>Pandas Series</h4><p>1D labelled data. Like a NumPy array with index labels. Built-in stats, flexible indexing, boolean filtering.</p></div></div>\n<div class=\"recap-item\"><div class=\"recap-icon\">📊</div><div class=\"recap-text\"><h4>DataFrame Basics</h4><p>Create from CSV, dict, or API. Explore with head/shape/dtypes/describe/isnull. loc vs iloc for indexing.</p></div></div>\n<div class=\"recap-item\"><div class=\"recap-icon\">🔍</div><div class=\"recap-text\"><h4>Filtering &amp; Transforming</h4><p>Boolean conditions with &amp; and |. .isin(), .str.contains(). Add computed columns. np.where for IF logic.</p></div></div>\n<div class=\"recap-item\"><div class=\"recap-icon\">🧹</div><div class=\"recap-text\"><h4>Cleaning Missing Data</h4><p>dropna() to remove. fillna(mean/median) to impute. ffill() for time series. Always clean before modelling.</p></div></div>\n<div class=\"recap-item\"><div class=\"recap-icon\">📦</div><div class=\"recap-text\"><h4>GroupBy &amp; Merging</h4><p>groupby().agg() for summaries. pd.merge() for SQL JOIN. pd.concat() to stack tables.</p></div></div>\n</div>\n<div class=\"highlight\" style=\"margin-top:auto;\">🚀 <strong>Next:</strong> Session 5 — Data Visualisation: matplotlib &amp; seaborn to chart your findings</div>"}];

let cur=0;
const wrap=document.getElementById('slides-wrap');
const dotsEl=document.getElementById('dots');
function renderSlides(){
  wrap.innerHTML='';dotsEl.innerHTML='';
  SLIDES_DATA.forEach((s,i)=>{
    const div=document.createElement('div');
    div.className='slide'+(i===0?' active':'');
    div.innerHTML=s.html;
    wrap.appendChild(div);
    const dot=document.createElement('div');
    dot.className='dot'+(i===0?' active':'');
    dot.onclick=()=>jump(i);
    dotsEl.appendChild(dot);
  });
  updateUI();
}
function updateUI(){
  const t=SLIDES_DATA.length;
  document.getElementById('counter').textContent=(cur+1)+' / '+t;
  document.getElementById('progress-bar').style.width=((cur+1)/t*100)+'%';
  document.getElementById('slide-title-bar').textContent=SLIDES_DATA[cur].label||'';
  document.getElementById('prev-btn').disabled=cur===0;
  document.getElementById('next-btn').disabled=cur===t-1;
  document.querySelectorAll('.slide').forEach((el,i)=>el.classList.toggle('active',i===cur));
  document.querySelectorAll('.dot').forEach((el,i)=>el.classList.toggle('active',i===cur));
}
function go(d){jump(cur+d);}
function jump(i){if(i<0||i>=SLIDES_DATA.length)return;cur=i;updateUI();document.querySelectorAll('.slide')[cur].scrollTop=0;}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(1);}
  if(e.key==='ArrowLeft'){e.preventDefault();go(-1);}
  if(e.key==='f'||e.key==='F')toggleFS();
  if(e.key==='Home')jump(0);
  if(e.key==='End')jump(SLIDES_DATA.length-1);
});
function toggleFS(){if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen();}

let _tx=0;
document.addEventListener('touchstart',e=>{_tx=e.changedTouches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-_tx;
  if(Math.abs(dx)>50){go(dx<0?1:-1);}
},{passive:true});
renderSlides();
</script><script src="../access-guard.js"></script><style id="codencode-copy-style">

<script id="codencode-copy-script">
(function(){
  function addCopy(){
    document.querySelectorAll('.code-wrap').forEach(function(w){
      var hdr=w.querySelector('.code-header'), pre=w.querySelector('pre');
      if(!hdr||!pre||hdr.querySelector('.copy-btn'))return;
      var b=document.createElement('button');
      b.className='copy-btn';b.type='button';b.textContent='Copy';
      b.addEventListener('click',function(ev){
        ev.stopPropagation();
        var t=pre.innerText.replace(/\u00a0/g,' ');
        function ok(){b.textContent='Copied';b.classList.add('done');setTimeout(function(){b.textContent='Copy';b.classList.remove('done');},1400);}
        if(navigator.clipboard&&navigator.clipboard.writeText){
          navigator.clipboard.writeText(t).then(ok).catch(fallback);
        }else{fallback();}
        function fallback(){
          var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
          document.body.appendChild(ta);ta.select();
          try{document.execCommand('copy');ok();}catch(e){}
          document.body.removeChild(ta);
        }
      });
      hdr.appendChild(b);
    });
  }
  if(document.readyState!=='loading')addCopy();
  document.addEventListener('DOMContentLoaded',addCopy);
  setTimeout(addCopy,400);
})();
</script>
