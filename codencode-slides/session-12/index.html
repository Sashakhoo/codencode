nplt.plot(hist.history[<span class=\"st\">\"accuracy\"</span>],     label=<span class=\"st\">\"Train\"</span>, color=<span class=\"st\">\"#43e97b\"</span>)\nplt.plot(hist.history[<span class=\"st\">\"val_accuracy\"</span>], label=<span class=\"st\">\"Val\"</span>,   color=<span class=\"st\">\"#f5576c\"</span>)\nplt.xlabel(<span class=\"st\">\"Epoch\"</span>); plt.ylabel(<span class=\"st\">\"Accuracy\"</span>); plt.legend()\nplt.title(<span class=\"st\">\"Accuracy — val should follow train closely\"</span>)\n\nplt.tight_layout(); plt.show()\n\n<span class=\"cm\"># Diagnose:</span>\nbest_train = max(hist.history[<span class=\"st\">\"accuracy\"</span>])\nbest_val   = max(hist.history[<span class=\"st\">\"val_accuracy\"</span>])\ngap = best_train - best_val\n<span class=\"fn\">print</span>(<span class=\"st\">f\"Train: {best_train:.2%}  Val: {best_val:.2%}  Gap: {gap:.2%}\"</span>)\n<span class=\"kw\">if</span> gap > <span class=\"nm\">0.10</span>: <span class=\"fn\">print</span>(<span class=\"st\">\"⚠️  Overfitting — add Dropout or reduce complexity\"</span>)\n<span class=\"kw\">if</span> best_val < <span class=\"nm\">0.65</span>: <span class=\"fn\">print</span>(<span class=\"st\">\"⚠️  Underfitting — try a bigger model or more features\"</span>)</pre></div>"}, {"label": "Overfit & Underfit Examples", "html": "<div class=\"section-tag\">Examples</div><div class=\"slide-heading\">Real Examples of Underfitting &amp; Overfitting 🔍</div><svg viewBox=\"0 0 560 200\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:560px;display:block;margin:4px auto;\">\n  <rect width=\"560\" height=\"200\" fill=\"rgba(0,0,0,0.45)\" rx=\"10\"/>\n  <text x=\"280\" y=\"18\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"12\" font-weight=\"bold\" font-family=\"monospace\">Real-World Examples</text>\n  <!-- Underfit examples -->\n  <rect x=\"8\" y=\"26\" width=\"262\" height=\"160\" fill=\"rgba(255,209,102,0.05)\" stroke=\"rgba(255,209,102,0.25)\" rx=\"7\"/>\n  <text x=\"139\" y=\"43\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"11\" font-weight=\"bold\" font-family=\"monospace\">🟡 Underfitting Examples</text>\n  <!-- Ex 1 -->\n  <rect x=\"18\" y=\"50\" width=\"240\" height=\"32\" fill=\"rgba(255,255,255,0.03)\" stroke=\"rgba(255,255,255,0.1)\" rx=\"5\"/>\n  <text x=\"26\" y=\"63\" fill=\"#FFD166\" font-size=\"9\" font-weight=\"bold\" font-family=\"monospace\">Spam filter using only 1 word:</text>\n  <text x=\"26\" y=\"75\" fill=\"rgba(255,255,255,0.55)\" font-size=\"8.5\" font-family=\"monospace\">\"If email contains 'free' → spam\"  (misses 90% of actual spam)</text>\n  <!-- Ex 2 -->\n  <rect x=\"18\" y=\"86\" width=\"240\" height=\"32\" fill=\"rgba(255,255,255,0.03)\" stroke=\"rgba(255,255,255,0.1)\" rx=\"5\"/>\n  <text x=\"26\" y=\"99\" fill=\"#FFD166\" font-size=\"9\" font-weight=\"bold\" font-family=\"monospace\">House price with 1 feature:</text>\n  <text x=\"26\" y=\"111\" fill=\"rgba(255,255,255,0.55)\" font-size=\"8.5\" font-family=\"monospace\">Price = a×size only  (ignores rooms, location, age)</text>\n  <!-- Ex 3 -->\n  <rect x=\"18\" y=\"122\" width=\"240\" height=\"32\" fill=\"rgba(255,255,255,0.03)\" stroke=\"rgba(255,255,255,0.1)\" rx=\"5\"/>\n  <text x=\"26\" y=\"135\" fill=\"#FFD166\" font-size=\"9\" font-weight=\"bold\" font-family=\"monospace\">Linear model for non-linear data:</text>\n  <text x=\"26\" y=\"147\" fill=\"rgba(255,255,255,0.55)\" font-size=\"8.5\" font-family=\"monospace\">Predicting stock with straight line  (markets aren't linear)</text>\n  <text x=\"139\" y=\"175\" text-anchor=\"middle\" fill=\"rgba(255,209,102,0.6)\" font-size=\"9\" font-family=\"monospace\">Fix: add more features, use a more complex model</text>\n  <!-- Overfit examples -->\n  <rect x=\"290\" y=\"26\" width=\"262\" height=\"160\" fill=\"rgba(245,87,108,0.05)\" stroke=\"rgba(245,87,108,0.25)\" rx=\"7\"/>\n  <text x=\"421\" y=\"43\" text-anchor=\"middle\" fill=\"#f5576c\" font-size=\"11\" font-weight=\"bold\" font-family=\"monospace\">🔴 Overfitting Examples</text>\n  <!-- Ex 1 -->\n  <rect x=\"300\" y=\"50\" width=\"240\" height=\"32\" fill=\"rgba(255,255,255,0.03)\" stroke=\"rgba(255,255,255,0.1)\" rx=\"5\"/>\n  <text x=\"308\" y=\"63\" fill=\"#f5576c\" font-size=\"9\" font-weight=\"bold\" font-family=\"monospace\">1000-layer NN on 100 rows:</text>\n  <text x=\"308\" y=\"75\" fill=\"rgba(255,255,255,0.55)\" font-size=\"8.5\" font-family=\"monospace\">Train acc 100%, Test acc 51%  (memorised every row)</text>\n  <!-- Ex 2 -->\n  <rect x=\"300\" y=\"86\" width=\"240\" height=\"32\" fill=\"rgba(255,255,255,0.03)\" stroke=\"rgba(255,255,255,0.1)\" rx=\"5\"/>\n  <text x=\"308\" y=\"99\" fill=\"#f5576c\" font-size=\"9\" font-weight=\"bold\" font-family=\"monospace\">Decision tree with no max_depth:</text>\n  <text x=\"308\" y=\"111\" fill=\"rgba(255,255,255,0.55)\" font-size=\"8.5\" font-family=\"monospace\">Creates one branch per training row  (useless on new data)</text>\n  <!-- Ex 3 -->\n  <rect x=\"300\" y=\"122\" width=\"240\" height=\"32\" fill=\"rgba(255,255,255,0.03)\" stroke=\"rgba(255,255,255,0.1)\" rx=\"5\"/>\n  <text x=\"308\" y=\"135\" fill=\"#f5576c\" font-size=\"9\" font-weight=\"bold\" font-family=\"monospace\">Training for 500 epochs on small data:</text>\n  <text x=\"308\" y=\"147\" fill=\"rgba(255,255,255,0.55)\" font-size=\"8.5\" font-family=\"monospace\">Model learns every noise spike in training set</text>\n  <text x=\"421\" y=\"175\" text-anchor=\"middle\" fill=\"rgba(245,87,108,0.6)\" font-size=\"9\" font-family=\"monospace\">Fix: Dropout, L2, EarlyStopping, more data</text>\n</svg><table style=\"margin-top:10px;\"><tr><th>Symptom</th><th>Diagnosis</th><th>Root Cause</th><th>Fix</th></tr><tr><td>Train 99%, Val 60%</td><td>🔴 Overfitting</td><td>Model too complex / too many epochs</td><td>Dropout, L2, EarlyStopping</td></tr><tr><td>Train 57%, Val 55%</td><td>🟡 Underfitting</td><td>Model too simple / missing features</td><td>More layers, add features</td></tr><tr><td>Train 88%, Val 85%</td><td>✅ Good fit</td><td>Right complexity, right amount of data</td><td>Ship it!</td></tr><tr><td>Train falls, Val rises after epoch 30</td><td>🔴 Overfitting starts at epoch 30</td><td>Trained too long</td><td>EarlyStopping(patience=5)</td></tr><tr><td>Both loss curves flat from epoch 1</td><td>🟡 Not learning</td><td>LR too low / bad data / wrong architecture</td><td>Increase LR, check data</td></tr></table><div class=\"tip\" style=\"margin-top:8px;\">💡 <strong>The Goldilocks principle:</strong> model complexity must match your data size. Rule of thumb: if you have 1,000 rows, don't use a 10-layer network with millions of parameters — start small.</div>"}, {"label": "Session Recap", "html": "<div class=\"section-tag\">Wrap Up</div><div class=\"slide-heading\">Session 12 Recap — What We Covered 🎓</div><div class=\"recap-grid\"><div class=\"recap-item\"><div class=\"recap-icon\">🧠</div><div class=\"recap-label\">Neural Networks</div><div class=\"recap-desc\">Neurons, weights, biases, layers, activation functions — the building blocks</div></div><div class=\"recap-item\"><div class=\"recap-icon\">➡️</div><div class=\"recap-label\">Forward Propagation</div><div class=\"recap-desc\">Data flows input → hidden(s) → output. Weighted sum + activation at each neuron</div></div><div class=\"recap-item\"><div class=\"recap-icon\">🔁</div><div class=\"recap-label\">Backpropagation</div><div class=\"recap-desc\">Gradients flow backwards. Chain rule. Weights updated to reduce loss</div></div><div class=\"recap-item\"><div class=\"recap-icon\">⚡</div><div class=\"recap-label\">Activations</div><div class=\"recap-desc\">ReLU (hidden) → Sigmoid (binary out) → Softmax (multi-class out)</div></div><div class=\"recap-item\"><div class=\"recap-icon\">🌐</div><div class=\"recap-label\">Network Types</div><div class=\"recap-desc\">MLP (tabular), CNN (images), RNN/LSTM (sequences), Transformer (NLP)</div></div><div class=\"recap-item\"><div class=\"recap-icon\">🛡️</div><div class=\"recap-label\">Overfitting</div><div class=\"recap-desc\">Dropout, L2, EarlyStopping — always monitor val_loss vs train_loss</div></div></div><div class=\"tip\" style=\"margin-top:12px;\">💡 Next up: Session 13 — LSTM for Time Series &amp; Sequential Forecasting</div>"}];



let cur=0;
const wrap=document.getElementById('slides-wrap');
const dotsEl=document.getElementById('dots');
function renderSlides(){
  wrap.innerHTML='';dotsEl.innerHTML='';
  SLIDES_DATA.forEach((s,i)=>{
    const div=document.createElement('div');
    div.className='slide'+(i===0?' active':'');
    div.innerHTML=s.html;
    wrap.appendChild(div);
    const dot=document.createElement('div');
    dot.className='dot'+(i===0?' active':'');
    dot.onclick=()=>jump(i);
    dotsEl.appendChild(dot);
  });
  updateUI();
}
function updateUI(){
  const t=SLIDES_DATA.length;
  document.getElementById('counter').textContent=(cur+1)+' / '+t;
  document.getElementById('progress-bar').style.width=((cur+1)/t*100)+'%';
  document.getElementById('slide-title-bar').textContent=SLIDES_DATA[cur].label||'';
  document.getElementById('prev-btn').disabled=cur===0;
  document.getElementById('next-btn').disabled=cur===t-1;
  document.querySelectorAll('.slide').forEach((el,i)=>el.classList.toggle('active',i===cur));
  document.querySelectorAll('.dot').forEach((el,i)=>el.classList.toggle('active',i===cur));
}
function go(d){jump(cur+d);}
function jump(i){if(i<0||i>=SLIDES_DATA.length)return;cur=i;updateUI();document.querySelectorAll('.slide')[cur].scrollTop=0;}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(1);}
  if(e.key==='ArrowLeft'){e.preventDefault();go(-1);}
  if(e.key==='f'||e.key==='F')toggleFS();
  if(e.key==='Home')jump(0);
  if(e.key==='End')jump(SLIDES_DATA.length-1);
});
function toggleFS(){if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen();}

let _tx=0;
document.addEventListener('touchstart',e=>{_tx=e.changedTouches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-_tx;
  if(Math.abs(dx)>50){go(dx<0?1:-1);}
},{passive:true});
renderSlides();

<script id="codencode-copy-script">
(function(){
  function addCopy(){
    document.querySelectorAll('.code-wrap').forEach(function(w){
      var hdr=w.querySelector('.code-header'), pre=w.querySelector('pre');
      if(!hdr||!pre||hdr.querySelector('.copy-btn'))return;
      var b=document.createElement('button');
      b.className='copy-btn';b.type='button';b.textContent='Copy';
      b.addEventListener('click',function(ev){
        ev.stopPropagation();
        var t=pre.innerText.replace(/\u00a0/g,' ');
        function ok(){b.textContent='Copied';b.classList.add('done');setTimeout(function(){b.textContent='Copy';b.classList.remove('done');},1400);}
        if(navigator.clipboard&&navigator.clipboard.writeText){
          navigator.clipboard.writeText(t).then(ok).catch(fallback);
        }else{fallback();}
        function fallback(){
          var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
          document.body.appendChild(ta);ta.select();
          try{document.execCommand('copy');ok();}catch(e){}
          document.body.removeChild(ta);
        }
      });
      hdr.appendChild(b);
    });
  }
  if(document.readyState!=='loading')addCopy();
  document.addEventListener('DOMContentLoaded',addCopy);
  setTimeout(addCopy,400);
})();
</script>
