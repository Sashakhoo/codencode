<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Session 12 — Neural Networks & Deep Learning</title><style>
:root{--accent:#f97583;--bg:#0f0f1a;--text:#e8e8f0;--muted:#8888aa;--code-bg:#0d1117;--card:#1e2240;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;user-select:none;}
#deck{width:100%;height:100vh;display:flex;flex-direction:column;}
#topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.06);flex-shrink:0;gap:12px;}
#session-label{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--accent);text-transform:uppercase;white-space:nowrap;}
#slide-title-bar{font-size:12px;color:var(--muted);flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#topbar-right{display:flex;gap:8px;align-items:center;flex-shrink:0;}
#counter{font-size:12px;color:var(--muted);white-space:nowrap;}
.btn{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);color:var(--text);border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer;transition:all 0.15s;}
.btn:hover{background:var(--accent);border-color:var(--accent);color:#000;}
#progress-wrap{height:3px;background:rgba(255,255,255,0.05);flex-shrink:0;}
#progress-bar{height:100%;background:var(--accent);transition:width 0.3s ease;}
#slides-wrap{flex:1;position:relative;overflow:hidden;}
.slide{position:absolute;inset:0;display:none;flex-direction:column;padding:32px 48px 24px;overflow-y:auto;animation:fadeIn 0.25s ease;}
.slide.active{display:flex;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
#nav{display:flex;align-items:center;justify-content:center;gap:16px;padding:10px 24px;flex-shrink:0;border-top:1px solid rgba(255,255,255,0.06);}
.nav-btn{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);color:var(--text);padding:7px 26px;border-radius:8px;font-size:14px;cursor:pointer;transition:all 0.15s;}
.nav-btn:hover:not(:disabled){background:var(--accent);border-color:var(--accent);color:#000;}
.nav-btn:disabled{opacity:0.3;cursor:default;}
#dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:600px;}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.2);cursor:pointer;transition:all 0.2s;}
.dot.active{background:var(--accent);transform:scale(1.5);}
.slide-title{align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at 50% 40%,#1e2a4a 0%,#0f0f1a 70%);}
.session-badge{font-size:11px;font-weight:800;letter-spacing:3px;color:var(--accent);text-transform:uppercase;margin-bottom:20px;padding:5px 16px;border:1px solid var(--accent);border-radius:20px;display:inline-block;}
.slide-title h1{font-size:clamp(26px,3.4vw,46px);font-weight:800;line-height:1.15;margin-bottom:16px;background:linear-gradient(135deg,#fff 30%,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;white-space:pre-line;}
.slide-title .sub{font-size:14px;color:var(--muted);max-width:580px;line-height:1.6;margin-bottom:28px;}
.academy-tag{font-size:12px;color:var(--muted);letter-spacing:1px;}
.section-tag{font-size:10px;font-weight:700;letter-spacing:2.5px;color:var(--accent);text-transform:uppercase;margin-bottom:6px;}
.slide-heading{font-size:clamp(17px,2.2vw,28px);font-weight:700;margin-bottom:14px;line-height:1.25;}
.cards{display:grid;gap:11px;}
.cards-2{grid-template-columns:1fr 1fr;}
.cards-3{grid-template-columns:1fr 1fr 1fr;}
.cards-4{grid-template-columns:1fr 1fr 1fr 1fr;}
.card{background:var(--card);border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:14px 16px;}
.card-accent{border-left:3px solid var(--accent);}
.card-icon{font-size:22px;margin-bottom:6px;}
.card h3{font-size:13px;font-weight:700;margin-bottom:4px;color:#fff;}
.card p{font-size:12px;color:var(--muted);line-height:1.55;}
.steps{display:flex;flex-direction:column;gap:9px;}
.step{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:10px;padding:11px 14px;border:1px solid rgba(255,255,255,0.06);}
.step-num{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#000;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.step-body h4{font-size:13px;font-weight:700;margin-bottom:2px;}
.step-body p{font-size:12px;color:var(--muted);line-height:1.5;}
.code-wrap{background:var(--code-bg);border-radius:10px;border:1px solid rgba(255,255,255,0.08);overflow:hidden;margin:8px 0;}
.code-header{background:rgba(255,255,255,0.05);padding:5px 13px;font-size:11px;color:var(--muted);font-family:monospace;display:flex;justify-content:space-between;align-items:center;}
pre{padding:11px 15px;overflow-x:auto;font-family:'Cascadia Code','Fira Code',Consolas,monospace;font-size:12px;line-height:1.7;color:#c9d1d9;}
.kw{color:#ff7b72;}.fn{color:#d2a8ff;}.st{color:#a5d6ff;}.cm{color:#8b949e;font-style:italic;}.nm{color:#79c0ff;}.op{color:#ff9e64;}
.highlight{background:rgba(255,255,255,0.04);border-left:4px solid var(--accent);border-radius:0 8px 8px 0;padding:10px 14px;margin:8px 0;font-size:13px;line-height:1.6;}
.highlight strong{color:var(--accent);}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;flex:1;}
.warn{background:rgba(255,100,50,0.1);border:1px solid rgba(255,100,50,0.3);border-radius:8px;padding:9px 13px;font-size:12px;margin:6px 0;}
.tip{background:rgba(80,220,100,0.1);border:1px solid rgba(80,220,100,0.3);border-radius:8px;padding:9px 13px;font-size:12px;margin:6px 0;}
.roadmap{display:grid;grid-template-columns:1fr 1fr;gap:9px;flex:1;}
.roadmap-item{background:var(--card);border-radius:12px;padding:12px;border:1px solid rgba(255,255,255,0.06);display:flex;gap:9px;align-items:flex-start;}
.rm-num{font-size:18px;font-weight:900;color:var(--accent);opacity:0.4;line-height:1;flex-shrink:0;width:22px;}
.rm-icon{font-size:17px;flex-shrink:0;}
.rm-text h4{font-size:12px;font-weight:700;margin-bottom:2px;}
.rm-text p{font-size:11px;color:var(--muted);line-height:1.5;}
.recap-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;flex:1;}
.recap-item{background:var(--card);border-radius:10px;padding:12px;border-left:3px solid var(--accent);display:flex;gap:8px;align-items:flex-start;}
.recap-icon{font-size:17px;flex-shrink:0;}
.recap-text h4{font-size:13px;font-weight:700;margin-bottom:2px;}
.recap-text p{font-size:11px;color:var(--muted);line-height:1.5;}
.e-list{display:flex;flex-direction:column;gap:8px;}
.e-item{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.55;}
.e-icon{font-size:15px;flex-shrink:0;}
table{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0;}
th{background:rgba(255,255,255,0.06);padding:7px 10px;text-align:left;font-weight:700;color:var(--accent);}
td{padding:6px 10px;border-top:1px solid rgba(255,255,255,0.05);color:var(--muted);}
.slide::-webkit-scrollbar{width:4px;}
.slide::-webkit-scrollbar-track{background:transparent;}
.slide::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:2px;}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:700;margin:2px;}
.tag-green{background:rgba(80,200,80,0.2);color:#50c850;border:1px solid rgba(80,200,80,0.3);}
.tag-blue{background:rgba(80,150,255,0.2);color:#79c0ff;border:1px solid rgba(80,150,255,0.3);}
.tag-orange{background:rgba(255,150,50,0.2);color:#ff9e64;border:1px solid rgba(255,150,50,0.3);}
.big-concept{background:linear-gradient(135deg,#1e2a4a,#1e2240);border:1px solid rgba(249,117,131,0.3);border-radius:14px;padding:20px 24px;margin:10px 0;text-align:center;}
.big-concept .bc-emoji{font-size:36px;margin-bottom:8px;}
.big-concept h2{font-size:20px;font-weight:800;color:#fff;margin-bottom:6px;}
.big-concept p{font-size:13px;color:var(--muted);line-height:1.6;}

@media(max-width:700px){
  body{overflow:auto;}
  #deck{height:auto;min-height:100vh;}
  #slides-wrap{height:auto;min-height:60vh;}
  .slide{position:relative;inset:auto;display:none;padding:16px 16px 12px;}
  .slide.active{display:flex;}
  .cards-2,.cards-3,.cards-4{grid-template-columns:1fr;}
  .two-col,.roadmap,.recap-grid{grid-template-columns:1fr;}
  #session-label{display:none;}
  #slide-title-bar{display:none;}
  pre{font-size:10px;line-height:1.6;}
  .nav-btn{padding:6px 14px;font-size:13px;}
  #dots{max-width:100%;}
  .dot{width:5px;height:5px;}
  .big-concept{padding:14px 16px;}
  .big-concept h2{font-size:16px;}
  .big-concept .bc-emoji{font-size:28px;}
  .slide-heading{font-size:18px;}
  #topbar{padding:8px 12px;gap:6px;}
  #nav{padding:8px 12px;gap:10px;}
  table{font-size:10px;}
  th,td{padding:5px 6px;}
  .card h3{font-size:12px;}
  .card p{font-size:11px;}
  .highlight,.tip,.warn{font-size:11px;}
  .step-body h4{font-size:12px;}
  .step-body p{font-size:11px;}
}
</style></head><body>

</div><script>
const SLIDES_DATA = [{"label": "Title", "html": "<div class=\"slide-title\" style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;\"><div class=\"session-badge\">Session 12 of 15</div><div style=\"font-size:48px;margin-bottom:12px;\">🧠</div><h1>Neural Networks &amp;<br>Deep Learning</h1><p class=\"sub\">Build artificial brains with Keras — learn how neurons, layers, activations, and backpropagation work together</p><div style=\"display:flex;gap:12px;justify-content:center;margin-top:14px;flex-wrap:wrap;\"><span class=\"tag tag-blue\">Keras</span><span class=\"tag tag-green\">Activation Functions</span><span class=\"tag tag-orange\">Backpropagation</span><span class=\"tag tag-blue\">Dropout</span><span class=\"tag tag-green\">Training Loop</span></div><div class=\"academy-tag\" style=\"margin-top:20px;\">codencode Academy · Python + Data Science</div></div>"}, {"label": "What Are Neural Networks?", "html": "<div class=\"section-tag\">Foundation</div><div class=\"slide-heading\">Neural Networks — Inspired by the Brain 🧠</div><div class=\"two-col\" style=\"margin-bottom:8px;\"><div><strong>Definition:</strong> Machine learning models that mimic how biological neurons work. Consist of connected nodes (neurons) that process data, learn patterns, and enable decisions — without pre-defined rules.<br><br><strong>Key components:</strong><br>• <strong>Neurons</strong> — basic units; receive inputs, governed by threshold + activation function<br>• <strong>Connections</strong> — links between neurons, carry information<br>• <strong>Weights &amp; Biases</strong> — determine strength and influence of each connection<br>• <strong>Propagation</strong> — mechanism to process &amp; transfer data across layers<br>• <strong>Learning Rule</strong> — adjusts weights/biases over time to improve accuracy</div><div><strong>3-stage learning process:</strong><br>① <strong>Input</strong> — data fed into the network<br>② <strong>Output</strong> — network generates prediction from current weights<br>③ <strong>Refine</strong> — weights adjusted, repeated until accurate<br><br><strong>Why neural networks?</strong><br>• Identify complex patterns (images, speech, text)<br>• Learn from data — improve with experience<br>• Drive NLP, self-driving cars, medical AI<br>• Backbone of modern AI (ChatGPT, image gen)</div></div><svg viewBox=\"0 0 540 260\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:540px;display:block;margin:4px auto;\">\n  <rect width=\"540\" height=\"260\" fill=\"rgba(0,0,0,0.45)\" rx=\"10\"/>\n  <text x=\"270\" y=\"19\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"12\" font-weight=\"bold\" font-family=\"monospace\">Neural Network Architecture — 3 Layers</text>\n  <!-- Column labels -->\n  <text x=\"90\"  y=\"38\" text-anchor=\"middle\" fill=\"#4facfe\" font-size=\"11\" font-weight=\"bold\" font-family=\"monospace\">Input Layer</text>\n  <text x=\"270\" y=\"38\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"11\" font-weight=\"bold\" font-family=\"monospace\">Hidden Layer</text>\n  <text x=\"450\" y=\"38\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"11\" font-weight=\"bold\" font-family=\"monospace\">Output Layer</text>\n  <!-- Sub labels -->\n  <text x=\"90\"  y=\"52\" text-anchor=\"middle\" fill=\"rgba(79,172,254,0.55)\" font-size=\"9\" font-family=\"monospace\">features in</text>\n  <text x=\"270\" y=\"52\" text-anchor=\"middle\" fill=\"rgba(255,209,102,0.55)\" font-size=\"9\" font-family=\"monospace\">learns patterns</text>\n  <text x=\"450\" y=\"52\" text-anchor=\"middle\" fill=\"rgba(67,233,123,0.55)\" font-size=\"9\" font-family=\"monospace\">prediction out</text>\n  <!-- Connections (draw first so neurons appear on top) -->\n  <!-- Input → Hidden -->\n  <line x1=\"106\" y1=\"80\"  x2=\"252\" y2=\"88\"  stroke=\"rgba(255,255,255,0.12)\" stroke-width=\"1.2\"/>\n  <line x1=\"106\" y1=\"80\"  x2=\"252\" y2=\"128\" stroke=\"rgba(255,255,255,0.12)\" stroke-width=\"1.2\"/>\n  <line x1=\"106\" y1=\"80\"  x2=\"252\" y2=\"168\" stroke=\"rgba(255,255,255,0.12)\" stroke-width=\"1.2\"/>\n  <line x1=\"106\" y1=\"80\"  x2=\"252\" y2=\"208\" stroke=\"rgba(255,255,255,0.12)\" stroke-width=\"1.2\"/>\n  <line x1=\"106\" y1=\"120\" x2=\"252\" y2=\"88\"  stroke=\"rgba(255,255,255,0.12)\" stroke-width=\"1.2\"/>\n  <line x1=\"106\" y1=\"120\" x2=\"252\" y2=\"128\" stroke=\"rgba(255,255,255,0.12)\" stroke-width=\"1.2\"/>\n  <line x1=\"106\" y1=\"120\" x2=\"252\" y2=\"168\" stroke=\"rgba(255,255,255,0.12)\" stroke-width=\"1.2\"/>\n  <line x1=\"106\" y1=\"120\" x2=\"252\" y2=\"208\" stroke=\"rgba(255,255,255,0.12)\" stroke-width=\"1.2\"/>\n  <line x1=\"106\" y1=\"160\" x2=\"252\" y2=\"88\"  stroke=\"rgba(255,255,255,0.12)\" stroke-width=\"1.2\"/>\n  <line x1=\"106\" y1=\"160\" x2=\"252\" y2=\"128\" stroke=\"rgba(255,255,255,0.12)\" stroke-width=\"1.2\"/>\n  <line x1=\"106\" y1=\"160\" x2=\"252\" y2=\"168\" stroke=\"rgba(255,255,255,0.12)\" stroke-width=\"1.2\"/>\n  <line x1=\"106\" y1=\"160\" x2=\"252\" y2=\"208\" stroke=\"rgba(255,255,255,0.12)\" stroke-width=\"1.2\"/>\n  <line x1=\"106\" y1=\"200\" x2=\"252\" y2=\"88\"  stroke=\"rgba(255,255,255,0.12)\" stroke-width=\"1.2\"/>\n  <line x1=\"106\" y1=\"200\" x2=\"252\" y2=\"128\" stroke=\"rgba(255,255,255,0.12)\" stroke-width=\"1.2\"/>\n  <line x1=\"106\" y1=\"200\" x2=\"252\" y2=\"168\" stroke=\"rgba(255,255,255,0.12)\" stroke-width=\"1.2\"/>\n  <line x1=\"106\" y1=\"200\" x2=\"252\" y2=\"208\" stroke=\"rgba(255,255,255,0.12)\" stroke-width=\"1.2\"/>\n  <!-- Hidden → Output (highlighted) -->\n  <line x1=\"288\" y1=\"88\"  x2=\"433\" y2=\"120\" stroke=\"rgba(67,233,123,0.35)\" stroke-width=\"1.8\"/>\n  <line x1=\"288\" y1=\"128\" x2=\"433\" y2=\"120\" stroke=\"rgba(67,233,123,0.35)\" stroke-width=\"1.8\"/>\n  <line x1=\"288\" y1=\"168\" x2=\"433\" y2=\"120\" stroke=\"rgba(67,233,123,0.35)\" stroke-width=\"1.8\"/>\n  <line x1=\"288\" y1=\"208\" x2=\"433\" y2=\"120\" stroke=\"rgba(67,233,123,0.35)\" stroke-width=\"1.8\"/>\n  <line x1=\"288\" y1=\"88\"  x2=\"433\" y2=\"170\" stroke=\"rgba(67,233,123,0.35)\" stroke-width=\"1.8\"/>\n  <line x1=\"288\" y1=\"128\" x2=\"433\" y2=\"170\" stroke=\"rgba(67,233,123,0.35)\" stroke-width=\"1.8\"/>\n  <line x1=\"288\" y1=\"168\" x2=\"433\" y2=\"170\" stroke=\"rgba(67,233,123,0.35)\" stroke-width=\"1.8\"/>\n  <line x1=\"288\" y1=\"208\" x2=\"433\" y2=\"170\" stroke=\"rgba(67,233,123,0.35)\" stroke-width=\"1.8\"/>\n  <!-- Input neurons (4) -->\n  <circle cx=\"90\" cy=\"80\"  r=\"16\" fill=\"rgba(79,172,254,0.2)\"  stroke=\"#4facfe\" stroke-width=\"2\"/>\n  <text x=\"90\"  y=\"84\"  text-anchor=\"middle\" fill=\"#4facfe\" font-size=\"9\" font-family=\"monospace\">x₁</text>\n  <circle cx=\"90\" cy=\"120\" r=\"16\" fill=\"rgba(79,172,254,0.2)\"  stroke=\"#4facfe\" stroke-width=\"2\"/>\n  <text x=\"90\"  y=\"124\" text-anchor=\"middle\" fill=\"#4facfe\" font-size=\"9\" font-family=\"monospace\">x₂</text>\n  <circle cx=\"90\" cy=\"160\" r=\"16\" fill=\"rgba(79,172,254,0.2)\"  stroke=\"#4facfe\" stroke-width=\"2\"/>\n  <text x=\"90\"  y=\"164\" text-anchor=\"middle\" fill=\"#4facfe\" font-size=\"9\" font-family=\"monospace\">x₃</text>\n  <circle cx=\"90\" cy=\"200\" r=\"16\" fill=\"rgba(79,172,254,0.2)\"  stroke=\"#4facfe\" stroke-width=\"2\"/>\n  <text x=\"90\"  y=\"204\" text-anchor=\"middle\" fill=\"#4facfe\" font-size=\"9\" font-family=\"monospace\">x₄</text>\n  <!-- Hidden neurons (4) -->\n  <circle cx=\"270\" cy=\"88\"  r=\"18\" fill=\"rgba(255,209,102,0.2)\" stroke=\"#FFD166\" stroke-width=\"2\"/>\n  <text x=\"270\"  y=\"85\"  text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"8\" font-family=\"monospace\">Σ then</text>\n  <text x=\"270\"  y=\"95\"  text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"8\" font-family=\"monospace\">f(z)</text>\n  <circle cx=\"270\" cy=\"128\" r=\"18\" fill=\"rgba(255,209,102,0.2)\" stroke=\"#FFD166\" stroke-width=\"2\"/>\n  <text x=\"270\"  y=\"125\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"8\" font-family=\"monospace\">Σ then</text>\n  <text x=\"270\"  y=\"135\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"8\" font-family=\"monospace\">f(z)</text>\n  <circle cx=\"270\" cy=\"168\" r=\"18\" fill=\"rgba(255,209,102,0.2)\" stroke=\"#FFD166\" stroke-width=\"2\"/>\n  <text x=\"270\"  y=\"165\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"8\" font-family=\"monospace\">Σ then</text>\n  <text x=\"270\"  y=\"175\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"8\" font-family=\"monospace\">f(z)</text>\n  <circle cx=\"270\" cy=\"208\" r=\"18\" fill=\"rgba(255,209,102,0.2)\" stroke=\"#FFD166\" stroke-width=\"2\"/>\n  <text x=\"270\"  y=\"205\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"8\" font-family=\"monospace\">Σ then</text>\n  <text x=\"270\"  y=\"215\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"8\" font-family=\"monospace\">f(z)</text>\n  <!-- Output neurons (2) -->\n  <circle cx=\"450\" cy=\"120\" r=\"18\" fill=\"rgba(67,233,123,0.2)\"  stroke=\"#43e97b\" stroke-width=\"2\"/>\n  <text x=\"450\"  y=\"116\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"8\" font-family=\"monospace\">ŷ₁</text>\n  <text x=\"450\"  y=\"126\" text-anchor=\"middle\" fill=\"rgba(67,233,123,0.6)\" font-size=\"7.5\" font-family=\"monospace\">spam</text>\n  <circle cx=\"450\" cy=\"170\" r=\"18\" fill=\"rgba(67,233,123,0.2)\"  stroke=\"#43e97b\" stroke-width=\"2\"/>\n  <text x=\"450\"  y=\"166\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"8\" font-family=\"monospace\">ŷ₂</text>\n  <text x=\"450\"  y=\"176\" text-anchor=\"middle\" fill=\"rgba(67,233,123,0.6)\" font-size=\"7.5\" font-family=\"monospace\">not spam</text>\n  <!-- Weight label on one connection -->\n  <text x=\"185\" y=\"98\"  fill=\"rgba(255,255,255,0.5)\" font-size=\"8.5\" font-family=\"monospace\">w=0.7</text>\n  <!-- Bias label -->\n  <circle cx=\"270\" cy=\"240\" r=\"10\" fill=\"rgba(255,255,255,0.08)\" stroke=\"rgba(255,255,255,0.3)\" stroke-width=\"1.5\" stroke-dasharray=\"3,2\"/>\n  <text x=\"270\" y=\"244\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.5)\" font-size=\"8\" font-family=\"monospace\">b</text>\n  <text x=\"305\" y=\"244\" fill=\"rgba(255,255,255,0.4)\" font-size=\"8\" font-family=\"monospace\">bias added to every neuron</text>\n  <!-- Formula -->\n  <text x=\"270\" y=\"256\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.4)\" font-size=\"9\" font-family=\"monospace\">Each neuron: z = w₁x₁ + w₂x₂ + … + wₙxₙ + b   →   output = activation(z)</text>\n</svg>"}, {"label": "Forward Propagation", "html": "<div class=\"section-tag\">How It Works</div><div class=\"slide-heading\">Forward Propagation — Data Flows Through the Network ➡️</div><div class=\"cards cards-3\" style=\"margin-bottom:8px;\"><div class=\"card card-accent\"><h3>① Linear Transformation</h3><p>Each neuron computes: <code>z = w₁x₁ + w₂x₂ + … + wₙxₙ + b</code><br>Weights (w) control importance. Bias (b) shifts the threshold. This is a dot product.</p></div><div class=\"card card-accent\"><h3>② Activation Function</h3><p>The result <code>z</code> passes through an activation function (ReLU, Sigmoid, tanh) — introduces <strong>non-linearity</strong> so the network can learn complex patterns, not just straight lines.</p></div><div class=\"card card-accent\"><h3>③ Layer by Layer</h3><p>Output of each layer becomes input to the next. Information flows forward through input → hidden → output. No loops — that's feedforward.</p></div></div><svg viewBox=\"0 0 540 265\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:540px;display:block;margin:4px auto;\">\n  <rect width=\"540\" height=\"265\" fill=\"rgba(0,0,0,0.45)\" rx=\"10\"/>\n  <text x=\"270\" y=\"18\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"12\" font-weight=\"bold\" font-family=\"monospace\">Forward Propagation — Spam Email Example</text>\n  <!-- Step 1: Input -->\n  <rect x=\"10\" y=\"28\" width=\"110\" height=\"100\" fill=\"rgba(79,172,254,0.08)\" stroke=\"rgba(79,172,254,0.3)\" rx=\"7\"/>\n  <text x=\"65\" y=\"44\" text-anchor=\"middle\" fill=\"#4facfe\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">① Input</text>\n  <text x=\"65\" y=\"58\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.6)\" font-size=\"9\" font-family=\"monospace\">Feature vector:</text>\n  <rect x=\"20\" y=\"63\" width=\"90\" height=\"16\" fill=\"rgba(79,172,254,0.15)\" rx=\"3\"/>\n  <text x=\"65\" y=\"75\" text-anchor=\"middle\" fill=\"#4facfe\" font-size=\"9\" font-family=\"monospace\">\"free\" = 1</text>\n  <rect x=\"20\" y=\"82\" width=\"90\" height=\"16\" fill=\"rgba(255,255,255,0.05)\" rx=\"3\"/>\n  <text x=\"65\" y=\"94\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.5)\" font-size=\"9\" font-family=\"monospace\">\"win\" = 0</text>\n  <rect x=\"20\" y=\"101\" width=\"90\" height=\"16\" fill=\"rgba(79,172,254,0.15)\" rx=\"3\"/>\n  <text x=\"65\" y=\"113\" text-anchor=\"middle\" fill=\"#4facfe\" font-size=\"9\" font-family=\"monospace\">\"offer\" = 1</text>\n  <!-- Arrow 1 -->\n  <text x=\"133\" y=\"82\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"18\">→</text>\n  <!-- Step 2: Hidden layer computation -->\n  <rect x=\"152\" y=\"28\" width=\"175\" height=\"145\" fill=\"rgba(255,209,102,0.07)\" stroke=\"rgba(255,209,102,0.3)\" rx=\"7\"/>\n  <text x=\"239\" y=\"44\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">② Hidden Layer</text>\n  <text x=\"239\" y=\"57\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.55)\" font-size=\"8.5\" font-family=\"monospace\">Weighted sum + ReLU</text>\n  <!-- H1 -->\n  <rect x=\"162\" y=\"62\" width=\"155\" height=\"48\" fill=\"rgba(255,209,102,0.08)\" stroke=\"rgba(255,209,102,0.2)\" rx=\"5\"/>\n  <text x=\"239\" y=\"76\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"9\" font-weight=\"bold\" font-family=\"monospace\">Neuron H1</text>\n  <text x=\"239\" y=\"88\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.55)\" font-size=\"8.5\" font-family=\"monospace\">z = 1×0.5 + 0×(−0.2) + 1×0.3 = 0.8</text>\n  <text x=\"239\" y=\"100\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"9\" font-weight=\"bold\" font-family=\"monospace\">ReLU(0.8) → 0.8  ✓</text>\n  <!-- H2 -->\n  <rect x=\"162\" y=\"115\" width=\"155\" height=\"48\" fill=\"rgba(255,209,102,0.08)\" stroke=\"rgba(255,209,102,0.2)\" rx=\"5\"/>\n  <text x=\"239\" y=\"129\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"9\" font-weight=\"bold\" font-family=\"monospace\">Neuron H2</text>\n  <text x=\"239\" y=\"141\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.55)\" font-size=\"8.5\" font-family=\"monospace\">z = 1×0.4 + 0×0.1 + 1×(−0.5) = −0.1</text>\n  <text x=\"239\" y=\"153\" text-anchor=\"middle\" fill=\"#f5576c\" font-size=\"9\" font-weight=\"bold\" font-family=\"monospace\">ReLU(−0.1) → 0  (killed)</text>\n  <!-- Arrow 2 -->\n  <text x=\"342\" y=\"82\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"18\">→</text>\n  <!-- Step 3: Output layer -->\n  <rect x=\"360\" y=\"28\" width=\"170\" height=\"100\" fill=\"rgba(67,233,123,0.07)\" stroke=\"rgba(67,233,123,0.3)\" rx=\"7\"/>\n  <text x=\"445\" y=\"44\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">③ Output Layer</text>\n  <text x=\"445\" y=\"57\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.55)\" font-size=\"8.5\" font-family=\"monospace\">Weighted sum + Sigmoid</text>\n  <rect x=\"370\" y=\"62\" width=\"150\" height=\"55\" fill=\"rgba(67,233,123,0.08)\" stroke=\"rgba(67,233,123,0.2)\" rx=\"5\"/>\n  <text x=\"445\" y=\"76\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.6)\" font-size=\"8.5\" font-family=\"monospace\">z = 0.8×0.7 + 0×0.2 = 0.56</text>\n  <text x=\"445\" y=\"90\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.6)\" font-size=\"8.5\" font-family=\"monospace\">σ(0.56) = 1/(1+e⁻⁰·⁵⁶)</text>\n  <text x=\"445\" y=\"107\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"12\" font-weight=\"bold\" font-family=\"monospace\">≈ 0.636</text>\n  <!-- Decision box -->\n  <rect x=\"360\" y=\"138\" width=\"170\" height=\"30\" fill=\"rgba(245,87,108,0.2)\" stroke=\"rgba(245,87,108,0.5)\" rx=\"6\"/>\n  <text x=\"445\" y=\"150\" text-anchor=\"middle\" fill=\"#f5576c\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">0.636 &gt; 0.5</text>\n  <text x=\"445\" y=\"162\" text-anchor=\"middle\" fill=\"#f5576c\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">→ SPAM 🚨</text>\n  <!-- Bottom: backprop arrow -->\n  <rect x=\"10\" y=\"185\" width=\"520\" height=\"70\" fill=\"rgba(139,92,246,0.07)\" stroke=\"rgba(139,92,246,0.25)\" rx=\"7\"/>\n  <text x=\"270\" y=\"200\" text-anchor=\"middle\" fill=\"#C4B5FD\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">④ Backpropagation — Learning from the Error</text>\n  <text x=\"270\" y=\"215\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.6)\" font-size=\"9\" font-family=\"monospace\">Actual label = 1 (spam).  Loss = (1 − 0.636)² = 0.133</text>\n  <text x=\"270\" y=\"230\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.6)\" font-size=\"9\" font-family=\"monospace\">Gradients flow BACKWARDS through every weight via chain rule</text>\n  <text x=\"270\" y=\"245\" text-anchor=\"middle\" fill=\"#C4B5FD\" font-size=\"9\" font-family=\"monospace\">Each weight updated: w ← w − lr × ∂Loss/∂w   (gradient descent)</text>\n  <text x=\"270\" y=\"258\" text-anchor=\"middle\" fill=\"rgba(196,181,253,0.6)\" font-size=\"8.5\" font-family=\"monospace\">Repeat for thousands of emails → loss falls → predictions improve</text>\n</svg>"}, {"label": "Backpropagation", "html": "<div class=\"section-tag\">Learning</div><div class=\"slide-heading\">Backpropagation — How the Network Actually Learns 🔁</div><div class=\"two-col\" style=\"margin-bottom:8px;\"><div><strong>Step 1 — Loss Calculation:</strong><br>After forward pass, measure how wrong the prediction was using a <strong>loss function</strong>.<br>• Regression: Mean Squared Error (MSE)<br>• Classification: Cross-Entropy Loss<br><br><strong>Step 2 — Gradient Calculation:</strong><br>Using the chain rule of calculus, compute how much each weight contributed to the error (∂Loss/∂w). These are called <em>gradients</em>.</div><div><strong>Step 3 — Weight Update:</strong><br><code>w ← w − learning_rate × gradient</code><br>Move weights in the direction that reduces loss.<br><br><strong>Step 4 — Iterate:</strong><br>Repeat forward → loss → backward → update for every mini-batch across the full dataset (one epoch). Do this for 50–200 epochs until loss converges.<br><br><strong>Optimiser choices:</strong> SGD, Adam (most common), RMSprop</div></div><svg viewBox=\"0 0 540 200\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:540px;display:block;margin:4px auto;\">\n  <rect width=\"540\" height=\"200\" fill=\"rgba(0,0,0,0.45)\" rx=\"10\"/>\n  <text x=\"270\" y=\"18\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"12\" font-weight=\"bold\" font-family=\"monospace\">Backpropagation — Gradient Flows Backwards</text>\n  <!-- Forward pass arrows (top) -->\n  <text x=\"55\"  y=\"42\" text-anchor=\"middle\" fill=\"#4facfe\" font-size=\"9\" font-family=\"monospace\">Input</text>\n  <line x1=\"90\"  y1=\"38\" x2=\"130\" y2=\"38\" stroke=\"#4facfe\" stroke-width=\"2\" marker-end=\"url(#fw)\"/>\n  <text x=\"180\" y=\"42\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"9\" font-family=\"monospace\">Hidden</text>\n  <line x1=\"218\" y1=\"38\" x2=\"258\" y2=\"38\" stroke=\"#4facfe\" stroke-width=\"2\" marker-end=\"url(#fw)\"/>\n  <text x=\"305\" y=\"42\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"9\" font-family=\"monospace\">Hidden</text>\n  <line x1=\"345\" y1=\"38\" x2=\"385\" y2=\"38\" stroke=\"#4facfe\" stroke-width=\"2\" marker-end=\"url(#fw)\"/>\n  <text x=\"430\" y=\"42\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"9\" font-family=\"monospace\">Output</text>\n  <text x=\"270\" y=\"30\" text-anchor=\"middle\" fill=\"rgba(79,172,254,0.6)\" font-size=\"9\" font-family=\"monospace\">Forward pass →  predictions generated</text>\n\n  <!-- Layer boxes -->\n  <rect x=\"18\"  y=\"50\" width=\"74\" height=\"40\" fill=\"rgba(79,172,254,0.12)\" stroke=\"rgba(79,172,254,0.35)\" rx=\"6\"/>\n  <text x=\"55\"  y=\"67\" text-anchor=\"middle\" fill=\"#4facfe\" font-size=\"9\" font-family=\"monospace\">x₁=1</text>\n  <text x=\"55\"  y=\"80\" text-anchor=\"middle\" fill=\"#4facfe\" font-size=\"9\" font-family=\"monospace\">x₂=0  x₃=1</text>\n  <rect x=\"142\" y=\"50\" width=\"74\" height=\"40\" fill=\"rgba(255,209,102,0.12)\" stroke=\"rgba(255,209,102,0.35)\" rx=\"6\"/>\n  <text x=\"179\" y=\"67\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"9\" font-family=\"monospace\">H1=0.8</text>\n  <text x=\"179\" y=\"80\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"9\" font-family=\"monospace\">H2=0</text>\n  <rect x=\"268\" y=\"50\" width=\"74\" height=\"40\" fill=\"rgba(255,209,102,0.12)\" stroke=\"rgba(255,209,102,0.35)\" rx=\"6\"/>\n  <text x=\"305\" y=\"73\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"9\" font-family=\"monospace\">deeper</text>\n  <rect x=\"394\" y=\"50\" width=\"130\" height=\"40\" fill=\"rgba(67,233,123,0.12)\" stroke=\"rgba(67,233,123,0.35)\" rx=\"6\"/>\n  <text x=\"459\" y=\"67\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"9\" font-family=\"monospace\">ŷ = 0.636</text>\n  <text x=\"459\" y=\"80\" text-anchor=\"middle\" fill=\"#f5576c\" font-size=\"9\" font-family=\"monospace\">actual y = 1</text>\n\n  <!-- Loss -->\n  <rect x=\"390\" y=\"105\" width=\"138\" height=\"36\" fill=\"rgba(245,87,108,0.15)\" stroke=\"#f5576c\" stroke-width=\"2\" rx=\"6\"/>\n  <text x=\"459\" y=\"120\" text-anchor=\"middle\" fill=\"#f5576c\" font-size=\"9\" font-weight=\"bold\" font-family=\"monospace\">Loss = (1−0.636)²</text>\n  <text x=\"459\" y=\"133\" text-anchor=\"middle\" fill=\"#f5576c\" font-size=\"9\" font-weight=\"bold\" font-family=\"monospace\">= 0.133</text>\n  <line x1=\"459\" y1=\"105\" x2=\"459\" y2=\"90\" stroke=\"#f5576c\" stroke-width=\"1.5\" marker-end=\"url(#bk)\"/>\n\n  <!-- Backprop arrows (bottom) going RIGHT to LEFT -->\n  <text x=\"270\" y=\"162\" text-anchor=\"middle\" fill=\"rgba(245,87,108,0.6)\" font-size=\"9\" font-family=\"monospace\">← Backward pass  (chain rule: ∂Loss/∂w calculated for every weight)</text>\n  <line x1=\"388\" y1=\"122\" x2=\"345\" y2=\"122\" stroke=\"#f5576c\" stroke-width=\"2\" marker-end=\"url(#bk)\"/>\n  <line x1=\"265\" y1=\"122\" x2=\"222\" y2=\"122\" stroke=\"#f5576c\" stroke-width=\"2\" marker-end=\"url(#bk)\"/>\n  <line x1=\"140\" y1=\"122\" x2=\"97\"  y2=\"122\" stroke=\"#f5576c\" stroke-width=\"2\" marker-end=\"url(#bk)\"/>\n  <!-- Back layer boxes -->\n  <rect x=\"268\" y=\"105\" width=\"74\" height=\"36\" fill=\"rgba(245,87,108,0.1)\" stroke=\"rgba(245,87,108,0.3)\" rx=\"6\"/>\n  <text x=\"305\" y=\"120\" text-anchor=\"middle\" fill=\"#f5576c\" font-size=\"8.5\" font-family=\"monospace\">∂L/∂w</text>\n  <text x=\"305\" y=\"133\" text-anchor=\"middle\" fill=\"#f5576c\" font-size=\"8.5\" font-family=\"monospace\">computed</text>\n  <rect x=\"142\" y=\"105\" width=\"74\" height=\"36\" fill=\"rgba(245,87,108,0.1)\" stroke=\"rgba(245,87,108,0.3)\" rx=\"6\"/>\n  <text x=\"179\" y=\"120\" text-anchor=\"middle\" fill=\"#f5576c\" font-size=\"8.5\" font-family=\"monospace\">∂L/∂w</text>\n  <text x=\"179\" y=\"133\" text-anchor=\"middle\" fill=\"#f5576c\" font-size=\"8.5\" font-family=\"monospace\">propagated</text>\n  <rect x=\"18\"  y=\"105\" width=\"74\" height=\"36\" fill=\"rgba(245,87,108,0.1)\" stroke=\"rgba(245,87,108,0.3)\" rx=\"6\"/>\n  <text x=\"55\"  y=\"120\" text-anchor=\"middle\" fill=\"#f5576c\" font-size=\"8.5\" font-family=\"monospace\">weights</text>\n  <text x=\"55\"  y=\"133\" text-anchor=\"middle\" fill=\"#f5576c\" font-size=\"8.5\" font-family=\"monospace\">updated!</text>\n\n  <!-- Update rule -->\n  <text x=\"270\" y=\"178\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.55)\" font-size=\"9.5\" font-family=\"monospace\">Update rule: w ← w − learning_rate × ∂Loss/∂w     (gradient descent)</text>\n  <text x=\"270\" y=\"192\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.35)\" font-size=\"9.5\" font-family=\"monospace\">Repeat for every mini-batch → 1000s of iterations → loss shrinks → model improves</text>\n  <!-- Defs -->\n  <defs>\n    <marker id=\"fw\" markerWidth=\"7\" markerHeight=\"5\" refX=\"7\" refY=\"2.5\" orient=\"auto\"><polygon points=\"0 0,7 2.5,0 5\" fill=\"#4facfe\"/></marker>\n    <marker id=\"bk\" markerWidth=\"7\" markerHeight=\"5\" refX=\"7\" refY=\"2.5\" orient=\"auto\"><polygon points=\"0 0,7 2.5,0 5\" fill=\"#f5576c\"/></marker>\n  </defs>\n</svg><div class=\"tip\" style=\"margin-top:6px;\">💡 <strong>Learning rate</strong> is the most critical hyperparameter. Too large → overshoots, loss oscillates. Too small → trains forever. Start with <code>0.001</code> for Adam.</div>"}, {"label": "Activation Functions", "html": "<div class=\"section-tag\">Key Concept</div><div class=\"slide-heading\">Activation Functions — The Non-Linearity That Makes NNs Powerful ⚡</div><div class=\"cards cards-4\" style=\"margin-bottom:8px;\"><div class=\"card card-accent\"><h3>ReLU</h3><p><code>max(0, z)</code> — simple, fast, default for hidden layers. Can suffer from \"dying ReLU\" (neurons stuck at 0).</p></div><div class=\"card card-accent\"><h3>Sigmoid</h3><p><code>1/(1+e⁻ᶻ)</code> — outputs 0–1, perfect for binary classification output layer. Slow for deep networks.</p></div><div class=\"card card-accent\"><h3>Tanh</h3><p><code>(eᶻ−e⁻ᶻ)/(eᶻ+e⁻ᶻ)</code> — outputs −1 to +1, zero-centred. Better than sigmoid for hidden layers.</p></div><div class=\"card card-accent\"><h3>Softmax</h3><p>Multi-class output layer. Converts raw scores into probabilities that sum to 1.0. Pick the highest.</p></div></div><svg viewBox=\"0 0 540 240\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:540px;display:block;margin:4px auto;\">\n  <rect width=\"540\" height=\"240\" fill=\"rgba(0,0,0,0.45)\" rx=\"10\"/>\n  <text x=\"270\" y=\"18\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"12\" font-weight=\"bold\" font-family=\"monospace\">Activation Functions — Visualised</text>\n  <!-- RELU panel -->\n  <rect x=\"10\" y=\"26\" width=\"155\" height=\"170\" fill=\"rgba(79,172,254,0.05)\" stroke=\"rgba(79,172,254,0.25)\" rx=\"7\"/>\n  <text x=\"87\" y=\"42\" text-anchor=\"middle\" fill=\"#4facfe\" font-size=\"11\" font-weight=\"bold\" font-family=\"monospace\">ReLU</text>\n  <text x=\"87\" y=\"54\" text-anchor=\"middle\" fill=\"rgba(79,172,254,0.6)\" font-size=\"8.5\" font-family=\"monospace\">max(0, z)</text>\n  <line x1=\"20\"  y1=\"150\" x2=\"158\" y2=\"150\" stroke=\"rgba(255,255,255,0.15)\" stroke-width=\"1\"/>\n  <line x1=\"87\"  y1=\"60\"  x2=\"87\"  y2=\"175\" stroke=\"rgba(255,255,255,0.15)\" stroke-width=\"1\"/>\n  <!-- ReLU curve: flat left, slope right -->\n  <polyline points=\"20,150 87,150 155,82\" fill=\"none\" stroke=\"#4facfe\" stroke-width=\"2.5\"/>\n  <text x=\"87\" y=\"184\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.45)\" font-size=\"8.5\" font-family=\"monospace\">z &lt; 0 → 0</text>\n  <text x=\"87\" y=\"195\" text-anchor=\"middle\" fill=\"#4facfe\" font-size=\"8.5\" font-family=\"monospace\">z ≥ 0 → z (linear)</text>\n  <!-- Usage tag -->\n  <rect x=\"20\" y=\"198\" width=\"135\" height=\"14\" fill=\"rgba(79,172,254,0.15)\" rx=\"3\"/>\n  <text x=\"87\" y=\"208\" text-anchor=\"middle\" fill=\"#4facfe\" font-size=\"8\" font-family=\"monospace\">Hidden layers (most common)</text>\n\n  <!-- SIGMOID panel -->\n  <rect x=\"192\" y=\"26\" width=\"155\" height=\"170\" fill=\"rgba(67,233,123,0.05)\" stroke=\"rgba(67,233,123,0.25)\" rx=\"7\"/>\n  <text x=\"269\" y=\"42\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"11\" font-weight=\"bold\" font-family=\"monospace\">Sigmoid</text>\n  <text x=\"269\" y=\"54\" text-anchor=\"middle\" fill=\"rgba(67,233,123,0.6)\" font-size=\"8.5\" font-family=\"monospace\">1 / (1 + e⁻ᶻ)</text>\n  <line x1=\"202\" y1=\"135\" x2=\"340\" y2=\"135\" stroke=\"rgba(255,255,255,0.15)\" stroke-width=\"1\"/>\n  <line x1=\"269\" y1=\"60\"  x2=\"269\" y2=\"175\" stroke=\"rgba(255,255,255,0.15)\" stroke-width=\"1\"/>\n  <!-- Sigmoid S-curve approximated -->\n  <path d=\"M 202 165 Q 230 165 250 135 Q 265 110 270 100 Q 275 92 290 75 Q 310 60 340 60\" fill=\"none\" stroke=\"#43e97b\" stroke-width=\"2.5\"/>\n  <!-- Asymptote lines -->\n  <line x1=\"202\" y1=\"165\" x2=\"340\" y2=\"165\" stroke=\"rgba(67,233,123,0.2)\" stroke-width=\"1\" stroke-dasharray=\"3,3\"/>\n  <line x1=\"202\" y1=\"60\"  x2=\"340\" y2=\"60\"  stroke=\"rgba(67,233,123,0.2)\" stroke-width=\"1\" stroke-dasharray=\"3,3\"/>\n  <text x=\"343\" y=\"64\"  fill=\"rgba(67,233,123,0.5)\" font-size=\"8\" font-family=\"monospace\">1</text>\n  <text x=\"343\" y=\"169\" fill=\"rgba(67,233,123,0.5)\" font-size=\"8\" font-family=\"monospace\">0</text>\n  <text x=\"269\" y=\"184\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.45)\" font-size=\"8.5\" font-family=\"monospace\">Output always 0–1</text>\n  <text x=\"269\" y=\"195\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"8.5\" font-family=\"monospace\">= probability!</text>\n  <rect x=\"202\" y=\"198\" width=\"135\" height=\"14\" fill=\"rgba(67,233,123,0.15)\" rx=\"3\"/>\n  <text x=\"269\" y=\"208\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"8\" font-family=\"monospace\">Binary output layer</text>\n\n  <!-- SOFTMAX / TANH panel -->\n  <rect x=\"374\" y=\"26\" width=\"155\" height=\"170\" fill=\"rgba(255,209,102,0.05)\" stroke=\"rgba(255,209,102,0.25)\" rx=\"7\"/>\n  <text x=\"451\" y=\"42\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"11\" font-weight=\"bold\" font-family=\"monospace\">Tanh</text>\n  <text x=\"451\" y=\"54\" text-anchor=\"middle\" fill=\"rgba(255,209,102,0.6)\" font-size=\"8.5\" font-family=\"monospace\">(eᶻ − e⁻ᶻ) / (eᶻ + e⁻ᶻ)</text>\n  <line x1=\"384\" y1=\"112\" x2=\"522\" y2=\"112\" stroke=\"rgba(255,255,255,0.15)\" stroke-width=\"1\"/>\n  <line x1=\"451\" y1=\"60\"  x2=\"451\" y2=\"175\" stroke=\"rgba(255,255,255,0.15)\" stroke-width=\"1\"/>\n  <!-- Tanh S-curve (symmetric around 0) -->\n  <path d=\"M 384 165 Q 405 165 425 138 Q 440 118 451 112 Q 462 106 477 86 Q 497 65 522 63\" fill=\"none\" stroke=\"#FFD166\" stroke-width=\"2.5\"/>\n  <line x1=\"384\" y1=\"165\" x2=\"522\" y2=\"165\" stroke=\"rgba(255,209,102,0.2)\" stroke-width=\"1\" stroke-dasharray=\"3,3\"/>\n  <line x1=\"384\" y1=\"62\"  x2=\"522\" y2=\"62\"  stroke=\"rgba(255,209,102,0.2)\" stroke-width=\"1\" stroke-dasharray=\"3,3\"/>\n  <text x=\"524\" y=\"66\"  fill=\"rgba(255,209,102,0.5)\" font-size=\"8\" font-family=\"monospace\">+1</text>\n  <text x=\"524\" y=\"169\" fill=\"rgba(255,209,102,0.5)\" font-size=\"8\" font-family=\"monospace\">−1</text>\n  <text x=\"451\" y=\"184\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.45)\" font-size=\"8.5\" font-family=\"monospace\">Output −1 to +1</text>\n  <text x=\"451\" y=\"195\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"8.5\" font-family=\"monospace\">Zero-centred (better)</text>\n  <rect x=\"384\" y=\"198\" width=\"135\" height=\"14\" fill=\"rgba(255,209,102,0.15)\" rx=\"3\"/>\n  <text x=\"451\" y=\"208\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"8\" font-family=\"monospace\">Hidden layers (RNNs)</text>\n  <!-- Bottom row: Softmax note -->\n  <text x=\"270\" y=\"225\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.55)\" font-size=\"9.5\" font-family=\"monospace\">+ Softmax (multi-class output): converts raw scores → probabilities that sum to 1.0</text>\n  <text x=\"270\" y=\"237\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.35)\" font-size=\"9.5\" font-family=\"monospace\">Leaky ReLU: like ReLU but z×0.01 when z&lt;0 → prevents \"dying ReLU\" problem</text>\n</svg><div class=\"tip\" style=\"margin-top:6px;\">💡 Quick rule: use <strong>ReLU</strong> everywhere in hidden layers → <strong>Sigmoid</strong> for binary output → <strong>Softmax</strong> for multi-class output.</div>"}, {"label": "Types of Neural Networks", "html": "<div class=\"section-tag\">Architecture Guide</div><div class=\"slide-heading\">Types of Neural Networks — Which One to Use? 🗺️</div><div class=\"two-col\" style=\"margin-bottom:8px;\"><div><strong>Feedforward / MLP</strong><br>Data moves one way: input → hidden(s) → output. The default. Use for tabular/structured data.<br><br><strong>CNN (Convolutional Neural Network)</strong><br>Slides a filter over the input to detect local patterns (edges, shapes, faces in images). Shared weights = far fewer parameters. Use for image, video, audio spectrograms.<br><br><strong>Single-layer Perceptron</strong><br>One hidden layer. Good for linearly separable problems. Rarely used today.</div><div><strong>RNN (Recurrent Neural Network)</strong><br>Has a loop — hidden state h(t) feeds back in. Keeps memory of past inputs. But suffers from vanishing gradients on long sequences.<br><br><strong>LSTM (Long Short-Term Memory)</strong><br>RNN with 3 gates (forget / input / output) that control what the cell remembers and forgets. Solves vanishing gradient. Use for stock prices, speech, text generation.<br><br><strong>Transformer</strong> (beyond this course)<br>The architecture behind ChatGPT, BERT — uses attention to process sequences in parallel.</div></div><svg viewBox=\"0 0 540 260\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:540px;display:block;margin:4px auto;\">\n  <rect width=\"540\" height=\"260\" fill=\"rgba(0,0,0,0.45)\" rx=\"10\"/>\n  <text x=\"270\" y=\"19\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"12\" font-weight=\"bold\" font-family=\"monospace\">Types of Neural Networks</text>\n  <!-- Feedforward / MLP -->\n  <rect x=\"10\" y=\"28\" width=\"120\" height=\"205\" fill=\"rgba(79,172,254,0.06)\" stroke=\"rgba(79,172,254,0.28)\" rx=\"7\"/>\n  <text x=\"70\" y=\"45\" text-anchor=\"middle\" fill=\"#4facfe\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">MLP</text>\n  <text x=\"70\" y=\"57\" text-anchor=\"middle\" fill=\"rgba(79,172,254,0.6)\" font-size=\"8\" font-family=\"monospace\">Feedforward</text>\n  <!-- Simple MLP diagram -->\n  <circle cx=\"32\" cy=\"90\"  r=\"7\" fill=\"rgba(79,172,254,0.3)\" stroke=\"#4facfe\" stroke-width=\"1.5\"/>\n  <circle cx=\"32\" cy=\"112\" r=\"7\" fill=\"rgba(79,172,254,0.3)\" stroke=\"#4facfe\" stroke-width=\"1.5\"/>\n  <circle cx=\"32\" cy=\"134\" r=\"7\" fill=\"rgba(79,172,254,0.3)\" stroke=\"#4facfe\" stroke-width=\"1.5\"/>\n  <circle cx=\"70\" cy=\"96\"  r=\"7\" fill=\"rgba(255,209,102,0.3)\" stroke=\"#FFD166\" stroke-width=\"1.5\"/>\n  <circle cx=\"70\" cy=\"118\" r=\"7\" fill=\"rgba(255,209,102,0.3)\" stroke=\"#FFD166\" stroke-width=\"1.5\"/>\n  <circle cx=\"70\" cy=\"140\" r=\"7\" fill=\"rgba(255,209,102,0.3)\" stroke=\"#FFD166\" stroke-width=\"1.5\"/>\n  <circle cx=\"108\" cy=\"112\" r=\"7\" fill=\"rgba(67,233,123,0.3)\" stroke=\"#43e97b\" stroke-width=\"1.5\"/>\n  <line x1=\"39\" y1=\"90\"  x2=\"63\" y2=\"96\"  stroke=\"rgba(255,255,255,0.2)\" stroke-width=\"1\"/>\n  <line x1=\"39\" y1=\"90\"  x2=\"63\" y2=\"118\" stroke=\"rgba(255,255,255,0.2)\" stroke-width=\"1\"/>\n  <line x1=\"39\" y1=\"112\" x2=\"63\" y2=\"96\"  stroke=\"rgba(255,255,255,0.2)\" stroke-width=\"1\"/>\n  <line x1=\"39\" y1=\"112\" x2=\"63\" y2=\"118\" stroke=\"rgba(255,255,255,0.2)\" stroke-width=\"1\"/>\n  <line x1=\"77\" y1=\"96\"  x2=\"101\" y2=\"112\" stroke=\"rgba(255,255,255,0.2)\" stroke-width=\"1\"/>\n  <line x1=\"77\" y1=\"118\" x2=\"101\" y2=\"112\" stroke=\"rgba(255,255,255,0.2)\" stroke-width=\"1\"/>\n  <line x1=\"77\" y1=\"140\" x2=\"101\" y2=\"112\" stroke=\"rgba(255,255,255,0.2)\" stroke-width=\"1\"/>\n  <text x=\"70\" y=\"165\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.5)\" font-size=\"8\" font-family=\"monospace\">Data flows one</text>\n  <text x=\"70\" y=\"175\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.5)\" font-size=\"8\" font-family=\"monospace\">direction only</text>\n  <text x=\"70\" y=\"192\" text-anchor=\"middle\" fill=\"#4facfe\" font-size=\"8.5\" font-weight=\"bold\" font-family=\"monospace\">Tabular data</text>\n  <text x=\"70\" y=\"204\" text-anchor=\"middle\" fill=\"#4facfe\" font-size=\"8.5\" font-family=\"monospace\">Classification</text>\n  <text x=\"70\" y=\"216\" text-anchor=\"middle\" fill=\"#4facfe\" font-size=\"8.5\" font-family=\"monospace\">Regression</text>\n\n  <!-- CNN -->\n  <rect x=\"145\" y=\"28\" width=\"120\" height=\"205\" fill=\"rgba(255,209,102,0.06)\" stroke=\"rgba(255,209,102,0.28)\" rx=\"7\"/>\n  <text x=\"205\" y=\"45\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">CNN</text>\n  <text x=\"205\" y=\"57\" text-anchor=\"middle\" fill=\"rgba(255,209,102,0.6)\" font-size=\"8\" font-family=\"monospace\">Convolutional</text>\n  <!-- CNN diagram: image → filter → feature map -->\n  <rect x=\"155\" y=\"66\" width=\"30\" height=\"30\" fill=\"rgba(255,209,102,0.15)\" stroke=\"#FFD166\" stroke-width=\"1.5\"/>\n  <rect x=\"158\" y=\"69\" width=\"6\" height=\"6\" fill=\"rgba(255,209,102,0.5)\"/>\n  <rect x=\"166\" y=\"69\" width=\"6\" height=\"6\" fill=\"rgba(255,209,102,0.2)\"/>\n  <rect x=\"158\" y=\"77\" width=\"6\" height=\"6\" fill=\"rgba(255,209,102,0.3)\"/>\n  <rect x=\"166\" y=\"77\" width=\"6\" height=\"6\" fill=\"rgba(255,209,102,0.6)\"/>\n  <text x=\"170\" y=\"102\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.4)\" font-size=\"8\" font-family=\"monospace\">image</text>\n  <text x=\"196\" y=\"83\" fill=\"rgba(255,255,255,0.5)\" font-size=\"14\">→</text>\n  <!-- Filter -->\n  <rect x=\"210\" y=\"68\" width=\"18\" height=\"18\" fill=\"rgba(255,209,102,0.3)\" stroke=\"#FFD166\" stroke-width=\"1.5\" rx=\"2\"/>\n  <text x=\"219\" y=\"80\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"8\" font-family=\"monospace\">f</text>\n  <text x=\"219\" y=\"102\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.4)\" font-size=\"8\" font-family=\"monospace\">filter</text>\n  <text x=\"234\" y=\"83\" fill=\"rgba(255,255,255,0.5)\" font-size=\"14\">→</text>\n  <!-- Feature map -->\n  <rect x=\"245\" y=\"66\" width=\"14\" height=\"14\" fill=\"rgba(67,233,123,0.3)\" stroke=\"#43e97b\" stroke-width=\"1.5\"/>\n  <rect x=\"245\" y=\"81\" width=\"14\" height=\"14\" fill=\"rgba(67,233,123,0.5)\" stroke=\"#43e97b\" stroke-width=\"1.5\"/>\n  <text x=\"252\" y=\"102\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.4)\" font-size=\"8\" font-family=\"monospace\">map</text>\n  <text x=\"205\" y=\"125\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.5)\" font-size=\"8\" font-family=\"monospace\">Slides filter over</text>\n  <text x=\"205\" y=\"135\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.5)\" font-size=\"8\" font-family=\"monospace\">image to detect</text>\n  <text x=\"205\" y=\"145\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.5)\" font-size=\"8\" font-family=\"monospace\">edges, shapes, objects</text>\n  <text x=\"205\" y=\"192\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"8.5\" font-weight=\"bold\" font-family=\"monospace\">Image recognition</text>\n  <text x=\"205\" y=\"204\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"8.5\" font-family=\"monospace\">Video analysis</text>\n  <text x=\"205\" y=\"216\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"8.5\" font-family=\"monospace\">Medical imaging</text>\n\n  <!-- RNN -->\n  <rect x=\"280\" y=\"28\" width=\"120\" height=\"205\" fill=\"rgba(245,87,108,0.06)\" stroke=\"rgba(245,87,108,0.28)\" rx=\"7\"/>\n  <text x=\"340\" y=\"45\" text-anchor=\"middle\" fill=\"#f5576c\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">RNN</text>\n  <text x=\"340\" y=\"57\" text-anchor=\"middle\" fill=\"rgba(245,87,108,0.6)\" font-size=\"8\" font-family=\"monospace\">Recurrent</text>\n  <!-- RNN diagram: loop -->\n  <circle cx=\"340\" cy=\"95\" r=\"18\" fill=\"rgba(245,87,108,0.15)\" stroke=\"#f5576c\" stroke-width=\"2\"/>\n  <text x=\"340\" y=\"99\" text-anchor=\"middle\" fill=\"#f5576c\" font-size=\"8.5\" font-weight=\"bold\" font-family=\"monospace\">RNN</text>\n  <!-- Self loop arrow -->\n  <path d=\"M 355 85 Q 382 72 382 95 Q 382 118 355 106\" fill=\"none\" stroke=\"#f5576c\" stroke-width=\"1.8\" marker-end=\"url(#arr_r)\"/>\n  <text x=\"385\" y=\"97\" fill=\"rgba(245,87,108,0.7)\" font-size=\"8.5\" font-family=\"monospace\">h(t)</text>\n  <!-- Input/output arrows -->\n  <line x1=\"290\" y1=\"95\" x2=\"320\" y2=\"95\" stroke=\"rgba(255,255,255,0.3)\" stroke-width=\"1.5\" marker-end=\"url(#arr_w)\"/>\n  <text x=\"290\" y=\"88\" fill=\"rgba(255,255,255,0.45)\" font-size=\"8\" font-family=\"monospace\">x(t)</text>\n  <line x1=\"340\" y1=\"113\" x2=\"340\" y2=\"133\" stroke=\"rgba(255,255,255,0.3)\" stroke-width=\"1.5\" marker-end=\"url(#arr_w)\"/>\n  <text x=\"348\" y=\"128\" fill=\"rgba(255,255,255,0.45)\" font-size=\"8\" font-family=\"monospace\">y(t)</text>\n  <text x=\"340\" y=\"152\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.5)\" font-size=\"8\" font-family=\"monospace\">Loops back — keeps</text>\n  <text x=\"340\" y=\"162\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.5)\" font-size=\"8\" font-family=\"monospace\">memory of past</text>\n  <text x=\"340\" y=\"192\" text-anchor=\"middle\" fill=\"#f5576c\" font-size=\"8.5\" font-weight=\"bold\" font-family=\"monospace\">Text / speech</text>\n  <text x=\"340\" y=\"204\" text-anchor=\"middle\" fill=\"#f5576c\" font-size=\"8.5\" font-family=\"monospace\">Time series</text>\n  <text x=\"340\" y=\"216\" text-anchor=\"middle\" fill=\"#f5576c\" font-size=\"8.5\" font-family=\"monospace\">Language models</text>\n\n  <!-- LSTM -->\n  <rect x=\"415\" y=\"28\" width=\"115\" height=\"205\" fill=\"rgba(139,92,246,0.06)\" stroke=\"rgba(139,92,246,0.28)\" rx=\"7\"/>\n  <text x=\"472\" y=\"45\" text-anchor=\"middle\" fill=\"#C4B5FD\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">LSTM</text>\n  <text x=\"472\" y=\"57\" text-anchor=\"middle\" fill=\"rgba(196,181,253,0.6)\" font-size=\"8\" font-family=\"monospace\">Long Short-Term</text>\n  <!-- LSTM cell with gates -->\n  <rect x=\"425\" y=\"65\" width=\"95\" height=\"75\" fill=\"rgba(139,92,246,0.12)\" stroke=\"rgba(139,92,246,0.4)\" rx=\"6\"/>\n  <text x=\"472\" y=\"80\" text-anchor=\"middle\" fill=\"#C4B5FD\" font-size=\"8.5\" font-weight=\"bold\" font-family=\"monospace\">Memory Cell</text>\n  <rect x=\"430\" y=\"85\" width=\"25\" height=\"14\" fill=\"rgba(245,87,108,0.3)\" stroke=\"rgba(245,87,108,0.5)\" rx=\"2\"/>\n  <text x=\"442\" y=\"94\" text-anchor=\"middle\" fill=\"#f5576c\" font-size=\"7.5\" font-family=\"monospace\">forget</text>\n  <rect x=\"460\" y=\"85\" width=\"20\" height=\"14\" fill=\"rgba(67,233,123,0.3)\" stroke=\"rgba(67,233,123,0.5)\" rx=\"2\"/>\n  <text x=\"470\" y=\"94\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"7.5\" font-family=\"monospace\">input</text>\n  <rect x=\"485\" y=\"85\" width=\"25\" height=\"14\" fill=\"rgba(79,172,254,0.3)\" stroke=\"rgba(79,172,254,0.5)\" rx=\"2\"/>\n  <text x=\"497\" y=\"94\" text-anchor=\"middle\" fill=\"#4facfe\" font-size=\"7.5\" font-family=\"monospace\">output</text>\n  <text x=\"472\" y=\"114\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.5)\" font-size=\"7.5\" font-family=\"monospace\">3 gates control</text>\n  <text x=\"472\" y=\"124\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.5)\" font-size=\"7.5\" font-family=\"monospace\">memory flow</text>\n  <text x=\"472\" y=\"152\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.5)\" font-size=\"8\" font-family=\"monospace\">Solves vanishing</text>\n  <text x=\"472\" y=\"162\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.5)\" font-size=\"8\" font-family=\"monospace\">gradient problem</text>\n  <text x=\"472\" y=\"192\" text-anchor=\"middle\" fill=\"#C4B5FD\" font-size=\"8.5\" font-weight=\"bold\" font-family=\"monospace\">Long sequences</text>\n  <text x=\"472\" y=\"204\" text-anchor=\"middle\" fill=\"#C4B5FD\" font-size=\"8.5\" font-family=\"monospace\">Stock prediction</text>\n  <text x=\"472\" y=\"216\" text-anchor=\"middle\" fill=\"#C4B5FD\" font-size=\"8.5\" font-family=\"monospace\">NLP / ChatGPT base</text>\n  <!-- Defs -->\n  <defs>\n    <marker id=\"arr_r\" markerWidth=\"6\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\"><polygon points=\"0 0,6 2.5,0 5\" fill=\"#f5576c\"/></marker>\n    <marker id=\"arr_w\" markerWidth=\"6\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\"><polygon points=\"0 0,6 2.5,0 5\" fill=\"rgba(255,255,255,0.5)\"/></marker>\n  </defs>\n  <!-- Bottom -->\n  <text x=\"270\" y=\"244\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.45)\" font-size=\"9.5\" font-family=\"monospace\">Rule of thumb: Tabular → MLP   |   Images → CNN   |   Sequences/Text → LSTM/Transformer</text>\n</svg>"}, {"label": "Build with Keras", "html": "<div class=\"section-tag\">Code</div><div class=\"slide-heading\">Building Neural Networks with Keras 🔧</div><div class=\"two-col\" style=\"margin-bottom:8px;\"><div><strong>Keras key components:</strong><br>• <code>Sequential</code> — linear stack of layers<br>• <code>Dense</code> — fully connected layer (every neuron connects to all in next layer)<br>• <code>Dropout</code> — randomly zeros X% of neurons each step → prevents overfitting<br>• <code>compile()</code> — choose optimiser + loss + metrics<br>• <code>fit()</code> — trains the model<br>• <code>evaluate()</code> — test set performance</div><div><strong>Optimiser choices:</strong><br>• <code>adam</code> — adaptive learning rate, best default<br>• <code>sgd</code> — classic, needs tuned lr<br><br><strong>Loss function:</strong><br>• Binary → <code>binary_crossentropy</code><br>• Multi-class → <code>sparse_categorical_crossentropy</code><br>• Regression → <code>mse</code> or <code>mae</code><br><br><strong>Callbacks:</strong><br>• <code>EarlyStopping</code> — stop when val_loss stops improving<br>• <code>ModelCheckpoint</code> — save best weights</div></div><div class=\"code-wrap\"><div class=\"code-header\"><span>keras_neural_net.py</span><span>python</span></div><pre><span class=\"kw\">import</span> tensorflow <span class=\"kw\">as</span> tf\n<span class=\"kw\">from</span> tensorflow <span class=\"kw\">import</span> keras\n<span class=\"kw\">from</span> tensorflow.keras <span class=\"kw\">import</span> layers\n<span class=\"kw\">from</span> sklearn.preprocessing <span class=\"kw\">import</span> StandardScaler\n<span class=\"kw\">from</span> sklearn.model_selection <span class=\"kw\">import</span> train_test_split\n\n<span class=\"cm\"># Scale features — ESSENTIAL for neural networks</span>\nscaler = StandardScaler()\nX_train_s = scaler.fit_transform(X_train)\nX_test_s  = scaler.transform(X_test)\n\n<span class=\"cm\"># Build model</span>\nmodel = keras.Sequential([\n    layers.Dense(<span class=\"nm\">128</span>, activation=<span class=\"st\">\"relu\"</span>, input_shape=(X_train_s.shape[<span class=\"nm\">1</span>],)),\n    layers.Dropout(<span class=\"nm\">0.3</span>),          <span class=\"cm\"># drops 30% neurons → reduces overfitting</span>\n    layers.Dense(<span class=\"nm\">64</span>,  activation=<span class=\"st\">\"relu\"</span>),\n    layers.Dropout(<span class=\"nm\">0.2</span>),\n    layers.Dense(<span class=\"nm\">1</span>,   activation=<span class=\"st\">\"sigmoid\"</span>)  <span class=\"cm\"># binary: spam or not</span>\n])\n\n<span class=\"cm\"># Compile</span>\nmodel.compile(\n    optimizer=<span class=\"st\">\"adam\"</span>,\n    loss=<span class=\"st\">\"binary_crossentropy\"</span>,\n    metrics=[<span class=\"st\">\"accuracy\"</span>]\n)\n\n<span class=\"cm\"># Train with early stopping</span>\ncallbacks = [\n    keras.callbacks.EarlyStopping(patience=<span class=\"nm\">10</span>, restore_best_weights=<span class=\"kw\">True</span>)\n]\nhist = model.fit(\n    X_train_s, y_train,\n    validation_split=<span class=\"nm\">0.2</span>,\n    epochs=<span class=\"nm\">100</span>,\n    batch_size=<span class=\"nm\">32</span>,\n    callbacks=callbacks,\n    verbose=<span class=\"nm\">1</span>\n)\n\n<span class=\"cm\"># Evaluate</span>\nloss, acc = model.evaluate(X_test_s, y_test)\n<span class=\"fn\">print</span>(<span class=\"st\">f\"Test accuracy: {acc:.2%}\"</span>)\nmodel.summary()   <span class=\"cm\"># shows layer shapes and param counts</span></pre></div>"}, {"label": "Overfitting & Dropout", "html": "<div class=\"section-tag\">Common Problem</div><div class=\"slide-heading\">Overfitting in Neural Networks — and How to Fight It 🛡️</div><div class=\"cards cards-3\" style=\"margin-bottom:10px;\"><div class=\"card card-accent\"><h3>What is overfitting?</h3><p>Train accuracy 99%, val accuracy 72% — the model memorised training data but can't generalise. Neural networks with many parameters are especially prone to this.</p></div><div class=\"card card-accent\"><h3>Dropout</h3><p>Each training step, randomly zero out <em>p</em>% of neuron activations. Forces network to learn <strong>redundant representations</strong> — like training with noise. At inference time all neurons are used.</p></div><div class=\"card card-accent\"><h3>L2 Regularisation</h3><p>Add a penalty for large weights: <code>loss += λ × Σw²</code>. Same idea as Ridge regression. Use <code>kernel_regularizer=l2(0.01)</code> in Keras Dense layers.</p></div></div><div class=\"code-wrap\"><div class=\"code-header\"><span>overfitting.py</span><span>python</span></div><pre><span class=\"kw\">import</span> matplotlib.pyplot <span class=\"kw\">as</span> plt\n<span class=\"kw\">from</span> tensorflow.keras <span class=\"kw\">import</span> regularizers\n\n<span class=\"cm\"># Model with regularisation</span>\nmodel = keras.Sequential([\n    layers.Dense(<span class=\"nm\">128</span>, activation=<span class=\"st\">\"relu\"</span>,\n                 kernel_regularizer=regularizers.l2(<span class=\"nm\">0.001</span>)),\n    layers.Dropout(<span class=\"nm\">0.4</span>),\n    layers.Dense(<span class=\"nm\">64</span>,  activation=<span class=\"st\">\"relu\"</span>),\n    layers.Dropout(<span class=\"nm\">0.3</span>),\n    layers.Dense(<span class=\"nm\">1</span>,   activation=<span class=\"st\">\"sigmoid\"</span>)\n])\n\n<span class=\"cm\"># Plot training history — spot overfitting visually</span>\nplt.figure(figsize=(<span class=\"nm\">12</span>, <span class=\"nm\">4</span>))\n\nplt.subplot(<span class=\"nm\">1</span>, <span class=\"nm\">2</span>, <span class=\"nm\">1</span>)\nplt.plot(hist.history[<span class=\"st\">\"loss\"</span>],     label=<span class=\"st\">\"Train Loss\"</span>)\nplt.plot(hist.history[<span class=\"st\">\"val_loss\"</span>], label=<span class=\"st\">\"Val Loss\"</span>)\nplt.legend(); plt.title(<span class=\"st\">\"Loss Curves\"</span>)\n<span class=\"cm\"># Healthy: both curves fall and converge</span>\n<span class=\"cm\"># Overfitting: train keeps falling, val rises</span>\n\nplt.subplot(<span class=\"nm\">1</span>, <span class=\"nm\">2</span>, <span class=\"nm\">2</span>)\nplt.plot(hist.history[<span class=\"st\">\"accuracy\"</span>],     label=<span class=\"st\">\"Train Acc\"</span>)\nplt.plot(hist.history[<span class=\"st\">\"val_accuracy\"</span>], label=<span class=\"st\">\"Val Acc\"</span>)\nplt.legend(); plt.title(<span class=\"st\">\"Accuracy Curves\"</span>)\nplt.tight_layout(); plt.show()</pre></div><div class=\"tip\">💡 Rule: if val_loss stops improving but train_loss keeps falling → you are overfitting. Add Dropout, reduce model size, or add more data.</div>"}, {"label": "Overfit vs Underfit — Visualised", "html": "<div class=\"section-tag\">Critical Concept</div><div class=\"slide-heading\">Underfit vs Good Fit vs Overfit — Visualised 🎯</div><div class=\"cards cards-3\" style=\"margin-bottom:8px;\"><div class=\"card card-accent\"><h3>🟡 Underfit (High Bias)</h3><p>Model is <strong>too simple</strong> — a straight line through curved data. Both train AND val accuracy are low and similar. The model never learned the pattern. Fix: use a more complex model or add features.</p></div><div class=\"card card-accent\"><h3>✅ Good Fit</h3><p>Model captures the real pattern. Train and val accuracy are both high and <strong>close to each other</strong> (small gap). Generalises well to new data. This is what we always aim for.</p></div><div class=\"card card-accent\"><h3>🔴 Overfit (High Variance)</h3><p>Model is <strong>too complex</strong> — memorised every training example including noise. Train acc is very high, val acc is much lower (<strong>large gap</strong>). Fix: Dropout, L2, more data, fewer layers.</p></div></div><svg viewBox=\"0 0 560 270\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:560px;display:block;margin:4px auto;\">\n  <rect width=\"560\" height=\"270\" fill=\"rgba(0,0,0,0.45)\" rx=\"10\"/>\n  <text x=\"280\" y=\"19\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"13\" font-weight=\"bold\" font-family=\"monospace\">Underfit vs Good Fit vs Overfit</text>\n\n  <!-- === PANEL 1: UNDERFIT === -->\n  <rect x=\"8\" y=\"28\" width=\"172\" height=\"195\" fill=\"rgba(255,209,102,0.05)\" stroke=\"rgba(255,209,102,0.3)\" rx=\"8\"/>\n  <text x=\"94\" y=\"46\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"11\" font-weight=\"bold\" font-family=\"monospace\">Underfit</text>\n  <text x=\"94\" y=\"58\" text-anchor=\"middle\" fill=\"rgba(255,209,102,0.6)\" font-size=\"8.5\" font-family=\"monospace\">(High Bias)</text>\n  <!-- Axes -->\n  <line x1=\"22\" y1=\"190\" x2=\"172\" y2=\"190\" stroke=\"rgba(255,255,255,0.2)\" stroke-width=\"1\"/>\n  <line x1=\"22\" y1=\"70\"  x2=\"22\"  y2=\"190\" stroke=\"rgba(255,255,255,0.2)\" stroke-width=\"1\"/>\n  <!-- Data points (curved pattern) -->\n  <circle cx=\"35\"  cy=\"175\" r=\"4\" fill=\"rgba(79,172,254,0.8)\"/>\n  <circle cx=\"50\"  cy=\"155\" r=\"4\" fill=\"rgba(79,172,254,0.8)\"/>\n  <circle cx=\"65\"  cy=\"130\" r=\"4\" fill=\"rgba(79,172,254,0.8)\"/>\n  <circle cx=\"80\"  cy=\"112\" r=\"4\" fill=\"rgba(79,172,254,0.8)\"/>\n  <circle cx=\"95\"  cy=\"105\" r=\"4\" fill=\"rgba(79,172,254,0.8)\"/>\n  <circle cx=\"110\" cy=\"115\" r=\"4\" fill=\"rgba(79,172,254,0.8)\"/>\n  <circle cx=\"125\" cy=\"132\" r=\"4\" fill=\"rgba(79,172,254,0.8)\"/>\n  <circle cx=\"140\" cy=\"155\" r=\"4\" fill=\"rgba(79,172,254,0.8)\"/>\n  <circle cx=\"158\" cy=\"178\" r=\"4\" fill=\"rgba(79,172,254,0.8)\"/>\n  <!-- Underfit model: just a horizontal line (misses curve entirely) -->\n  <line x1=\"22\" y1=\"138\" x2=\"172\" y2=\"138\" stroke=\"#FFD166\" stroke-width=\"2.5\"/>\n  <!-- Error lines (large) -->\n  <line x1=\"35\"  y1=\"175\" x2=\"35\"  y2=\"138\" stroke=\"rgba(245,87,108,0.5)\" stroke-width=\"1.5\"/>\n  <line x1=\"80\"  y1=\"112\" x2=\"80\"  y2=\"138\" stroke=\"rgba(245,87,108,0.5)\" stroke-width=\"1.5\"/>\n  <line x1=\"95\"  y1=\"105\" x2=\"95\"  y2=\"138\" stroke=\"rgba(245,87,108,0.5)\" stroke-width=\"1.5\"/>\n  <line x1=\"158\" y1=\"178\" x2=\"158\" y2=\"138\" stroke=\"rgba(245,87,108,0.5)\" stroke-width=\"1.5\"/>\n  <text x=\"94\" y=\"207\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"9\" font-family=\"monospace\">Model too simple</text>\n  <text x=\"94\" y=\"218\" text-anchor=\"middle\" fill=\"rgba(255,209,102,0.6)\" font-size=\"8.5\" font-family=\"monospace\">Misses the real pattern</text>\n  <!-- Scores -->\n  <rect x=\"18\" y=\"223\" width=\"154\" height=\"28\" fill=\"rgba(255,209,102,0.08)\" stroke=\"rgba(255,209,102,0.2)\" rx=\"4\"/>\n  <text x=\"95\" y=\"234\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.6)\" font-size=\"8.5\" font-family=\"monospace\">Train acc: 55%</text>\n  <text x=\"95\" y=\"245\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.6)\" font-size=\"8.5\" font-family=\"monospace\">Val acc:   53%</text>\n\n  <!-- === PANEL 2: GOOD FIT === -->\n  <rect x=\"194\" y=\"28\" width=\"172\" height=\"195\" fill=\"rgba(67,233,123,0.05)\" stroke=\"rgba(67,233,123,0.3)\" rx=\"8\"/>\n  <text x=\"280\" y=\"46\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"11\" font-weight=\"bold\" font-family=\"monospace\">Good Fit</text>\n  <text x=\"280\" y=\"58\" text-anchor=\"middle\" fill=\"rgba(67,233,123,0.6)\" font-size=\"8.5\" font-family=\"monospace\">(Just Right) ✅</text>\n  <!-- Axes -->\n  <line x1=\"208\" y1=\"190\" x2=\"358\" y2=\"190\" stroke=\"rgba(255,255,255,0.2)\" stroke-width=\"1\"/>\n  <line x1=\"208\" y1=\"70\"  x2=\"208\" y2=\"190\" stroke=\"rgba(255,255,255,0.2)\" stroke-width=\"1\"/>\n  <!-- Same data points -->\n  <circle cx=\"221\" cy=\"175\" r=\"4\" fill=\"rgba(79,172,254,0.8)\"/>\n  <circle cx=\"236\" cy=\"155\" r=\"4\" fill=\"rgba(79,172,254,0.8)\"/>\n  <circle cx=\"251\" cy=\"130\" r=\"4\" fill=\"rgba(79,172,254,0.8)\"/>\n  <circle cx=\"266\" cy=\"112\" r=\"4\" fill=\"rgba(79,172,254,0.8)\"/>\n  <circle cx=\"281\" cy=\"105\" r=\"4\" fill=\"rgba(79,172,254,0.8)\"/>\n  <circle cx=\"296\" cy=\"115\" r=\"4\" fill=\"rgba(79,172,254,0.8)\"/>\n  <circle cx=\"311\" cy=\"132\" r=\"4\" fill=\"rgba(79,172,254,0.8)\"/>\n  <circle cx=\"326\" cy=\"155\" r=\"4\" fill=\"rgba(79,172,254,0.8)\"/>\n  <circle cx=\"344\" cy=\"178\" r=\"4\" fill=\"rgba(79,172,254,0.8)\"/>\n  <!-- Good fit curve (smooth parabola approximation) -->\n  <path d=\"M 213 178 Q 236 145 251 128 Q 266 110 281 105 Q 296 110 311 128 Q 326 148 344 178\" fill=\"none\" stroke=\"#43e97b\" stroke-width=\"2.5\"/>\n  <!-- Small residuals -->\n  <line x1=\"221\" cy=\"175\" x1=\"221\" y1=\"175\" x2=\"221\" y2=\"172\" stroke=\"rgba(245,87,108,0.4)\" stroke-width=\"1\"/>\n  <line x1=\"251\" y1=\"130\" x2=\"251\" y2=\"128\" stroke=\"rgba(245,87,108,0.4)\" stroke-width=\"1\"/>\n  <text x=\"280\" y=\"207\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"9\" font-family=\"monospace\">Model captures pattern</text>\n  <text x=\"280\" y=\"218\" text-anchor=\"middle\" fill=\"rgba(67,233,123,0.6)\" font-size=\"8.5\" font-family=\"monospace\">Generalises to new data</text>\n  <rect x=\"204\" y=\"223\" width=\"154\" height=\"28\" fill=\"rgba(67,233,123,0.08)\" stroke=\"rgba(67,233,123,0.2)\" rx=\"4\"/>\n  <text x=\"281\" y=\"234\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.6)\" font-size=\"8.5\" font-family=\"monospace\">Train acc: 88%</text>\n  <text x=\"281\" y=\"245\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.6)\" font-size=\"8.5\" font-family=\"monospace\">Val acc:   86%  ✅</text>\n\n  <!-- === PANEL 3: OVERFIT === -->\n  <rect x=\"380\" y=\"28\" width=\"172\" height=\"195\" fill=\"rgba(245,87,108,0.05)\" stroke=\"rgba(245,87,108,0.3)\" rx=\"8\"/>\n  <text x=\"466\" y=\"46\" text-anchor=\"middle\" fill=\"#f5576c\" font-size=\"11\" font-weight=\"bold\" font-family=\"monospace\">Overfit</text>\n  <text x=\"466\" y=\"58\" text-anchor=\"middle\" fill=\"rgba(245,87,108,0.6)\" font-size=\"8.5\" font-family=\"monospace\">(High Variance)</text>\n  <!-- Axes -->\n  <line x1=\"394\" y1=\"190\" x2=\"544\" y2=\"190\" stroke=\"rgba(255,255,255,0.2)\" stroke-width=\"1\"/>\n  <line x1=\"394\" y1=\"70\"  x2=\"394\" y2=\"190\" stroke=\"rgba(255,255,255,0.2)\" stroke-width=\"1\"/>\n  <!-- Same data points -->\n  <circle cx=\"407\" cy=\"175\" r=\"4\" fill=\"rgba(79,172,254,0.8)\"/>\n  <circle cx=\"422\" cy=\"155\" r=\"4\" fill=\"rgba(79,172,254,0.8)\"/>\n  <circle cx=\"437\" cy=\"130\" r=\"4\" fill=\"rgba(79,172,254,0.8)\"/>\n  <circle cx=\"452\" cy=\"112\" r=\"4\" fill=\"rgba(79,172,254,0.8)\"/>\n  <circle cx=\"467\" cy=\"105\" r=\"4\" fill=\"rgba(79,172,254,0.8)\"/>\n  <circle cx=\"482\" cy=\"115\" r=\"4\" fill=\"rgba(79,172,254,0.8)\"/>\n  <circle cx=\"497\" cy=\"132\" r=\"4\" fill=\"rgba(79,172,254,0.8)\"/>\n  <circle cx=\"512\" cy=\"155\" r=\"4\" fill=\"rgba(79,172,254,0.8)\"/>\n  <circle cx=\"530\" cy=\"178\" r=\"4\" fill=\"rgba(79,172,254,0.8)\"/>\n  <!-- Overfit: wiggly curve that passes through every point -->\n  <path d=\"M 399 175 Q 407 175 407 175 Q 414 165 422 155 Q 428 140 437 130 Q 443 115 452 112 Q 458 108 467 105 Q 474 110 482 115 Q 487 125 497 132 Q 504 145 512 155 Q 521 165 530 178\" fill=\"none\" stroke=\"#f5576c\" stroke-width=\"2.5\"/>\n  <!-- Extra wiggles -->\n  <path d=\"M 407 175 Q 410 185 415 178 Q 420 168 422 155\" fill=\"none\" stroke=\"#f5576c\" stroke-width=\"2.5\"/>\n  <path d=\"M 452 112 Q 456 95 462 100 Q 466 107 467 105\" fill=\"none\" stroke=\"#f5576c\" stroke-width=\"2.5\"/>\n  <text x=\"466\" y=\"207\" text-anchor=\"middle\" fill=\"#f5576c\" font-size=\"9\" font-family=\"monospace\">Memorised training data</text>\n  <text x=\"466\" y=\"218\" text-anchor=\"middle\" fill=\"rgba(245,87,108,0.6)\" font-size=\"8.5\" font-family=\"monospace\">Fails on new data</text>\n  <rect x=\"390\" y=\"223\" width=\"154\" height=\"28\" fill=\"rgba(245,87,108,0.08)\" stroke=\"rgba(245,87,108,0.2)\" rx=\"4\"/>\n  <text x=\"467\" y=\"234\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.6)\" font-size=\"8.5\" font-family=\"monospace\">Train acc: 99%</text>\n  <text x=\"467\" y=\"245\" text-anchor=\"middle\" fill=\"#f5576c\" font-size=\"8.5\" font-family=\"monospace\">Val acc:   62%  ❌</text>\n\n  <!-- Bottom label -->\n  <text x=\"280\" y=\"261\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.4)\" font-size=\"9.5\" font-family=\"monospace\">Gap between train &amp; val accuracy = how much the model is overfitting</text>\n</svg>"}, {"label": "Reading Training Curves", "html": "<div class=\"section-tag\">Diagnosis Tool</div><div class=\"slide-heading\">Reading Training Curves — Know What's Happening During Training 📉</div><div class=\"two-col\" style=\"margin-bottom:8px;\"><div><strong>What to look for (train vs val loss):</strong><br>• Both high and flat → <strong>underfitting</strong> — model not learning<br>• Both falling and converging → <strong>good fit</strong> — keep training<br>• Train falls, val rises → <strong>overfitting</strong> — stop here!<br><br><strong>EarlyStopping saves the best weights</strong> automatically at the val loss minimum — no manual watching needed.</div><div><strong>Common fixes:</strong><br><br>🟡 If underfitting:<br>• Add layers or neurons<br>• Reduce dropout<br>• Train longer<br>• Add more features<br><br>🔴 If overfitting:<br>• Add <code>Dropout(0.3-0.5)</code><br>• Add L2 regularisation<br>• Reduce model size<br>• Get more training data<br>• Use <code>EarlyStopping</code></div></div><svg viewBox=\"0 0 560 230\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:560px;display:block;margin:4px auto;\">\n  <rect width=\"560\" height=\"230\" fill=\"rgba(0,0,0,0.45)\" rx=\"10\"/>\n  <text x=\"280\" y=\"18\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"12\" font-weight=\"bold\" font-family=\"monospace\">Loss Curves — How to Spot Overfit &amp; Underfit During Training</text>\n\n  <!-- === LEFT: Underfitting curves === -->\n  <rect x=\"8\" y=\"26\" width=\"170\" height=\"165\" fill=\"rgba(255,209,102,0.04)\" stroke=\"rgba(255,209,102,0.25)\" rx=\"7\"/>\n  <text x=\"93\" y=\"42\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">Underfitting</text>\n  <!-- Axes -->\n  <line x1=\"22\" y1=\"170\" x2=\"170\" y2=\"170\" stroke=\"rgba(255,255,255,0.2)\" stroke-width=\"1\"/>\n  <line x1=\"22\" y1=\"50\"  x2=\"22\"  y2=\"170\" stroke=\"rgba(255,255,255,0.2)\" stroke-width=\"1\"/>\n  <text x=\"96\"  y=\"182\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.3)\" font-size=\"8\" font-family=\"monospace\">Epochs</text>\n  <text x=\"13\"  y=\"115\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.3)\" font-size=\"8\" font-family=\"monospace\" transform=\"rotate(-90,13,115)\">Loss</text>\n  <!-- Train loss: stays HIGH and flat (barely learns) -->\n  <path d=\"M 25 140 Q 60 135 100 132 Q 140 130 168 129\" fill=\"none\" stroke=\"#FFD166\" stroke-width=\"2\"/>\n  <!-- Val loss: same, stays high -->\n  <path d=\"M 25 145 Q 60 141 100 138 Q 140 136 168 135\" fill=\"none\" stroke=\"rgba(255,209,102,0.45)\" stroke-width=\"2\" stroke-dasharray=\"5,3\"/>\n  <!-- Labels -->\n  <text x=\"140\" y=\"124\" fill=\"#FFD166\" font-size=\"8.5\" font-family=\"monospace\">train</text>\n  <text x=\"140\" y=\"130\" fill=\"rgba(255,209,102,0.5)\" font-size=\"8.5\" font-family=\"monospace\">val</text>\n  <text x=\"93\" y=\"155\" text-anchor=\"middle\" fill=\"rgba(255,209,102,0.8)\" font-size=\"8.5\" font-family=\"monospace\">Both losses stay HIGH</text>\n  <text x=\"93\" y=\"166\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.4)\" font-size=\"8\" font-family=\"monospace\">Model not learning at all</text>\n\n  <!-- === MIDDLE: Good fit curves === -->\n  <rect x=\"195\" y=\"26\" width=\"170\" height=\"165\" fill=\"rgba(67,233,123,0.04)\" stroke=\"rgba(67,233,123,0.25)\" rx=\"7\"/>\n  <text x=\"280\" y=\"42\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">Good Fit  ✅</text>\n  <line x1=\"209\" y1=\"170\" x2=\"357\" y2=\"170\" stroke=\"rgba(255,255,255,0.2)\" stroke-width=\"1\"/>\n  <line x1=\"209\" y1=\"50\"  x2=\"209\" y2=\"170\" stroke=\"rgba(255,255,255,0.2)\" stroke-width=\"1\"/>\n  <text x=\"283\"  y=\"182\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.3)\" font-size=\"8\" font-family=\"monospace\">Epochs</text>\n  <!-- Train loss: falls and levels off -->\n  <path d=\"M 212 145 Q 240 110 265 88 Q 290 76 320 72 Q 340 71 355 70\" fill=\"none\" stroke=\"#43e97b\" stroke-width=\"2\"/>\n  <!-- Val loss: slightly higher but tracks train closely -->\n  <path d=\"M 212 148 Q 240 115 265 95 Q 290 84 320 80 Q 340 79 355 78\" fill=\"none\" stroke=\"rgba(67,233,123,0.5)\" stroke-width=\"2\" stroke-dasharray=\"5,3\"/>\n  <text x=\"330\" y=\"66\" fill=\"#43e97b\" font-size=\"8.5\" font-family=\"monospace\">train</text>\n  <text x=\"330\" y=\"75\" fill=\"rgba(67,233,123,0.5)\" font-size=\"8.5\" font-family=\"monospace\">val</text>\n  <text x=\"280\" y=\"155\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"8.5\" font-family=\"monospace\">Both fall &amp; converge</text>\n  <text x=\"280\" y=\"166\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.4)\" font-size=\"8\" font-family=\"monospace\">Learning &amp; generalising!</text>\n\n  <!-- === RIGHT: Overfitting curves === -->\n  <rect x=\"382\" y=\"26\" width=\"170\" height=\"165\" fill=\"rgba(245,87,108,0.04)\" stroke=\"rgba(245,87,108,0.25)\" rx=\"7\"/>\n  <text x=\"467\" y=\"42\" text-anchor=\"middle\" fill=\"#f5576c\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">Overfitting</text>\n  <line x1=\"396\" y1=\"170\" x2=\"544\" y2=\"170\" stroke=\"rgba(255,255,255,0.2)\" stroke-width=\"1\"/>\n  <line x1=\"396\" y1=\"50\"  x2=\"396\" y2=\"170\" stroke=\"rgba(255,255,255,0.2)\" stroke-width=\"1\"/>\n  <text x=\"470\"  y=\"182\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.3)\" font-size=\"8\" font-family=\"monospace\">Epochs</text>\n  <!-- Train loss: keeps falling steeply -->\n  <path d=\"M 399 148 Q 420 115 440 90 Q 460 72 480 60 Q 500 52 540 46\" fill=\"none\" stroke=\"#43e97b\" stroke-width=\"2\"/>\n  <!-- Val loss: falls then RISES (the key signal!) -->\n  <path d=\"M 399 150 Q 418 120 436 100 Q 454 90 468 92 Q 488 98 510 112 Q 525 122 540 134\" fill=\"none\" stroke=\"#f5576c\" stroke-width=\"2.5\"/>\n  <!-- Divergence callout -->\n  <line x1=\"468\" y1=\"92\" x2=\"468\" y2=\"170\" stroke=\"rgba(255,209,102,0.4)\" stroke-width=\"1.5\" stroke-dasharray=\"3,3\"/>\n  <text x=\"470\" y=\"105\" fill=\"#FFD166\" font-size=\"8\" font-family=\"monospace\">↑ val loss starts</text>\n  <text x=\"470\" y=\"115\" fill=\"#FFD166\" font-size=\"8\" font-family=\"monospace\">  rising here!</text>\n  <text x=\"510\" y=\"42\" fill=\"#43e97b\" font-size=\"8.5\" font-family=\"monospace\">train</text>\n  <text x=\"510\" y=\"110\" fill=\"#f5576c\" font-size=\"8.5\" font-family=\"monospace\">val</text>\n  <text x=\"467\" y=\"155\" text-anchor=\"middle\" fill=\"#f5576c\" font-size=\"8.5\" font-family=\"monospace\">Val loss rises = memorising</text>\n  <text x=\"467\" y=\"166\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.4)\" font-size=\"8\" font-family=\"monospace\">Stop training at the dip!</text>\n\n  <!-- Bottom legend -->\n  <line x1=\"20\" y1=\"208\" x2=\"50\" y2=\"208\" stroke=\"#43e97b\" stroke-width=\"2\"/>\n  <text x=\"55\" y=\"212\" fill=\"rgba(255,255,255,0.5)\" font-size=\"9\" font-family=\"monospace\">Train loss</text>\n  <line x1=\"140\" y1=\"208\" x2=\"170\" y2=\"208\" stroke=\"#f5576c\" stroke-width=\"2.5\"/>\n  <text x=\"175\" y=\"212\" fill=\"rgba(255,255,255,0.5)\" font-size=\"9\" font-family=\"monospace\">Val loss</text>\n  <text x=\"360\" y=\"212\" fill=\"rgba(255,255,255,0.5)\" font-size=\"9\" font-family=\"monospace\">EarlyStopping saves the best weights at the val loss dip automatically</text>\n</svg><div class=\"code-wrap\" style=\"margin-top:6px;\"><div class=\"code-header\"><span>read_curves.py</span><span>python</span></div><pre><span class=\"kw\">import</span> matplotlib.pyplot <span class=\"kw\">as</span> plt\n\nhist = model.fit(X_train_s, y_train, validation_split=<span class=\"nm\">0.2</span>, epochs=<span class=\"nm\">100</span>, ...)\n\nplt.figure(figsize=(<span class=\"nm\">12</span>, <span class=\"nm\">4</span>))\n\n<span class=\"cm\"># Loss curves — most important plot</span>\nplt.subplot(<span class=\"nm\">1</span>, <span class=\"nm\">2</span>, <span class=\"nm\">1</span>)\nplt.plot(hist.history[<span class=\"st\">\"loss\"</span>],     label=<span class=\"st\">\"Train\"</span>, color=<span class=\"st\">\"#43e97b\"</span>)\nplt.plot(hist.history[<span class=\"st\">\"val_loss\"</span>], label=<span class=\"st\">\"Val\"</span>,   color=<span class=\"st\">\"#f5576c\"</span>)\nplt.xlabel(<span class=\"st\">\"Epoch\"</span>); plt.ylabel(<span class=\"st\">\"Loss\"</span>); plt.legend()\nplt.title(<span class=\"st\">\"Loss — watch for val rising while train falls (overfit)\"</span>)\n\n<span class=\"cm\"># Accuracy curves</span>\nplt.subplot(<span class=\"nm\">1</span>, <span class=\"nm\">2</span>, <span class=\"nm\">2</span>)\
