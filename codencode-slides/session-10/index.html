<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Session 10 — Regression Models</title><style>
:root{--accent:#f97583;--bg:#0f0f1a;--text:#e8e8f0;--muted:#8888aa;--code-bg:#0d1117;--card:#1e2240;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;user-select:none;}
#deck{width:100%;height:100vh;display:flex;flex-direction:column;}
#topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.06);flex-shrink:0;gap:12px;}
#session-label{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--accent);text-transform:uppercase;white-space:nowrap;}
#slide-title-bar{font-size:12px;color:var(--muted);flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#topbar-right{display:flex;gap:8px;align-items:center;flex-shrink:0;}
#counter{font-size:12px;color:var(--muted);white-space:nowrap;}
.btn{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);color:var(--text);border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer;transition:all 0.15s;}
.btn:hover{background:var(--accent);border-color:var(--accent);color:#000;}
#progress-wrap{height:3px;background:rgba(255,255,255,0.05);flex-shrink:0;}
#progress-bar{height:100%;background:var(--accent);transition:width 0.3s ease;}
#slides-wrap{flex:1;position:relative;overflow:hidden;}
.slide{position:absolute;inset:0;display:none;flex-direction:column;padding:32px 48px 24px;overflow-y:auto;animation:fadeIn 0.25s ease;}
.slide.active{display:flex;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
#nav{display:flex;align-items:center;justify-content:center;gap:16px;padding:10px 24px;flex-shrink:0;border-top:1px solid rgba(255,255,255,0.06);}
.nav-btn{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);color:var(--text);padding:7px 26px;border-radius:8px;font-size:14px;cursor:pointer;transition:all 0.15s;}
.nav-btn:hover:not(:disabled){background:var(--accent);border-color:var(--accent);color:#000;}
.nav-btn:disabled{opacity:0.3;cursor:default;}
#dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:600px;}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.2);cursor:pointer;transition:all 0.2s;}
.dot.active{background:var(--accent);transform:scale(1.5);}
.slide-title{align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at 50% 40%,#1e2a4a 0%,#0f0f1a 70%);}
.session-badge{font-size:11px;font-weight:800;letter-spacing:3px;color:var(--accent);text-transform:uppercase;margin-bottom:20px;padding:5px 16px;border:1px solid var(--accent);border-radius:20px;display:inline-block;}
.slide-title h1{font-size:clamp(26px,3.4vw,46px);font-weight:800;line-height:1.15;margin-bottom:16px;background:linear-gradient(135deg,#fff 30%,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;white-space:pre-line;}
.slide-title .sub{font-size:14px;color:var(--muted);max-width:580px;line-height:1.6;margin-bottom:28px;}
.academy-tag{font-size:12px;color:var(--muted);letter-spacing:1px;}
.section-tag{font-size:10px;font-weight:700;letter-spacing:2.5px;color:var(--accent);text-transform:uppercase;margin-bottom:6px;}
.slide-heading{font-size:clamp(17px,2.2vw,28px);font-weight:700;margin-bottom:14px;line-height:1.25;}
.cards{display:grid;gap:11px;}
.cards-2{grid-template-columns:1fr 1fr;}
.cards-3{grid-template-columns:1fr 1fr 1fr;}
.cards-4{grid-template-columns:1fr 1fr 1fr 1fr;}
.card{background:var(--card);border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:14px 16px;}
.card-accent{border-left:3px solid var(--accent);}
.card-icon{font-size:22px;margin-bottom:6px;}
.card h3{font-size:13px;font-weight:700;margin-bottom:4px;color:#fff;}
.card p{font-size:12px;color:var(--muted);line-height:1.55;}
.steps{display:flex;flex-direction:column;gap:9px;}
.step{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:10px;padding:11px 14px;border:1px solid rgba(255,255,255,0.06);}
.step-num{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#000;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.step-body h4{font-size:13px;font-weight:700;margin-bottom:2px;}
.step-body p{font-size:12px;color:var(--muted);line-height:1.5;}
.code-wrap{background:var(--code-bg);border-radius:10px;border:1px solid rgba(255,255,255,0.08);overflow:hidden;margin:8px 0;}
.code-header{background:rgba(255,255,255,0.05);padding:5px 13px;font-size:11px;color:var(--muted);font-family:monospace;display:flex;justify-content:space-between;align-items:center;}
pre{padding:11px 15px;overflow-x:auto;font-family:'Cascadia Code','Fira Code',Consolas,monospace;font-size:12px;line-height:1.7;color:#c9d1d9;}
.kw{color:#ff7b72;}.fn{color:#d2a8ff;}.st{color:#a5d6ff;}.cm{color:#8b949e;font-style:italic;}.nm{color:#79c0ff;}.op{color:#ff9e64;}
.highlight{background:rgba(255,255,255,0.04);border-left:4px solid var(--accent);border-radius:0 8px 8px 0;padding:10px 14px;margin:8px 0;font-size:13px;line-height:1.6;}
.highlight strong{color:var(--accent);}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;flex:1;}
.warn{background:rgba(255,100,50,0.1);border:1px solid rgba(255,100,50,0.3);border-radius:8px;padding:9px 13px;font-size:12px;margin:6px 0;}
.tip{background:rgba(80,220,100,0.1);border:1px solid rgba(80,220,100,0.3);border-radius:8px;padding:9px 13px;font-size:12px;margin:6px 0;}
.roadmap{display:grid;grid-template-columns:1fr 1fr;gap:9px;flex:1;}
.roadmap-item{background:var(--card);border-radius:12px;padding:12px;border:1px solid rgba(255,255,255,0.06);display:flex;gap:9px;align-items:flex-start;}
.rm-num{font-size:18px;font-weight:900;color:var(--accent);opacity:0.4;line-height:1;flex-shrink:0;width:22px;}
.rm-icon{font-size:17px;flex-shrink:0;}
.rm-text h4{font-size:12px;font-weight:700;margin-bottom:2px;}
.rm-text p{font-size:11px;color:var(--muted);line-height:1.5;}
.recap-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;flex:1;}
.recap-item{background:var(--card);border-radius:10px;padding:12px;border-left:3px solid var(--accent);display:flex;gap:8px;align-items:flex-start;}
.recap-icon{font-size:17px;flex-shrink:0;}
.recap-text h4{font-size:13px;font-weight:700;margin-bottom:2px;}
.recap-text p{font-size:11px;color:var(--muted);line-height:1.5;}
.e-list{display:flex;flex-direction:column;gap:8px;}
.e-item{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.55;}
.e-icon{font-size:15px;flex-shrink:0;}
table{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0;}
th{background:rgba(255,255,255,0.06);padding:7px 10px;text-align:left;font-weight:700;color:var(--accent);}
td{padding:6px 10px;border-top:1px solid rgba(255,255,255,0.05);color:var(--muted);}
.slide::-webkit-scrollbar{width:4px;}
.slide::-webkit-scrollbar-track{background:transparent;}
.slide::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:2px;}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:700;margin:2px;}
.tag-green{background:rgba(80,200,80,0.2);color:#50c850;border:1px solid rgba(80,200,80,0.3);}
.tag-blue{background:rgba(80,150,255,0.2);color:#79c0ff;border:1px solid rgba(80,150,255,0.3);}
.tag-orange{background:rgba(255,150,50,0.2);color:#ff9e64;border:1px solid rgba(255,150,50,0.3);}
.big-concept{background:linear-gradient(135deg,#1e2a4a,#1e2240);border:1px solid rgba(249,117,131,0.3);border-radius:14px;padding:20px 24px;margin:10px 0;text-align:center;}
.big-concept .bc-emoji{font-size:36px;margin-bottom:8px;}
.big-concept h2{font-size:20px;font-weight:800;color:#fff;margin-bottom:6px;}
.big-concept p{font-size:13px;color:var(--muted);line-height:1.6;}

@media(max-width:700px){
  body{overflow:auto;}
  #deck{height:auto;min-height:100vh;}
  #slides-wrap{height:auto;min-height:60vh;}
  .slide{position:relative;inset:auto;display:none;padding:16px 16px 12px;}
  .slide.active{display:flex;}
  .cards-2,.cards-3,.cards-4{grid-template-columns:1fr;}
  .two-col,.roadmap,.recap-grid{grid-template-columns:1fr;}
  #session-label{display:none;}
  #slide-title-bar{display:none;}
  pre{font-size:10px;line-height:1.6;}
  .nav-btn{padding:6px 14px;font-size:13px;}
  #dots{max-width:100%;}
  .dot{width:5px;height:5px;}
  .big-concept{padding:14px 16px;}
  .big-concept h2{font-size:16px;}
  .big-concept .bc-emoji{font-size:28px;}
  .slide-heading{font-size:18px;}
  #topbar{padding:8px 12px;gap:6px;}
  #nav{padding:8px 12px;gap:10px;}
  table{font-size:10px;}
  th,td{padding:5px 6px;}
  .card h3{font-size:12px;}
  .card p{font-size:11px;}
  .highlight,.tip,.warn{font-size:11px;}
  .step-body h4{font-size:12px;}
  .step-body p{font-size:11px;}
}
.code-wrap pre,.code-wrap *,.code-wrap{user-select:text !important;-webkit-user-select:text !important;}
</style></head><body>

<div id="topbar"><div id="session-label">Session 10 · codencode Academy</div><div id="slide-title-bar"></div><div id="topbar-right"><span id="counter"></span><button class="btn" onclick="toggleFS()">⛶ Fullscreen</button></div></div>
<div id="progress-wrap"><div id="progress-bar"></div></div>
<div id="slides-wrap"></div>

</div><script>
const SLIDES_DATA = [{"label": "Title", "html": "<div class=\"slide-title\" style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;\"><div class=\"session-badge\">Session 10 of 15</div><div style=\"font-size:48px;margin-bottom:12px;\">🔢</div><h1>Regression Models:<br>Predict Any Number</h1><p class=\"sub\">Linear Regression, Ridge, Lasso, and XGBoost — choose the right tool, interpret the results, and avoid the traps</p><div style=\"display:flex;gap:12px;justify-content:center;margin-top:14px;flex-wrap:wrap;\"><span class=\"tag tag-blue\">Linear Regression</span><span class=\"tag tag-green\">Ridge &amp; Lasso</span><span class=\"tag tag-orange\">XGBoost</span><span class=\"tag tag-blue\">RMSE / R²</span></div><div class=\"academy-tag\" style=\"margin-top:20px;\">codencode Academy · Python + Data Science</div></div>"}, {"label": "What is Regression?", "html": "<div class=\"section-tag\">Foundation</div><div class=\"slide-heading\">What is Regression? 📈</div><div class=\"cards cards-3\" style=\"margin-bottom:10px;\"><div class=\"card card-accent\"><h3>Definition</h3><p>Regression predicts a <strong>continuous number</strong> (any real value). You feed it features (inputs) and it outputs a number. <em>Example: predict house price from size, rooms, location.</em></p></div><div class=\"card card-accent\"><h3>vs Classification</h3><p>Classification predicts a <strong>category</strong> (spam/not spam, 0/1). Regression predicts a <strong>number</strong> ($450,000 or 3.8 stars). Same pipeline — different output type.</p></div><div class=\"card card-accent\"><h3>Loss function</h3><p>The model minimises <strong>MSE</strong> (Mean Squared Error) — the average of squared differences between actual and predicted values. Lower MSE = better model.</p></div></div><svg viewBox=\"0 0 500 220\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:500px;display:block;margin:4px auto;\">\n  <rect width=\"500\" height=\"220\" fill=\"rgba(0,0,0,0.45)\" rx=\"10\"/>\n  <text x=\"250\" y=\"20\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"12\" font-weight=\"bold\" font-family=\"monospace\">Linear Regression — Best Fit Line</text>\n  <!-- Axes -->\n  <line x1=\"50\" y1=\"185\" x2=\"460\" y2=\"185\" stroke=\"rgba(255,255,255,0.3)\" stroke-width=\"1.5\"/>\n  <line x1=\"50\" y1=\"30\" x2=\"50\" y2=\"185\" stroke=\"rgba(255,255,255,0.3)\" stroke-width=\"1.5\"/>\n  <text x=\"250\" y=\"210\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.45)\" font-size=\"10\" font-family=\"monospace\">House Size (sqm)</text>\n  <text x=\"18\" y=\"110\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.45)\" font-size=\"10\" font-family=\"monospace\" transform=\"rotate(-90,18,110)\">Price ($K)</text>\n  <!-- Best fit line: y = 0.38x + 30 (in svg coords) -->\n  <line x1=\"55\" y1=\"170\" x2=\"455\" y2=\"52\" stroke=\"#4facfe\" stroke-width=\"2.5\"/>\n  <!-- Data dots scattered around the line -->\n  <circle cx=\"80\"  cy=\"162\" r=\"5\" fill=\"rgba(67,233,123,0.8)\"/>\n  <circle cx=\"110\" cy=\"155\" r=\"5\" fill=\"rgba(67,233,123,0.8)\"/>\n  <circle cx=\"130\" cy=\"148\" r=\"5\" fill=\"rgba(67,233,123,0.8)\"/>\n  <circle cx=\"160\" cy=\"138\" r=\"5\" fill=\"rgba(67,233,123,0.8)\"/>\n  <circle cx=\"180\" cy=\"130\" r=\"5\" fill=\"rgba(67,233,123,0.8)\"/>\n  <circle cx=\"200\" cy=\"128\" r=\"5\" fill=\"rgba(67,233,123,0.8)\"/>\n  <circle cx=\"220\" cy=\"118\" r=\"5\" fill=\"rgba(67,233,123,0.8)\"/>\n  <circle cx=\"240\" cy=\"122\" r=\"5\" fill=\"rgba(67,233,123,0.8)\"/>\n  <circle cx=\"270\" cy=\"105\" r=\"5\" fill=\"rgba(67,233,123,0.8)\"/>\n  <circle cx=\"300\" cy=\"100\" r=\"5\" fill=\"rgba(67,233,123,0.8)\"/>\n  <circle cx=\"320\" cy=\"90\"  r=\"5\" fill=\"rgba(67,233,123,0.8)\"/>\n  <circle cx=\"350\" cy=\"80\"  r=\"5\" fill=\"rgba(67,233,123,0.8)\"/>\n  <circle cx=\"380\" cy=\"75\"  r=\"5\" fill=\"rgba(67,233,123,0.8)\"/>\n  <circle cx=\"410\" cy=\"65\"  r=\"5\" fill=\"rgba(67,233,123,0.8)\"/>\n  <circle cx=\"440\" cy=\"60\"  r=\"5\" fill=\"rgba(67,233,123,0.8)\"/>\n  <!-- Residual lines (errors) -->\n  <line x1=\"80\"  y1=\"162\" x2=\"80\"  y2=\"168\" stroke=\"rgba(245,87,108,0.6)\" stroke-width=\"1.5\" stroke-dasharray=\"3,2\"/>\n  <line x1=\"160\" y1=\"138\" x2=\"160\" y2=\"148\" stroke=\"rgba(245,87,108,0.6)\" stroke-width=\"1.5\" stroke-dasharray=\"3,2\"/>\n  <line x1=\"300\" y1=\"100\" x2=\"300\" y2=\"107\" stroke=\"rgba(245,87,108,0.6)\" stroke-width=\"1.5\" stroke-dasharray=\"3,2\"/>\n  <line x1=\"410\" y1=\"65\"  x2=\"410\" y2=\"71\"  stroke=\"rgba(245,87,108,0.6)\" stroke-width=\"1.5\" stroke-dasharray=\"3,2\"/>\n  <!-- Equation label -->\n  <text x=\"340\" y=\"135\" fill=\"#FFD166\" font-size=\"12\" font-family=\"monospace\">ŷ = β₀ + β₁x</text>\n  <text x=\"340\" y=\"150\" fill=\"rgba(255,209,102,0.6)\" font-size=\"9\" font-family=\"monospace\">intercept + slope × x</text>\n  <!-- Legend -->\n  <circle cx=\"60\"  cy=\"200\" r=\"4\" fill=\"rgba(67,233,123,0.8)\"/><text x=\"70\" y=\"204\" fill=\"rgba(255,255,255,0.6)\" font-size=\"9\" font-family=\"monospace\">actual data</text>\n  <line x1=\"140\" y1=\"200\" x2=\"165\" y2=\"200\" stroke=\"#4facfe\" stroke-width=\"2\"/><text x=\"170\" y=\"204\" fill=\"rgba(255,255,255,0.6)\" font-size=\"9\" font-family=\"monospace\">best-fit line</text>\n  <line x1=\"240\" y1=\"200\" x2=\"265\" y2=\"200\" stroke=\"rgba(245,87,108,0.6)\" stroke-width=\"1.5\" stroke-dasharray=\"3,2\"/><text x=\"270\" y=\"204\" fill=\"rgba(255,255,255,0.6)\" font-size=\"9\" font-family=\"monospace\">residual (error)</text>\n</svg><div class=\"tip\" style=\"margin-top:6px;\">💡 The best-fit line = the line that minimises the total squared residuals (errors). Residual = actual − predicted. This is called <strong>Ordinary Least Squares (OLS)</strong>.</div>"}, {"label": "Types of Regression", "html": "<div class=\"section-tag\">Overview</div><div class=\"slide-heading\">Regression Models — Which to Use When? 🗺️</div><table><tr><th>Model</th><th>When to Use</th><th>Strengths</th><th>Weakness</th></tr><tr><td>Linear Regression</td><td>Linear relationship, interpretability needed</td><td>Fast, explainable, baseline</td><td>Fails on non-linear data</td></tr><tr><td>Ridge (L2)</td><td>Many correlated features, prevent overfitting</td><td>Shrinks all coefficients</td><td>Doesn't zero out features</td></tr><tr><td>Lasso (L1)</td><td>Feature selection needed</td><td>Forces some coefs to 0</td><td>Can be unstable</td></tr><tr><td>ElasticNet</td><td>Mix of Ridge and Lasso</td><td>Best of both</td><td>Extra hyperparameter</td></tr><tr><td>Random Forest</td><td>Non-linear, many features</td><td>Robust, handles missing</td><td>Slow to train</td></tr><tr><td>XGBoost</td><td>Tabular data, competition winner</td><td>Very accurate, fast</td><td>Many hyperparameters</td></tr><tr><td>Neural Network</td><td>Huge data, complex patterns</td><td>Most powerful</td><td>Needs lots of data, slow</td></tr></table><div class=\"tip\">💡 <strong>Start with Linear Regression as baseline.</strong> If R² &lt; 0.7, try XGBoost. If R² &lt; 0.5, reconsider your features.</div>"}, {"label": "Linear Regression", "html": "<div class=\"section-tag\">Model 1</div><div class=\"slide-heading\">Linear Regression — The Simplest Model 📏</div><div class=\"two-col\" style=\"margin-bottom:8px;\"><div><strong>What it does:</strong> Fits a straight line through data by finding the slope (β₁) and intercept (β₀) that minimises squared errors. Works when the relationship between features and target is roughly linear.<br><br><strong>When to use:</strong> Baseline model first. Interpretable (each coefficient = effect of that feature). Fast to train.<br><br><strong>Weakness:</strong> Fails on non-linear patterns. Sensitive to outliers and correlated features (multicollinearity).</div><div><strong>Key parameters:</strong><br>• <code>fit_intercept=True</code> — include β₀<br>• <code>normalize</code> — use StandardScaler instead<br><br><strong>Key outputs:</strong><br>• <code>.coef_</code> — slope for each feature<br>• <code>.intercept_</code> — y-intercept<br>• <code>.score(X,y)</code> — R² score</div></div><div class=\"code-wrap\"><div class=\"code-header\"><span>linear_regression.py</span><span>python</span></div><pre><span class=\"kw\">from</span> sklearn.linear_model <span class=\"kw\">import</span> LinearRegression\n<span class=\"kw\">from</span> sklearn.preprocessing <span class=\"kw\">import</span> StandardScaler\n<span class=\"kw\">from</span> sklearn.model_selection <span class=\"kw\">import</span> train_test_split\n<span class=\"kw\">from</span> sklearn.metrics <span class=\"kw\">import</span> mean_absolute_error, r2_score\n<span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n\n<span class=\"cm\"># 1. Load & split</span>\ndf = pd.read_csv(<span class=\"st\">\"houses.csv\"</span>)\nX = df.drop(<span class=\"st\">\"price\"</span>, axis=<span class=\"nm\">1</span>)\ny = df[<span class=\"st\">\"price\"</span>]\nX_train, X_test, y_train, y_test = train_test_split(X, y, test_size=<span class=\"nm\">0.2</span>, random_state=<span class=\"nm\">42</span>)\n\n<span class=\"cm\"># 2. Scale (important for Linear Regression!)</span>\nscaler = StandardScaler()\nX_train_s = scaler.fit_transform(X_train)\nX_test_s  = scaler.transform(X_test)\n\n<span class=\"cm\"># 3. Train</span>\nmodel = LinearRegression()\nmodel.fit(X_train_s, y_train)\n\n<span class=\"cm\"># 4. Evaluate</span>\npred = model.predict(X_test_s)\n<span class=\"fn\">print</span>(<span class=\"st\">f\"R²:  {r2_score(y_test, pred):.3f}\"</span>)   <span class=\"cm\"># 1.0 = perfect</span>\n<span class=\"fn\">print</span>(<span class=\"st\">f\"MAE: {mean_absolute_error(y_test, pred):,.0f}\"</span>)\n\n<span class=\"cm\"># 5. Inspect coefficients</span>\n<span class=\"kw\">for</span> feat, coef <span class=\"kw\">in</span> <span class=\"fn\">zip</span>(X.columns, model.coef_):\n    <span class=\"fn\">print</span>(<span class=\"st\">f\"  {feat:20s}  {coef:+.2f}\"</span>)</pre></div>"}, {"label": "Ridge and Lasso", "html": "<div class=\"section-tag\">Regularisation</div>\n<h2 class=\"slide-heading\"></h2>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;flex:1;min-height:0;overflow:hidden;margin-top:6px;\">\n  <div style=\"display:flex;flex-direction:column;gap:8px;min-height:0;overflow:hidden;\">\n    \n    <div style=\"flex:1;overflow:hidden;display:flex;align-items:center;\">\n      <svg viewBox=\"0 0 540 240\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-height:220px;\">\n  <rect width=\"540\" height=\"240\" fill=\"rgba(0,0,0,0.45)\" rx=\"10\"/>\n  <text x=\"270\" y=\"20\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"12\" font-weight=\"bold\" font-family=\"monospace\">Ridge vs Lasso — What Happens to Coefficients</text>\n  <!-- LEFT panel: No regularization -->\n  <rect x=\"10\" y=\"28\" width=\"155\" height=\"170\" fill=\"rgba(255,255,255,0.02)\" stroke=\"rgba(255,255,255,0.1)\" rx=\"7\"/>\n  <text x=\"87\" y=\"46\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.7)\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">No Regularization</text>\n  <text x=\"87\" y=\"58\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.4)\" font-size=\"9\" font-family=\"monospace\">(overfitting risk)</text>\n  <!-- Coefficient bars: some huge -->\n  <rect x=\"22\" y=\"65\" width=\"128\" height=\"12\" fill=\"rgba(245,87,108,0.7)\" rx=\"2\"/>\n  <text x=\"24\" y=\"74\" fill=\"#fff\" font-size=\"8\" font-family=\"monospace\">feat_A  8.7</text>\n  <rect x=\"22\" y=\"82\" width=\"95\" height=\"12\" fill=\"rgba(245,87,108,0.6)\" rx=\"2\"/>\n  <text x=\"24\" y=\"91\" fill=\"#fff\" font-size=\"8\" font-family=\"monospace\">feat_B  6.4</text>\n  <rect x=\"22\" y=\"99\" width=\"110\" height=\"12\" fill=\"rgba(245,87,108,0.6)\" rx=\"2\"/>\n  <text x=\"24\" y=\"108\" fill=\"#fff\" font-size=\"8\" font-family=\"monospace\">feat_C  7.5</text>\n  <rect x=\"22\" y=\"116\" width=\"55\" height=\"12\" fill=\"rgba(245,87,108,0.5)\" rx=\"2\"/>\n  <text x=\"24\" y=\"125\" fill=\"#fff\" font-size=\"8\" font-family=\"monospace\">feat_D  3.7</text>\n  <rect x=\"22\" y=\"133\" width=\"72\" height=\"12\" fill=\"rgba(245,87,108,0.5)\" rx=\"2\"/>\n  <text x=\"24\" y=\"142\" fill=\"#fff\" font-size=\"8\" font-family=\"monospace\">feat_E  4.9</text>\n  <rect x=\"22\" y=\"150\" width=\"40\" height=\"12\" fill=\"rgba(245,87,108,0.4)\" rx=\"2\"/>\n  <text x=\"24\" y=\"159\" fill=\"#fff\" font-size=\"8\" font-family=\"monospace\">feat_F  2.7</text>\n  <text x=\"87\" y=\"185\" text-anchor=\"middle\" fill=\"rgba(245,87,108,0.8)\" font-size=\"9\" font-family=\"monospace\">All features large</text>\n\n  <!-- MIDDLE panel: Ridge -->\n  <rect x=\"192\" y=\"28\" width=\"155\" height=\"170\" fill=\"rgba(79,172,254,0.05)\" stroke=\"rgba(79,172,254,0.25)\" rx=\"7\"/>\n  <text x=\"269\" y=\"46\" text-anchor=\"middle\" fill=\"#4facfe\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">Ridge (L2)</text>\n  <text x=\"269\" y=\"58\" text-anchor=\"middle\" fill=\"rgba(79,172,254,0.6)\" font-size=\"9\" font-family=\"monospace\">shrinks coefficients</text>\n  <rect x=\"204\" y=\"65\" width=\"80\" height=\"12\" fill=\"rgba(79,172,254,0.6)\" rx=\"2\"/>\n  <text x=\"206\" y=\"74\" fill=\"#fff\" font-size=\"8\" font-family=\"monospace\">feat_A  5.4</text>\n  <rect x=\"204\" y=\"82\" width=\"62\" height=\"12\" fill=\"rgba(79,172,254,0.55)\" rx=\"2\"/>\n  <text x=\"206\" y=\"91\" fill=\"#fff\" font-size=\"8\" font-family=\"monospace\">feat_B  4.2</text>\n  <rect x=\"204\" y=\"99\" width=\"70\" height=\"12\" fill=\"rgba(79,172,254,0.55)\" rx=\"2\"/>\n  <text x=\"206\" y=\"108\" fill=\"#fff\" font-size=\"8\" font-family=\"monospace\">feat_C  4.7</text>\n  <rect x=\"204\" y=\"116\" width=\"44\" height=\"12\" fill=\"rgba(79,172,254,0.45)\" rx=\"2\"/>\n  <text x=\"206\" y=\"125\" fill=\"#fff\" font-size=\"8\" font-family=\"monospace\">feat_D  2.9</text>\n  <rect x=\"204\" y=\"133\" width=\"50\" height=\"12\" fill=\"rgba(79,172,254,0.45)\" rx=\"2\"/>\n  <text x=\"206\" y=\"142\" fill=\"#fff\" font-size=\"8\" font-family=\"monospace\">feat_E  3.3</text>\n  <rect x=\"204\" y=\"150\" width=\"30\" height=\"12\" fill=\"rgba(79,172,254,0.4)\" rx=\"2\"/>\n  <text x=\"206\" y=\"159\" fill=\"#fff\" font-size=\"8\" font-family=\"monospace\">feat_F  2.0</text>\n  <text x=\"269\" y=\"185\" text-anchor=\"middle\" fill=\"#4facfe\" font-size=\"9\" font-family=\"monospace\">All shrunk, none zero</text>\n\n  <!-- RIGHT panel: Lasso -->\n  <rect x=\"374\" y=\"28\" width=\"155\" height=\"170\" fill=\"rgba(67,233,123,0.05)\" stroke=\"rgba(67,233,123,0.25)\" rx=\"7\"/>\n  <text x=\"451\" y=\"46\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">Lasso (L1)</text>\n  <text x=\"451\" y=\"58\" text-anchor=\"middle\" fill=\"rgba(67,233,123,0.6)\" font-size=\"9\" font-family=\"monospace\">kills weak features</text>\n  <rect x=\"386\" y=\"65\" width=\"80\" height=\"12\" fill=\"rgba(67,233,123,0.6)\" rx=\"2\"/>\n  <text x=\"388\" y=\"74\" fill=\"#fff\" font-size=\"8\" font-family=\"monospace\">feat_A  5.1</text>\n  <rect x=\"386\" y=\"82\" width=\"58\" height=\"12\" fill=\"rgba(67,233,123,0.55)\" rx=\"2\"/>\n  <text x=\"388\" y=\"91\" fill=\"#fff\" font-size=\"8\" font-family=\"monospace\">feat_B  3.9</text>\n  <rect x=\"386\" y=\"99\" width=\"68\" height=\"12\" fill=\"rgba(67,233,123,0.55)\" rx=\"2\"/>\n  <text x=\"388\" y=\"108\" fill=\"#fff\" font-size=\"8\" font-family=\"monospace\">feat_C  4.6</text>\n  <!-- D and E zeroed out -->\n  <rect x=\"386\" y=\"116\" width=\"2\" height=\"12\" fill=\"rgba(255,255,255,0.15)\" rx=\"2\"/>\n  <text x=\"388\" y=\"125\" fill=\"rgba(255,255,255,0.35)\" font-size=\"8\" font-family=\"monospace\">feat_D  0  ← killed</text>\n  <rect x=\"386\" y=\"133\" width=\"2\" height=\"12\" fill=\"rgba(255,255,255,0.15)\" rx=\"2\"/>\n  <text x=\"388\" y=\"142\" fill=\"rgba(255,255,255,0.35)\" font-size=\"8\" font-family=\"monospace\">feat_E  0  ← killed</text>\n  <rect x=\"386\" y=\"150\" width=\"2\" height=\"12\" fill=\"rgba(255,255,255,0.15)\" rx=\"2\"/>\n  <text x=\"388\" y=\"159\" fill=\"rgba(255,255,255,0.35)\" font-size=\"8\" font-family=\"monospace\">feat_F  0  ← killed</text>\n  <text x=\"451\" y=\"185\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"9\" font-family=\"monospace\">Auto feature selection!</text>\n  <!-- Bottom rule -->\n  <text x=\"270\" y=\"215\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.5)\" font-size=\"9.5\" font-family=\"monospace\">Ridge: keeps all features small   ·   Lasso: zeros out weak features (built-in selection)</text>\n  <text x=\"270\" y=\"230\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.35)\" font-size=\"9.5\" font-family=\"monospace\">Both controlled by alpha (λ) — higher alpha = stronger penalty</text>\n</svg>\n    </div>\n  </div>\n  <div style=\"display:flex;flex-direction:column;min-height:0;overflow:hidden;\">\n    <div class=\"code-wrap\" style=\"flex:1;overflow:auto;min-height:0;\">\n      <div class=\"code-header\"><span>ridge_lasso.py</span><span>python</span></div>\n      <pre><span class=\"kw\">from</span> sklearn.linear_model <span class=\"kw\">import</span> Ridge, Lasso\n<span class=\"kw\">from</span> sklearn.model_selection <span class=\"kw\">import</span> GridSearchCV\n<span class=\"kw\">from</span> sklearn.preprocessing <span class=\"kw\">import</span> StandardScaler\n\n<span class=\"cm\"># Scale first — Ridge/Lasso are sensitive to scale</span>\nscaler = StandardScaler()\nX_train_s = scaler.fit_transform(X_train)\nX_test_s  = scaler.transform(X_test)\n\n<span class=\"cm\"># Ridge — tune alpha via cross-validation</span>\nridge = GridSearchCV(Ridge(), {<span class=\"st\">\"alpha\"</span>: [<span class=\"nm\">0.1</span>, <span class=\"nm\">1</span>, <span class=\"nm\">10</span>, <span class=\"nm\">100</span>]}, cv=<span class=\"nm\">5</span>)\nridge.fit(X_train_s, y_train)\n<span class=\"fn\">print</span>(<span class=\"st\">f\"Ridge best alpha: {ridge.best_params_}\"</span>)\n<span class=\"fn\">print</span>(<span class=\"st\">f\"Ridge R²: {ridge.score(X_test_s, y_test):.3f}\"</span>)\n\n<span class=\"cm\"># Lasso — some coefficients will go to zero</span>\nlasso = GridSearchCV(Lasso(), {<span class=\"st\">\"alpha\"</span>: [<span class=\"nm\">0.01</span>, <span class=\"nm\">0.1</span>, <span class=\"nm\">1</span>, <span class=\"nm\">10</span>]}, cv=<span class=\"nm\">5</span>)\nlasso.fit(X_train_s, y_train)\nzero_feats = (lasso.best_estimator_.coef_ == <span class=\"nm\">0</span>).sum()\n<span class=\"fn\">print</span>(<span class=\"st\">f\"Lasso zeroed {zero_feats} features\"</span>)</pre>\n    </div>\n  </div>\n</div>"}, {"label": "XGBoost Regressor", "html": "<div class=\"section-tag\">Advanced Model</div><div class=\"slide-heading\">XGBoost — The Kaggle Champion 🏆</div><div class=\"two-col\" style=\"margin-bottom:8px;\"><div><strong>What is XGBoost?</strong><br>eXtreme Gradient Boosting. Builds <strong>hundreds of decision trees sequentially</strong> — each tree corrects the errors of the previous one. Uses gradient descent to minimise the loss.<br><br><strong>Why it usually wins:</strong><br>• Handles missing values natively<br>• Built-in regularisation (λ, α)<br>• Feature importance built-in<br>• GPU support for large datasets</div><div><strong>Key hyperparameters:</strong><br>• <code>n_estimators</code> — number of trees (100–1000)<br>• <code>max_depth</code> — tree depth (3–8 typical)<br>• <code>learning_rate</code> — step size (0.01–0.3)<br>• <code>subsample</code> — row fraction per tree<br>• <code>colsample_bytree</code> — feature fraction<br>• <code>early_stopping_rounds</code> — stop when score stops improving</div></div><svg viewBox=\"0 0 540 250\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:540px;display:block;margin:4px auto;\">\n  <rect width=\"540\" height=\"250\" fill=\"rgba(0,0,0,0.45)\" rx=\"10\"/>\n  <text x=\"270\" y=\"20\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"12\" font-weight=\"bold\" font-family=\"monospace\">XGBoost — Boosting: Trees Learn from Each Other's Mistakes</text>\n  <!-- Tree 1 -->\n  <rect x=\"12\" y=\"30\" width=\"150\" height=\"140\" fill=\"rgba(79,172,254,0.07)\" stroke=\"rgba(79,172,254,0.3)\" rx=\"8\"/>\n  <text x=\"87\" y=\"47\" text-anchor=\"middle\" fill=\"#4facfe\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">Tree 1 (weak)</text>\n  <!-- Simple tree structure -->\n  <rect x=\"57\" y=\"54\" width=\"60\" height=\"20\" fill=\"rgba(79,172,254,0.2)\" stroke=\"rgba(79,172,254,0.5)\" rx=\"4\"/>\n  <text x=\"87\" y=\"67\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"8.5\" font-family=\"monospace\">size &gt; 100?</text>\n  <line x1=\"75\" y1=\"74\" x2=\"55\" y2=\"95\" stroke=\"rgba(79,172,254,0.5)\" stroke-width=\"1.5\"/>\n  <line x1=\"99\" y1=\"74\" x2=\"119\" y2=\"95\" stroke=\"rgba(79,172,254,0.5)\" stroke-width=\"1.5\"/>\n  <rect x=\"27\" y=\"95\" width=\"54\" height=\"18\" fill=\"rgba(67,233,123,0.2)\" stroke=\"rgba(67,233,123,0.4)\" rx=\"3\"/>\n  <text x=\"54\" y=\"107\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"8\" font-family=\"monospace\">pred: 350K</text>\n  <rect x=\"93\" y=\"95\" width=\"54\" height=\"18\" fill=\"rgba(255,209,102,0.2)\" stroke=\"rgba(255,209,102,0.4)\" rx=\"3\"/>\n  <text x=\"120\" y=\"107\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"8\" font-family=\"monospace\">pred: 520K</text>\n  <!-- Residuals -->\n  <text x=\"87\" y=\"135\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.6)\" font-size=\"8.5\" font-family=\"monospace\">Actual: 480K</text>\n  <text x=\"87\" y=\"148\" text-anchor=\"middle\" fill=\"#f5576c\" font-size=\"8.5\" font-family=\"monospace\">Error: +130K, -40K</text>\n  <text x=\"87\" y=\"162\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.4)\" font-size=\"8\" font-family=\"monospace\">(residuals passed on)</text>\n\n  <!-- Arrow 1 -->\n  <text x=\"176\" y=\"105\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"20\">→</text>\n  <text x=\"176\" y=\"122\" text-anchor=\"middle\" fill=\"rgba(255,209,102,0.5)\" font-size=\"8\" font-family=\"monospace\">learn from</text>\n  <text x=\"176\" y=\"133\" text-anchor=\"middle\" fill=\"rgba(255,209,102,0.5)\" font-size=\"8\" font-family=\"monospace\">mistakes</text>\n\n  <!-- Tree 2 -->\n  <rect x=\"196\" y=\"30\" width=\"150\" height=\"140\" fill=\"rgba(255,209,102,0.07)\" stroke=\"rgba(255,209,102,0.3)\" rx=\"8\"/>\n  <text x=\"271\" y=\"47\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">Tree 2 (corrects)</text>\n  <rect x=\"241\" y=\"54\" width=\"60\" height=\"20\" fill=\"rgba(255,209,102,0.2)\" stroke=\"rgba(255,209,102,0.5)\" rx=\"4\"/>\n  <text x=\"271\" y=\"67\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"8.5\" font-family=\"monospace\">rooms &gt; 3?</text>\n  <line x1=\"259\" y1=\"74\" x2=\"239\" y2=\"95\" stroke=\"rgba(255,209,102,0.5)\" stroke-width=\"1.5\"/>\n  <line x1=\"283\" y1=\"74\" x2=\"303\" y2=\"95\" stroke=\"rgba(255,209,102,0.5)\" stroke-width=\"1.5\"/>\n  <rect x=\"211\" y=\"95\" width=\"54\" height=\"18\" fill=\"rgba(67,233,123,0.2)\" stroke=\"rgba(67,233,123,0.4)\" rx=\"3\"/>\n  <text x=\"238\" y=\"107\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"8\" font-family=\"monospace\">adj: +50K</text>\n  <rect x=\"277\" y=\"95\" width=\"54\" height=\"18\" fill=\"rgba(67,233,123,0.2)\" stroke=\"rgba(67,233,123,0.4)\" rx=\"3\"/>\n  <text x=\"304\" y=\"107\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"8\" font-family=\"monospace\">adj: -10K</text>\n  <text x=\"271\" y=\"135\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.6)\" font-size=\"8.5\" font-family=\"monospace\">Fixes Tree 1 errors</text>\n  <text x=\"271\" y=\"150\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.4)\" font-size=\"8\" font-family=\"monospace\">RMSE improves</text>\n\n  <!-- Arrow 2 -->\n  <text x=\"361\" y=\"105\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"20\">→</text>\n\n  <!-- Tree N -->\n  <rect x=\"380\" y=\"30\" width=\"150\" height=\"140\" fill=\"rgba(139,92,246,0.07)\" stroke=\"rgba(139,92,246,0.3)\" rx=\"8\"/>\n  <text x=\"455\" y=\"47\" text-anchor=\"middle\" fill=\"#C4B5FD\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">Tree N (final)</text>\n  <text x=\"455\" y=\"70\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.5)\" font-size=\"8.5\" font-family=\"monospace\">100s of trees later…</text>\n  <rect x=\"400\" y=\"80\" width=\"110\" height=\"40\" fill=\"rgba(139,92,246,0.2)\" stroke=\"rgba(139,92,246,0.5)\" rx=\"5\"/>\n  <text x=\"455\" y=\"97\" text-anchor=\"middle\" fill=\"#C4B5FD\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">Final Prediction</text>\n  <text x=\"455\" y=\"111\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"11\" font-weight=\"bold\" font-family=\"monospace\">= SUM of all trees</text>\n  <text x=\"455\" y=\"135\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.5)\" font-size=\"8.5\" font-family=\"monospace\">350K + 50K + … = 478K</text>\n  <text x=\"455\" y=\"150\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"8.5\" font-family=\"monospace\">Actual was 480K ✅</text>\n\n  <!-- Bottom explanation row -->\n  <text x=\"270\" y=\"193\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.65)\" font-size=\"9.5\" font-family=\"monospace\">Boosting = sequential trees, each correcting the previous one's errors</text>\n  <text x=\"270\" y=\"208\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.45)\" font-size=\"9.5\" font-family=\"monospace\">vs Random Forest (bagging) = parallel trees trained independently, then averaged</text>\n  <text x=\"270\" y=\"225\" text-anchor=\"middle\" fill=\"rgba(79,172,254,0.7)\" font-size=\"9.5\" font-family=\"monospace\">XGBoost adds: gradient descent optimisation + regularisation + speed tricks</text>\n  <text x=\"270\" y=\"240\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.35)\" font-size=\"9.5\" font-family=\"monospace\">That's why it wins Kaggle competitions 🏆</text>\n</svg><div class=\"code-wrap\" style=\"margin-top:6px;\"><div class=\"code-header\"><span>xgboost_regressor.py</span><span>python</span></div><pre><span class=\"kw\">from</span> xgboost <span class=\"kw\">import</span> XGBRegressor\n<span class=\"kw\">from</span> sklearn.model_selection <span class=\"kw\">import</span> train_test_split\n<span class=\"kw\">from</span> sklearn.metrics <span class=\"kw\">import</span> r2_score\n<span class=\"kw\">import</span> matplotlib.pyplot <span class=\"kw\">as</span> plt\n\nmodel = XGBRegressor(\n    n_estimators=<span class=\"nm\">500</span>,\n    max_depth=<span class=\"nm\">5</span>,\n    learning_rate=<span class=\"nm\">0.05</span>,\n    subsample=<span class=\"nm\">0.8</span>,\n    colsample_bytree=<span class=\"nm\">0.8</span>,\n    random_state=<span class=\"nm\">42</span>,\n    early_stopping_rounds=<span class=\"nm\">20</span>,   <span class=\"cm\"># stops if val score doesn't improve</span>\n    eval_metric=<span class=\"st\">\"rmse\"</span>\n)\nmodel.fit(X_train, y_train, eval_set=[(X_test, y_test)], verbose=<span class=\"nm\">50</span>)\n\n<span class=\"fn\">print</span>(<span class=\"st\">f\"R²: {r2_score(y_test, model.predict(X_test)):.3f}\"</span>)\n\n<span class=\"cm\"># Feature importance chart</span>\nfig, ax = plt.subplots(figsize=(<span class=\"nm\">8</span>, <span class=\"nm\">4</span>))\nxgb.plot_importance(model, ax=ax, max_num_features=<span class=\"nm\">10</span>)\nplt.tight_layout(); plt.show()</pre></div>"}, {"label": "Regression Evaluation", "html": "<div class=\"section-tag\">Evaluation</div>\n<h2 class=\"slide-heading\"></h2>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;flex:1;min-height:0;overflow:hidden;margin-top:6px;\">\n  <div style=\"display:flex;flex-direction:column;gap:8px;min-height:0;overflow:hidden;\">\n    \n    <div style=\"flex:1;overflow:hidden;display:flex;align-items:center;\">\n      <svg viewBox=\"0 0 540 220\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-height:220px;\">\n  <rect width=\"540\" height=\"220\" fill=\"rgba(0,0,0,0.45)\" rx=\"10\"/>\n  <text x=\"270\" y=\"18\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"12\" font-weight=\"bold\" font-family=\"monospace\">How We Evaluate Regression — 3 Key Plots</text>\n  <!-- Panel 1: Actual vs Predicted -->\n  <rect x=\"10\" y=\"25\" width=\"160\" height=\"155\" fill=\"rgba(255,255,255,0.02)\" stroke=\"rgba(255,255,255,0.1)\" rx=\"6\"/>\n  <text x=\"90\" y=\"40\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.7)\" font-size=\"9\" font-weight=\"bold\" font-family=\"monospace\">Actual vs Predicted</text>\n  <line x1=\"22\" y1=\"165\" x2=\"162\" y2=\"165\" stroke=\"rgba(255,255,255,0.2)\" stroke-width=\"1\"/>\n  <line x1=\"22\" y1=\"45\" x2=\"22\" y2=\"165\" stroke=\"rgba(255,255,255,0.2)\" stroke-width=\"1\"/>\n  <!-- Perfect diagonal line -->\n  <line x1=\"22\" y1=\"165\" x2=\"162\" y2=\"45\" stroke=\"#4facfe\" stroke-width=\"1.5\" stroke-dasharray=\"5,3\"/>\n  <!-- Dots near diagonal -->\n  <circle cx=\"35\"  cy=\"155\" r=\"4\" fill=\"#43e97b\" opacity=\"0.85\"/>\n  <circle cx=\"55\"  cy=\"135\" r=\"4\" fill=\"#43e97b\" opacity=\"0.85\"/>\n  <circle cx=\"75\"  cy=\"115\" r=\"4\" fill=\"#43e97b\" opacity=\"0.85\"/>\n  <circle cx=\"95\"  cy=\"98\"  r=\"4\" fill=\"#43e97b\" opacity=\"0.85\"/>\n  <circle cx=\"115\" cy=\"80\"  r=\"4\" fill=\"#43e97b\" opacity=\"0.85\"/>\n  <circle cx=\"135\" cy=\"62\"  r=\"4\" fill=\"#43e97b\" opacity=\"0.85\"/>\n  <circle cx=\"150\" cy=\"50\"  r=\"4\" fill=\"#43e97b\" opacity=\"0.85\"/>\n  <text x=\"50\"  y=\"178\" fill=\"rgba(255,255,255,0.4)\" font-size=\"8\" font-family=\"monospace\">Predicted</text>\n  <text x=\"90\"  y=\"192\" text-anchor=\"middle\" fill=\"#4facfe\" font-size=\"8\" font-family=\"monospace\">Dots near line = great fit</text>\n\n  <!-- Panel 2: Residual plot -->\n  <rect x=\"190\" y=\"25\" width=\"160\" height=\"155\" fill=\"rgba(255,255,255,0.02)\" stroke=\"rgba(255,255,255,0.1)\" rx=\"6\"/>\n  <text x=\"270\" y=\"40\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.7)\" font-size=\"9\" font-weight=\"bold\" font-family=\"monospace\">Residual Plot</text>\n  <line x1=\"200\" y1=\"105\" x2=\"342\" y2=\"105\" stroke=\"rgba(255,255,255,0.3)\" stroke-width=\"1.5\" stroke-dasharray=\"4,3\"/>\n  <line x1=\"200\" y1=\"45\" x2=\"200\" y2=\"170\" stroke=\"rgba(255,255,255,0.2)\" stroke-width=\"1\"/>\n  <!-- Random residuals around zero -->\n  <circle cx=\"215\" cy=\"95\"  r=\"4\" fill=\"#FFD166\" opacity=\"0.8\"/>\n  <circle cx=\"232\" cy=\"115\" r=\"4\" fill=\"#FFD166\" opacity=\"0.8\"/>\n  <circle cx=\"248\" cy=\"98\"  r=\"4\" fill=\"#FFD166\" opacity=\"0.8\"/>\n  <circle cx=\"264\" cy=\"112\" r=\"4\" fill=\"#FFD166\" opacity=\"0.8\"/>\n  <circle cx=\"280\" cy=\"95\"  r=\"4\" fill=\"#FFD166\" opacity=\"0.8\"/>\n  <circle cx=\"296\" cy=\"108\" r=\"4\" fill=\"#FFD166\" opacity=\"0.8\"/>\n  <circle cx=\"315\" cy=\"100\" r=\"4\" fill=\"#FFD166\" opacity=\"0.8\"/>\n  <circle cx=\"332\" cy=\"112\" r=\"4\" fill=\"#FFD166\" opacity=\"0.8\"/>\n  <text x=\"230\"  y=\"178\" fill=\"rgba(255,255,255,0.4)\" font-size=\"8\" font-family=\"monospace\">Predicted value</text>\n  <text x=\"270\"  y=\"192\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"8\" font-family=\"monospace\">Random scatter = good</text>\n\n  <!-- Panel 3: Metric summary -->\n  <rect x=\"370\" y=\"25\" width=\"158\" height=\"155\" fill=\"rgba(255,255,255,0.02)\" stroke=\"rgba(255,255,255,0.1)\" rx=\"6\"/>\n  <text x=\"449\" y=\"40\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.7)\" font-size=\"9\" font-weight=\"bold\" font-family=\"monospace\">Regression Metrics</text>\n  <rect x=\"380\" y=\"48\" width=\"138\" height=\"24\" fill=\"rgba(79,172,254,0.15)\" stroke=\"rgba(79,172,254,0.3)\" rx=\"4\"/>\n  <text x=\"449\" y=\"58\" text-anchor=\"middle\" fill=\"#4facfe\" font-size=\"8.5\" font-weight=\"bold\" font-family=\"monospace\">R² Score (0 to 1)</text>\n  <text x=\"449\" y=\"68\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.5)\" font-size=\"8\" font-family=\"monospace\">1.0 = perfect, 0.7 = ok</text>\n  <rect x=\"380\" y=\"78\" width=\"138\" height=\"24\" fill=\"rgba(255,209,102,0.15)\" stroke=\"rgba(255,209,102,0.3)\" rx=\"4\"/>\n  <text x=\"449\" y=\"88\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"8.5\" font-weight=\"bold\" font-family=\"monospace\">MAE (Mean Abs Error)</text>\n  <text x=\"449\" y=\"98\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.5)\" font-size=\"8\" font-family=\"monospace\">Avg error in $ or units</text>\n  <rect x=\"380\" y=\"108\" width=\"138\" height=\"24\" fill=\"rgba(245,87,108,0.15)\" stroke=\"rgba(245,87,108,0.3)\" rx=\"4\"/>\n  <text x=\"449\" y=\"118\" text-anchor=\"middle\" fill=\"#f5576c\" font-size=\"8.5\" font-weight=\"bold\" font-family=\"monospace\">RMSE</text>\n  <text x=\"449\" y=\"128\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.5)\" font-size=\"8\" font-family=\"monospace\">Punishes big errors more</text>\n  <text x=\"449\" y=\"155\" text-anchor=\"middle\" fill=\"rgba(67,233,123,0.9)\" font-size=\"9\" font-family=\"monospace\">Our goal:</text>\n  <text x=\"449\" y=\"167\" text-anchor=\"middle\" fill=\"rgba(67,233,123,0.9)\" font-size=\"9\" font-family=\"monospace\">High R², Low MAE/RMSE</text>\n  <!-- Overall bottom -->\n  <text x=\"270\" y=\"208\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.4)\" font-size=\"9\" font-family=\"monospace\">All 3 together give you the full picture of how well your regression model works</text>\n</svg>\n    </div>\n  </div>\n  <div style=\"display:flex;flex-direction:column;min-height:0;overflow:hidden;\">\n    <div class=\"code-wrap\" style=\"flex:1;overflow:auto;min-height:0;\">\n      <div class=\"code-header\"><span>evaluate_regression.py</span><span>python</span></div>\n      <pre><span class=\"kw\">from</span> sklearn.metrics <span class=\"kw\">import</span> r2_score, mean_absolute_error, mean_squared_error\n<span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n<span class=\"kw\">import</span> matplotlib.pyplot <span class=\"kw\">as</span> plt\n\npred = model.predict(X_test)\nprint(f\"R²:   {r2_score(y_test, pred):.3f}\")\nprint(f\"MAE:  {mean_absolute_error(y_test, pred):,.0f}\")\nprint(f\"RMSE: {np.sqrt(mean_squared_error(y_test, pred)):,.0f}\")\n\n<span class=\"cm\"># Actual vs Predicted</span>\nfig, axes = plt.subplots(<span class=\"nm\">1</span>, <span class=\"nm\">2</span>, figsize=(<span class=\"nm\">12</span>, <span class=\"nm\">4</span>))\naxes[<span class=\"nm\">0</span>].scatter(y_test, pred, alpha=<span class=\"nm\">0.5</span>)\naxes[<span class=\"nm\">0</span>].plot([y_test.min(), y_test.max()], [y_test.min(), y_test.max()], <span class=\"st\">\"r--\"</span>)\naxes[<span class=\"nm\">0</span>].set(xlabel=<span class=\"st\">\"Actual\"</span>, ylabel=<span class=\"st\">\"Predicted\"</span>, title=<span class=\"st\">\"Actual vs Predicted\"</span>)\n\n<span class=\"cm\"># Residuals</span>\nresiduals = y_test - pred\naxes[<span class=\"nm\">1</span>].scatter(pred, residuals, alpha=<span class=\"nm\">0.5</span>)\naxes[<span class=\"nm\">1</span>].axhline(<span class=\"nm\">0</span>, color=<span class=\"st\">\"r\"</span>, linestyle=<span class=\"st\">\"--\"</span>)\naxes[<span class=\"nm\">1</span>].set(xlabel=<span class=\"st\">\"Predicted\"</span>, ylabel=<span class=\"st\">\"Residual\"</span>, title=<span class=\"st\">\"Residual Plot\"</span>)\nplt.tight_layout(); plt.show()</pre>\n    </div>\n  </div>\n</div>"}, {"label": "Real World Lab", "html": "<div class=\"section-tag\">Hands-On</div><div class=\"slide-heading\">Code Lab — House Price Predictor 💻</div><div class=\"code-wrap\"><div class=\"code-header\"><span>lab_10_regression.py</span><span>python</span></div><pre><span class=\"kw\">from</span> sklearn.datasets <span class=\"kw\">import</span> fetch_california_housing\n<span class=\"kw\">from</span> sklearn.linear_model <span class=\"kw\">import</span> Ridge\n<span class=\"kw\">from</span> sklearn.ensemble <span class=\"kw\">import</span> RandomForestRegressor\n<span class=\"kw\">import</span> xgboost <span class=\"kw\">as</span> xgb\n<span class=\"kw\">from</span> sklearn.model_selection <span class=\"kw\">import</span> train_test_split, cross_val_score\n<span class=\"kw\">from</span> sklearn.metrics <span class=\"kw\">import</span> r2_score, mean_squared_error\n<span class=\"kw\">from</span> sklearn.preprocessing <span class=\"kw\">import</span> StandardScaler\n<span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n<span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\n<span class=\"cm\"># Load California housing dataset</span>\ndata = fetch_california_housing(as_frame=<span class=\"kw\">True</span>)\ndf = data.frame\n<span class=\"fn\">print</span>(df.head()); <span class=\"fn\">print</span>(df.describe())\n\nX = df.drop(<span class=\"st\">\"MedHouseVal\"</span>, axis=<span class=\"nm\">1</span>)\ny = df[<span class=\"st\">\"MedHouseVal\"</span>]\n\nX_train, X_test, y_train, y_test = train_test_split(X, y, test_size=<span class=\"nm\">0.2</span>, random_state=<span class=\"nm\">42</span>)\nscaler = StandardScaler()\nX_train_s = scaler.fit_transform(X_train)\nX_test_s  = scaler.transform(X_test)\n\n<span class=\"cm\"># Compare 3 models</span>\nmodels = {\n    <span class=\"st\">\"Ridge\"</span>: Ridge(alpha=<span class=\"nm\">10</span>),\n    <span class=\"st\">\"RandomForest\"</span>: RandomForestRegressor(n_estimators=<span class=\"nm\">100</span>, random_state=<span class=\"nm\">42</span>),\n    <span class=\"st\">\"XGBoost\"</span>: xgb.XGBRegressor(n_estimators=<span class=\"nm\">200</span>, random_state=<span class=\"nm\">42</span>, verbosity=<span class=\"nm\">0</span>),\n}\nfor name, model <span class=\"kw\">in</span> models.items():\n    model.fit(X_train_s, y_train)\n    pred = model.predict(X_test_s)\n    r2 = r2_score(y_test, pred)\n    rmse = mean_squared_error(y_test, pred)**<span class=\"nm\">0.5</span>\n    <span class=\"fn\">print</span>(<span class=\"st\">f\"{name:15} R²={r2:.3f}  RMSE={rmse:.3f}\"</span>)</pre></div><div class=\"tip\">🚀 <strong>Challenge:</strong> Add a feature <code>rooms_per_household = AveRooms / HouseAge</code>. Does it improve XGBoost R²?</div>"}, {"label": "Common Mistakes", "html": "<div class=\"section-tag\">Watch Out!</div><div class=\"slide-heading\">Common Regression Mistakes ⚠️</div><div class=\"e-list\"><div class=\"e-item\"><div class=\"e-icon\">❌</div><div><strong>Forgetting to scale for linear models</strong><br>Salary (50000) dominates Age (30) — linear models treat all features equally without scaling.<br>✅ Fix: Always StandardScaler before fitting Linear/Ridge/Lasso. Not needed for tree models (RF, XGBoost).</div></div><div class=\"e-item\"><div class=\"e-icon\">❌</div><div><strong>Using R² as the only metric</strong><br>R²=0.95 sounds great, but RMSE=$100,000 on house prices is terrible if average price is $400,000.<br>✅ Fix: Always report RMSE (or MAE) alongside R² with the actual units for context.</div></div><div class=\"e-item\"><div class=\"e-icon\">❌</div><div><strong>Not checking residuals</strong><br>Residuals reveal non-linearity, outliers, and heteroscedasticity that metrics hide.<br>✅ Fix: Always plot actual vs predicted and the residual plot before concluding the model is good.</div></div><div class=\"e-item\"><div class=\"e-icon\">❌</div><div><strong>Predicting outside training range (extrapolation)</strong><br>Linear regression can predict negative house prices outside the training range.<br>✅ Fix: Clip predictions to plausible range. Note the training data range in documentation.</div></div></div>"}, {"label": "Session Recap", "html": "<div class=\"section-tag\">Session Recap</div><div class=\"slide-heading\">What You've Learned 🎉</div><div class=\"recap-grid\"><div class=\"recap-item\"><div class=\"recap-icon\">📐</div><div class=\"recap-text\"><h4>Linear Regression</h4><p>Baseline model. Needs scaling. Coefficients are interpretable. Use when relationship is approximately linear.</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">🔒</div><div class=\"recap-text\"><h4>Ridge &amp; Lasso</h4><p>Ridge: shrinks all coefs. Lasso: zeros out unimportant ones (feature selection). Tune alpha with GridSearchCV.</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">🏆</div><div class=\"recap-text\"><h4>XGBoost</h4><p>Best for tabular data. No scaling needed. Feature importance built-in. Early stopping to prevent overfitting.</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">📏</div><div class=\"recap-text\"><h4>Metrics</h4><p>RMSE: penalises large errors. MAE: robust to outliers. R²: % variance explained. Always report with units.</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">📊</div><div class=\"recap-text\"><h4>Visualisation</h4><p>Actual vs predicted (points near red line = good). Residual plot (random scatter around 0 = good).</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">📋</div><div class=\"recap-text\"><h4>Model Comparison</h4><p>Always compare at least 3 models. Start simple (Ridge baseline), then XGBoost. Use cross_val_score for fair comparison.</p></div></div></div><div class=\"highlight\" style=\"margin-top:auto;\">🚀 <strong>Next:</strong> Session 11 — Classification: predict categories with Decision Trees, Random Forest, and XGBoost</div>"}];



let cur=0;
const wrap=document.getElementById('slides-wrap');
const dotsEl=document.getElementById('dots');
function renderSlides(){
  wrap.innerHTML='';dotsEl.innerHTML='';
  SLIDES_DATA.forEach((s,i)=>{
    const div=document.createElement('div');
    div.className='slide'+(i===0?' active':'');
    div.innerHTML=s.html;
    wrap.appendChild(div);
    const dot=document.createElement('div');
    dot.className='dot'+(i===0?' active':'');
    dot.onclick=()=>jump(i);
    dotsEl.appendChild(dot);
  });
  updateUI();
}
function updateUI(){
  const t=SLIDES_DATA.length;
  document.getElementById('counter').textContent=(cur+1)+' / '+t;
  document.getElementById('progress-bar').style.width=((cur+1)/t*100)+'%';
  document.getElementById('slide-title-bar').textContent=SLIDES_DATA[cur].label||'';
  document.getElementById('prev-btn').disabled=cur===0;
  document.getElementById('next-btn').disabled=cur===t-1;
  document.querySelectorAll('.slide').forEach((el,i)=>el.classList.toggle('active',i===cur));
  document.querySelectorAll('.dot').forEach((el,i)=>el.classList.toggle('active',i===cur));
}
function go(d){jump(cur+d);}
function jump(i){if(i<0||i>=SLIDES_DATA.length)return;cur=i;updateUI();document.querySelectorAll('.slide')[cur].scrollTop=0;}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(1);}
  if(e.key==='ArrowLeft'){e.preventDefault();go(-1);}
  if(e.key==='f'||e.key==='F')toggleFS();
  if(e.key==='Home')jump(0);
  if(e.key==='End')jump(SLIDES_DATA.length-1);
});
function toggleFS(){if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen();}

let _tx=0;
document.addEventListener('touchstart',e=>{_tx=e.changedTouches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-_tx;
  if(Math.abs(dx)>50){go(dx<0?1:-1);}
},{passive:true});
renderSlides();
</script><script src="../access-guard.js"></script></body></html>
