<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Session 11 — Classification & Random Forest</title><style>
:root{--accent:#f97583;--bg:#0f0f1a;--text:#e8e8f0;--muted:#8888aa;--code-bg:#0d1117;--card:#1e2240;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;user-select:none;}
#deck{width:100%;height:100vh;display:flex;flex-direction:column;}
#topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.06);flex-shrink:0;gap:12px;}
#session-label{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--accent);text-transform:uppercase;white-space:nowrap;}
#slide-title-bar{font-size:12px;color:var(--muted);flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#topbar-right{display:flex;gap:8px;align-items:center;flex-shrink:0;}
#counter{font-size:12px;color:var(--muted);white-space:nowrap;}
.btn{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);color:var(--text);border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer;transition:all 0.15s;}
.btn:hover{background:var(--accent);border-color:var(--accent);color:#000;}
#progress-wrap{height:3px;background:rgba(255,255,255,0.05);flex-shrink:0;}
#progress-bar{height:100%;background:var(--accent);transition:width 0.3s ease;}
#slides-wrap{flex:1;position:relative;overflow:hidden;}
.slide{position:absolute;inset:0;display:none;flex-direction:column;padding:32px 48px 24px;overflow-y:auto;animation:fadeIn 0.25s ease;}
.slide.active{display:flex;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
#nav{display:flex;align-items:center;justify-content:center;gap:16px;padding:10px 24px;flex-shrink:0;border-top:1px solid rgba(255,255,255,0.06);}
.nav-btn{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);color:var(--text);padding:7px 26px;border-radius:8px;font-size:14px;cursor:pointer;transition:all 0.15s;}
.nav-btn:hover:not(:disabled){background:var(--accent);border-color:var(--accent);color:#000;}
.nav-btn:disabled{opacity:0.3;cursor:default;}
#dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:600px;}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.2);cursor:pointer;transition:all 0.2s;}
.dot.active{background:var(--accent);transform:scale(1.5);}
.slide-title{align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at 50% 40%,#1e2a4a 0%,#0f0f1a 70%);}
.session-badge{font-size:11px;font-weight:800;letter-spacing:3px;color:var(--accent);text-transform:uppercase;margin-bottom:20px;padding:5px 16px;border:1px solid var(--accent);border-radius:20px;display:inline-block;}
.slide-title h1{font-size:clamp(26px,3.4vw,46px);font-weight:800;line-height:1.15;margin-bottom:16px;background:linear-gradient(135deg,#fff 30%,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;white-space:pre-line;}
.slide-title .sub{font-size:14px;color:var(--muted);max-width:580px;line-height:1.6;margin-bottom:28px;}
.academy-tag{font-size:12px;color:var(--muted);letter-spacing:1px;}
.section-tag{font-size:10px;font-weight:700;letter-spacing:2.5px;color:var(--accent);text-transform:uppercase;margin-bottom:6px;}
.slide-heading{font-size:clamp(17px,2.2vw,28px);font-weight:700;margin-bottom:14px;line-height:1.25;}
.cards{display:grid;gap:11px;}
.cards-2{grid-template-columns:1fr 1fr;}
.cards-3{grid-template-columns:1fr 1fr 1fr;}
.cards-4{grid-template-columns:1fr 1fr 1fr 1fr;}
.card{background:var(--card);border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:14px 16px;}
.card-accent{border-left:3px solid var(--accent);}
.card-icon{font-size:22px;margin-bottom:6px;}
.card h3{font-size:13px;font-weight:700;margin-bottom:4px;color:#fff;}
.card p{font-size:12px;color:var(--muted);line-height:1.55;}
.steps{display:flex;flex-direction:column;gap:9px;}
.step{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:10px;padding:11px 14px;border:1px solid rgba(255,255,255,0.06);}
.step-num{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#000;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.step-body h4{font-size:13px;font-weight:700;margin-bottom:2px;}
.step-body p{font-size:12px;color:var(--muted);line-height:1.5;}
.code-wrap{background:var(--code-bg);border-radius:10px;border:1px solid rgba(255,255,255,0.08);overflow:hidden;margin:8px 0;}
.code-header{background:rgba(255,255,255,0.05);padding:5px 13px;font-size:11px;color:var(--muted);font-family:monospace;display:flex;justify-content:space-between;align-items:center;}
pre{padding:11px 15px;overflow-x:auto;font-family:'Cascadia Code','Fira Code',Consolas,monospace;font-size:12px;line-height:1.7;color:#c9d1d9;}
.kw{color:#ff7b72;}.fn{color:#d2a8ff;}.st{color:#a5d6ff;}.cm{color:#8b949e;font-style:italic;}.nm{color:#79c0ff;}.op{color:#ff9e64;}
.highlight{background:rgba(255,255,255,0.04);border-left:4px solid var(--accent);border-radius:0 8px 8px 0;padding:10px 14px;margin:8px 0;font-size:13px;line-height:1.6;}
.highlight strong{color:var(--accent);}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;flex:1;}
.warn{background:rgba(255,100,50,0.1);border:1px solid rgba(255,100,50,0.3);border-radius:8px;padding:9px 13px;font-size:12px;margin:6px 0;}
.tip{background:rgba(80,220,100,0.1);border:1px solid rgba(80,220,100,0.3);border-radius:8px;padding:9px 13px;font-size:12px;margin:6px 0;}
.roadmap{display:grid;grid-template-columns:1fr 1fr;gap:9px;flex:1;}
.roadmap-item{background:var(--card);border-radius:12px;padding:12px;border:1px solid rgba(255,255,255,0.06);display:flex;gap:9px;align-items:flex-start;}
.rm-num{font-size:18px;font-weight:900;color:var(--accent);opacity:0.4;line-height:1;flex-shrink:0;width:22px;}
.rm-icon{font-size:17px;flex-shrink:0;}
.rm-text h4{font-size:12px;font-weight:700;margin-bottom:2px;}
.rm-text p{font-size:11px;color:var(--muted);line-height:1.5;}
.recap-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;flex:1;}
.recap-item{background:var(--card);border-radius:10px;padding:12px;border-left:3px solid var(--accent);display:flex;gap:8px;align-items:flex-start;}
.recap-icon{font-size:17px;flex-shrink:0;}
.recap-text h4{font-size:13px;font-weight:700;margin-bottom:2px;}
.recap-text p{font-size:11px;color:var(--muted);line-height:1.5;}
.e-list{display:flex;flex-direction:column;gap:8px;}
.e-item{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.55;}
.e-icon{font-size:15px;flex-shrink:0;}
table{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0;}
th{background:rgba(255,255,255,0.06);padding:7px 10px;text-align:left;font-weight:700;color:var(--accent);}
td{padding:6px 10px;border-top:1px solid rgba(255,255,255,0.05);color:var(--muted);}
.slide::-webkit-scrollbar{width:4px;}
.slide::-webkit-scrollbar-track{background:transparent;}
.slide::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:2px;}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:700;margin:2px;}
.tag-green{background:rgba(80,200,80,0.2);color:#50c850;border:1px solid rgba(80,200,80,0.3);}
.tag-blue{background:rgba(80,150,255,0.2);color:#79c0ff;border:1px solid rgba(80,150,255,0.3);}
.tag-orange{background:rgba(255,150,50,0.2);color:#ff9e64;border:1px solid rgba(255,150,50,0.3);}
.big-concept{background:linear-gradient(135deg,#1e2a4a,#1e2240);border:1px solid rgba(249,117,131,0.3);border-radius:14px;padding:20px 24px;margin:10px 0;text-align:center;}
.big-concept .bc-emoji{font-size:36px;margin-bottom:8px;}
.big-concept h2{font-size:20px;font-weight:800;color:#fff;margin-bottom:6px;}
.big-concept p{font-size:13px;color:var(--muted);line-height:1.6;}

@media(max-width:700px){
  body{overflow:auto;}
  #deck{height:auto;min-height:100vh;}
  #slides-wrap{height:auto;min-height:60vh;}
  .slide{position:relative;inset:auto;display:none;padding:16px 16px 12px;}
  .slide.active{display:flex;}
  .cards-2,.cards-3,.cards-4{grid-template-columns:1fr;}
  .two-col,.roadmap,.recap-grid{grid-template-columns:1fr;}
  #session-label{display:none;}
  #slide-title-bar{display:none;}
  pre{font-size:10px;line-height:1.6;}
  .nav-btn{padding:6px 14px;font-size:13px;}
  #dots{max-width:100%;}
  .dot{width:5px;height:5px;}
  .big-concept{padding:14px 16px;}
  .big-concept h2{font-size:16px;}
  .big-concept .bc-emoji{font-size:28px;}
  .slide-heading{font-size:18px;}
  #topbar{padding:8px 12px;gap:6px;}
  #nav{padding:8px 12px;gap:10px;}
  table{font-size:10px;}
  th,td{padding:5px 6px;}
  .card h3{font-size:12px;}
  .card p{font-size:11px;}
  .highlight,.tip,.warn{font-size:11px;}
  .step-body h4{font-size:12px;}
  .step-body p{font-size:11px;}
}
.code-wrap pre,.code-wrap *,.code-wrap{user-select:text !important;-webkit-user-select:text !important;}
</style></head><body>
<div id="deck">
<div id="topbar"><div id="session-label">Session 11 · codencode Academy</div><div id="slide-title-bar"></div><div id="topbar-right"><span id="counter"></span><button class="btn" onclick="toggleFS()">⛶ Fullscreen</button></div></div>

</div><script>
const SLIDES_DATA = [{"label": "Title", "html": "<div class=\"slide-title\" style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;\"><div class=\"session-badge\">Session 11 of 15</div><div style=\"font-size:48px;margin-bottom:12px;\">🏷️</div><h1>Classification:<br>Random Forest &amp; Evaluation</h1><p class=\"sub\">Predict categories — spam/ham, churn/stay, disease/healthy — with Decision Trees, Random Forest, and XGBoost</p><div style=\"display:flex;gap:12px;justify-content:center;margin-top:14px;flex-wrap:wrap;\"><span class=\"tag tag-blue\">Decision Trees</span><span class=\"tag tag-green\">Random Forest</span><span class=\"tag tag-orange\">XGBoost</span><span class=\"tag tag-blue\">Confusion Matrix</span><span class=\"tag tag-green\">F1 Score</span></div><div class=\"academy-tag\" style=\"margin-top:20px;\">codencode Academy · Python + Data Science</div></div>"}, {"label": "What is Classification?", "html": "<div class=\"section-tag\">Fundamentals</div><div class=\"slide-heading\">What is Classification? 🏷️</div><div class=\"big-concept\"><div class=\"bc-emoji\">🏷️</div><h2>Classification = predict which category a data point belongs to</h2><p>Binary (2 classes): spam/not spam, fraud/legit, pass/fail. Multi-class (3+ classes): cat/dog/bird, disease type, product category.</p></div><div class=\"cards cards-3\" style=\"margin-top:10px;\"><div class=\"card card-accent\"><div class=\"card-icon\">🎯</div><h3>Binary Examples</h3><p>Email spam detection. Credit card fraud. Customer churn prediction. Medical diagnosis (disease/healthy). Default prediction.</p></div><div class=\"card card-accent\"><div class=\"card-icon\">🎨</div><h3>Multi-class Examples</h3><p>Image recognition (cat/dog/car). Sentiment (positive/neutral/negative). Product category assignment. Handwriting digit recognition.</p></div><div class=\"card card-accent\"><div class=\"card-icon\">📏</div><h3>Key Metrics</h3><p>Accuracy (balanced data). Precision (avoid false positives). Recall (avoid false negatives). F1 (imbalanced data). ROC-AUC (probability ranking).</p></div></div>"}, {"label": "Decision Trees", "html": "<div class=\"section-tag\">Model 1</div><div class=\"slide-heading\">Decision Trees — If/Else Rules the Model Learns Itself 🌳</div><div class=\"two-col\" style=\"margin-bottom:8px;\"><div><strong>How it works:</strong> At each node the tree asks the Yes/No question that <em>best splits</em> the data (reduces Gini impurity or Entropy). Keeps splitting until leaves are pure or depth limit is hit.<br><br><strong>Strengths:</strong> Interpretable — you can see exactly why a prediction was made. No scaling needed. Handles mixed feature types.</div><div><strong>Weaknesses:</strong> <strong>Overfits badly</strong> without constraints — a deep tree can memorise every training row.<br><br><strong>Key parameters:</strong><br>• <code>max_depth</code> — limit tree depth (try 3–6)<br>• <code>min_samples_split</code> — min rows to split<br>• <code>min_samples_leaf</code> — min rows per leaf<br>• <code>criterion</code> — \"gini\" or \"entropy\"</div></div><svg viewBox=\"0 0 500 290\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:500px;display:block;margin:4px auto;\">\n  <rect width=\"500\" height=\"290\" fill=\"rgba(0,0,0,0.45)\" rx=\"10\"/>\n  <text x=\"250\" y=\"20\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"12\" font-weight=\"bold\" font-family=\"monospace\">Decision Tree — How It Splits Data</text>\n  <!-- ROOT -->\n  <rect x=\"175\" y=\"28\" width=\"150\" height=\"30\" fill=\"rgba(79,172,254,0.2)\" stroke=\"#4facfe\" stroke-width=\"2\" rx=\"8\"/>\n  <text x=\"250\" y=\"42\" text-anchor=\"middle\" fill=\"#4facfe\" font-size=\"11\" font-weight=\"bold\" font-family=\"monospace\">age &lt; 30?</text>\n  <text x=\"250\" y=\"54\" text-anchor=\"middle\" fill=\"rgba(79,172,254,0.6)\" font-size=\"8.5\" font-family=\"monospace\">Root node — best split</text>\n  <!-- Root branches -->\n  <line x1=\"210\" y1=\"58\" x2=\"140\" y2=\"100\" stroke=\"rgba(255,255,255,0.3)\" stroke-width=\"1.5\"/>\n  <line x1=\"290\" y1=\"58\" x2=\"360\" y2=\"100\" stroke=\"rgba(255,255,255,0.3)\" stroke-width=\"1.5\"/>\n  <text x=\"158\" y=\"85\" fill=\"#43e97b\" font-size=\"9\" font-family=\"monospace\">Yes</text>\n  <text x=\"328\" y=\"85\" fill=\"#f5576c\" font-size=\"9\" font-family=\"monospace\">No</text>\n  <!-- Level 2 LEFT -->\n  <rect x=\"72\" y=\"100\" width=\"138\" height=\"28\" fill=\"rgba(255,209,102,0.15)\" stroke=\"#FFD166\" stroke-width=\"1.5\" rx=\"7\"/>\n  <text x=\"141\" y=\"112\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"10\" font-family=\"monospace\">income &gt; 40K?</text>\n  <text x=\"141\" y=\"122\" text-anchor=\"middle\" fill=\"rgba(255,209,102,0.5)\" font-size=\"8\" font-family=\"monospace\">inner node</text>\n  <!-- Level 2 RIGHT -->\n  <rect x=\"290\" y=\"100\" width=\"138\" height=\"28\" fill=\"rgba(255,209,102,0.15)\" stroke=\"#FFD166\" stroke-width=\"1.5\" rx=\"7\"/>\n  <text x=\"359\" y=\"112\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"10\" font-family=\"monospace\">married?</text>\n  <text x=\"359\" y=\"122\" text-anchor=\"middle\" fill=\"rgba(255,209,102,0.5)\" font-size=\"8\" font-family=\"monospace\">inner node</text>\n  <!-- L2 branches -->\n  <line x1=\"115\" y1=\"128\" x2=\"80\"  y2=\"170\" stroke=\"rgba(255,255,255,0.25)\" stroke-width=\"1.5\"/>\n  <line x1=\"167\" y1=\"128\" x2=\"200\" y2=\"170\" stroke=\"rgba(255,255,255,0.25)\" stroke-width=\"1.5\"/>\n  <line x1=\"333\" y1=\"128\" x2=\"300\" y2=\"170\" stroke=\"rgba(255,255,255,0.25)\" stroke-width=\"1.5\"/>\n  <line x1=\"385\" y1=\"128\" x2=\"420\" y2=\"170\" stroke=\"rgba(255,255,255,0.25)\" stroke-width=\"1.5\"/>\n  <text x=\"86\"  y=\"158\" fill=\"#43e97b\" font-size=\"8.5\" font-family=\"monospace\">Yes</text>\n  <text x=\"184\" y=\"158\" fill=\"#f5576c\" font-size=\"8.5\" font-family=\"monospace\">No</text>\n  <text x=\"304\" y=\"158\" fill=\"#43e97b\" font-size=\"8.5\" font-family=\"monospace\">Yes</text>\n  <text x=\"408\" y=\"158\" fill=\"#f5576c\" font-size=\"8.5\" font-family=\"monospace\">No</text>\n  <!-- Leaf nodes -->\n  <rect x=\"45\" y=\"170\" width=\"70\" height=\"30\" fill=\"rgba(67,233,123,0.2)\" stroke=\"#43e97b\" stroke-width=\"1.5\" rx=\"6\"/>\n  <text x=\"80\"  y=\"183\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"9\" font-weight=\"bold\" font-family=\"monospace\">APPROVE</text>\n  <text x=\"80\"  y=\"194\" text-anchor=\"middle\" fill=\"rgba(67,233,123,0.6)\" font-size=\"7.5\" font-family=\"monospace\">leaf node</text>\n  <rect x=\"170\" y=\"170\" width=\"70\" height=\"30\" fill=\"rgba(245,87,108,0.2)\" stroke=\"#f5576c\" stroke-width=\"1.5\" rx=\"6\"/>\n  <text x=\"205\" y=\"183\" text-anchor=\"middle\" fill=\"#f5576c\" font-size=\"9\" font-weight=\"bold\" font-family=\"monospace\">REJECT</text>\n  <text x=\"205\" y=\"194\" text-anchor=\"middle\" fill=\"rgba(245,87,108,0.6)\" font-size=\"7.5\" font-family=\"monospace\">leaf node</text>\n  <rect x=\"265\" y=\"170\" width=\"70\" height=\"30\" fill=\"rgba(67,233,123,0.2)\" stroke=\"#43e97b\" stroke-width=\"1.5\" rx=\"6\"/>\n  <text x=\"300\" y=\"183\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"9\" font-weight=\"bold\" font-family=\"monospace\">APPROVE</text>\n  <text x=\"300\" y=\"194\" text-anchor=\"middle\" fill=\"rgba(67,233,123,0.6)\" font-size=\"7.5\" font-family=\"monospace\">leaf node</text>\n  <rect x=\"390\" y=\"170\" width=\"70\" height=\"30\" fill=\"rgba(245,87,108,0.2)\" stroke=\"#f5576c\" stroke-width=\"1.5\" rx=\"6\"/>\n  <text x=\"425\" y=\"183\" text-anchor=\"middle\" fill=\"#f5576c\" font-size=\"9\" font-weight=\"bold\" font-family=\"monospace\">REJECT</text>\n  <text x=\"425\" y=\"194\" text-anchor=\"middle\" fill=\"rgba(245,87,108,0.6)\" font-size=\"7.5\" font-family=\"monospace\">leaf node</text>\n  <!-- Annotations -->\n  <text x=\"250\" y=\"222\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.5)\" font-size=\"9.5\" font-family=\"monospace\">Each split asks a Yes/No question that best separates the classes</text>\n  <text x=\"250\" y=\"237\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.5)\" font-size=\"9.5\" font-family=\"monospace\">The algorithm picks the feature+threshold that reduces impurity the most (Gini / Entropy)</text>\n  <!-- Overfitting warning -->\n  <rect x=\"60\" y=\"248\" width=\"380\" height=\"30\" fill=\"rgba(245,87,108,0.08)\" stroke=\"rgba(245,87,108,0.3)\" rx=\"6\"/>\n  <text x=\"250\" y=\"261\" text-anchor=\"middle\" fill=\"#f5576c\" font-size=\"9\" font-weight=\"bold\" font-family=\"monospace\">⚠️ Problem: Deep trees memorise training data (overfit)</text>\n  <text x=\"250\" y=\"274\" text-anchor=\"middle\" fill=\"rgba(245,87,108,0.7)\" font-size=\"9\" font-family=\"monospace\">Fix: max_depth, min_samples_split — or use Random Forest instead</text>\n</svg><div class=\"code-wrap\" style=\"margin-top:6px;\"><div class=\"code-header\"><span>decision_tree.py</span><span>python</span></div><pre><span class=\"kw\">from</span> sklearn.tree <span class=\"kw\">import</span> DecisionTreeClassifier, plot_tree\n<span class=\"kw\">from</span> sklearn.model_selection <span class=\"kw\">import</span> train_test_split\n<span class=\"kw\">from</span> sklearn.metrics <span class=\"kw\">import</span> accuracy_score\n<span class=\"kw\">import</span> matplotlib.pyplot <span class=\"kw\">as</span> plt\n\nX_train, X_test, y_train, y_test = train_test_split(X, y, test_size=<span class=\"nm\">0.2</span>, random_state=<span class=\"nm\">42</span>)\n\n<span class=\"cm\"># Without max_depth — will overfit!</span>\ndt_overfit = DecisionTreeClassifier(random_state=<span class=\"nm\">42</span>)\ndt_overfit.fit(X_train, y_train)\n<span class=\"fn\">print</span>(<span class=\"st\">f\"No limit  — train: {dt_overfit.score(X_train,y_train):.2%}  test: {dt_overfit.score(X_test,y_test):.2%}\"</span>)\n\n<span class=\"cm\"># With depth limit — balanced model</span>\ndt = DecisionTreeClassifier(max_depth=<span class=\"nm\">4</span>, min_samples_leaf=<span class=\"nm\">10</span>, random_state=<span class=\"nm\">42</span>)\ndt.fit(X_train, y_train)\n<span class=\"fn\">print</span>(<span class=\"st\">f\"Depth 4   — train: {dt.score(X_train,y_train):.2%}  test: {dt.score(X_test,y_test):.2%}\"</span>)\n\n<span class=\"cm\"># Visualise the tree</span>\nplt.figure(figsize=(<span class=\"nm\">14</span>, <span class=\"nm\">6</span>))\nplot_tree(dt, feature_names=X.columns, class_names=[<span class=\"st\">\"No\"</span>,<span class=\"st\">\"Yes\"</span>], filled=<span class=\"kw\">True</span>, rounded=<span class=\"kw\">True</span>)\nplt.tight_layout(); plt.show()</pre></div>"}, {"label": "Random Forest", "html": "<div class=\"section-tag\">Model 2</div><div class=\"slide-heading\">Random Forest — Why 500 Bad Trees Beat 1 Good One 🌲🌲🌲</div><div class=\"two-col\" style=\"margin-bottom:8px;\"><div><strong>The insight:</strong> One deep tree overfits. But if you train <em>many</em> shallow trees on <strong>random subsets of data and features</strong>, each makes different errors. When they vote together, the errors cancel out → much better generalisation.<br><br><strong>Two sources of randomness:</strong><br>• Bootstrap: each tree trains on a random 63% of rows (sampled with replacement)<br>• Feature subset: each split only considers √(n_features) features</div><div><strong>Strengths:</strong> Hard to overfit. No scaling needed. Built-in feature importance. Handles outliers well.<br><br><strong>Key parameters:</strong><br>• <code>n_estimators</code> — number of trees (100–500)<br>• <code>max_depth</code> — keep None or 10–20<br>• <code>max_features</code> — features per split<br>• <code>class_weight=\"balanced\"</code> — for imbalanced data<br>• <code>n_jobs=-1</code> — use all CPU cores</div></div><svg viewBox=\"0 0 540 250\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:540px;display:block;margin:4px auto;\">\n  <rect width=\"540\" height=\"250\" fill=\"rgba(0,0,0,0.45)\" rx=\"10\"/>\n  <text x=\"270\" y=\"18\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"12\" font-weight=\"bold\" font-family=\"monospace\">Random Forest — Many Trees Vote, Majority Wins</text>\n  <!-- Full dataset box -->\n  <rect x=\"195\" y=\"26\" width=\"150\" height=\"26\" fill=\"rgba(79,172,254,0.15)\" stroke=\"rgba(79,172,254,0.4)\" rx=\"6\"/>\n  <text x=\"270\" y=\"41\" text-anchor=\"middle\" fill=\"#4facfe\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">Full Dataset (N rows)</text>\n  <!-- Bootstrap sample arrows -->\n  <line x1=\"220\" y1=\"52\" x2=\"100\" y2=\"80\" stroke=\"rgba(255,255,255,0.3)\" stroke-width=\"1.5\" stroke-dasharray=\"4,3\"/>\n  <line x1=\"260\" y1=\"52\" x2=\"270\" y2=\"80\" stroke=\"rgba(255,255,255,0.3)\" stroke-width=\"1.5\" stroke-dasharray=\"4,3\"/>\n  <line x1=\"320\" y1=\"52\" x2=\"440\" y2=\"80\" stroke=\"rgba(255,255,255,0.3)\" stroke-width=\"1.5\" stroke-dasharray=\"4,3\"/>\n  <text x=\"152\" y=\"68\" fill=\"rgba(255,255,255,0.4)\" font-size=\"8.5\" font-family=\"monospace\">random</text>\n  <text x=\"152\" y=\"78\" fill=\"rgba(255,255,255,0.4)\" font-size=\"8.5\" font-family=\"monospace\">bootstrap</text>\n  <text x=\"350\" y=\"68\" fill=\"rgba(255,255,255,0.4)\" font-size=\"8.5\" font-family=\"monospace\">random</text>\n  <text x=\"350\" y=\"78\" fill=\"rgba(255,255,255,0.4)\" font-size=\"8.5\" font-family=\"monospace\">bootstrap</text>\n  <!-- Tree 1 -->\n  <rect x=\"48\" y=\"80\" width=\"104\" height=\"70\" fill=\"rgba(67,233,123,0.07)\" stroke=\"rgba(67,233,123,0.3)\" rx=\"7\"/>\n  <text x=\"100\" y=\"97\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"9\" font-weight=\"bold\" font-family=\"monospace\">Tree 1</text>\n  <text x=\"100\" y=\"110\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.45)\" font-size=\"8\" font-family=\"monospace\">random subset</text>\n  <text x=\"100\" y=\"121\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.45)\" font-size=\"8\" font-family=\"monospace\">of features too</text>\n  <rect x=\"60\" y=\"128\" width=\"76\" height=\"16\" fill=\"rgba(67,233,123,0.2)\" stroke=\"rgba(67,233,123,0.4)\" rx=\"4\"/>\n  <text x=\"98\" y=\"139\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"9\" font-weight=\"bold\" font-family=\"monospace\">→ SPAM ✓</text>\n  <!-- Tree 2 -->\n  <rect x=\"218\" y=\"80\" width=\"104\" height=\"70\" fill=\"rgba(255,209,102,0.07)\" stroke=\"rgba(255,209,102,0.3)\" rx=\"7\"/>\n  <text x=\"270\" y=\"97\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"9\" font-weight=\"bold\" font-family=\"monospace\">Tree 2</text>\n  <text x=\"270\" y=\"110\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.45)\" font-size=\"8\" font-family=\"monospace\">different sample</text>\n  <text x=\"270\" y=\"121\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.45)\" font-size=\"8\" font-family=\"monospace\">different features</text>\n  <rect x=\"232\" y=\"128\" width=\"76\" height=\"16\" fill=\"rgba(67,233,123,0.2)\" stroke=\"rgba(67,233,123,0.4)\" rx=\"4\"/>\n  <text x=\"270\" y=\"139\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"9\" font-weight=\"bold\" font-family=\"monospace\">→ SPAM ✓</text>\n  <!-- Tree 3 -->\n  <rect x=\"388\" y=\"80\" width=\"104\" height=\"70\" fill=\"rgba(139,92,246,0.07)\" stroke=\"rgba(139,92,246,0.3)\" rx=\"7\"/>\n  <text x=\"440\" y=\"97\" text-anchor=\"middle\" fill=\"#C4B5FD\" font-size=\"9\" font-weight=\"bold\" font-family=\"monospace\">Tree 500</text>\n  <text x=\"440\" y=\"110\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.45)\" font-size=\"8\" font-family=\"monospace\">yet another</text>\n  <text x=\"440\" y=\"121\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.45)\" font-size=\"8\" font-family=\"monospace\">bootstrap sample</text>\n  <rect x=\"402\" y=\"128\" width=\"76\" height=\"16\" fill=\"rgba(245,87,108,0.2)\" stroke=\"rgba(245,87,108,0.4)\" rx=\"4\"/>\n  <text x=\"440\" y=\"139\" text-anchor=\"middle\" fill=\"#f5576c\" font-size=\"9\" font-weight=\"bold\" font-family=\"monospace\">→ NOT SPAM ✗</text>\n  <!-- Arrows down to vote box -->\n  <line x1=\"100\" y1=\"150\" x2=\"180\" y2=\"180\" stroke=\"rgba(255,255,255,0.3)\" stroke-width=\"1.5\"/>\n  <line x1=\"270\" y1=\"150\" x2=\"270\" y2=\"180\" stroke=\"rgba(255,255,255,0.3)\" stroke-width=\"1.5\"/>\n  <line x1=\"440\" y1=\"150\" x2=\"360\" y2=\"180\" stroke=\"rgba(255,255,255,0.3)\" stroke-width=\"1.5\"/>\n  <!-- Vote box -->\n  <rect x=\"165\" y=\"180\" width=\"210\" height=\"40\" fill=\"rgba(79,172,254,0.15)\" stroke=\"#4facfe\" stroke-width=\"2\" rx=\"8\"/>\n  <text x=\"270\" y=\"196\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">🗳️  Majority Vote</text>\n  <text x=\"270\" y=\"212\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">SPAM wins (498/500 trees)</text>\n  <!-- Bottom stats -->\n  <text x=\"270\" y=\"236\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.5)\" font-size=\"9\" font-family=\"monospace\">Random Forest = Bagging (parallel) + random feature subsets → much lower variance than 1 tree</text>\n</svg><div class=\"code-wrap\" style=\"margin-top:6px;\"><div class=\"code-header\"><span>random_forest.py</span><span>python</span></div><pre><span class=\"kw\">from</span> sklearn.ensemble <span class=\"kw\">import</span> RandomForestClassifier\n<span class=\"kw\">from</span> sklearn.metrics <span class=\"kw\">import</span> classification_report\n<span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n<span class=\"kw\">import</span> matplotlib.pyplot <span class=\"kw\">as</span> plt\n\nrf = RandomForestClassifier(\n    n_estimators=<span class=\"nm\">300</span>,\n    max_depth=<span class=\"nm\">12</span>,\n    min_samples_leaf=<span class=\"nm\">5</span>,\n    class_weight=<span class=\"st\">\"balanced\"</span>,  <span class=\"cm\"># handles class imbalance</span>\n    n_jobs=-<span class=\"nm\">1</span>,\n    random_state=<span class=\"nm\">42</span>\n)\nrf.fit(X_train, y_train)\n\n<span class=\"cm\"># Detailed classification report</span>\n<span class=\"fn\">print</span>(classification_report(y_test, rf.predict(X_test)))\n\n<span class=\"cm\"># Predict probabilities (not just class)</span>\nproba = rf.predict_proba(X_test)[:, <span class=\"nm\">1</span>]  <span class=\"cm\"># prob of class 1</span>\n\n<span class=\"cm\"># Feature importance</span>\nfeat_imp = pd.Series(rf.feature_importances_, index=X.columns).sort_values(ascending=<span class=\"kw\">False</span>)\nfeat_imp.head(<span class=\"nm\">10</span>).plot(kind=<span class=\"st\">\"bar\"</span>, title=<span class=\"st\">\"Top 10 Important Features\"</span>)\nplt.tight_layout(); plt.show()</pre></div>"}, {"label": "Confusion Matrix", "html": "<div class=\"section-tag\">Evaluation</div>\n<h2 class=\"slide-heading\"></h2>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;flex:1;min-height:0;overflow:hidden;margin-top:6px;\">\n  <div style=\"display:flex;flex-direction:column;gap:8px;min-height:0;overflow:hidden;\">\n    \n    <div style=\"flex:1;overflow:hidden;display:flex;align-items:center;\">\n      <svg viewBox=\"0 0 500 270\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-height:220px;\">\n  <rect width=\"500\" height=\"270\" fill=\"rgba(0,0,0,0.45)\" rx=\"10\"/>\n  <text x=\"250\" y=\"18\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"12\" font-weight=\"bold\" font-family=\"monospace\">Confusion Matrix — What Did the Model Actually Get Right?</text>\n  <!-- Column headers -->\n  <text x=\"240\" y=\"36\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.6)\" font-size=\"10\" font-family=\"monospace\">Predicted</text>\n  <text x=\"188\" y=\"54\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"10\" font-family=\"monospace\">SPAM</text>\n  <text x=\"300\" y=\"54\" text-anchor=\"middle\" fill=\"#f5576c\" font-size=\"10\" font-family=\"monospace\">NOT SPAM</text>\n  <!-- Row header -->\n  <text x=\"55\" y=\"110\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.6)\" font-size=\"10\" font-family=\"monospace\" transform=\"rotate(-90,55,110)\">Actual</text>\n  <text x=\"90\" y=\"95\" fill=\"#43e97b\" font-size=\"10\" font-family=\"monospace\">SPAM</text>\n  <text x=\"90\" y=\"140\" fill=\"#f5576c\" font-size=\"10\" font-family=\"monospace\">NOT</text>\n  <text x=\"90\" y=\"153\" fill=\"#f5576c\" font-size=\"10\" font-family=\"monospace\">SPAM</text>\n  <!-- TP cell -->\n  <rect x=\"118\" y=\"60\" width=\"130\" height=\"75\" fill=\"rgba(67,233,123,0.25)\" stroke=\"#43e97b\" stroke-width=\"2.5\" rx=\"5\"/>\n  <text x=\"183\" y=\"88\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"26\" font-weight=\"bold\" font-family=\"monospace\">85</text>\n  <text x=\"183\" y=\"104\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"11\" font-weight=\"bold\" font-family=\"monospace\">TP</text>\n  <text x=\"183\" y=\"118\" text-anchor=\"middle\" fill=\"rgba(67,233,123,0.7)\" font-size=\"8.5\" font-family=\"monospace\">True Positive</text>\n  <text x=\"183\" y=\"129\" text-anchor=\"middle\" fill=\"rgba(67,233,123,0.7)\" font-size=\"8.5\" font-family=\"monospace\">Spam caught ✅</text>\n  <!-- FN cell -->\n  <rect x=\"258\" y=\"60\" width=\"130\" height=\"75\" fill=\"rgba(245,87,108,0.12)\" stroke=\"rgba(245,87,108,0.4)\" stroke-width=\"1.5\" rx=\"5\"/>\n  <text x=\"323\" y=\"88\" text-anchor=\"middle\" fill=\"#f5576c\" font-size=\"26\" font-weight=\"bold\" font-family=\"monospace\">15</text>\n  <text x=\"323\" y=\"104\" text-anchor=\"middle\" fill=\"#f5576c\" font-size=\"11\" font-weight=\"bold\" font-family=\"monospace\">FN</text>\n  <text x=\"323\" y=\"118\" text-anchor=\"middle\" fill=\"rgba(245,87,108,0.7)\" font-size=\"8.5\" font-family=\"monospace\">False Negative</text>\n  <text x=\"323\" y=\"129\" text-anchor=\"middle\" fill=\"rgba(245,87,108,0.7)\" font-size=\"8.5\" font-family=\"monospace\">Spam missed ❌</text>\n  <!-- FP cell -->\n  <rect x=\"118\" y=\"143\" width=\"130\" height=\"75\" fill=\"rgba(255,209,102,0.12)\" stroke=\"rgba(255,209,102,0.4)\" stroke-width=\"1.5\" rx=\"5\"/>\n  <text x=\"183\" y=\"171\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"26\" font-weight=\"bold\" font-family=\"monospace\">5</text>\n  <text x=\"183\" y=\"187\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"11\" font-weight=\"bold\" font-family=\"monospace\">FP</text>\n  <text x=\"183\" y=\"201\" text-anchor=\"middle\" fill=\"rgba(255,209,102,0.7)\" font-size=\"8.5\" font-family=\"monospace\">False Positive</text>\n  <text x=\"183\" y=\"212\" text-anchor=\"middle\" fill=\"rgba(255,209,102,0.7)\" font-size=\"8.5\" font-family=\"monospace\">Legit flagged ⚠️</text>\n  <!-- TN cell -->\n  <rect x=\"258\" y=\"143\" width=\"130\" height=\"75\" fill=\"rgba(79,172,254,0.15)\" stroke=\"rgba(79,172,254,0.35)\" stroke-width=\"1.5\" rx=\"5\"/>\n  <text x=\"323\" y=\"171\" text-anchor=\"middle\" fill=\"#4facfe\" font-size=\"26\" font-weight=\"bold\" font-family=\"monospace\">95</text>\n  <text x=\"323\" y=\"187\" text-anchor=\"middle\" fill=\"#4facfe\" font-size=\"11\" font-weight=\"bold\" font-family=\"monospace\">TN</text>\n  <text x=\"323\" y=\"201\" text-anchor=\"middle\" fill=\"rgba(79,172,254,0.7)\" font-size=\"8.5\" font-family=\"monospace\">True Negative</text>\n  <text x=\"323\" y=\"212\" text-anchor=\"middle\" fill=\"rgba(79,172,254,0.7)\" font-size=\"8.5\" font-family=\"monospace\">Legit left alone ✅</text>\n  <!-- Metrics bottom row -->\n  <text x=\"250\" y=\"237\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.6)\" font-size=\"9.5\" font-family=\"monospace\">Accuracy = (TP+TN)/(All) = 90%   Precision = TP/(TP+FP) = 94%   Recall = TP/(TP+FN) = 85%</text>\n  <text x=\"250\" y=\"252\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.45)\" font-size=\"9.5\" font-family=\"monospace\">F1 = 2 × Precision × Recall / (Precision + Recall) — balances both</text>\n  <text x=\"250\" y=\"266\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"9.5\" font-family=\"monospace\">Medical/fraud: minimise FN (recall matters).  Spam filter: minimise FP (precision matters).</text>\n</svg>\n    </div>\n  </div>\n  <div style=\"display:flex;flex-direction:column;min-height:0;overflow:hidden;\">\n    <div class=\"code-wrap\" style=\"flex:1;overflow:auto;min-height:0;\">\n      <div class=\"code-header\"><span>confusion_matrix.py</span><span>python</span></div>\n      <pre><span class=\"kw\">from</span> sklearn.metrics <span class=\"kw\">import</span> confusion_matrix, classification_report, ConfusionMatrixDisplay\n<span class=\"kw\">import</span> matplotlib.pyplot <span class=\"kw\">as</span> plt\n\npred = rf.predict(X_test)\n\n<span class=\"cm\"># Numeric confusion matrix</span>\ncm = confusion_matrix(y_test, pred)\n<span class=\"fn\">print</span>(<span class=\"st\">f\"TP={cm[1,1]}  FP={cm[0,1]}  FN={cm[1,0]}  TN={cm[0,0]}\"</span>)\n\n<span class=\"cm\"># Visual confusion matrix</span>\nfig, ax = plt.subplots(figsize=(<span class=\"nm\">5</span>, <span class=\"nm\">4</span>))\nConfusionMatrixDisplay.from_predictions(\n    y_test, pred,\n    display_labels=[<span class=\"st\">\"Not Spam\"</span>, <span class=\"st\">\"Spam\"</span>],\n    colorbar=<span class=\"kw\">False</span>,\n    ax=ax\n)\nplt.tight_layout(); plt.show()\n\n<span class=\"cm\"># Full report: precision, recall, f1 per class</span>\n<span class=\"fn\">print</span>(classification_report(y_test, pred, target_names=[<span class=\"st\">\"Not Spam\"</span>, <span class=\"st\">\"Spam\"</span>]))\n\n<span class=\"cm\"># Tune threshold: if recall matters more than precision</span>\nproba = rf.predict_proba(X_test)[:, <span class=\"nm\">1</span>]\npred_aggressive = (proba >= <span class=\"nm\">0.3</span>).astype(<span class=\"nm\">int</span>)   <span class=\"cm\"># catch more spam, more FP</span>\n<span class=\"fn\">print</span>(classification_report(y_test, pred_aggressive))</pre>\n    </div>\n  </div>\n</div>"}, {"label": "Handling Imbalanced Data", "html": "<div class=\"section-tag\">Real-World Problem</div><div class=\"slide-heading\">Handling Imbalanced Classes ⚖️</div><div class=\"highlight\">Real datasets are often imbalanced: 99% normal transactions, 1% fraud. A model that always predicts \"normal\" gets 99% accuracy but catches 0% of fraud.</div><div class=\"code-wrap\"><div class=\"code-header\"><span>imbalanced.py</span><span>python</span></div><pre><span class=\"kw\">from</span> sklearn.ensemble <span class=\"kw\">import</span> RandomForestClassifier\n<span class=\"kw\">from</span> sklearn.metrics <span class=\"kw\">import</span> classification_report\n<span class=\"kw\">from</span> imblearn.over_sampling <span class=\"kw\">import</span> SMOTE\n\n<span class=\"fn\">print</span>(y.value_counts())\n<span class=\"cm\"># class 0: 9800   class 1: 200  ← severely imbalanced!</span>\n\n<span class=\"cm\"># ── Strategy 1: class_weight (easiest) ────────────────────</span>\nrf = RandomForestClassifier(\n    class_weight=<span class=\"st\">\"balanced\"</span>,  <span class=\"cm\"># penalise minority misclassification more</span>\n    random_state=<span class=\"nm\">42</span>\n)\nrf.fit(X_train, y_train)\n\n<span class=\"cm\"># ── Strategy 2: SMOTE (oversample minority class) ────────</span>\nsmote = SMOTE(random_state=<span class=\"nm\">42</span>)\nX_res, y_res = smote.fit_resample(X_train, y_train)\n<span class=\"fn\">print</span>(<span class=\"st\">f\"After SMOTE: {pd.Series(y_res).value_counts().to_dict()}\"</span>)\nrf_smote = RandomForestClassifier(random_state=<span class=\"nm\">42</span>)\nrf_smote.fit(X_res, y_res)\n\n<span class=\"cm\"># ── Strategy 3: Adjust decision threshold ─────────────────</span>\ny_prob = rf.predict_proba(X_test)[:, <span class=\"nm\">1</span>]\ny_pred_custom = (y_prob > <span class=\"nm\">0.3</span>).astype(<span class=\"nm\">int</span>)  <span class=\"cm\"># lower threshold = more positives</span></pre></div><div class=\"tip\">💡 <strong>Always use F1 or ROC-AUC</strong> for imbalanced data — never accuracy. <code>class_weight=\"balanced\"</code> is the easiest first step.</div>"}, {"label": "XGBoost Classifier", "html": "<div class=\"section-tag\">Model 3</div><div class=\"slide-heading\">XGBoost Classifier — The Kaggle Standard 🏆</div><div class=\"code-wrap\"><div class=\"code-header\"><span>xgb_classifier.py</span><span>python</span></div><pre><span class=\"kw\">import</span> xgboost <span class=\"kw\">as</span> xgb\n<span class=\"kw\">from</span> sklearn.model_selection <span class=\"kw\">import</span> cross_val_score, GridSearchCV\n<span class=\"kw\">from</span> sklearn.metrics <span class=\"kw\">import</span> classification_report, roc_auc_score\n\n<span class=\"cm\"># ── Basic XGBoost classifier ──────────────────────────────</span>\nmodel = xgb.XGBClassifier(\n    n_estimators=<span class=\"nm\">200</span>,\n    max_depth=<span class=\"nm\">4</span>,\n    learning_rate=<span class=\"nm\">0.05</span>,\n    subsample=<span class=\"nm\">0.8</span>,\n    use_label_encoder=<span class=\"kw\">False</span>,\n    eval_metric=<span class=\"st\">\"logloss\"</span>,\n    random_state=<span class=\"nm\">42</span>\n)\nmodel.fit(X_train, y_train)\n\n<span class=\"fn\">print</span>(classification_report(y_test, model.predict(X_test)))\n<span class=\"fn\">print</span>(<span class=\"st\">f\"ROC-AUC: {roc_auc_score(y_test, model.predict_proba(X_test)[:,1]):.3f}\"</span>)\n\n<span class=\"cm\"># ── Tune key hyperparameters ──────────────────────────────</span>\nparam_grid = {\n    <span class=\"st\">\"max_depth\"</span>: [<span class=\"nm\">3</span>, <span class=\"nm\">5</span>, <span class=\"nm\">7</span>],\n    <span class=\"st\">\"learning_rate\"</span>: [<span class=\"nm\">0.01</span>, <span class=\"nm\">0.05</span>, <span class=\"nm\">0.1</span>],\n    <span class=\"st\">\"n_estimators\"</span>: [<span class=\"nm\">100</span>, <span class=\"nm\">200</span>]\n}\ngrid = GridSearchCV(xgb.XGBClassifier(random_state=<span class=\"nm\">42</span>, verbosity=<span class=\"nm\">0</span>),\n                    param_grid, cv=<span class=\"nm\">5</span>, scoring=<span class=\"st\">\"f1\"</span>, n_jobs=-<span class=\"nm\">1</span>)\ngrid.fit(X_train, y_train)\n<span class=\"fn\">print</span>(<span class=\"st\">f\"Best: {grid.best_params_}, F1={grid.best_score_:.3f}\"</span>)</pre></div>"}, {"label": "Session Recap", "html": "<div class=\"section-tag\">Session Recap</div><div class=\"slide-heading\">What You've Learned 🎉</div><div class=\"recap-grid\"><div class=\"recap-item\"><div class=\"recap-icon\">🌳</div><div class=\"recap-text\"><h4>Decision Trees</h4><p>Interpretable, learns IF-THEN rules. max_depth prevents overfitting. Always visualise the tree to understand decisions.</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">🌲</div><div class=\"recap-text\"><h4>Random Forest</h4><p>Ensemble of 100–500 trees. Much better than single tree. n_estimators, max_depth, min_samples_leaf are key params.</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">🏆</div><div class=\"recap-text\"><h4>XGBoost</h4><p>Gradient boosting — each tree fixes previous mistakes. Best for tabular data. Tune with GridSearchCV.</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">📊</div><div class=\"recap-text\"><h4>Confusion Matrix</h4><p>TP/FP/FN/TN. Precision = no false alarms. Recall = catch everything. F1 = balance. ROC-AUC = overall ranking.</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">⚖️</div><div class=\"recap-text\"><h4>Imbalanced Data</h4><p>class_weight=\"balanced\" (easiest). SMOTE (synthesise minority samples). Lower decision threshold. Never use accuracy alone.</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">🎯</div><div class=\"recap-text\"><h4>Which Metric?</h4><p>Spam filter → Precision. Cancer detection → Recall. General imbalanced → F1. Probability ranking → ROC-AUC.</p></div></div></div><div class=\"highlight\" style=\"margin-top:auto;\">🚀 <strong>Next:</strong> Session 12 — Neural Networks: build deep learning models with Keras</div>"}];



let cur=0;
const wrap=document.getElementById('slides-wrap');
const dotsEl=document.getElementById('dots');
function renderSlides(){
  wrap.innerHTML='';dotsEl.innerHTML='';
  SLIDES_DATA.forEach((s,i)=>{
    const div=document.createElement('div');
    div.className='slide'+(i===0?' active':'');
    div.innerHTML=s.html;
    wrap.appendChild(div);
    const dot=document.createElement('div');
    dot.className='dot'+(i===0?' active':'');
    dot.onclick=()=>jump(i);
    dotsEl.appendChild(dot);
  });
  updateUI();
}
function updateUI(){
  const t=SLIDES_DATA.length;
  document.getElementById('counter').textContent=(cur+1)+' / '+t;
  document.getElementById('progress-bar').style.width=((cur+1)/t*100)+'%';
  document.getElementById('slide-title-bar').textContent=SLIDES_DATA[cur].label||'';
  document.getElementById('prev-btn').disabled=cur===0;
  document.getElementById('next-btn').disabled=cur===t-1;
  document.querySelectorAll('.slide').forEach((el,i)=>el.classList.toggle('active',i===cur));
  document.querySelectorAll('.dot').forEach((el,i)=>el.classList.toggle('active',i===cur));
}
function go(d){jump(cur+d);}
function jump(i){if(i<0||i>=SLIDES_DATA.length)return;cur=i;updateUI();document.querySelectorAll('.slide')[cur].scrollTop=0;}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(1);}
  if(e.key==='ArrowLeft'){e.preventDefault();go(-1);}
  if(e.key==='f'||e.key==='F')toggleFS();
  if(e.key==='Home')jump(0);
  if(e.key==='End')jump(SLIDES_DATA.length-1);
});
function toggleFS(){if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen();}

let _tx=0;
document.addEventListener('touchstart',e=>{_tx=e.changedTouches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-_tx;
  if(Math.abs(dx)>50){go(dx<0?1:-1);}
},{passive:true});
renderSlides();
</script><script src="../access-guard.js"></script></body></html>
