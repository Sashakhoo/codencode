<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Session 15 — Project Planning & Capstone Execution</title><style>
:root{--accent:#f97583;--bg:#0f0f1a;--text:#e8e8f0;--muted:#8888aa;--code-bg:#0d1117;--card:#1e2240;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;user-select:none;}
#deck{width:100%;height:100vh;display:flex;flex-direction:column;}
#topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.06);flex-shrink:0;gap:12px;}
#session-label{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--accent);text-transform:uppercase;white-space:nowrap;}
#slide-title-bar{font-size:12px;color:var(--muted);flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#topbar-right{display:flex;gap:8px;align-items:center;flex-shrink:0;}
#counter{font-size:12px;color:var(--muted);white-space:nowrap;}
.btn{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);color:var(--text);border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer;transition:all 0.15s;}
.btn:hover{background:var(--accent);border-color:var(--accent);color:#000;}
#progress-wrap{height:3px;background:rgba(255,255,255,0.05);flex-shrink:0;}
#progress-bar{height:100%;background:var(--accent);transition:width 0.3s ease;}
#slides-wrap{flex:1;position:relative;overflow:hidden;}
.slide{position:absolute;inset:0;display:none;flex-direction:column;padding:32px 48px 24px;overflow-y:auto;animation:fadeIn 0.25s ease;}
.slide.active{display:flex;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
#nav{display:flex;align-items:center;justify-content:center;gap:16px;padding:10px 24px;flex-shrink:0;border-top:1px solid rgba(255,255,255,0.06);}
.nav-btn{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);color:var(--text);padding:7px 26px;border-radius:8px;font-size:14px;cursor:pointer;transition:all 0.15s;}
.nav-btn:hover:not(:disabled){background:var(--accent);border-color:var(--accent);color:#000;}
.nav-btn:disabled{opacity:0.3;cursor:default;}
#dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:600px;}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.2);cursor:pointer;transition:all 0.2s;}
.dot.active{background:var(--accent);transform:scale(1.5);}
.slide-title{align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at 50% 40%,#1e2a4a 0%,#0f0f1a 70%);}
.session-badge{font-size:11px;font-weight:800;letter-spacing:3px;color:var(--accent);text-transform:uppercase;margin-bottom:20px;padding:5px 16px;border:1px solid var(--accent);border-radius:20px;display:inline-block;}
.slide-title h1{font-size:clamp(26px,3.4vw,46px);font-weight:800;line-height:1.15;margin-bottom:16px;background:linear-gradient(135deg,#fff 30%,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;white-space:pre-line;}
.slide-title .sub{font-size:14px;color:var(--muted);max-width:580px;line-height:1.6;margin-bottom:28px;}
.academy-tag{font-size:12px;color:var(--muted);letter-spacing:1px;}
.section-tag{font-size:10px;font-weight:700;letter-spacing:2.5px;color:var(--accent);text-transform:uppercase;margin-bottom:6px;}
.slide-heading{font-size:clamp(17px,2.2vw,28px);font-weight:700;margin-bottom:14px;line-height:1.25;}
.cards{display:grid;gap:11px;}
.cards-2{grid-template-columns:1fr 1fr;}
.cards-3{grid-template-columns:1fr 1fr 1fr;}
.cards-4{grid-template-columns:1fr 1fr 1fr 1fr;}
.card{background:var(--card);border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:14px 16px;}
.card-accent{border-left:3px solid var(--accent);}
.card-icon{font-size:22px;margin-bottom:6px;}
.card h3{font-size:13px;font-weight:700;margin-bottom:4px;color:#fff;}
.card p{font-size:12px;color:var(--muted);line-height:1.55;}
.steps{display:flex;flex-direction:column;gap:9px;}
.step{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:10px;padding:11px 14px;border:1px solid rgba(255,255,255,0.06);}
.step-num{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#000;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.step-body h4{font-size:13px;font-weight:700;margin-bottom:2px;}
.step-body p{font-size:12px;color:var(--muted);line-height:1.5;}
.code-wrap{background:var(--code-bg);border-radius:10px;border:1px solid rgba(255,255,255,0.08);overflow:hidden;margin:8px 0;}
.code-header{background:rgba(255,255,255,0.05);padding:5px 13px;font-size:11px;color:var(--muted);font-family:monospace;display:flex;justify-content:space-between;align-items:center;}
pre{padding:11px 15px;overflow-x:auto;font-family:'Cascadia Code','Fira Code',Consolas,monospace;font-size:12px;line-height:1.7;color:#c9d1d9;}
.kw{color:#ff7b72;}.fn{color:#d2a8ff;}.st{color:#a5d6ff;}.cm{color:#8b949e;font-style:italic;}.nm{color:#79c0ff;}.op{color:#ff9e64;}
.highlight{background:rgba(255,255,255,0.04);border-left:4px solid var(--accent);border-radius:0 8px 8px 0;padding:10px 14px;margin:8px 0;font-size:13px;line-height:1.6;}
.highlight strong{color:var(--accent);}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;flex:1;}
.warn{background:rgba(255,100,50,0.1);border:1px solid rgba(255,100,50,0.3);border-radius:8px;padding:9px 13px;font-size:12px;margin:6px 0;}
.tip{background:rgba(80,220,100,0.1);border:1px solid rgba(80,220,100,0.3);border-radius:8px;padding:9px 13px;font-size:12px;margin:6px 0;}
.roadmap{display:grid;grid-template-columns:1fr 1fr;gap:9px;flex:1;}
.roadmap-item{background:var(--card);border-radius:12px;padding:12px;border:1px solid rgba(255,255,255,0.06);display:flex;gap:9px;align-items:flex-start;}
.rm-num{font-size:18px;font-weight:900;color:var(--accent);opacity:0.4;line-height:1;flex-shrink:0;width:22px;}
.rm-icon{font-size:17px;flex-shrink:0;}
.rm-text h4{font-size:12px;font-weight:700;margin-bottom:2px;}
.rm-text p{font-size:11px;color:var(--muted);line-height:1.5;}
.recap-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;flex:1;}
.recap-item{background:var(--card);border-radius:10px;padding:12px;border-left:3px solid var(--accent);display:flex;gap:8px;align-items:flex-start;}
.recap-icon{font-size:17px;flex-shrink:0;}
.recap-text h4{font-size:13px;font-weight:700;margin-bottom:2px;}
.recap-text p{font-size:11px;color:var(--muted);line-height:1.5;}
.e-list{display:flex;flex-direction:column;gap:8px;}
.e-item{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.55;}
.e-icon{font-size:15px;flex-shrink:0;}
table{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0;}
th{background:rgba(255,255,255,0.06);padding:7px 10px;text-align:left;font-weight:700;color:var(--accent);}
td{padding:6px 10px;border-top:1px solid rgba(255,255,255,0.05);color:var(--muted);}
.slide::-webkit-scrollbar{width:4px;}
.slide::-webkit-scrollbar-track{background:transparent;}
.slide::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:2px;}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:700;margin:2px;}
.tag-green{background:rgba(80,200,80,0.2);color:#50c850;border:1px solid rgba(80,200,80,0.3);}
.tag-blue{background:rgba(80,150,255,0.2);color:#79c0ff;border:1px solid rgba(80,150,255,0.3);}
.tag-orange{background:rgba(255,150,50,0.2);color:#ff9e64;border:1px solid rgba(255,150,50,0.3);}
.big-concept{background:linear-gradient(135deg,#1e2a4a,#1e2240);border:1px solid rgba(249,117,131,0.3);border-radius:14px;padding:20px 24px;margin:10px 0;text-align:center;}
.big-concept .bc-emoji{font-size:36px;margin-bottom:8px;}
.big-concept h2{font-size:20px;font-weight:800;color:#fff;margin-bottom:6px;}
.big-concept p{font-size:13px;color:var(--muted);line-height:1.6;}

@media(max-width:700px){
  body{overflow:auto;}
  #deck{height:auto;min-height:100vh;}
  #slides-wrap{height:auto;min-height:60vh;}
  .slide{position:relative;inset:auto;display:none;padding:16px 16px 12px;}
  .slide.active{display:flex;}
  .cards-2,.cards-3,.cards-4{grid-template-columns:1fr;}
  .two-col,.roadmap,.recap-grid{grid-template-columns:1fr;}
  #session-label{display:none;}
  #slide-title-bar{display:none;}
  pre{font-size:10px;line-height:1.6;}
  .nav-btn{padding:6px 14px;font-size:13px;}
  #dots{max-width:100%;}
  .dot{width:5px;height:5px;}
  .big-concept{padding:14px 16px;}
  .big-concept h2{font-size:16px;}
  .big-concept .bc-emoji{font-size:28px;}
  .slide-heading{font-size:18px;}
  #topbar{padding:8px 12px;gap:6px;}
  #nav{padding:8px 12px;gap:10px;}
  table{font-size:10px;}
  th,td{padding:5px 6px;}
  .card h3{font-size:12px;}
  .card p{font-size:11px;}
  .highlight,.tip,.warn{font-size:11px;}
  .step-body h4{font-size:12px;}
  .step-body p{font-size:11px;}
}
</style></head><body>

<div id="topbar"><div id="session-label">Session 15 · codencode Academy</div><div id="slide-title-bar"></div><div id="topbar-right"><span id="counter"></span><button class="btn" onclick="toggleFS()">⛶ Fullscreen</button></div></div>
<div id="progress-wrap"><div id="progress-bar"></div></div>

</div><script>
const SLIDES_DATA = [{"label": "Title", "note": "Final session! Everything comes together into one real project. Open with energy — whatever they build today can go on their portfolio.", "html": "<div class=\"slide-title\" style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;\"><div class=\"session-badge\">Session 15 of 15</div><div style=\"font-size:46px;margin-bottom:10px;\">🏆🎓</div><h1>Project Planning<br>&amp; Capstone Execution</h1><p class=\"sub\">The final boss. You will plan, build, evaluate, and present a full end-to-end machine learning project from scratch. This goes on your portfolio. This is what gets you hired.</p><div style=\"display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap;\"><span class=\"tag tag-blue\">Project Planning Framework</span><span class=\"tag tag-green\">Full ML Checklist</span><span class=\"tag tag-orange\">Project Ideas & Datasets</span><span class=\"tag tag-blue\">How to Present Results</span><span class=\"tag tag-green\">Your Learning Journey</span></div><div class=\"academy-tag\" style=\"margin-top:18px;\">codencode Academy · Python + Data Science</div></div>"}, {"label": "What Makes a Great ML Project", "note": "Not every idea is a good ML project. The most common mistake: picking a boring or impossible problem. The second: not having real data. Get them to articulate their idea before building anything.", "html": "<div class=\"section-tag\">Choose Well Before You Build</div><div class=\"slide-heading\">🎯 What Makes a Great ML Project?</div><div class=\"two-col\"><div><div class=\"card card-accent\"><div class=\"card-icon\">✅</div><h3>Signs of a GREAT project</h3><p>Real data you can download today · a clear prediction goal (one number or label) · a problem that matters to someone · enough rows (500+, ideally 5,000+) · a mix of numeric + categorical features · a baseline to beat.</p></div></div><div><div class=\"card card-accent\"><div class=\"card-icon\">❌</div><h3>Red flags to avoid</h3><p>\"Predict the stock market\" (too noisy) · \"I'll scrape Twitter\" (you won't finish) · \"95% accuracy from day 1\" (probably data leakage) · a dataset with 50 rows (too small to generalise).</p></div></div></div><div class=\"section-tag\">The 3-Question Project Test</div><div class=\"slide-heading\">🔑 Answer these before you touch code</div><div class=\"steps\"><div class=\"step\"><div class=\"step-num\">1</div><div class=\"step-body\"><h4>What am I predicting?</h4><p>\"I am predicting the [TARGET] from [FEATURES].\"</p></div></div><div class=\"step\"><div class=\"step-num\">2</div><div class=\"step-body\"><h4>Where is my data?</h4><p>\"My dataset is [SOURCE] and has [N] rows.\"</p></div></div><div class=\"step\"><div class=\"step-num\">3</div><div class=\"step-body\"><h4>How will I evaluate success?</h4><p>\"I will use [METRIC] because [REASON].\"</p></div></div></div><div class=\"tip\">💡 <strong>The \"explain to grandma\" rule:</strong> if you can't explain your project in 2 sentences a non-technical person understands, it's too complicated — or not clearly defined yet. Depth &gt; breadth for a capstone.</div>"}, {"label": "Capstone Roadmap", "note": "This is the project map — the exact same process every data scientist follows on the job. A checklist students can print and tick off as they build.", "html": "<div class=\"section-tag\">8 Milestones from Raw Data to Story</div><div class=\"slide-heading\">🗺️ Full ML Pipeline — Your Capstone Roadmap</div><div class=\"steps\"><div class=\"step\"><div class=\"step-num\">M1</div><div class=\"step-body\"><h4>Define the problem  <em>~15 min</em></h4><p>Write your 3-question test · choose regression or classification · pick your evaluation metric · identify your data source.</p></div></div><div class=\"step\"><div class=\"step-num\">M2</div><div class=\"step-body\"><h4>Load &amp; explore data  <em>~20 min</em></h4><p>Load CSV, check shape and dtypes · df.isnull().sum() · df.describe() for outliers · plot target distribution · correlation heatmap.</p></div></div><div class=\"step\"><div class=\"step-num\">M3</div><div class=\"step-body\"><h4>Clean &amp; preprocess  <em>~25 min</em></h4><p>Handle nulls · encode categoricals (LabelEncoder / get_dummies) · remove duplicates · cap or remove outliers · check df.isnull().sum() == 0.</p></div></div><div class=\"step\"><div class=\"step-num\">M4</div><div class=\"step-body\"><h4>Feature engineering  <em>~20 min</em></h4><p>Create 1–3 new features from existing cols · extract date parts · bin numerics if useful · drop redundant or low-importance cols.</p></div></div><div class=\"step\"><div class=\"step-num\">M5</div><div class=\"step-body\"><h4>Split &amp; scale  <em>~10 min</em></h4><p>train_test_split (80/20) · StandardScaler — fit on X_train ONLY, transform both · never touch X_test before this step.</p></div></div><div class=\"step\"><div class=\"step-num\">M6</div><div class=\"step-body\"><h4>Train models  <em>~20 min</em></h4><p>Start with a baseline (LogReg / Linear) · train Random Forest · train XGBoost · print the metric for each and compare.</p></div></div><div class=\"step\"><div class=\"step-num\">M7</div><div class=\"step-body\"><h4>Evaluate &amp; interpret  <em>~20 min</em></h4><p>classification_report or RMSE/R² · confusion matrix or actual-vs-predicted plot · feature importances bar chart · check for data leakage.</p></div></div><div class=\"step\"><div class=\"step-num\">M8</div><div class=\"step-body\"><h4>Present your story  <em>~15 min</em></h4><p>Problem → Data → Method → Result · state your best metric · explain 1 key insight · state 1 honest limitation · state 1 next step.</p></div></div></div>"}, {"label": "Project Ideas & Datasets", "note": "Stuck for ideas? These are proven starter projects with real downloadable data, all completable in a few hours. Pick the one that excites you most — motivation matters more than difficulty.", "html": "<div class=\"section-tag\">Pick What Excites You</div><div class=\"slide-heading\">💡 Project Ideas & Datasets</div><div class=\"cards cards-3\"><div class=\"card card-accent\"><div class=\"card-icon\">🚢</div><h3>Titanic Survival — ⭐</h3><p>Classification · target <em>survived</em> (0/1). Clean, famous, well-documented. Metric: Accuracy, F1. <em>kaggle.com/titanic</em></p></div><div class=\"card card-accent\"><div class=\"card-icon\">🏠</div><h3>House Price Prediction — ⭐⭐</h3><p>Regression · target <em>SalePrice</em>. Lots of features, great for feature engineering. Metric: RMSE, R². <em>kaggle.com/house-prices</em></p></div><div class=\"card card-accent\"><div class=\"card-icon\">😊</div><h3>Customer Churn — ⭐⭐</h3><p>Classification · target <em>Churn</em> (0/1). Business-relevant, imbalanced classes. Metric: F1, Precision/Recall. <em>kaggle telco churn</em></p></div><div class=\"card card-accent\"><div class=\"card-icon\">💳</div><h3>Credit Card Fraud — ⭐⭐⭐</h3><p>Classification · target <em>fraud</em> (0/1). 99.8% legit — teaches SMOTE, class_weight, threshold tuning. <em>kaggle credit card fraud</em></p></div><div class=\"card card-accent\"><div class=\"card-icon\">🌡️</div><h3>Energy Consumption Forecast — ⭐⭐⭐</h3><p>Regression / time series · target <em>power (kWh)</em>. Great for LSTM and lag features. <em>UCI Energy dataset</em></p></div><div class=\"card card-accent\"><div class=\"card-icon\">🏥</div><h3>Diabetes Risk — ⭐</h3><p>Classification · target <em>Outcome</em>. 8 clear features, 768 rows — perfect size, meaningful use case. <em>Pima Indians (UCI)</em></p></div></div><div class=\"tip\">🇲🇾 <strong>Local ideas:</strong> HDB resale price prediction (data.gov.sg) · Malaysia crime statistics by state (data.gov.my) · Grab/GOJEK demand forecast · PSLE score predictor. Government open data is great for local projects.</div>"}, {"label": "Structuring Your Notebook", "note": "How you go from 'homework' to 'portfolio project'. The storytelling matters as much as the code — recruiters and hiring managers read notebooks.", "html": "<div class=\"section-tag\">From Homework to Portfolio</div><div class=\"slide-heading\">📓 Structuring Your Notebook</div><div class=\"highlight\">📌 <strong>Key rule:</strong> every code cell is preceded by a markdown cell explaining WHAT you're doing and WHY. A recruiter should follow your logic without running anything.</div><div class=\"code-wrap\"><div class=\"code-header\"><span>notebook_skeleton.py</span><span>python</span></div><pre># Section 1  Problem Statement    - what we predict and why it matters\n# Section 2  Data Loading &amp; EDA    - what the data looks like, key observations\n# Section 3  Data Cleaning         - what we cleaned and why\n# Section 4  Feature Engineering   - new features created and the reasoning\n# Section 5  Modelling             - models tried, metrics, comparison\n# Section 6  Evaluation &amp; Insights - what the model learned, feature importances\n# Section 7  Conclusion            - key findings, limitations, next steps</pre></div><div class=\"two-col\"><div><div class=\"tip\">🏆 <strong>Portfolio-ready:</strong> clear problem statement at the top · dataset source &amp; description · every chart has a title and x/y labels · every metric interpreted, not just printed · honest limitations section · conclusion answers \"did we solve the problem?\"</div></div><div><div class=\"warn\">✗ <strong>Rookie mistakes:</strong> giant code cells with no explanation · printing raw 1000-row dataframes · no chart labels · metrics printed but not explained · no conclusion · variable names like df2, df3, df_final_final.</div></div></div><div class=\"highlight\">🚀 <strong>Ship it:</strong> push the finished notebook to GitHub, add a README with 3–5 sentences, and link it on LinkedIn. This is your first real portfolio piece.</div>"}, {"label": "Presenting Your Results", "note": "Most technical people can't communicate results. This teaches the most valuable non-technical skill: translating a number into a story. Role-play a presentation scenario.", "html": "<div class=\"section-tag\">Tell the Story, Not Just the Number</div><div class=\"slide-heading\">📊 Presenting Your Results</div><div class=\"two-col\"><div><div class=\"card card-accent\"><div class=\"card-icon\">❌</div><h3>Weak</h3><p>\"I trained a Random Forest. Accuracy is 82.5%. The confusion matrix shows 125 TP and 15 FP.\" → No context. What does 82.5% mean? Is that good? What does FP mean here?</p></div></div><div><div class=\"card card-accent\"><div class=\"card-icon\">✅</div><h3>Compelling</h3><p>\"I built a model to flag patients at risk of diabetes. It correctly identifies 82.5% of at-risk patients. The top predictor was glucose, then BMI. Out of 100 at-risk patients it flags 82 — missing 18.\" → A doctor, a manager, anyone understands this.</p></div></div></div><div class=\"section-tag\">The 5-Minute Presentation Structure</div><div class=\"slide-heading\">📐 Hook → Data → Method → Results → Reflection</div><div class=\"steps\"><div class=\"step\"><div class=\"step-num\">1</div><div class=\"step-body\"><h4>Hook  <em>30s</em></h4><p>What problem, why it matters.</p></div></div><div class=\"step\"><div class=\"step-num\">2</div><div class=\"step-body\"><h4>Data  <em>1 min</em></h4><p>Source, size, key features.</p></div></div><div class=\"step\"><div class=\"step-num\">3</div><div class=\"step-body\"><h4>Method  <em>1 min</em></h4><p>What model, why you chose it.</p></div></div><div class=\"step\"><div class=\"step-num\">4</div><div class=\"step-body\"><h4>Results  <em>1.5 min</em></h4><p>Best metric, what it means, one key insight.</p></div></div><div class=\"step\"><div class=\"step-num\">5</div><div class=\"step-body\"><h4>Reflection  <em>1 min</em></h4><p>One honest limitation + one next step.</p></div></div></div><div class=\"tip\">💬 <strong>Metrics in plain English:</strong> Accuracy 80% → \"8 of 10 predictions correct\" · R²=0.85 → \"85% of price variation explained\" · RMSE=25,000 → \"off by ~RM25k on average\" · F1=0.78 → \"balanced precision &amp; recall of 78%\". 🎙️ Record yourself once on your phone before the real thing.</div>"}, {"label": "Build Time", "note": "Hands-on building time — 60-90 minutes of uninterrupted project work. Walk around and help. Ask clarifying questions, don't write code for them. Check their problem definition before they touch data.", "html": "<div class=\"section-tag\">Your Capstone Starts Now</div><div class=\"slide-heading\">⚡ Build Time!</div><div class=\"highlight\">🏁 <strong>Your task:</strong> build milestones M1–M7 using the tools and knowledge from all 15 sessions. Use AI to accelerate — but understand every line. You have <strong>60–90 minutes</strong>.</div><div class=\"two-col\"><div><div class=\"card card-accent\"><div class=\"card-icon\">📋</div><h3>Before you write one line of code</h3><p>☐ I can complete the 3-question test ☐ I have downloaded the dataset and can open it in Jupyter ☐ I know if this is classification or regression ☐ I know which metric I'll use ☐ Trainer has approved my problem statement</p></div></div><div><div class=\"card card-accent\"><div class=\"card-icon\">⏱️</div><h3>Suggested time allocation</h3><p>Problem def + data load — 10 min · EDA — 20 min · cleaning + feature engineering — 20 min · modelling (2–3 models) — 20 min · evaluation + conclusion — 10 min</p></div></div></div><div class=\"code-wrap\"><div class=\"code-header\"><span>start_prompt.txt</span><span>prompt</span></div><pre>I am building an ML project to predict [TARGET] from [DATASET].\nGenerate a complete Jupyter notebook structure with section headers,\na skeleton for each stage (load, clean, model, evaluate), and comments\nexplaining what to fill in at each step.</pre></div><div class=\"warn\">⚠️ <strong>Stuck?</strong> Can you run df.head()? Does df.info() show the right dtypes? Does df.isnull().sum() show nulls you haven't handled? What do the last 3 lines of the traceback say?</div>"}, {"label": "Evaluation Quick Reference", "note": "Quick reference card for choosing the right metric. Students often use the wrong one. Classification = accuracy/F1, imbalanced = F1 or AUC, regression = RMSE/R².", "html": "<div class=\"section-tag\">Pick the Right Metric</div><div class=\"slide-heading\">📐 Evaluation Quick Reference</div><div class=\"two-col\"><div><div class=\"card card-accent\"><div class=\"card-icon\">📊</div><h3>Classification</h3><p><strong>Accuracy</strong> — balanced classes (Titanic, iris). <br><strong>F1 (macro)</strong> — imbalanced (fraud, churn); balances precision &amp; recall. <br><strong>Recall</strong> — when false negatives are costly (disease, fraud). <br><strong>ROC-AUC</strong> — threshold-independent ranking; great for imbalanced.</p></div></div><div><div class=\"card card-accent\"><div class=\"card-icon\">📉</div><h3>Regression</h3><p><strong>RMSE</strong> — average error in target units; penalises big errors (RMSE=25000 → ±$25k). <br><strong>R²</strong> — % of variance explained (0.85 great, 0.40 weak, 0.99 first try → check leakage). <br><strong>MAE</strong> — like RMSE but treats all errors equally; more honest average.</p></div></div></div><div class=\"highlight\">📌 <strong>Decision tree:</strong> Binary? → Accuracy (balanced) or F1 (imbalanced). Multi-class? → Macro F1. Regression? → RMSE + R² together. Health / fraud? → always add Recall.</div>"}, {"label": "Your Learning Journey", "note": "The emotional peak of the course. Walk through every session. Pause on each: 'Remember when you learned X?' Let students feel the weight of how much they covered.", "html": "<div class=\"section-tag\">All 15 Sessions</div><div class=\"slide-heading\">🗺️ Your Learning Journey</div><div class=\"cards cards-3\"><div class=\"card card-accent\"><div class=\"card-icon\">🐍</div><h3>Foundation · Sessions 1–5</h3><p>Python basics &amp; intermediate, Pandas, NumPy &amp; math, data wrangling, visualisation with Matplotlib &amp; Seaborn.</p></div><div class=\"card card-accent\"><div class=\"card-icon\">📊</div><h3>Data &amp; ML Basics · Sessions 6–9</h3><p>APIs &amp; real data, statistics &amp; probability, feature engineering, and your first ML models.</p></div><div class=\"card card-accent\"><div class=\"card-icon\">🤖</div><h3>Advanced ML · Sessions 10–15</h3><p>Regression, Random Forest, neural networks, LSTM &amp; time series, vibe coding, and the capstone.</p></div></div><div class=\"highlight\">🏆 <strong>What you have actually mastered:</strong> you went from \"how do I print hello world\" to building neural networks and LSTM models for time-series forecasting — with Python, real datasets, and real ML libraries. That is industry-relevant skill, not beginner knowledge.</div>"}, {"label": "What's Next", "note": "The 'now what?' slide. Give concrete next steps — specific resources, specific skills, specific career paths.", "html": "<div class=\"section-tag\">Your Path Forward</div><div class=\"slide-heading\">🚀 What's Next?</div><div class=\"cards cards-3\"><div class=\"card card-accent\"><div class=\"card-icon\">🐬</div><h3>SQL for Data Science</h3><p>90% of data jobs require it. Mode Analytics has a free course; practice at sql-practice.com.</p></div><div class=\"card card-accent\"><div class=\"card-icon\">📊</div><h3>Tableau / Power BI</h3><p>Employers love analysts who can visualise insights. Tableau Public is free — do the getting-started tutorial.</p></div><div class=\"card card-accent\"><div class=\"card-icon\">☁️</div><h3>Cloud ML (AWS / GCP / Azure)</h3><p>Deploying models to production is the next frontier. AWS SageMaker free tier and Google Colab are the easiest entry.</p></div></div><div class=\"cards cards-3\"><div class=\"card card-accent\"><div class=\"card-icon\">📈</div><h3>Data Analyst</h3><p>SQL + Tableau + Python EDA. Entry role at most companies. KL starting: RM3,500–6,500.</p></div><div class=\"card card-accent\"><div class=\"card-icon\">🤖</div><h3>ML Engineer</h3><p>Builds &amp; deploys models at scale. Deeper Python + cloud. Starting: RM5,000–9,000.</p></div><div class=\"card card-accent\"><div class=\"card-icon\">🧬</div><h3>Data Scientist</h3><p>EDA + modelling + storytelling + domain expertise. Starting: RM4,500–8,000.</p></div></div><div class=\"tip\">🏗️ <strong>Build your portfolio — 3 projects is enough:</strong> 1 classification (Titanic / churn) + 1 regression (house prices) + your capstone dataset. Upload all 3 to GitHub, write a LinkedIn post about each.</div>"}, {"label": "You Did It", "note": "The final slide. Celebrate! 15 sessions of Python and ML is a real accomplishment. End on energy and warmth; encourage them to share their capstone projects.", "html": "<div class=\"section-tag\">15 Sessions. One Real ML Engineer.</div><div class=\"slide-heading\">🎓 You Did It!</div><div class=\"recap-grid\"><div class=\"recap-item\"><div class=\"recap-icon\">🐍</div><div class=\"recap-text\"><h4>Python</h4><p>From scratch to advanced OOP.</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">🐼</div><div class=\"recap-text\"><h4>Pandas &amp; NumPy</h4><p>Data wrangling at speed.</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">📊</div><div class=\"recap-text\"><h4>Visualisation</h4><p>Matplotlib &amp; Seaborn.</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">🌐</div><div class=\"recap-text\"><h4>Real Data</h4><p>APIs, JSON parsing, messy datasets.</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">📈</div><div class=\"recap-text\"><h4>Statistics</h4><p>Probability, distributions, inference.</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">🔧</div><div class=\"recap-text\"><h4>Feature Engineering</h4><p>The secret sauce.</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">🤖</div><div class=\"recap-text\"><h4>Classical ML</h4><p>Regression, Random Forest, XGBoost.</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">🧠</div><div class=\"recap-text\"><h4>Deep Learning</h4><p>Neural networks, backprop, Keras, LSTM.</p></div></div></div><div class=\"highlight\">📣 <strong>Share your project!</strong> Tag <strong>@codencode</strong> and use <strong>#codencodeML</strong> — we'd love to feature your work. 🎓 Congratulations, Data Scientist!</div><div class=\"academy-tag\" style=\"margin-top:12px;\">codencode · codencode.my · hello@codencode.my · +60 19-681 1628 · KL · JB · Online · LinkedIn @codencode · IG @codencode.my</div>"}];


let cur=0;
const wrap=document.getElementById('slides-wrap');
const dotsEl=document.getElementById('dots');
function renderSlides(){
  wrap.innerHTML='';dotsEl.innerHTML='';
  SLIDES_DATA.forEach((s,i)=>{
    const div=document.createElement('div');
    div.className='slide'+(i===0?' active':'');
    div.innerHTML=s.html;if(s.note)div.dataset.notes=s.note;
    wrap.appendChild(div);
    const dot=document.createElement('div');
    dot.className='dot'+(i===0?' active':'');
    dot.onclick=()=>jump(i);
    dotsEl.appendChild(dot);
  });
  updateUI();
}
function updateUI(){
  const t=SLIDES_DATA.length;
  document.getElementById('counter').textContent=(cur+1)+' / '+t;
  document.getElementById('progress-bar').style.width=((cur+1)/t*100)+'%';
  document.getElementById('slide-title-bar').textContent=SLIDES_DATA[cur].label||'';
  document.getElementById('prev-btn').disabled=cur===0;
  document.getElementById('next-btn').disabled=cur===t-1;
  document.querySelectorAll('.slide').forEach((el,i)=>el.classList.toggle('active',i===cur));
  document.querySelectorAll('.dot').forEach((el,i)=>el.classList.toggle('active',i===cur));
}
function go(d){jump(cur+d);}
function jump(i){if(i<0||i>=SLIDES_DATA.length)return;cur=i;updateUI();document.querySelectorAll('.slide')[cur].scrollTop=0;}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(1);}
  if(e.key==='ArrowLeft'){e.preventDefault();go(-1);}
  if(e.key==='f'||e.key==='F')toggleFS();
  if(e.key==='Home')jump(0);
  if(e.key==='End')jump(SLIDES_DATA.length-1);
});
function toggleFS(){if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen();}

let _tx=0;
document.addEventListener('touchstart',e=>{_tx=e.changedTouches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-_tx;
  if(Math.abs(dx)>50){go(dx<0?1:-1);}
},{passive:true});
renderSlides();

</style>
<script id="codencode-copy-script">
(function(){
  function addCopy(){
    document.querySelectorAll('.code-wrap').forEach(function(w){
      var hdr=w.querySelector('.code-header'), pre=w.querySelector('pre');
      if(!hdr||!pre||hdr.querySelector('.copy-btn'))return;
      var b=document.createElement('button');
      b.className='copy-btn';b.type='button';b.textContent='Copy';
      b.addEventListener('click',function(ev){
        ev.stopPropagation();
        var t=pre.innerText.replace(/\u00a0/g,' ');
        function ok(){b.textContent='Copied';b.classList.add('done');setTimeout(function(){b.textContent='Copy';b.classList.remove('done');},1400);}
        if(navigator.clipboard&&navigator.clipboard.writeText){
          navigator.clipboard.writeText(t).then(ok).catch(fallback);
        }else{fallback();}
        function fallback(){
          var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
          document.body.appendChild(ta);ta.select();
          try{document.execCommand('copy');ok();}catch(e){}
          document.body.removeChild(ta);
        }
      });
      hdr.appendChild(b);
    });
  }
  if(document.readyState!=='loading')addCopy();
  document.addEventListener('DOMContentLoaded',addCopy);
  setTimeout(addCopy,400);
})();
</script>
