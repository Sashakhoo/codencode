<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Session 03 — Python Data Structures & Functions</title><style>
:root{--accent:#f97583;--bg:#0f0f1a;--text:#e8e8f0;--muted:#8888aa;--code-bg:#0d1117;--card:#1e2240;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;user-select:none;}
#deck{width:100%;height:100vh;display:flex;flex-direction:column;}
#topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.06);flex-shrink:0;gap:12px;}
#session-label{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--accent);text-transform:uppercase;white-space:nowrap;}
#slide-title-bar{font-size:12px;color:var(--muted);flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#topbar-right{display:flex;gap:8px;align-items:center;flex-shrink:0;}
#counter{font-size:12px;color:var(--muted);white-space:nowrap;}
.btn{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);color:var(--text);border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer;transition:all 0.15s;}
.btn:hover{background:var(--accent);border-color:var(--accent);color:#000;}
#progress-wrap{height:3px;background:rgba(255,255,255,0.05);flex-shrink:0;}
#progress-bar{height:100%;background:var(--accent);transition:width 0.3s ease;}
#slides-wrap{flex:1;position:relative;overflow:hidden;}
.slide{position:absolute;inset:0;display:none;flex-direction:column;padding:32px 48px 24px;overflow-y:auto;animation:fadeIn 0.25s ease;}
.slide.active{display:flex;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
#nav{display:flex;align-items:center;justify-content:center;gap:16px;padding:10px 24px;flex-shrink:0;border-top:1px solid rgba(255,255,255,0.06);}
.nav-btn{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);color:var(--text);padding:7px 26px;border-radius:8px;font-size:14px;cursor:pointer;transition:all 0.15s;}
.nav-btn:hover:not(:disabled){background:var(--accent);border-color:var(--accent);color:#000;}
.nav-btn:disabled{opacity:0.3;cursor:default;}
#dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:600px;}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.2);cursor:pointer;transition:all 0.2s;}
.dot.active{background:var(--accent);transform:scale(1.5);}
.slide-title{align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at 50% 40%,#1e2a4a 0%,#0f0f1a 70%);}
.session-badge{font-size:11px;font-weight:800;letter-spacing:3px;color:var(--accent);text-transform:uppercase;margin-bottom:20px;padding:5px 16px;border:1px solid var(--accent);border-radius:20px;display:inline-block;}
.slide-title h1{font-size:clamp(26px,3.4vw,46px);font-weight:800;line-height:1.15;margin-bottom:16px;background:linear-gradient(135deg,#fff 30%,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;white-space:pre-line;}
.slide-title .sub{font-size:14px;color:var(--muted);max-width:580px;line-height:1.6;margin-bottom:28px;}
.academy-tag{font-size:12px;color:var(--muted);letter-spacing:1px;}
.section-tag{font-size:10px;font-weight:700;letter-spacing:2.5px;color:var(--accent);text-transform:uppercase;margin-bottom:6px;}
.slide-heading{font-size:clamp(17px,2.2vw,28px);font-weight:700;margin-bottom:14px;line-height:1.25;}
.cards{display:grid;gap:11px;}
.cards-2{grid-template-columns:1fr 1fr;}
.cards-3{grid-template-columns:1fr 1fr 1fr;}
.cards-4{grid-template-columns:1fr 1fr 1fr 1fr;}
.card{background:var(--card);border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:14px 16px;}
.card-accent{border-left:3px solid var(--accent);}
.card-icon{font-size:22px;margin-bottom:6px;}
.card h3{font-size:13px;font-weight:700;margin-bottom:4px;color:#fff;}
.card p{font-size:12px;color:var(--muted);line-height:1.55;}
.steps{display:flex;flex-direction:column;gap:9px;}
.step{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:10px;padding:11px 14px;border:1px solid rgba(255,255,255,0.06);}
.step-num{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#000;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.step-body h4{font-size:13px;font-weight:700;margin-bottom:2px;}
.step-body p{font-size:12px;color:var(--muted);line-height:1.5;}
.code-wrap{background:var(--code-bg);border-radius:10px;border:1px solid rgba(255,255,255,0.08);overflow:hidden;margin:8px 0;}
.code-header{background:rgba(255,255,255,0.05);padding:5px 13px;font-size:11px;color:var(--muted);font-family:monospace;display:flex;justify-content:space-between;align-items:center;}
pre{padding:11px 15px;overflow-x:auto;font-family:'Cascadia Code','Fira Code',Consolas,monospace;font-size:12px;line-height:1.7;color:#c9d1d9;}
.kw{color:#ff7b72;}.fn{color:#d2a8ff;}.st{color:#a5d6ff;}.cm{color:#8b949e;font-style:italic;}.nm{color:#79c0ff;}.op{color:#ff9e64;}
.highlight{background:rgba(255,255,255,0.04);border-left:4px solid var(--accent);border-radius:0 8px 8px 0;padding:10px 14px;margin:8px 0;font-size:13px;line-height:1.6;}
.highlight strong{color:var(--accent);}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;flex:1;}
.warn{background:rgba(255,100,50,0.1);border:1px solid rgba(255,100,50,0.3);border-radius:8px;padding:9px 13px;font-size:12px;margin:6px 0;}
.tip{background:rgba(80,220,100,0.1);border:1px solid rgba(80,220,100,0.3);border-radius:8px;padding:9px 13px;font-size:12px;margin:6px 0;}
.roadmap{display:grid;grid-template-columns:1fr 1fr;gap:9px;flex:1;}
.roadmap-item{background:var(--card);border-radius:12px;padding:12px;border:1px solid rgba(255,255,255,0.06);display:flex;gap:9px;align-items:flex-start;}
.rm-num{font-size:18px;font-weight:900;color:var(--accent);opacity:0.4;line-height:1;flex-shrink:0;width:22px;}
.rm-icon{font-size:17px;flex-shrink:0;}
.rm-text h4{font-size:12px;font-weight:700;margin-bottom:2px;}
.rm-text p{font-size:11px;color:var(--muted);line-height:1.5;}
.recap-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;flex:1;}
.recap-item{background:var(--card);border-radius:10px;padding:12px;border-left:3px solid var(--accent);display:flex;gap:8px;align-items:flex-start;}
.recap-icon{font-size:17px;flex-shrink:0;}
.recap-text h4{font-size:13px;font-weight:700;margin-bottom:2px;}
.recap-text p{font-size:11px;color:var(--muted);line-height:1.5;}
.e-list{display:flex;flex-direction:column;gap:8px;}
.e-item{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.55;}
.e-icon{font-size:15px;flex-shrink:0;}
table{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0;}
th{background:rgba(255,255,255,0.06);padding:7px 10px;text-align:left;font-weight:700;color:var(--accent);}
td{padding:6px 10px;border-top:1px solid rgba(255,255,255,0.05);color:var(--muted);}
.slide::-webkit-scrollbar{width:4px;}
.slide::-webkit-scrollbar-track{background:transparent;}
.slide::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:2px;}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:700;margin:2px;}
.tag-green{background:rgba(80,200,80,0.2);color:#50c850;border:1px solid rgba(80,200,80,0.3);}
.tag-blue{background:rgba(80,150,255,0.2);color:#79c0ff;border:1px solid rgba(80,150,255,0.3);}
.tag-orange{background:rgba(255,150,50,0.2);color:#ff9e64;border:1px solid rgba(255,150,50,0.3);}
.big-concept{background:linear-gradient(135deg,#1e2a4a,#1e2240);border:1px solid rgba(249,117,131,0.3);border-radius:14px;padding:20px 24px;margin:10px 0;text-align:center;}
.big-concept .bc-emoji{font-size:36px;margin-bottom:8px;}
.big-concept h2{font-size:20px;font-weight:800;color:#fff;margin-bottom:6px;}
.big-concept p{font-size:13px;color:var(--muted);line-height:1.6;}

@media(max-width:700px){
  body{overflow:auto;}
  #deck{height:auto;min-height:100vh;}
  #slides-wrap{height:auto;min-height:60vh;}
  .slide{position:relative;inset:auto;display:none;padding:16px 16px 12px;}
  .slide.active{display:flex;}
  .cards-2,.cards-3,.cards-4{grid-template-columns:1fr;}
  .two-col,.roadmap,.recap-grid{grid-template-columns:1fr;}
  #session-label{display:none;}
  #slide-title-bar{display:none;}
  pre{font-size:10px;line-height:1.6;}
  .nav-btn{padding:6px 14px;font-size:13px;}
  #dots{max-width:100%;}
  .dot{width:5px;height:5px;}
  .big-concept{padding:14px 16px;}
  .big-concept h2{font-size:16px;}
  .big-concept .bc-emoji{font-size:28px;}
  .slide-heading{font-size:18px;}
  #topbar{padding:8px 12px;gap:6px;}
  #nav{padding:8px 12px;gap:10px;}
  table{font-size:10px;}
  th,td{padding:5px 6px;}
  .card h3{font-size:12px;}
  .card p{font-size:11px;}
  .highlight,.tip,.warn{font-size:11px;}
  .step-body h4{font-size:12px;}
  .step-body p{font-size:11px;}
}
</style></head><body>

<div id="topbar"><div id="session-label">Session 03 · codencode Academy</div><div id="slide-title-bar"></div><div id="topbar-right"><span id="counter"></span><button class="btn" onclick="toggleFS()">⛶ Fullscreen</button></div></div>

</div><script>
const SLIDES_DATA = [{"label": "Title", "html": "<div class=\"slide-title\" style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;\"><div class=\"session-badge\">Session 03 of 15</div><div style=\"font-size:48px;margin-bottom:12px;\">&#x1F4DA;</div><h1>Python Data Structures<br>&amp; Functions</h1><p class=\"sub\">Lists, Tuples, Dictionaries, Functions &amp; Modules — the complete Python toolkit before data science begins</p><div class=\"academy-tag\">codencode Academy · Python + Data Science</div></div>"}, {"label": "Today's Roadmap", "html": "<div class=\"section-tag\">Today's Roadmap</div><div class=\"slide-heading\">What We'll Cover &#x1F5FA;&#xFE0F;</div><div class=\"roadmap\"><div class=\"roadmap-item\"><div class=\"rm-num\">1</div><div class=\"rm-icon\">&#x1F4CB;</div><div class=\"rm-text\"><h4>Lists</h4><p>Ordered, changeable collections — the most used data structure in Python</p></div></div><div class=\"roadmap-item\"><div class=\"rm-num\">2</div><div class=\"rm-icon\">&#x1F512;</div><div class=\"rm-text\"><h4>Tuples</h4><p>Like lists, but locked — when your data must never change</p></div></div><div class=\"roadmap-item\"><div class=\"rm-num\">3</div><div class=\"rm-icon\">&#x1F5DD;&#xFE0F;</div><div class=\"rm-text\"><h4>Dictionaries</h4><p>Key &rarr; Value lookup tables — name your data, access it instantly</p></div></div><div class=\"roadmap-item\"><div class=\"rm-num\">4</div><div class=\"rm-icon\">&#x1F4CA;</div><div class=\"rm-text\"><h4>Choosing the Right One</h4><p>List vs Tuple vs Dict — a clear decision framework</p></div></div><div class=\"roadmap-item\"><div class=\"rm-num\">5</div><div class=\"rm-icon\">&#x2699;&#xFE0F;</div><div class=\"rm-text\"><h4>Functions</h4><p>Write once, reuse everywhere — the core of good code</p></div></div><div class=\"roadmap-item\"><div class=\"rm-num\">6</div><div class=\"rm-icon\">&#x1F4E6;</div><div class=\"rm-text\"><h4>Modules</h4><p>Import thousands of pre-built tools instantly</p></div></div><div class=\"roadmap-item\"><div class=\"rm-num\">7</div><div class=\"rm-icon\">&#x1F4BB;</div><div class=\"rm-text\"><h4>Code Labs</h4><p>Build a menu system, order tracker, and stock analyser</p></div></div><div class=\"roadmap-item\"><div class=\"rm-num\">8</div><div class=\"rm-icon\">&#x1F4DA;</div><div class=\"rm-text\"><h4>Recap &amp; Homework</h4><p>Consolidate and practice</p></div></div></div>"}, {"label": "Lists — What & Why", "html": "<div class=\"section-tag\">Data Structure 1</div><div class=\"slide-heading\">Lists — Ordered, Changeable Collections &#x1F4CB;</div><div class=\"big-concept\"><div class=\"bc-emoji\">&#x1F6D2;</div><h2>A List stores many values in order, in one variable</h2><p>Like a shopping basket — you can add items, remove items, check what's inside, and change anything. Order matters and is preserved.</p></div><div class=\"cards cards-3\" style=\"margin-top:10px;\"><div class=\"card card-accent\"><div class=\"card-icon\">&#x2753;</div><h3>What is a List?</h3><p>An ordered collection of values inside square brackets <code>[]</code>. Each value is called an <strong>element</strong>. Elements can be any type — numbers, strings, booleans, even other lists.</p></div><div class=\"card card-accent\"><div class=\"card-icon\">&#x1F4A1;</div><h3>Why Use a List?</h3><p>Instead of 10 separate variables (item1, item2, item3...), store them all in one. Loop over them, sort them, filter them — all in one line.</p></div><div class=\"card card-accent\"><div class=\"card-icon\">&#x1F3AF;</div><h3>When to Use?</h3><p>When you have a collection of similar items that might change: menu items, daily sales figures, stock tickers, customer orders, search results.</p></div></div>"}, {"label": "Lists — Code Examples", "html": "<div class=\"section-tag\">Lists in Action</div><div class=\"slide-heading\">Lists — Creating, Accessing, Modifying &#x1F4BB;</div><div class=\"code-wrap\"><div class=\"code-header\"><span>lists.py</span><span>python</span></div><pre><span class=\"cm\"># ── Create ─────────────────────────────────────────</span>\nmenu   = [<span class=\"st\">\"Big Mac\"</span>, <span class=\"st\">\"McFlurry\"</span>, <span class=\"st\">\"Fries\"</span>, <span class=\"st\">\"Coke\"</span>]\nprices = [<span class=\"nm\">5.99</span>, <span class=\"nm\">3.49</span>, <span class=\"nm\">2.99</span>, <span class=\"nm\">1.99</span>]\nmixed  = [<span class=\"st\">\"Alice\"</span>, <span class=\"nm\">42</span>, <span class=\"kw\">True</span>, <span class=\"nm\">3.14</span>]  <span class=\"cm\"># any types</span>\n\n<span class=\"cm\"># ── Access (index starts at 0!) ────────────────────</span>\n<span class=\"fn\">print</span>(menu[<span class=\"nm\">0</span>])     <span class=\"cm\"># \"Big Mac\"   ← first item</span>\n<span class=\"fn\">print</span>(menu[<span class=\"nm\">2</span>])     <span class=\"cm\"># \"Fries\"     ← third item</span>\n<span class=\"fn\">print</span>(menu[-<span class=\"nm\">1</span>])    <span class=\"cm\"># \"Coke\"      ← last item</span>\n<span class=\"fn\">print</span>(menu[-<span class=\"nm\">2</span>])    <span class=\"cm\"># \"Fries\"     ← second from end</span>\n\n<span class=\"cm\"># ── Slicing — get a sub-list ───────────────────────</span>\n<span class=\"fn\">print</span>(menu[<span class=\"nm\">0</span>:<span class=\"nm\">2</span>])   <span class=\"cm\"># [\"Big Mac\", \"McFlurry\"]</span>\n<span class=\"fn\">print</span>(menu[<span class=\"nm\">1</span>:])    <span class=\"cm\"># [\"McFlurry\",\"Fries\",\"Coke\"]</span>\n<span class=\"fn\">print</span>(menu[:<span class=\"nm\">2</span>])    <span class=\"cm\"># [\"Big Mac\",\"McFlurry\"]</span>\n\n<span class=\"cm\"># ── Modify (lists are mutable!) ────────────────────</span>\nmenu[<span class=\"nm\">1</span>] = <span class=\"st\">\"Oreo McFlurry\"</span>   <span class=\"cm\"># change item</span>\nmenu.append(<span class=\"st\">\"Apple Pie\"</span>)      <span class=\"cm\"># add to end</span>\nmenu.insert(<span class=\"nm\">0</span>, <span class=\"st\">\"Breakfast Roll\"</span>)  <span class=\"cm\"># insert at index</span>\nmenu.remove(<span class=\"st\">\"Coke\"</span>)            <span class=\"cm\"># remove by value</span>\npopped = menu.pop()             <span class=\"cm\"># remove &amp; return last item</span>\n\n<span class=\"cm\"># ── Useful functions ───────────────────────────────</span>\n<span class=\"fn\">print</span>(<span class=\"fn\">len</span>(menu))          <span class=\"cm\"># number of items</span>\n<span class=\"fn\">print</span>(<span class=\"fn\">sum</span>(prices))        <span class=\"cm\"># 14.46</span>\n<span class=\"fn\">print</span>(<span class=\"fn\">max</span>(prices))        <span class=\"cm\"># 5.99</span>\n<span class=\"fn\">print</span>(<span class=\"fn\">sorted</span>(prices))     <span class=\"cm\"># sorted copy (ascending)</span>\n<span class=\"fn\">print</span>(<span class=\"st\">\"Fries\"</span> <span class=\"kw\">in</span> menu)     <span class=\"cm\"># True — membership check</span></pre></div>"}, {"label": "Lists — Looping & Comprehensions", "html": "<div class=\"section-tag\">Lists — Advanced</div><div class=\"slide-heading\">Looping Over Lists &amp; List Comprehensions &#x1F504;</div><div class=\"two-col\"><div><div class=\"code-wrap\"><div class=\"code-header\"><span>list_loops.py</span><span>python</span></div><pre>menu   = [<span class=\"st\">\"Big Mac\"</span>, <span class=\"st\">\"Fries\"</span>, <span class=\"st\">\"McFlurry\"</span>]\nprices = [<span class=\"nm\">5.99</span>, <span class=\"nm\">2.99</span>, <span class=\"nm\">3.49</span>]\n\n<span class=\"cm\"># Basic for loop over a list</span>\n<span class=\"kw\">for</span> item <span class=\"kw\">in</span> menu:\n    <span class=\"fn\">print</span>(<span class=\"st\">f\"- {item}\"</span>)\n\n<span class=\"cm\"># Loop with index — enumerate()</span>\n<span class=\"kw\">for</span> i, item <span class=\"kw\">in</span> <span class=\"fn\">enumerate</span>(menu):\n    <span class=\"fn\">print</span>(<span class=\"st\">f\"{i+1}. {item}: ${prices[i]:.2f}\"</span>)\n\n<span class=\"cm\"># Loop two lists together — zip()</span>\n<span class=\"kw\">for</span> item, price <span class=\"kw\">in</span> <span class=\"fn\">zip</span>(menu, prices):\n    <span class=\"fn\">print</span>(<span class=\"st\">f\"{item} costs ${price}\"</span>)\n\n<span class=\"cm\"># ── List Comprehension ─────────────────────────</span>\n<span class=\"cm\"># Old way (3 lines):</span>\ndiscounted = []\n<span class=\"kw\">for</span> p <span class=\"kw\">in</span> prices:\n    discounted.append(p * <span class=\"nm\">0.9</span>)\n\n<span class=\"cm\"># New way (1 line — same result!):</span>\ndiscounted = [p * <span class=\"nm\">0.9</span> <span class=\"kw\">for</span> p <span class=\"kw\">in</span> prices]\n\n<span class=\"cm\"># With filter — only items under $4</span>\ncheap = [p <span class=\"kw\">for</span> p <span class=\"kw\">in</span> prices <span class=\"kw\">if</span> p &lt; <span class=\"nm\">4.0</span>]</pre></div></div><div><div class=\"highlight\"><strong>List comprehension syntax:</strong><br><code>[expression for item in list if condition]</code><br>The <code>if condition</code> part is optional.</div><div class=\"cards\" style=\"margin-top:10px;display:flex;flex-direction:column;gap:8px;\"><div class=\"card card-accent\"><div class=\"card-icon\">&#x26A1;</div><h3>Why comprehensions?</h3><p>Faster to write, faster to run, and reads like English: \"give me price times 0.9 for every price in prices\".</p></div><div class=\"card card-accent\"><div class=\"card-icon\">&#x1F4C8;</div><h3>Used everywhere in data science</h3><p>Building feature lists, filtering rows, transforming columns — list comprehensions are everywhere in pandas and ML code.</p></div></div></div></div>"}, {"label": "Tuples — What & Why", "html": "<div class=\"section-tag\">Data Structure 2</div><div class=\"slide-heading\">Tuples — Ordered, UNCHANGEABLE Collections &#x1F512;</div><div class=\"big-concept\"><div class=\"bc-emoji\">&#x1F512;</div><h2>A Tuple is like a List, but locked — you can never change it</h2><p>Created with <code>()</code> instead of <code>[]</code>. Once created, elements cannot be added, removed, or changed. This is called <strong>immutable</strong>.</p></div><div class=\"cards cards-3\" style=\"margin-top:10px;\"><div class=\"card card-accent\"><div class=\"card-icon\">&#x1F6E1;&#xFE0F;</div><h3>Why \"immutable\"?</h3><p>Safety. If you store GPS coordinates, database column names, or config settings in a tuple, nothing in your code can accidentally change them.</p></div><div class=\"card card-accent\"><div class=\"card-icon\">&#x26A1;</div><h3>Faster than Lists</h3><p>Python processes tuples faster than lists because it knows the size will never change. For fixed data you loop over many times, tuples are the better choice.</p></div><div class=\"card card-accent\"><div class=\"card-icon\">&#x1F3AF;</div><h3>When to Use?</h3><p>Coordinates (lat, lon) · RGB colours (255, 0, 0) · Database column names · Function returning multiple values · Any data that must never be modified.</p></div></div><div class=\"warn\">&#x26A0;&#xFE0F; <strong>Tuple vs List:</strong> Ask yourself \"should this data ever change?\" If NO &rarr; Tuple. If YES &rarr; List.</div>"}, {"label": "Tuples — Code Examples", "html": "<div class=\"section-tag\">Tuples in Action</div><div class=\"slide-heading\">Tuples — Creating, Accessing, Unpacking &#x1F4BB;</div><div class=\"code-wrap\"><div class=\"code-header\"><span>tuples.py</span><span>python</span></div><pre><span class=\"cm\"># ── Create ─────────────────────────────────────────</span>\ncoords     = (<span class=\"nm\">51.5074</span>, -<span class=\"nm\">0.1278</span>)   <span class=\"cm\"># London GPS</span>\nrgb_red    = (<span class=\"nm\">255</span>, <span class=\"nm\">0</span>, <span class=\"nm\">0</span>)            <span class=\"cm\"># RGB colour</span>\nsingle     = (<span class=\"nm\">42</span>,)                   <span class=\"cm\"># one-element tuple (note the comma!)</span>\ndimensions = (<span class=\"nm\">1920</span>, <span class=\"nm\">1080</span>)           <span class=\"cm\"># screen resolution</span>\n\n<span class=\"cm\"># ── Access — same as lists ──────────────────────────</span>\n<span class=\"fn\">print</span>(coords[<span class=\"nm\">0</span>])    <span class=\"cm\"># 51.5074  (latitude)</span>\n<span class=\"fn\">print</span>(coords[<span class=\"nm\">1</span>])    <span class=\"cm\"># -0.1278  (longitude)</span>\n<span class=\"fn\">print</span>(coords[-<span class=\"nm\">1</span>])   <span class=\"cm\"># -0.1278  (last element)</span>\n\n<span class=\"cm\"># ── Unpacking — assign each element to a variable ──</span>\nlat, lon = coords\n<span class=\"fn\">print</span>(<span class=\"st\">f\"Latitude: {lat}, Longitude: {lon}\"</span>)\n\nr, g, b = rgb_red\n<span class=\"fn\">print</span>(<span class=\"st\">f\"Red={r}, Green={g}, Blue={b}\"</span>)\n\nwidth, height = dimensions\n<span class=\"fn\">print</span>(<span class=\"st\">f\"Resolution: {width}x{height}\"</span>)\n\n<span class=\"cm\"># ── Immutable — this will CRASH (intentionally!) ───</span>\n<span class=\"cm\"># coords[0] = 999   # TypeError: tuple does not support item assignment</span>\n\n<span class=\"cm\"># ── Convert between list and tuple ─────────────────</span>\nitems_list  = [<span class=\"nm\">1</span>, <span class=\"nm\">2</span>, <span class=\"nm\">3</span>]\nitems_tuple = <span class=\"fn\">tuple</span>(items_list)  <span class=\"cm\"># list → tuple (locked)</span>\nback_to_list = <span class=\"fn\">list</span>(items_tuple) <span class=\"cm\"># tuple → list (unlocked)</span>\n\n<span class=\"cm\"># ── Functions returning multiple values = tuples! ──</span>\n<span class=\"kw\">def</span> <span class=\"fn\">min_max</span>(data):\n    <span class=\"kw\">return</span> <span class=\"fn\">min</span>(data), <span class=\"fn\">max</span>(data)  <span class=\"cm\"># returns a tuple</span>\n\nlo, hi = <span class=\"fn\">min_max</span>([<span class=\"nm\">3</span>, <span class=\"nm\">1</span>, <span class=\"nm\">9</span>, <span class=\"nm\">4</span>, <span class=\"nm\">7</span>])\n<span class=\"fn\">print</span>(<span class=\"st\">f\"Min: {lo}, Max: {hi}\"</span>)</pre></div>"}, {"label": "Dictionaries — What & Why", "html": "<div class=\"section-tag\">Data Structure 3</div><div class=\"slide-heading\">Dictionaries — Key &rarr; Value Lookup Tables &#x1F5DD;&#xFE0F;</div><div class=\"big-concept\"><div class=\"bc-emoji\">&#x1F4D6;</div><h2>A Dictionary maps a unique key to a value — instant lookup by name</h2><p>Like a real dictionary: you look up a <strong>word (key)</strong> and get its <strong>definition (value)</strong>. No searching through positions — access any value directly by its name.</p></div><div class=\"cards cards-3\" style=\"margin-top:10px;\"><div class=\"card card-accent\"><div class=\"card-icon\">&#x2753;</div><h3>What is it?</h3><p>A collection of <code>key: value</code> pairs inside curly braces <code>{}</code>. Keys must be unique. Values can be anything — strings, numbers, lists, even other dicts.</p></div><div class=\"card card-accent\"><div class=\"card-icon\">&#x1F4A1;</div><h3>Why Use It?</h3><p>Access data by <em>name</em> instead of by <em>position</em>. <code>burger[\"calories\"]</code> is clearer than <code>burger[2]</code>. Perfect for structured, named data.</p></div><div class=\"card card-accent\"><div class=\"card-icon\">&#x1F3AF;</div><h3>When to Use?</h3><p>Named attributes (name, price, calories) · Config settings · API/JSON responses · Counting things (word frequency) · Any key-value relationship.</p></div></div>"}, {"label": "Dictionaries — Code Examples", "html": "<div class=\"section-tag\">Dictionaries in Action</div><div class=\"slide-heading\">Dictionaries — Creating, Accessing, Modifying &#x1F4BB;</div><div class=\"code-wrap\"><div class=\"code-header\"><span>dicts.py</span><span>python</span></div><pre><span class=\"cm\"># ── Create ─────────────────────────────────────────</span>\nburger = {\n    <span class=\"st\">\"name\"</span>:      <span class=\"st\">\"Big Mac\"</span>,\n    <span class=\"st\">\"price\"</span>:     <span class=\"nm\">5.99</span>,\n    <span class=\"st\">\"calories\"</span>:  <span class=\"nm\">563</span>,\n    <span class=\"st\">\"protein_g\"</span>: <span class=\"nm\">26</span>,\n    <span class=\"st\">\"in_stock\"</span>:  <span class=\"kw\">True</span>\n}\n\n<span class=\"cm\"># ── Access by key ───────────────────────────────────</span>\n<span class=\"fn\">print</span>(burger[<span class=\"st\">\"name\"</span>])       <span class=\"cm\"># \"Big Mac\"</span>\n<span class=\"fn\">print</span>(burger[<span class=\"st\">\"calories\"</span>])   <span class=\"cm\"># 563</span>\n\n<span class=\"cm\"># .get() — safe access (no crash if key missing)</span>\n<span class=\"fn\">print</span>(burger.get(<span class=\"st\">\"size\"</span>, <span class=\"st\">\"unknown\"</span>))  <span class=\"cm\"># \"unknown\" (default)</span>\n\n<span class=\"cm\"># ── Add &amp; Update ────────────────────────────────────</span>\nburger[<span class=\"st\">\"fat_g\"</span>]   = <span class=\"nm\">33</span>      <span class=\"cm\"># add new key</span>\nburger[<span class=\"st\">\"price\"</span>]   = <span class=\"nm\">6.49</span>    <span class=\"cm\"># update existing key</span>\n\n<span class=\"cm\"># ── Delete ──────────────────────────────────────────</span>\n<span class=\"kw\">del</span> burger[<span class=\"st\">\"in_stock\"</span>]    <span class=\"cm\"># remove a key</span>\n\n<span class=\"cm\"># ── Check if key exists ─────────────────────────────</span>\n<span class=\"kw\">if</span> <span class=\"st\">\"calories\"</span> <span class=\"kw\">in</span> burger:\n    <span class=\"fn\">print</span>(<span class=\"st\">f\"Calories: {burger['calories']}\"</span>)\n\n<span class=\"cm\"># ── Loop over all items ─────────────────────────────</span>\n<span class=\"kw\">for</span> key, value <span class=\"kw\">in</span> burger.items():\n    <span class=\"fn\">print</span>(<span class=\"st\">f\"  {key}: {value}\"</span>)\n\n<span class=\"cm\"># ── All keys / all values ───────────────────────────</span>\n<span class=\"fn\">print</span>(burger.keys())     <span class=\"cm\"># dict_keys(['name', 'price', ...])</span>\n<span class=\"fn\">print</span>(burger.values())   <span class=\"cm\"># dict_values(['Big Mac', 6.49, ...])</span></pre></div>"}, {"label": "Dicts — Nested & Lists of Dicts", "html": "<div class=\"section-tag\">Advanced Dictionaries</div><div class=\"slide-heading\">Nested Dicts &amp; List of Dicts &#x1F9F1;</div><div class=\"code-wrap\"><div class=\"code-header\"><span>nested_dicts.py</span><span>python</span></div><pre><span class=\"cm\"># ── Nested dictionary — dict inside a dict ──────────</span>\nrestaurant = {\n    <span class=\"st\">\"name\"</span>: <span class=\"st\">\"McDonald's Oxford St\"</span>,\n    <span class=\"st\">\"location\"</span>: {\n        <span class=\"st\">\"city\"</span>:    <span class=\"st\">\"London\"</span>,\n        <span class=\"st\">\"postcode\"</span>: <span class=\"st\">\"W1D 1LL\"</span>,\n        <span class=\"st\">\"coords\"</span>:  (<span class=\"nm\">51.5152</span>, -<span class=\"nm\">0.1398</span>)  <span class=\"cm\"># tuple inside dict</span>\n    },\n    <span class=\"st\">\"rating\"</span>: <span class=\"nm\">4.2</span>,\n    <span class=\"st\">\"top_items\"</span>: [<span class=\"st\">\"Big Mac\"</span>, <span class=\"st\">\"McFlurry\"</span>, <span class=\"st\">\"Fries\"</span>]  <span class=\"cm\"># list inside dict</span>\n}\n\n<span class=\"cm\"># Accessing nested values</span>\n<span class=\"fn\">print</span>(restaurant[<span class=\"st\">\"location\"</span>][<span class=\"st\">\"city\"</span>])        <span class=\"cm\"># \"London\"</span>\n<span class=\"fn\">print</span>(restaurant[<span class=\"st\">\"top_items\"</span>][<span class=\"nm\">0</span>])            <span class=\"cm\"># \"Big Mac\"</span>\n<span class=\"fn\">print</span>(restaurant[<span class=\"st\">\"location\"</span>][<span class=\"st\">\"coords\"</span>][<span class=\"nm\">0</span>])   <span class=\"cm\"># 51.5152</span>\n\n<span class=\"cm\"># ── List of dicts — the basis of every DataFrame ────</span>\nmenu = [\n    {<span class=\"st\">\"name\"</span>: <span class=\"st\">\"Big Mac\"</span>,   <span class=\"st\">\"price\"</span>: <span class=\"nm\">5.99</span>, <span class=\"st\">\"cal\"</span>: <span class=\"nm\">563</span>},\n    {<span class=\"st\">\"name\"</span>: <span class=\"st\">\"McFlurry\"</span>,  <span class=\"st\">\"price\"</span>: <span class=\"nm\">3.49</span>, <span class=\"st\">\"cal\"</span>: <span class=\"nm\">340</span>},\n    {<span class=\"st\">\"name\"</span>: <span class=\"st\">\"Lg Fries\"</span>,  <span class=\"st\">\"price\"</span>: <span class=\"nm\">2.99</span>, <span class=\"st\">\"cal\"</span>: <span class=\"nm\">490</span>},\n]\n\n<span class=\"cm\"># Loop and filter</span>\n<span class=\"kw\">for</span> item <span class=\"kw\">in</span> menu:\n    <span class=\"kw\">if</span> item[<span class=\"st\">\"cal\"</span>] &gt; <span class=\"nm\">400</span>:\n        <span class=\"fn\">print</span>(<span class=\"st\">f\"{item['name']} is high calorie: {item['cal']} cal\"</span>)\n\n<span class=\"cm\"># Convert to DataFrame in one line (Session 4 preview!)</span>\n<span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\ndf = pd.DataFrame(menu)\n<span class=\"fn\">print</span>(df)</pre></div><div class=\"tip\">&#x1F4CC; A <strong>list of dicts</strong> is exactly what <code>pd.DataFrame()</code> takes as input. Understanding this structure makes pandas feel natural.</div>"}, {"label": "List vs Tuple vs Dict", "html": "<div class=\"section-tag\">Decision Guide</div><div class=\"slide-heading\">&#x1F4CA; List vs Tuple vs Dict — Which to Use?</div><table><tr><th></th><th>List <code>[]</code></th><th>Tuple <code>()</code></th><th>Dict <code>{}</code></th></tr><tr><td><strong>Created with</strong></td><td><code>[1, 2, 3]</code></td><td><code>(1, 2, 3)</code></td><td><code>{\"a\": 1}</code></td></tr><tr><td><strong>Ordered?</strong></td><td>Yes</td><td>Yes</td><td>Yes (Python 3.7+)</td></tr><tr><td><strong>Changeable?</strong></td><td>Yes &#x2705;</td><td>No &#x1F512;</td><td>Yes &#x2705;</td></tr><tr><td><strong>Access by</strong></td><td>Index: <code>list[0]</code></td><td>Index: <code>tup[0]</code></td><td>Key: <code>d[\"name\"]</code></td></tr><tr><td><strong>Duplicates?</strong></td><td>Allowed</td><td>Allowed</td><td>Keys must be unique</td></tr><tr><td><strong>Best for</strong></td><td>Collection of same-type items you may modify</td><td>Fixed data that must not change</td><td>Named attributes, lookup tables</td></tr><tr><td><strong>Example</strong></td><td>Menu items, daily sales, tickers</td><td>GPS coords, RGB, screen size</td><td>Burger info, config, API response</td></tr></table><div class=\"highlight\"><strong>Quick decision:</strong> Is data named? &rarr; Dict. Is data fixed forever? &rarr; Tuple. Is data a growing/changing collection? &rarr; List.</div>"}, {"label": "Functions — What & Why", "html": "<div class=\"section-tag\">Functions</div><div class=\"slide-heading\">Functions — Write Once, Use Everywhere &#x2699;&#xFE0F;</div><div class=\"big-concept\"><div class=\"bc-emoji\">&#x1F527;</div><h2>A function is a named, reusable block of code</h2><p>Write the logic once. Call it by name whenever needed. Change in one place — fixed everywhere. The single most powerful concept in programming.</p></div><div class=\"cards cards-3\" style=\"margin-top:10px;\"><div class=\"card card-accent\"><div class=\"card-icon\">&#x267B;&#xFE0F;</div><h3>Reusability</h3><p><code>calculate_tax()</code> written once, called for every order. Without functions: copy-paste the same 5 lines 500 times. One bug = 500 fixes.</p></div><div class=\"card card-accent\"><div class=\"card-icon\">&#x1F4D6;</div><h3>Readability</h3><p>Code reads like a story:<br><code>get_data()</code> &rarr; <code>clean_data()</code> &rarr; <code>train_model()</code>. You don't need to read every detail to understand the flow.</p></div><div class=\"card card-accent\"><div class=\"card-icon\">&#x1F527;</div><h3>Maintainability</h3><p>Bug in tax logic? Fix <code>calculate_tax()</code> once. Done. This is why every real codebase is built from functions.</p></div></div>"}, {"label": "Functions — Code Examples", "html": "<div class=\"section-tag\">Functions in Action</div><div class=\"slide-heading\">Defining &amp; Using Functions &#x1F4BB;</div><div class=\"code-wrap\"><div class=\"code-header\"><span>functions.py</span><span>python</span></div><pre><span class=\"cm\"># ── Basic function ──────────────────────────────────</span>\n<span class=\"kw\">def</span> <span class=\"fn\">greet</span>(name):                        <span class=\"cm\"># name = parameter</span>\n    <span class=\"fn\">print</span>(<span class=\"st\">f\"Welcome to codencode, {name}!\"</span>)\n\n<span class=\"fn\">greet</span>(<span class=\"st\">\"Alice\"</span>)   <span class=\"cm\"># Welcome to codencode, Alice!</span>\n<span class=\"fn\">greet</span>(<span class=\"st\">\"Bob\"</span>)     <span class=\"cm\"># Welcome to codencode, Bob!</span>\n\n<span class=\"cm\"># ── Return value + default parameter ────────────────</span>\n<span class=\"kw\">def</span> <span class=\"fn\">calculate_total</span>(price, quantity, tax=<span class=\"nm\">0.10</span>):\n    <span class=\"st\">\"\"\"Calculate order total including tax.\n    Args: price (float), quantity (int), tax (float)\n    Returns: total price after tax\n    \"\"\"</span>\n    subtotal = price * quantity\n    <span class=\"kw\">return</span> subtotal * (<span class=\"nm\">1</span> + tax)\n\n<span class=\"fn\">print</span>(<span class=\"fn\">calculate_total</span>(<span class=\"nm\">5.99</span>, <span class=\"nm\">3</span>))         <span class=\"cm\"># 19.77 (10% tax)</span>\n<span class=\"fn\">print</span>(<span class=\"fn\">calculate_total</span>(<span class=\"nm\">5.99</span>, <span class=\"nm\">3</span>, <span class=\"nm\">0.20</span>))   <span class=\"cm\"># 21.56 (20% tax)</span>\n\n<span class=\"cm\"># ── Return multiple values (as a tuple) ─────────────</span>\n<span class=\"kw\">def</span> <span class=\"fn\">analyse</span>(data: list) -> tuple:\n    <span class=\"kw\">return</span> <span class=\"fn\">min</span>(data), <span class=\"fn\">max</span>(data), <span class=\"fn\">sum</span>(data)/<span class=\"fn\">len</span>(data)\n\nsales = [<span class=\"nm\">1200</span>, <span class=\"nm\">980</span>, <span class=\"nm\">1450</span>, <span class=\"nm\">1800</span>, <span class=\"nm\">2200</span>]\nlow, high, avg = <span class=\"fn\">analyse</span>(sales)\n<span class=\"fn\">print</span>(<span class=\"st\">f\"Low:{low}  High:{high}  Avg:{avg:.0f}\"</span>)</pre></div>"}, {"label": "Modules — Importing Power", "html": "<div class=\"section-tag\">Modules</div><div class=\"slide-heading\">Modules — Pre-Built Code You Import &#x1F4E6;</div><div class=\"big-concept\"><div class=\"bc-emoji\">&#x1F4DA;</div><h2>A module is a file full of functions someone else already wrote — free for you to use</h2><p>Python has thousands of modules. One import line gives you access to enormous capabilities.</p></div><div class=\"code-wrap\"><div class=\"code-header\"><span>modules.py</span><span>python</span></div><pre><span class=\"cm\"># Built-in (no install needed)</span>\n<span class=\"kw\">import</span> math\n<span class=\"fn\">print</span>(math.sqrt(<span class=\"nm\">144</span>))        <span class=\"cm\"># 12.0</span>\n<span class=\"fn\">print</span>(math.pi)                <span class=\"cm\"># 3.14159...</span>\n\n<span class=\"kw\">import</span> random\n<span class=\"fn\">print</span>(random.randint(<span class=\"nm\">1</span>, <span class=\"nm\">100</span>)) <span class=\"cm\"># random integer</span>\n<span class=\"fn\">print</span>(random.choice([<span class=\"st\">\"MCD\"</span>, <span class=\"st\">\"CMG\"</span>, <span class=\"st\">\"DPZ\"</span>]))  <span class=\"cm\"># random item</span>\n\n<span class=\"kw\">import</span> datetime\n<span class=\"fn\">print</span>(datetime.date.today())  <span class=\"cm\"># 2024-11-15</span>\n\n<span class=\"cm\"># External (pip install first)</span>\n<span class=\"cm\"># pip install pandas numpy matplotlib yfinance scikit-learn</span>\n<span class=\"kw\">import</span> pandas    <span class=\"kw\">as</span> pd   <span class=\"cm\"># data tables</span>\n<span class=\"kw\">import</span> numpy     <span class=\"kw\">as</span> np   <span class=\"cm\"># fast maths</span>\n<span class=\"kw\">import</span> yfinance  <span class=\"kw\">as</span> yf   <span class=\"cm\"># stock data</span>\n\n<span class=\"cm\"># Import specific functions only</span>\n<span class=\"kw\">from</span> math <span class=\"kw\">import</span> sqrt, pi\n<span class=\"fn\">print</span>(sqrt(<span class=\"nm\">25</span>))   <span class=\"cm\"># 5.0 — no \"math.\" needed</span></pre></div>"}, {"label": "Code Lab — Full Order System", "html": "<div class=\"section-tag\">Code Lab</div><div class=\"slide-heading\">&#x1F4BB; Full Order System — Lists + Dicts + Functions</div><div class=\"code-wrap\"><div class=\"code-header\"><span>order_system.py</span><span>python</span></div><pre><span class=\"cm\"># MENU — list of dicts (each item is a dict)</span>\nMENU = [\n    {<span class=\"st\">\"name\"</span>: <span class=\"st\">\"Big Mac\"</span>,    <span class=\"st\">\"price\"</span>: <span class=\"nm\">5.99</span>, <span class=\"st\">\"cal\"</span>: <span class=\"nm\">563</span>},\n    {<span class=\"st\">\"name\"</span>: <span class=\"st\">\"McChicken\"</span>,  <span class=\"st\">\"price\"</span>: <span class=\"nm\">4.49</span>, <span class=\"st\">\"cal\"</span>: <span class=\"nm\">400</span>},\n    {<span class=\"st\">\"name\"</span>: <span class=\"st\">\"Lg Fries\"</span>,   <span class=\"st\">\"price\"</span>: <span class=\"nm\">2.99</span>, <span class=\"st\">\"cal\"</span>: <span class=\"nm\">490</span>},\n    {<span class=\"st\">\"name\"</span>: <span class=\"st\">\"McFlurry\"</span>,  <span class=\"st\">\"price\"</span>: <span class=\"nm\">3.49</span>, <span class=\"st\">\"cal\"</span>: <span class=\"nm\">340</span>},\n]\n\n<span class=\"cm\"># FUNCTION — find item by name</span>\n<span class=\"kw\">def</span> <span class=\"fn\">find_item</span>(name: str) -> dict:\n    <span class=\"kw\">for</span> item <span class=\"kw\">in</span> MENU:\n        <span class=\"kw\">if</span> item[<span class=\"st\">\"name\"</span>].lower() == name.lower():\n            <span class=\"kw\">return</span> item\n    <span class=\"kw\">return</span> <span class=\"kw\">None</span>\n\n<span class=\"cm\"># FUNCTION — total for an order (list of item names)</span>\n<span class=\"kw\">def</span> <span class=\"fn\">order_total</span>(order: list, tax: float = <span class=\"nm\">0.10</span>) -> tuple:\n    subtotal = <span class=\"fn\">sum</span>(find_item(n)[<span class=\"st\">\"price\"</span>] <span class=\"kw\">for</span> n <span class=\"kw\">in</span> order)\n    total_cal = <span class=\"fn\">sum</span>(find_item(n)[<span class=\"st\">\"cal\"</span>]   <span class=\"kw\">for</span> n <span class=\"kw\">in</span> order)\n    <span class=\"kw\">return</span> subtotal, subtotal * (<span class=\"nm\">1</span> + tax), total_cal\n\n<span class=\"cm\"># PLACE AN ORDER</span>\nmy_order = [<span class=\"st\">\"Big Mac\"</span>, <span class=\"st\">\"Lg Fries\"</span>, <span class=\"st\">\"McFlurry\"</span>]\nsub, total, cals = <span class=\"fn\">order_total</span>(my_order)\n\n<span class=\"fn\">print</span>(<span class=\"st\">\"Your order:\"</span>, my_order)\n<span class=\"fn\">print</span>(<span class=\"st\">f\"Subtotal: ${sub:.2f}  |  Total: ${total:.2f}  |  Calories: {cals}\"</span>)</pre></div><div class=\"tip\">&#x1F4CC; This combines everything: a <strong>list of dicts</strong> (MENU), <strong>functions</strong> (find_item, order_total), <strong>tuple unpacking</strong> (sub, total, cals), and <strong>list comprehensions</strong> inside functions.</div>"}, {"label": "Quick Reference", "html": "<div class=\"section-tag\">Quick Reference</div><div class=\"slide-heading\">&#x1F4CB; Syntax Quick Reference — All 3 Structures</div><div class=\"two-col\"><div><div class=\"code-wrap\"><div class=\"code-header\"><span>quick_ref_list.py</span><span>python</span></div><pre><span class=\"cm\"># LIST []</span>\nx = [<span class=\"nm\">1</span>, <span class=\"nm\">2</span>, <span class=\"nm\">3</span>]      <span class=\"cm\"># create</span>\nx[<span class=\"nm\">0</span>]              <span class=\"cm\"># access</span>\nx.append(<span class=\"nm\">4</span>)       <span class=\"cm\"># add</span>\nx.remove(<span class=\"nm\">2</span>)       <span class=\"cm\"># remove</span>\nx[<span class=\"nm\">0</span>] = <span class=\"nm\">99</span>          <span class=\"cm\"># change</span>\n<span class=\"fn\">len</span>(x)             <span class=\"cm\"># length</span>\n<span class=\"nm\">3</span> <span class=\"kw\">in</span> x             <span class=\"cm\"># membership</span>\n<span class=\"kw\">for</span> v <span class=\"kw\">in</span> x: ...    <span class=\"cm\"># loop\n\n</span><span class=\"cm\"># TUPLE ()</span>\nt = (<span class=\"nm\">1</span>, <span class=\"nm\">2</span>, <span class=\"nm\">3</span>)      <span class=\"cm\"># create</span>\nt[<span class=\"nm\">0</span>]               <span class=\"cm\"># access</span>\na, b, c = t        <span class=\"cm\"># unpack</span>\n<span class=\"cm\"># t[0] = 99  ← CRASH!</span></pre></div></div><div><div class=\"code-wrap\"><div class=\"code-header\"><span>quick_ref_dict.py</span><span>python</span></div><pre><span class=\"cm\"># DICT {}</span>\nd = {<span class=\"st\">\"a\"</span>: <span class=\"nm\">1</span>, <span class=\"st\">\"b\"</span>: <span class=\"nm\">2</span>}   <span class=\"cm\"># create</span>\nd[<span class=\"st\">\"a\"</span>]                  <span class=\"cm\"># access</span>\nd.get(<span class=\"st\">\"c\"</span>, <span class=\"nm\">0</span>)           <span class=\"cm\"># safe access</span>\nd[<span class=\"st\">\"c\"</span>] = <span class=\"nm\">3</span>              <span class=\"cm\"># add key</span>\nd[<span class=\"st\">\"a\"</span>] = <span class=\"nm\">99</span>             <span class=\"cm\"># update</span>\n<span class=\"kw\">del</span> d[<span class=\"st\">\"b\"</span>]              <span class=\"cm\"># delete key</span>\n<span class=\"st\">\"a\"</span> <span class=\"kw\">in</span> d               <span class=\"cm\"># membership</span>\nd.keys()               <span class=\"cm\"># all keys</span>\nd.values()             <span class=\"cm\"># all values</span>\nd.items()              <span class=\"cm\"># key,value pairs</span>\n<span class=\"kw\">for</span> k,v <span class=\"kw\">in</span> d.items():  <span class=\"cm\"># loop</span>\n    ...</pre></div></div></div>"}, {"label": "Common Mistakes", "html": "<div class=\"section-tag\">Common Mistakes</div><div class=\"slide-heading\">&#x26A0;&#xFE0F; Traps Every Beginner Falls Into</div><div class=\"cards cards-2\"><div class=\"card\" style=\"border-left:3px solid #ff7b72;\"><h3 style=\"color:#ff7b72;\">List index starts at 0, not 1</h3><div class=\"code-wrap\"><div class=\"code-header\"><span>err1.py</span><span>python</span></div><pre>items = [<span class=\"st\">\"a\"</span>, <span class=\"st\">\"b\"</span>, <span class=\"st\">\"c\"</span>]\n<span class=\"fn\">print</span>(items[<span class=\"nm\">1</span>])  <span class=\"cm\"># \"b\" — not \"a\"!</span>\n<span class=\"fn\">print</span>(items[<span class=\"nm\">0</span>])  <span class=\"cm\"># \"a\" ✅</span></pre></div></div><div class=\"card\" style=\"border-left:3px solid #ff7b72;\"><h3 style=\"color:#ff7b72;\">Modifying a tuple</h3><div class=\"code-wrap\"><div class=\"code-header\"><span>err2.py</span><span>python</span></div><pre>t = (<span class=\"nm\">1</span>, <span class=\"nm\">2</span>, <span class=\"nm\">3</span>)\nt[<span class=\"nm\">0</span>] = <span class=\"nm\">99</span>  <span class=\"cm\"># TypeError! Tuples are immutable</span>\n<span class=\"cm\"># Fix: convert to list first</span>\nlst = <span class=\"fn\">list</span>(t); lst[<span class=\"nm\">0</span>] = <span class=\"nm\">99</span></pre></div></div><div class=\"card\" style=\"border-left:3px solid #ffa657;\"><h3 style=\"color:#ffa657;\">Missing key in dict</h3><div class=\"code-wrap\"><div class=\"code-header\"><span>err3.py</span><span>python</span></div><pre>d = {<span class=\"st\">\"name\"</span>: <span class=\"st\">\"Big Mac\"</span>}\n<span class=\"fn\">print</span>(d[<span class=\"st\">\"calories\"</span>])   <span class=\"cm\"># KeyError!</span>\n<span class=\"cm\"># Fix: use .get() with a default</span>\n<span class=\"fn\">print</span>(d.get(<span class=\"st\">\"calories\"</span>, <span class=\"nm\">0</span>))  <span class=\"cm\"># 0 ✅</span></pre></div></div><div class=\"card\" style=\"border-left:3px solid #ffa657;\"><h3 style=\"color:#ffa657;\">Single-element tuple (needs comma)</h3><div class=\"code-wrap\"><div class=\"code-header\"><span>err4.py</span><span>python</span></div><pre>not_a_tuple = (<span class=\"nm\">42</span>)    <span class=\"cm\"># just an int in brackets</span>\nis_a_tuple  = (<span class=\"nm\">42</span>,)   <span class=\"cm\"># ✅ the comma makes it a tuple</span>\n<span class=\"fn\">print</span>(<span class=\"fn\">type</span>(not_a_tuple))  <span class=\"cm\"># &lt;class 'int'&gt;</span>\n<span class=\"fn\">print</span>(<span class=\"fn\">type</span>(is_a_tuple))   <span class=\"cm\"># &lt;class 'tuple'&gt;</span></pre></div></div></div>"}, {"label": "Session Recap", "html": "<div class=\"section-tag\">Session Recap</div><div class=\"slide-heading\">What You've Learned &#x1F389;</div><div class=\"recap-grid\"><div class=\"recap-item\"><div class=\"recap-icon\">&#x1F4CB;</div><div class=\"recap-text\"><h4>Lists <code>[]</code></h4><p>Ordered, changeable. Access by index (starts at 0). append(), remove(), sort(), loop with for. List comprehensions for compact transforms.</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">&#x1F512;</div><div class=\"recap-text\"><h4>Tuples <code>()</code></h4><p>Ordered, immutable. Access by index. Unpack into variables. Use for fixed data: coordinates, colours, function multiple returns.</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">&#x1F5DD;&#xFE0F;</div><div class=\"recap-text\"><h4>Dictionaries <code>{}</code></h4><p>Key-value pairs. Access by name. .get() for safe access. Loop with .items(). Nest dicts and lists freely.</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">&#x1F4CA;</div><div class=\"recap-text\"><h4>Which to Use?</h4><p>Named data &rarr; Dict. Fixed data &rarr; Tuple. Growing/changing collection &rarr; List. List of dicts &rarr; becomes a DataFrame!</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">&#x2699;&#xFE0F;</div><div class=\"recap-text\"><h4>Functions</h4><p>def name(params): &rarr; body &rarr; return. Default params. Multiple return values (tuples). Docstrings explain purpose.</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">&#x1F4E6;</div><div class=\"recap-text\"><h4>Modules</h4><p>import module or from module import func. Aliases (as pd). pip install for external packages.</p></div></div></div><div class=\"highlight\" style=\"margin-top:auto;\">&#x1F680; <strong>Next:</strong> Session 4 — NumPy &amp; Pandas: your list-of-dicts becomes a DataFrame!</div>"}, {"label": "Homework", "html": "<div class=\"section-tag\">Homework</div><div class=\"slide-heading\">Before Next Session &#x1F4DA;</div><div class=\"two-col\"><div><h3 style=\"font-size:13px;font-weight:700;margin-bottom:10px;color:var(--accent);\">&#x1F3E0; Tasks</h3><div class=\"e-list\"><div class=\"e-item\"><div class=\"e-icon\">&#x1F4CC;</div><div><strong>List task:</strong> Create a list of 5 stock tickers. Write a function that takes this list and returns a tuple of (first, last, total_count).</div></div><div class=\"e-item\"><div class=\"e-icon\">&#x1F4CC;</div><div><strong>Tuple task:</strong> Store 3 city coordinates as tuples. Write a function that takes a list of (city, lat, lon) tuples and prints each one formatted.</div></div><div class=\"e-item\"><div class=\"e-icon\">&#x1F4CC;</div><div><strong>Dict task:</strong> Build a menu dict (name &rarr; price). Write a function that takes an order list and returns the subtotal, total (with 10% tax), and the most expensive item ordered.</div></div><div class=\"e-item\"><div class=\"e-icon\">&#x1F4CC;</div><div><strong>Combine all:</strong> Build a list of dicts for 5 menu items. Convert to a pandas DataFrame and print .head() and .describe().</div></div></div></div><div><h3 style=\"font-size:13px;font-weight:700;margin-bottom:10px;color:var(--accent);\">&#x1F4D6; Resources</h3><div class=\"e-list\"><div class=\"e-item\"><div class=\"e-icon\">&#x1F517;</div><div>docs.python.org/3/tutorial/datastructures</div></div><div class=\"e-item\"><div class=\"e-icon\">&#x1F517;</div><div>w3schools.com/python/python_lists.asp</div></div><div class=\"e-item\"><div class=\"e-icon\">&#x1F517;</div><div>realpython.com — \"Python Lists and Tuples\"</div></div></div></div></div>"}];
let cur=0;
const wrap=document.getElementById('slides-wrap');
const dotsEl=document.getElementById('dots');
function renderSlides(){
  wrap.innerHTML='';dotsEl.innerHTML='';
  SLIDES_DATA.forEach((s,i)=>{
    const div=document.createElement('div');
    div.className='slide'+(i===0?' active':'');
    div.innerHTML=s.html;
    wrap.appendChild(div);
    const dot=document.createElement('div');
    dot.className='dot'+(i===0?' active':'');
    dot.onclick=()=>jump(i);
    dotsEl.appendChild(dot);
  });
  updateUI();
}
function updateUI(){
  const t=SLIDES_DATA.length;
  document.getElementById('counter').textContent=(cur+1)+' / '+t;
  document.getElementById('progress-bar').style.width=((cur+1)/t*100)+'%';
  document.getElementById('slide-title-bar').textContent=SLIDES_DATA[cur].label||'';
  document.getElementById('prev-btn').disabled=cur===0;
  document.getElementById('next-btn').disabled=cur===t-1;
  document.querySelectorAll('.slide').forEach((el,i)=>el.classList.toggle('active',i===cur));
  document.querySelectorAll('.dot').forEach((el,i)=>el.classList.toggle('active',i===cur));
}
function go(d){jump(cur+d);}
function jump(i){if(i<0||i>=SLIDES_DATA.length)return;cur=i;updateUI();document.querySelectorAll('.slide')[cur].scrollTop=0;}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(1);}
  if(e.key==='ArrowLeft'){e.preventDefault();go(-1);}
  if(e.key==='f'||e.key==='F')toggleFS();
  if(e.key==='Home')jump(0);
  if(e.key==='End')jump(SLIDES_DATA.length-1);
});
function toggleFS(){if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen();}

let _tx=0;
document.addEventListener('touchstart',e=>{_tx=e.changedTouches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-_tx;
  if(Math.abs(dx)>50){go(dx<0?1:-1);}
},{passive:true});
renderSlides();

<script id="codencode-copy-script">
(function(){
  function addCopy(){
    document.querySelectorAll('.code-wrap').forEach(function(w){
      var hdr=w.querySelector('.code-header'), pre=w.querySelector('pre');
      if(!hdr||!pre||hdr.querySelector('.copy-btn'))return;
      var b=document.createElement('button');
      b.className='copy-btn';b.type='button';b.textContent='Copy';
      b.addEventListener('click',function(ev){
        ev.stopPropagation();
        var t=pre.innerText.replace(/\u00a0/g,' ');
        function ok(){b.textContent='Copied';b.classList.add('done');setTimeout(function(){b.textContent='Copy';b.classList.remove('done');},1400);}
        if(navigator.clipboard&&navigator.clipboard.writeText){
          navigator.clipboard.writeText(t).then(ok).catch(fallback);
        }else{fallback();}
        function fallback(){
          var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
          document.body.appendChild(ta);ta.select();
          try{document.execCommand('copy');ok();}catch(e){}
          document.body.removeChild(ta);
        }
      });
      hdr.appendChild(b);
    });
  }
  if(document.readyState!=='loading')addCopy();
  document.addEventListener('DOMContentLoaded',addCopy);
  setTimeout(addCopy,400);
})();
</script>
