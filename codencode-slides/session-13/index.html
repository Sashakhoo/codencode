OOKBACK = <span class=\"nm\">60</span>\nX, y = [], []\nfor i <span class=\"kw\">in</span> <span class=\"fn\">range</span>(LOOKBACK, len(scaled)):\n    X.append(scaled[i-LOOKBACK:i, <span class=\"nm\">0</span>])\n    y.append(scaled[i, <span class=\"nm\">0</span>])\nX, y = np.array(X), np.array(y)\nX = X.reshape(X.shape[<span class=\"nm\">0</span>], X.shape[<span class=\"nm\">1</span>], <span class=\"nm\">1</span>)  <span class=\"cm\"># (samples, timesteps, features)</span>\n\n<span class=\"cm\"># ── 4. Build LSTM ─────────────────────────────────────────</span>\nmodel = Sequential([\n    layers.LSTM(<span class=\"nm\">50</span>, return_sequences=<span class=\"kw\">True</span>, input_shape=(LOOKBACK,<span class=\"nm\">1</span>)),\n    layers.Dropout(<span class=\"nm\">0.2</span>),\n    layers.LSTM(<span class=\"nm\">50</span>, return_sequences=<span class=\"kw\">False</span>),\n    layers.Dropout(<span class=\"nm\">0.2</span>),\n    layers.Dense(<span class=\"nm\">25</span>, activation=<span class=\"st\">\"relu\"</span>),\n    layers.Dense(<span class=\"nm\">1</span>)\n])\nmodel.compile(optimizer=<span class=\"st\">\"adam\"</span>, loss=<span class=\"st\">\"mse\"</span>)\nmodel.fit(X, y, epochs=<span class=\"nm\">20</span>, batch_size=<span class=\"nm\">32</span>)</pre>\n<div style=\"background:rgba(255,255,255,0.04);border-top:2px solid rgba(255,255,255,0.08);padding:9px 14px;font-size:11px;\"><div style=\"color:#fff;font-weight:700;margin-bottom:6px;font-size:11.5px;\">🔍 What this block does</div><div style=\"color:#ccc;font-size:11.5px;margin-bottom:7px;line-height:1.55;\">Downloads stock prices, creates 60-day look-back windows, trains LSTM end-to-end.</div><div style=\"display:flex;flex-direction:column;gap:1px;\"><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">fit()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ trains the model — it learns patterns from your X_train and y_train data</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">fit_transform()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ fits the scaler on the data AND transforms it in one step — only use on training data</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">MinMaxScaler()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ scales values to [0,1] — essential for LSTM; raw prices cause gradient issues</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">yfTicker()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ creates a Ticker object for one stock — access .history(), .info(), .dividends, etc.</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">Sequential()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ Keras model where layers stack one after another — data flows left to right</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">Dense()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ fully-connected layer — every neuron connects to every neuron in the next layer</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">Dropout()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ randomly deactivates X% of neurons each batch — prevents overfitting in neural networks</span></div></div></div></div>"}, {"label": "Forecasting & Visualising", "html": "<div class=\"section-tag\">Results</div><div class=\"slide-heading\">Forecasting &amp; Visualising LSTM Predictions 📈</div><div class=\"code-wrap\"><div class=\"code-header\"><span>lstm_predict.py</span><span>python</span></div><div style=\"padding:5px 14px;display:flex;gap:18px;flex-wrap:wrap;background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.07);font-size:10.5px;\"><span><span style=\"color:#4facfe;font-weight:700;\">📅 When: </span><span style=\"color:#8b949e;\">after training — generate and evaluate future predictions</span></span><span><span style=\"color:#43e97b;font-weight:700;\">💡 Why: </span><span style=\"color:#8b949e;\">chronological split is mandatory — temporal order must be preserved</span></span><span><span style=\"color:#FFD166;font-weight:700;\">✏️ Try: </span><span style=\"color:#8b949e;\">plot actual vs predicted on the same axis to visually assess alignment</span></span></div><pre><span class=\"kw\">import</span> matplotlib.pyplot <span class=\"kw\">as</span> plt\n\n<span class=\"cm\"># ── Train/Test split (chronological!) ─────────────────────</span>\ntrain_size = <span class=\"nm\">int</span>(len(X) * <span class=\"nm\">0.8</span>)\nX_train, X_test = X[:train_size], X[train_size:]\ny_train, y_test = y[:train_size], y[train_size:]\n\nmodel.fit(X_train, y_train, epochs=<span class=\"nm\">20</span>, batch_size=<span class=\"nm\">32</span>, verbose=<span class=\"nm\">0</span>)\n\n<span class=\"cm\"># Predict and inverse transform</span>\ny_pred = model.predict(X_test)\ny_pred_actual = scaler.inverse_transform(y_pred)\ny_test_actual = scaler.inverse_transform(y_test.reshape(-<span class=\"nm\">1</span>,<span class=\"nm\">1</span>))\n\n<span class=\"cm\"># Compute RMSE on actual prices</span>\nfrom sklearn.metrics <span class=\"kw\">import</span> mean_squared_error\nrmse = mean_squared_error(y_test_actual, y_pred_actual) ** <span class=\"nm\">0.5</span>\n<span class=\"fn\">print</span>(<span class=\"st\">f\"RMSE: ${rmse:.2f}\"</span>)\n\n<span class=\"cm\"># Plot</span>\nfig, ax = plt.subplots(figsize=(<span class=\"nm\">14</span>, <span class=\"nm\">5</span>))\nax.plot(y_test_actual, label=<span class=\"st\">\"Actual\"</span>, linewidth=<span class=\"nm\">2</span>)\nax.plot(y_pred_actual, label=<span class=\"st\">\"LSTM Predicted\"</span>, linestyle=<span class=\"st\">\"--\"</span>, linewidth=<span class=\"nm\">2</span>)\nax.set_title(<span class=\"st\">\"AAPL Stock — LSTM Prediction\"</span>)\nax.set_xlabel(<span class=\"st\">\"Days\"</span>); ax.set_ylabel(<span class=\"st\">\"Price ($)\"</span>)\nax.legend(); ax.grid(<span class=\"kw\">True</span>, alpha=<span class=\"nm\">0.3</span>)\nplt.tight_layout(); plt.show()</pre>\n<div style=\"background:rgba(255,255,255,0.04);border-top:2px solid rgba(255,255,255,0.08);padding:9px 14px;font-size:11px;\"><div style=\"color:#fff;font-weight:700;margin-bottom:6px;font-size:11.5px;\">🔍 What this block does</div><div style=\"color:#ccc;font-size:11.5px;margin-bottom:7px;line-height:1.55;\">Splits data chronologically, generates predictions, and plots forecast vs actual prices.</div><div style=\"display:flex;flex-direction:column;gap:1px;\"><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">fit()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ trains the model — it learns patterns from your X_train and y_train data</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">predict()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ uses the trained model to make predictions on new data (X_test) — never seen during training</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">mean_squared_error()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ average squared error — RMSE = sqrt(MSE); penalises large errors more than MAE</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">pltsubplots()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ creates a figure with multiple subplot panels — returns (fig, axes) tuple</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">modelfit()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ trains the neural network — feeds data through forward pass, calculates loss, backpropagates</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">LSTM()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ Long Short-Term Memory layer — remembers long sequences using forget/input/output gates</span></div></div></div></div>"}, {"label": "LSTM vs Other Approaches", "html": "<div class=\"section-tag\">Comparison</div><div class=\"slide-heading\">LSTM vs Other Time Series Approaches 🆚</div><table><tr><th>Method</th><th>Pros</th><th>Cons</th><th>When to Use</th></tr><tr><td>LSTM</td><td>Captures long-range dependencies, flexible</td><td>Needs lots of data, slow to train, complex</td><td>Stock prices, NLP, complex sequences</td></tr><tr><td>ARIMA</td><td>Statistically principled, interpretable</td><td>Manual tuning, only linear patterns</td><td>Classic econometrics, stationary series</td></tr><tr><td>Prophet (Facebook)</td><td>Handles seasonality automatically, easy</td><td>Less accurate on complex data</td><td>Business metrics with clear seasonality</td></tr><tr><td>XGBoost + lag features</td><td>Fast, no sequence reshaping, feature importance</td><td>Fixed lookback window</td><td>Tabular time series with many features</td></tr><tr><td>Moving Average</td><td>Trivially simple, interpretable</td><td>Can't capture trends or seasonality</td><td>Smoothing / baseline only</td></tr></table><div class=\"tip\">💡 <strong>Start with the simplest baseline</strong> (last-value naive, moving average). Beat that before trying LSTM. Many \"smart\" forecasts don't beat a simple rolling mean.</div>"}, {"label": "Session Recap", "html": "<div class=\"section-tag\">Session Recap</div><div class=\"slide-heading\">What You've Learned 🎉</div><div class=\"recap-grid\"><div class=\"recap-item\"><div class=\"recap-icon\">⏱️</div><div class=\"recap-text\"><h4>Time Series</h4><p>Ordered data with trend, seasonality, noise. Always split chronologically. Sort by date first.</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">🧠</div><div class=\"recap-text\"><h4>LSTM</h4><p>Forget/Input/Output gates. Remembers 60+ timesteps. return_sequences=True for stacked LSTMs. MinMaxScaler for inputs.</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">🪟</div><div class=\"recap-text\"><h4>Windowing</h4><p>Create (X, y) pairs from sequence: use last N timesteps to predict next value. Reshape X to (samples, timesteps, features).</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">📈</div><div class=\"recap-text\"><h4>Forecasting</h4><p>Inverse transform predictions back to original scale. Plot actual vs predicted. Compute RMSE in real units.</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">🆚</div><div class=\"recap-text\"><h4>Method Selection</h4><p>LSTM for complex sequences. Prophet for business seasonality. XGBoost + lags for tabular time series. Always beat naive baseline first.</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">⚠️</div><div class=\"recap-text\"><h4>Common Pitfalls</h4><p>Never random-split time series. Always sort chronologically. Scale to [0,1] for LSTM. Inverse transform before computing RMSE.</p></div></div></div><div class=\"highlight\" style=\"margin-top:auto;\">🚀 <strong>Next:</strong> Session 14 — Vibe Coding: use AI assistants to build faster and smarter</div>"}];





let cur=0;
const wrap=document.getElementById('slides-wrap');
const dotsEl=document.getElementById('dots');
function renderSlides(){
  wrap.innerHTML='';dotsEl.innerHTML='';
  SLIDES_DATA.forEach((s,i)=>{
    const div=document.createElement('div');
    div.className='slide'+(i===0?' active':'');
    div.innerHTML=s.html;
    wrap.appendChild(div);
    const dot=document.createElement('div');
    dot.className='dot'+(i===0?' active':'');
    dot.onclick=()=>jump(i);
    dotsEl.appendChild(dot);
  });
  updateUI();
}
function updateUI(){
  const t=SLIDES_DATA.length;
  document.getElementById('counter').textContent=(cur+1)+' / '+t;
  document.getElementById('progress-bar').style.width=((cur+1)/t*100)+'%';
  document.getElementById('slide-title-bar').textContent=SLIDES_DATA[cur].label||'';
  document.getElementById('prev-btn').disabled=cur===0;
  document.getElementById('next-btn').disabled=cur===t-1;
  document.querySelectorAll('.slide').forEach((el,i)=>el.classList.toggle('active',i===cur));
  document.querySelectorAll('.dot').forEach((el,i)=>el.classList.toggle('active',i===cur));
}
function go(d){jump(cur+d);}
function jump(i){if(i<0||i>=SLIDES_DATA.length)return;cur=i;updateUI();document.querySelectorAll('.slide')[cur].scrollTop=0;}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(1);}
  if(e.key==='ArrowLeft'){e.preventDefault();go(-1);}
  if(e.key==='f'||e.key==='F')toggleFS();
  if(e.key==='Home')jump(0);
  if(e.key==='End')jump(SLIDES_DATA.length-1);
});
function toggleFS(){if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen();}

let _tx=0;
document.addEventListener('touchstart',e=>{_tx=e.changedTouches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-_tx;
  if(Math.abs(dx)>50){go(dx<0?1:-1);}
},{passive:true});
renderSlides();

<script id="codencode-copy-script">
(function(){
  function addCopy(){
    document.querySelectorAll('.code-wrap').forEach(function(w){
      var hdr=w.querySelector('.code-header'), pre=w.querySelector('pre');
      if(!hdr||!pre||hdr.querySelector('.copy-btn'))return;
      var b=document.createElement('button');
      b.className='copy-btn';b.type='button';b.textContent='Copy';
      b.addEventListener('click',function(ev){
        ev.stopPropagation();
        var t=pre.innerText.replace(/\u00a0/g,' ');
        function ok(){b.textContent='Copied';b.classList.add('done');setTimeout(function(){b.textContent='Copy';b.classList.remove('done');},1400);}
        if(navigator.clipboard&&navigator.clipboard.writeText){
          navigator.clipboard.writeText(t).then(ok).catch(fallback);
        }else{fallback();}
        function fallback(){
          var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
          document.body.appendChild(ta);ta.select();
          try{document.execCommand('copy');ok();}catch(e){}
          document.body.removeChild(ta);
        }
      });
      hdr.appendChild(b);
    });
  }
  if(document.readyState!=='loading')addCopy();
  document.addEventListener('DOMContentLoaded',addCopy);
  setTimeout(addCopy,400);
})();
</script>
