<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Session 13 — LSTM & Time Series</title><style>
:root{--accent:#f97583;--bg:#0f0f1a;--text:#e8e8f0;--muted:#8888aa;--code-bg:#0d1117;--card:#1e2240;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;user-select:none;}
#deck{width:100%;height:100vh;display:flex;flex-direction:column;}
#topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.06);flex-shrink:0;gap:12px;}
#session-label{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--accent);text-transform:uppercase;white-space:nowrap;}
#slide-title-bar{font-size:12px;color:var(--muted);flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#topbar-right{display:flex;gap:8px;align-items:center;flex-shrink:0;}
#counter{font-size:12px;color:var(--muted);white-space:nowrap;}
.btn{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);color:var(--text);border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer;transition:all 0.15s;}
.btn:hover{background:var(--accent);border-color:var(--accent);color:#000;}
#progress-wrap{height:3px;background:rgba(255,255,255,0.05);flex-shrink:0;}
#progress-bar{height:100%;background:var(--accent);transition:width 0.3s ease;}
#slides-wrap{flex:1;position:relative;overflow:hidden;}
.slide{position:absolute;inset:0;display:none;flex-direction:column;padding:32px 48px 24px;overflow-y:auto;animation:fadeIn 0.25s ease;}
.slide.active{display:flex;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
#nav{display:flex;align-items:center;justify-content:center;gap:16px;padding:10px 24px;flex-shrink:0;border-top:1px solid rgba(255,255,255,0.06);}
.nav-btn{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);color:var(--text);padding:7px 26px;border-radius:8px;font-size:14px;cursor:pointer;transition:all 0.15s;}
.nav-btn:hover:not(:disabled){background:var(--accent);border-color:var(--accent);color:#000;}
.nav-btn:disabled{opacity:0.3;cursor:default;}
#dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:600px;}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.2);cursor:pointer;transition:all 0.2s;}
.dot.active{background:var(--accent);transform:scale(1.5);}
.slide-title{align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at 50% 40%,#1e2a4a 0%,#0f0f1a 70%);}
.session-badge{font-size:11px;font-weight:800;letter-spacing:3px;color:var(--accent);text-transform:uppercase;margin-bottom:20px;padding:5px 16px;border:1px solid var(--accent);border-radius:20px;display:inline-block;}
.slide-title h1{font-size:clamp(26px,3.4vw,46px);font-weight:800;line-height:1.15;margin-bottom:16px;background:linear-gradient(135deg,#fff 30%,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;white-space:pre-line;}
.slide-title .sub{font-size:14px;color:var(--muted);max-width:580px;line-height:1.6;margin-bottom:28px;}
.academy-tag{font-size:12px;color:var(--muted);letter-spacing:1px;}
.section-tag{font-size:10px;font-weight:700;letter-spacing:2.5px;color:var(--accent);text-transform:uppercase;margin-bottom:6px;}
.slide-heading{font-size:clamp(17px,2.2vw,28px);font-weight:700;margin-bottom:14px;line-height:1.25;}
.cards{display:grid;gap:11px;}
.cards-2{grid-template-columns:1fr 1fr;}
.cards-3{grid-template-columns:1fr 1fr 1fr;}
.cards-4{grid-template-columns:1fr 1fr 1fr 1fr;}
.card{background:var(--card);border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:14px 16px;}
.card-accent{border-left:3px solid var(--accent);}
.card-icon{font-size:22px;margin-bottom:6px;}
.card h3{font-size:13px;font-weight:700;margin-bottom:4px;color:#fff;}
.card p{font-size:11.5px;color:var(--muted);line-height:1.55;}
.steps{display:flex;flex-direction:column;gap:9px;}
.step{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:10px;padding:11px 14px;border:1px solid rgba(255,255,255,0.06);}
.step-num{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#000;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.step-body h4{font-size:13px;font-weight:700;margin-bottom:2px;}
.step-body p{font-size:12px;color:var(--muted);line-height:1.5;}
.code-wrap{flex:0 0 auto;display:flex;flex-direction:column;min-height:100px;background:var(--code-bg);border-radius:10px;border:1px solid rgba(255,255,255,0.08);overflow:hidden;margin:8px 0;}
.code-header{background:rgba(255,255,255,0.05);padding:5px 13px;font-size:11px;color:var(--muted);font-family:monospace;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
pre{padding:9px 13px;overflow-x:auto;font-family:'Cascadia Code','Fira Code',Consolas,monospace;font-size:13.5px;line-height:1.75;color:#c9d1d9;}
.kw{color:#ff7b72;}.fn{color:#d2a8ff;}.st{color:#a5d6ff;}.cm{color:#8b949e;font-style:italic;}.nm{color:#79c0ff;}.op{color:#ff9e64;}
.highlight{background:rgba(255,255,255,0.04);border-left:4px solid var(--accent);border-radius:0 8px 8px 0;padding:10px 14px;margin:8px 0;font-size:13px;line-height:1.6;}
.highlight strong{color:var(--accent);}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;flex:1;}
.warn{background:rgba(255,100,50,0.1);border:1px solid rgba(255,100,50,0.3);border-radius:8px;padding:9px 13px;font-size:12px;margin:6px 0;}
.tip{background:rgba(80,220,100,0.1);border:1px solid rgba(80,220,100,0.3);border-radius:8px;padding:9px 13px;font-size:12px;margin:6px 0;}
.roadmap{display:grid;grid-template-columns:1fr 1fr;gap:9px;flex:1;}
.roadmap-item{background:var(--card);border-radius:12px;padding:12px;border:1px solid rgba(255,255,255,0.06);display:flex;gap:9px;align-items:flex-start;}
.rm-num{font-size:18px;font-weight:900;color:var(--accent);opacity:0.4;line-height:1;flex-shrink:0;width:22px;}
.rm-icon{font-size:17px;flex-shrink:0;}
.rm-text h4{font-size:12px;font-weight:700;margin-bottom:2px;}
.rm-text p{font-size:11px;color:var(--muted);line-height:1.5;}
.recap-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;flex:1;}
.recap-item{background:var(--card);border-radius:10px;padding:12px;border-left:3px solid var(--accent);display:flex;gap:8px;align-items:flex-start;}
.recap-icon{font-size:17px;flex-shrink:0;}
.recap-text h4{font-size:13px;font-weight:700;margin-bottom:2px;}
.recap-text p{font-size:11px;color:var(--muted);line-height:1.5;}
.e-list{display:flex;flex-direction:column;gap:8px;}
.e-item{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.55;}
.e-icon{font-size:15px;flex-shrink:0;}
table{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0;}
th{background:rgba(255,255,255,0.06);padding:7px 10px;text-align:left;font-weight:700;color:var(--accent);}
td{padding:6px 10px;border-top:1px solid rgba(255,255,255,0.05);color:var(--muted);}
.slide::-webkit-scrollbar{width:4px;}
.slide::-webkit-scrollbar-track{background:transparent;}
.slide::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:2px;}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:700;margin:2px;}
.tag-green{background:rgba(80,200,80,0.2);color:#50c850;border:1px solid rgba(80,200,80,0.3);}
.tag-blue{background:rgba(80,150,255,0.2);color:#79c0ff;border:1px solid rgba(80,150,255,0.3);}
.tag-orange{background:rgba(255,150,50,0.2);color:#ff9e64;border:1px solid rgba(255,150,50,0.3);}
.big-concept{background:linear-gradient(135deg,#1e2a4a,#1e2240);border:1px solid rgba(249,117,131,0.3);border-radius:14px;padding:20px 24px;margin:10px 0;text-align:center;}
.big-concept .bc-emoji{font-size:36px;margin-bottom:8px;}
.big-concept h2{font-size:20px;font-weight:800;color:#fff;margin-bottom:6px;}
.big-concept p{font-size:13px;color:var(--muted);line-height:1.6;}

@media(max-width:768px){
  body{overflow:auto;}
  #deck{height:auto;min-height:100vh;}
  #slides-wrap{height:auto;min-height:50vh;}
  .slide{position:relative;inset:auto;display:none;padding:16px 16px 12px;overflow-y:auto;}
  .slide.active{display:flex;}

  /* ── Force ALL inline CSS grids to single column ── */
  div[style*="grid-template-columns"]{grid-template-columns:1fr !important;}
  div[style*="display:grid"]{grid-template-columns:1fr !important;}

  /* ── Stack all named grid layouts ── */
  .cards-2,.cards-3,.cards-4,.two-col,.roadmap,.recap-grid{grid-template-columns:1fr !important;}

  /* ── Code blocks — readable, scrollable ── */
  pre{font-size:11.5px !important;line-height:1.65 !important;overflow-x:auto;white-space:pre;}
  .code-wrap{overflow-x:auto;}
  .code-header{font-size:10px;}

  /* ── Context strip & breakdown — wrap cleanly ── */
  div[style*="color:#4facfe"]{flex-direction:column !important;gap:5px !important;}
  div[style*="🔍 What this block"]{font-size:10.5px !important;}
  div[style*="color:#d2a8ff"]{font-size:10px !important;}

  /* ── Slide text ── */
  .slide-heading{font-size:17px !important;margin-bottom:8px;}
  .section-tag{font-size:9px;}
  .card h3{font-size:12px;}
  .card p,.card-p,.card{font-size:11px;}
  .highlight,.tip,.warn{font-size:11px;padding:8px 10px;}
  .step-body h4{font-size:12px;}
  .step-body p{font-size:11px;}
  table{font-size:10px;}
  th,td{padding:4px 6px;}

  /* ── SVGs — cap height so they don't eat the screen ── */
  svg{max-height:220px !important;width:100% !important;}

  /* ── Navigation ── */
  #topbar{padding:8px 10px;gap:6px;}
  #session-label{display:none;}
  #slide-title-bar{font-size:10px;}
  #nav{padding:8px 10px;gap:8px;}
  .nav-btn{padding:8px 18px;font-size:14px;}
  #dots{max-width:100%;flex-wrap:wrap;}
  .dot{width:5px;height:5px;}

  /* ── Remove flex constraints that cause clipping ── */
  .code-wrap{min-height:unset !important;flex:unset !important;}
  pre{flex:unset !important;}

  /* ── Inline style overrides for padding/margin ── */
  div[style*="padding:32px"]{padding:12px 14px !important;}
  div[style*="padding:20px 44px"]{padding:10px 12px !important;}
  div[style*="padding:16px 44px"]{padding:10px 12px !important;}
  div[style*="padding:14px 40px"]{padding:10px 12px !important;}
}
.code-wrap pre{overflow-x:auto;overflow-y:visible;flex-shrink:0;} .code-wrap *,.code-wrap *,.code-wrap{user-select:text !important;-webkit-user-select:text !important;}
</style></head><body>
<div id="deck">
<div id="topbar"><div id="session-label">Session 13 · codencode Academy</div><div id="slide-title-bar"></div><div id="topbar-right"><span id="counter"></span><button class="btn" onclick="toggleFS()">⛶ Fullscreen</button></div></div>
<div id="progress-wrap"><div id="progress-bar"></div></div>
<div id="slides-wrap"></div>
<div id="nav"><button class="nav-btn" id="prev-btn" onclick="go(-1)">← Prev</button><div id="dots"></div><button class="nav-btn" id="next-btn" onclick="go(1)">Next →</button></div>
</div><script>
const SLIDES_DATA = [{"label": "Title", "html": "<div class=\"slide-title\" style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;\"><div class=\"session-badge\">Session 13 of 15</div><div style=\"font-size:48px;margin-bottom:12px;\">⏰</div><h1>LSTM &amp; Time Series:<br>Sequential Learning</h1><p class=\"sub\">Teach neural networks to remember history — model stock prices, sensor readings, weather, and any sequential data</p><div style=\"display:flex;gap:12px;justify-content:center;margin-top:14px;flex-wrap:wrap;\"><span class=\"tag tag-blue\">Time Series</span><span class=\"tag tag-green\">LSTM</span><span class=\"tag tag-orange\">Windowing</span><span class=\"tag tag-blue\">Forecasting</span></div><div class=\"academy-tag\" style=\"margin-top:20px;\">codencode Academy · Python + Data Science</div></div>"}, {"label": "What is Time Series?", "html": "<div class=\"section-tag\">Fundamentals</div><div class=\"slide-heading\">What is Time Series Data? ⏱️</div><div class=\"big-concept\"><div class=\"bc-emoji\">⏱️</div><h2>Time series = data points ordered in time, where past values influence future ones</h2><p>Stock prices, temperature readings, electricity demand, website traffic, heart rate, currency exchange rates. The ORDER of observations matters — shuffling would destroy the meaning.</p></div><div class=\"cards cards-3\" style=\"margin-top:10px;\"><div class=\"card card-accent\"><div class=\"card-icon\">📈</div><h3>Trend</h3><p>Long-term direction: upward (stock market over decades), downward (CD sales), flat (background noise).</p></div><div class=\"card card-accent\"><div class=\"card-icon\">🔄</div><h3>Seasonality</h3><p>Regular repeating patterns: higher sales in December, lower traffic on weekends, peak energy at 8am and 6pm daily.</p></div><div class=\"card card-accent\"><div class=\"card-icon\">⚡</div><h3>Noise</h3><p>Random variation around the trend. The part we can't predict. Goal: capture trend + seasonality, ignore noise.</p></div></div>"}, {"label": "Time Series vs Regular ML", "html": "<div class=\"section-tag\">Difference</div><div class=\"slide-heading\">Time Series vs Regular ML — Key Differences 🔄</div><table><tr><th></th><th>Regular ML</th><th>Time Series</th></tr><tr><td>Row order</td><td>Random — can shuffle</td><td>Matters — must preserve order</td></tr><tr><td>Train/Test split</td><td>Random split OK</td><td>Split chronologically (no future leakage!)</td></tr><tr><td>Features</td><td>Independent observations</td><td>Lag features: yesterday, last week</td></tr><tr><td>Baseline</td><td>Predict mean or most common class</td><td>Naive: predict last value. Check vs this first.</td></tr><tr><td>Key challenge</td><td>Generalise to new data</td><td>Generalise to future time points</td></tr></table><div class=\"code-wrap\" style=\"margin-top:8px;\"><div class=\"code-header\"><span>time_split.py</span><span>python</span></div><div style=\"padding:5px 14px;display:flex;gap:18px;flex-wrap:wrap;background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.07);font-size:10.5px;\"><span><span style=\"color:#4facfe;font-weight:700;\">📅 When: </span><span style=\"color:#8b949e;\">any sequential or temporal data — stock prices, sensor readings, sales</span></span><span><span style=\"color:#43e97b;font-weight:700;\">💡 Why: </span><span style=\"color:#8b949e;\">random split leaks future into past — always split chronologically</span></span><span><span style=\"color:#FFD166;font-weight:700;\">✏️ Try: </span><span style=\"color:#8b949e;\">print(df['date'].min(), df['date'].max()) to understand your time range</span></span></div><pre><span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\ndf = df.sort_values(<span class=\"st\">\"date\"</span>)   <span class=\"cm\"># always sort chronologically first!</span>\n\n<span class=\"cm\"># WRONG: random split leaks future data into training</span>\n<span class=\"cm\"># X_train, X_test = train_test_split(X, test_size=0.2)  ❌</span>\n\n<span class=\"cm\"># CORRECT: split at a time point</span>\nsplit_idx = <span class=\"nm\">int</span>(len(df) * <span class=\"nm\">0.8</span>)\ntrain = df.iloc[:split_idx]     <span class=\"cm\"># first 80% chronologically</span>\ntest  = df.iloc[split_idx:]     <span class=\"cm\"># last 20%</span></pre>\n<div style=\"background:rgba(255,255,255,0.04);border-top:2px solid rgba(255,255,255,0.08);padding:9px 14px;font-size:11px;\"><div style=\"color:#fff;font-weight:700;margin-bottom:6px;font-size:11.5px;\">🔍 What this block does</div><div style=\"color:#ccc;font-size:11.5px;margin-bottom:7px;line-height:1.55;\">Shows the correct chronological train/test split for time series — avoids future leakage.</div><div style=\"display:flex;flex-direction:column;gap:1px;\"><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">train_test_split()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ randomly splits X and y into training and test sets; test_size=0.2 → 20% held out for evaluation</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">sort_values()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ sorts DataFrame rows by one or more columns — essential before time-series operations</span></div></div></div></div>"}, {"label": "What is an RNN?", "html": "<div class=\"section-tag\">Prerequisite</div><div class=\"slide-heading\">Recurrent Neural Networks — Memory Across Time ♻️</div><div class=\"two-col\" style=\"margin-bottom:8px;\"><div><strong>What makes RNNs different:</strong><br>Standard neural networks assume inputs are independent. RNNs have a <strong>loop</strong> — the hidden state h(t) from the current step feeds into the <em>next</em> step as an additional input. This gives the network <em>memory</em>.<br><br><strong>How it works:</strong><br>At each time step t:<br>• Take current input x(t)<br>• Take previous hidden state h(t-1)<br>• Compute: h(t) = tanh(W·[h(t-1), x(t)] + b)<br>• Output y(t) from h(t)</div><div><strong>What RNNs can do that MLPs cannot:</strong><br>• Process sequences of any length<br>• Remember what happened 5 steps ago<br>• Share weights across all time steps (efficient)<br><br><strong>Applications:</strong><br>• Early voice assistants (speech → text)<br>• Sentiment analysis (\"I loved it!\" = positive)<br>• Time series forecasting<br>• Machine translation (before transformers)<br><br><strong>Key limitation:</strong> Vanishing gradient — the memory fades over long sequences</div></div><svg viewBox=\"0 0 560 280\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:560px;display:block;margin:4px auto;\">\n  <rect width=\"560\" height=\"280\" fill=\"rgba(0,0,0,0.45)\" rx=\"10\"/>\n  <text x=\"280\" y=\"19\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"12\" font-weight=\"bold\" font-family=\"monospace\">Recurrent Neural Network — How Recurrence Works</text>\n\n  <!-- Column labels at bottom -->\n  <text x=\"68\"  y=\"265\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.5)\" font-size=\"9.5\" font-family=\"monospace\">Input</text>\n  <text x=\"68\"  y=\"276\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.5)\" font-size=\"9.5\" font-family=\"monospace\">Layer</text>\n  <text x=\"210\" y=\"265\" text-anchor=\"middle\" fill=\"rgba(79,172,254,0.8)\" font-size=\"9.5\" font-family=\"monospace\">Hidden</text>\n  <text x=\"210\" y=\"276\" text-anchor=\"middle\" fill=\"rgba(79,172,254,0.8)\" font-size=\"9.5\" font-family=\"monospace\">Layer</text>\n  <text x=\"370\" y=\"265\" text-anchor=\"middle\" fill=\"rgba(139,92,246,0.8)\" font-size=\"9.5\" font-family=\"monospace\">Hidden</text>\n  <text x=\"370\" y=\"276\" text-anchor=\"middle\" fill=\"rgba(139,92,246,0.8)\" font-size=\"9.5\" font-family=\"monospace\">Layer</text>\n  <text x=\"500\" y=\"265\" text-anchor=\"middle\" fill=\"rgba(67,233,123,0.8)\" font-size=\"9.5\" font-family=\"monospace\">Output</text>\n  <text x=\"500\" y=\"276\" text-anchor=\"middle\" fill=\"rgba(67,233,123,0.8)\" font-size=\"9.5\" font-family=\"monospace\">Layer</text>\n\n  <!-- Dashed vertical dividers -->\n  <line x1=\"128\" y1=\"240\" x2=\"128\" y2=\"260\" stroke=\"rgba(255,255,255,0.2)\" stroke-width=\"1\" stroke-dasharray=\"3,3\"/>\n  <line x1=\"285\" y1=\"240\" x2=\"285\" y2=\"260\" stroke=\"rgba(255,255,255,0.2)\" stroke-width=\"1\" stroke-dasharray=\"3,3\"/>\n  <line x1=\"445\" y1=\"240\" x2=\"445\" y2=\"260\" stroke=\"rgba(255,255,255,0.2)\" stroke-width=\"1\" stroke-dasharray=\"3,3\"/>\n\n  <!-- INPUT neurons (dark blue, 4 nodes) -->\n  <circle cx=\"68\" cy=\"75\"  r=\"16\" fill=\"#1a3a6e\" stroke=\"rgba(79,172,254,0.5)\" stroke-width=\"2\"/>\n  <circle cx=\"68\" cy=\"128\" r=\"16\" fill=\"#1a3a6e\" stroke=\"rgba(79,172,254,0.5)\" stroke-width=\"2\"/>\n  <circle cx=\"68\" cy=\"181\" r=\"16\" fill=\"#1a3a6e\" stroke=\"rgba(79,172,254,0.5)\" stroke-width=\"2\"/>\n  <circle cx=\"68\" cy=\"234\" r=\"16\" fill=\"#1a3a6e\" stroke=\"rgba(79,172,254,0.5)\" stroke-width=\"2\"/>\n\n  <!-- HIDDEN layer 1 neurons (bright blue, 5 nodes) -->\n  <circle cx=\"210\" cy=\"55\"  r=\"18\" fill=\"#2563eb\" stroke=\"#4facfe\" stroke-width=\"2.5\"/>\n  <circle cx=\"210\" cy=\"105\" r=\"18\" fill=\"#2563eb\" stroke=\"#4facfe\" stroke-width=\"2.5\"/>\n  <circle cx=\"210\" cy=\"155\" r=\"18\" fill=\"#2563eb\" stroke=\"#4facfe\" stroke-width=\"2.5\"/>\n  <circle cx=\"210\" cy=\"205\" r=\"18\" fill=\"#2563eb\" stroke=\"#4facfe\" stroke-width=\"2.5\"/>\n  <circle cx=\"210\" cy=\"235\" r=\"18\" fill=\"#2563eb\" stroke=\"#4facfe\" stroke-width=\"2.5\"/>\n\n  <!-- HIDDEN layer 2 neurons (purple/dark blue, 3 nodes) -->\n  <circle cx=\"370\" cy=\"90\"  r=\"18\" fill=\"#1e1b4b\" stroke=\"rgba(139,92,246,0.7)\" stroke-width=\"2.5\"/>\n  <circle cx=\"370\" cy=\"155\" r=\"18\" fill=\"#1e1b4b\" stroke=\"rgba(139,92,246,0.7)\" stroke-width=\"2.5\"/>\n  <circle cx=\"370\" cy=\"220\" r=\"18\" fill=\"#1e1b4b\" stroke=\"rgba(139,92,246,0.7)\" stroke-width=\"2.5\"/>\n\n  <!-- OUTPUT neuron (dark, 1 node) -->\n  <circle cx=\"500\" cy=\"155\" r=\"18\" fill=\"#0f2744\" stroke=\"rgba(67,233,123,0.7)\" stroke-width=\"2.5\"/>\n\n  <!-- Connections: Input → Hidden1 (draw behind) -->\n  <line x1=\"84\"  y1=\"75\"  x2=\"192\" y2=\"58\"  stroke=\"rgba(255,255,255,0.12)\" stroke-width=\"1.2\"/>\n  <line x1=\"84\"  y1=\"75\"  x2=\"192\" y2=\"108\" stroke=\"rgba(255,255,255,0.12)\" stroke-width=\"1.2\"/>\n  <line x1=\"84\"  y1=\"75\"  x2=\"192\" y2=\"158\" stroke=\"rgba(255,255,255,0.12)\" stroke-width=\"1.2\"/>\n  <line x1=\"84\"  y1=\"128\" x2=\"192\" y2=\"58\"  stroke=\"rgba(255,255,255,0.12)\" stroke-width=\"1.2\"/>\n  <line x1=\"84\"  y1=\"128\" x2=\"192\" y2=\"108\" stroke=\"rgba(255,255,255,0.12)\" stroke-width=\"1.2\"/>\n  <line x1=\"84\"  y1=\"128\" x2=\"192\" y2=\"158\" stroke=\"rgba(255,255,255,0.12)\" stroke-width=\"1.2\"/>\n  <line x1=\"84\"  y1=\"128\" x2=\"192\" y2=\"208\" stroke=\"rgba(255,255,255,0.12)\" stroke-width=\"1.2\"/>\n  <line x1=\"84\"  y1=\"181\" x2=\"192\" y2=\"108\" stroke=\"rgba(255,255,255,0.12)\" stroke-width=\"1.2\"/>\n  <line x1=\"84\"  y1=\"181\" x2=\"192\" y2=\"158\" stroke=\"rgba(255,255,255,0.12)\" stroke-width=\"1.2\"/>\n  <line x1=\"84\"  y1=\"181\" x2=\"192\" y2=\"208\" stroke=\"rgba(255,255,255,0.12)\" stroke-width=\"1.2\"/>\n  <line x1=\"84\"  y1=\"234\" x2=\"192\" y2=\"158\" stroke=\"rgba(255,255,255,0.12)\" stroke-width=\"1.2\"/>\n  <line x1=\"84\"  y1=\"234\" x2=\"192\" y2=\"208\" stroke=\"rgba(255,255,255,0.12)\" stroke-width=\"1.2\"/>\n  <line x1=\"84\"  y1=\"234\" x2=\"192\" y2=\"235\" stroke=\"rgba(255,255,255,0.12)\" stroke-width=\"1.2\"/>\n\n  <!-- Connections: Hidden1 → Hidden2 -->\n  <line x1=\"228\" y1=\"58\"  x2=\"352\" y2=\"92\"  stroke=\"rgba(255,255,255,0.12)\" stroke-width=\"1.2\"/>\n  <line x1=\"228\" y1=\"58\"  x2=\"352\" y2=\"155\" stroke=\"rgba(255,255,255,0.12)\" stroke-width=\"1.2\"/>\n  <line x1=\"228\" y1=\"108\" x2=\"352\" y2=\"92\"  stroke=\"rgba(255,255,255,0.12)\" stroke-width=\"1.2\"/>\n  <line x1=\"228\" y1=\"108\" x2=\"352\" y2=\"155\" stroke=\"rgba(255,255,255,0.12)\" stroke-width=\"1.2\"/>\n  <line x1=\"228\" y1=\"108\" x2=\"352\" y2=\"220\" stroke=\"rgba(255,255,255,0.12)\" stroke-width=\"1.2\"/>\n  <line x1=\"228\" y1=\"158\" x2=\"352\" y2=\"92\"  stroke=\"rgba(255,255,255,0.12)\" stroke-width=\"1.2\"/>\n  <line x1=\"228\" y1=\"158\" x2=\"352\" y2=\"155\" stroke=\"rgba(255,255,255,0.12)\" stroke-width=\"1.2\"/>\n  <line x1=\"228\" y1=\"158\" x2=\"352\" y2=\"220\" stroke=\"rgba(255,255,255,0.12)\" stroke-width=\"1.2\"/>\n  <line x1=\"228\" y1=\"208\" x2=\"352\" y2=\"155\" stroke=\"rgba(255,255,255,0.12)\" stroke-width=\"1.2\"/>\n  <line x1=\"228\" y1=\"208\" x2=\"352\" y2=\"220\" stroke=\"rgba(255,255,255,0.12)\" stroke-width=\"1.2\"/>\n  <line x1=\"228\" y1=\"235\" x2=\"352\" y2=\"220\" stroke=\"rgba(255,255,255,0.12)\" stroke-width=\"1.2\"/>\n\n  <!-- Connections: Hidden2 → Output -->\n  <line x1=\"388\" y1=\"92\"  x2=\"482\" y2=\"155\" stroke=\"rgba(67,233,123,0.3)\" stroke-width=\"1.5\"/>\n  <line x1=\"388\" y1=\"155\" x2=\"482\" y2=\"155\" stroke=\"rgba(67,233,123,0.3)\" stroke-width=\"1.5\"/>\n  <line x1=\"388\" y1=\"220\" x2=\"482\" y2=\"155\" stroke=\"rgba(67,233,123,0.3)\" stroke-width=\"1.5\"/>\n\n  <!-- RECURRENCE arrow (top arc from hidden1 back to hidden1) — kept below the title band -->\n  <path d=\"M 228 55 Q 300 38 300 38 Q 340 32 370 40 Q 400 32 430 38 Q 460 38 388 55\" fill=\"none\" stroke=\"#4facfe\" stroke-width=\"2.5\"/>\n  <polygon points=\"388,55 378,48 395,48\" fill=\"#4facfe\"/>\n  <text x=\"308\" y=\"30\" text-anchor=\"middle\" fill=\"#4facfe\" font-size=\"10\" font-weight=\"bold\" font-family=\"sans-serif\">loops back →</text>\n\n  <!-- Also recurrence from hidden1 bottom back -->\n  <path d=\"M 228 235 Q 260 252 260 252 Q 300 260 340 252 Q 355 248 352 235\" fill=\"none\" stroke=\"#4facfe\" stroke-width=\"2\" stroke-dasharray=\"5,3\"/>\n\n  <!-- Labels inside key neurons -->\n  <text x=\"210\" y=\"59\"  text-anchor=\"middle\" fill=\"#fff\" font-size=\"9\" font-family=\"monospace\">h(t)</text>\n  <text x=\"370\" y=\"159\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"9\" font-family=\"monospace\">h(t)</text>\n  <text x=\"500\" y=\"159\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"9\" font-family=\"monospace\">ŷ</text>\n\n  <!-- Bottom callout -->\n  <text x=\"280\" y=\"254\" text-anchor=\"middle\" fill=\"rgba(79,172,254,0.8)\" font-size=\"9.5\" font-family=\"monospace\">↑ Recurrence: hidden layer output feeds back as input to itself at the next time step</text>\n</svg><div class=\"tip\" style=\"margin-top:6px;\">💡 RNNs share the <strong>same weight matrix W</strong> at every time step — that's what makes them efficient and what enables sequence learning.</div>"}, {"label": "How RNNs Store Memory", "html": "<div class=\"section-tag\">Session 13 — RNN Deep Dive</div>\n<h2 class=\"slide-heading\">🧠 How RNNs Store Memory — Two Types Working Together</h2>\n<div class=\"cards\" style=\"margin-bottom:14px;\">\n  <div class=\"card card-accent\" style=\"--accent:#4facfe;\">\n    <strong>Long-Term Memory → Weights</strong><br>\n    The network's weights are its long-term memory. They change slowly through backpropagation across thousands of training examples. Each weight encodes a general pattern the model has learned from the whole dataset — like \"words before 'is' are usually nouns.\" Weights persist for the entire lifetime of the trained model.\n  </div>\n  <div class=\"card card-accent\" style=\"--accent:#43e97b;\">\n    <strong>Short-Term Memory → Hidden State Activations</strong><br>\n    At each time step, the RNN produces a <strong>hidden state h_t</strong> — a vector of numbers passed forward to the next node. This is ephemeral context: the model's working memory of what it just saw. It carries information from the last few inputs forward, giving the RNN its ability to reason about sequences.\n  </div>\n</div>\n<div style=\"margin-bottom:10px;\"><svg viewBox='0 0 700 200' xmlns='http://www.w3.org/2000/svg' style='width:100%;max-height:200px;'>\n  <rect width='700' height='200' rx='12' fill='rgba(0,0,0,0.45)'/>\n  <!-- Long-term memory side -->\n  <rect x='20' y='20' width='300' height='160' rx='10' fill='rgba(79,172,254,0.12)' stroke='#4facfe' stroke-width='1.5'/>\n  <text x='170' y='45' text-anchor='middle' fill='#4facfe' font-size='13' font-weight='bold'>🧠 LONG-TERM MEMORY</text>\n  <text x='170' y='62' text-anchor='middle' fill='#aaa' font-size='10'>Stored in network WEIGHTS</text>\n  <rect x='40' y='72' width='260' height='36' rx='8' fill='rgba(79,172,254,0.2)' stroke='#4facfe' stroke-width='1'/>\n  <text x='170' y='88' text-anchor='middle' fill='#e0e0e0' font-size='11'>w₁ = 0.82  w₂ = -0.31  w₃ = 0.55</text>\n  <text x='170' y='102' text-anchor='middle' fill='#aaa' font-size='10'>Billions of weight values</text>\n  <text x='40' y='128' fill='#ccc' font-size='10.5'>✓ Changes slowly during training</text>\n  <text x='40' y='145' fill='#ccc' font-size='10.5'>✓ Encodes general patterns from all data</text>\n  <text x='40' y='162' fill='#ccc' font-size='10.5'>✓ Persists across entire dataset</text>\n  <!-- Short-term memory side -->\n  <rect x='380' y='20' width='300' height='160' rx='10' fill='rgba(67,233,123,0.1)' stroke='#43e97b' stroke-width='1.5'/>\n  <text x='530' y='45' text-anchor='middle' fill='#43e97b' font-size='13' font-weight='bold'>⚡ SHORT-TERM MEMORY</text>\n  <text x='530' y='62' text-anchor='middle' fill='#aaa' font-size='10'>Stored in hidden state ACTIVATIONS</text>\n  <rect x='400' y='72' width='260' height='36' rx='8' fill='rgba(67,233,123,0.18)' stroke='#43e97b' stroke-width='1'/>\n  <text x='530' y='88' text-anchor='middle' fill='#e0e0e0' font-size='11'>h_t = [0.4, -0.1, 0.9, 0.2 ...]</text>\n  <text x='530' y='102' text-anchor='middle' fill='#aaa' font-size='10'>Hidden state vector (ephemeral)</text>\n  <text x='400' y='128' fill='#ccc' font-size='10.5'>✓ Changes every single time step</text>\n  <text x='400' y='145' fill='#ccc' font-size='10.5'>✓ Carries context from recent inputs</text>\n  <text x='400' y='162' fill='#ccc' font-size='10.5'>✓ Passed forward to the next node</text>\n  <!-- Arrow between -->\n  <text x='350' y='105' text-anchor='middle' fill='#FFD166' font-size='22'>↔</text>\n  <text x='350' y='125' text-anchor='middle' fill='#FFD166' font-size='9'>both</text>\n</svg></div>\n<div class=\"tip\" style=\"font-size:12.5px;\">💡 <strong>The key insight:</strong> Every new time step, the hidden state is updated: <code>h_t = tanh(W·x_t + U·h_{t-1} + b)</code> — the new hidden state depends on the current input <em>and</em> the previous hidden state. That loop is what makes RNNs recurrent.</div>"}, {"label": "The Vanishing Gradient Problem", "html": "<div class=\"section-tag\">The Problem</div><div class=\"slide-heading\">Why Plain RNNs Forget — The Vanishing Gradient 📉</div><div class=\"cards cards-3\" style=\"margin-bottom:8px;\"><div class=\"card card-accent\"><h3>Vanishing Gradient</h3><p>During backprop, gradients are multiplied by values &lt;1 at each time step. Over 50+ steps, the gradient becomes essentially <strong>zero</strong> — early time steps stop learning. The network forgets context from more than ~10 steps ago.</p></div><div class=\"card card-accent\"><h3>Exploding Gradient</h3><p>The opposite — values &gt;1 compound exponentially. Gradients become huge, weights overflow to NaN, training collapses. Fix: <strong>gradient clipping</strong> (<code>clipnorm=1.0</code>).</p></div><div class=\"card card-accent\"><h3>Why it matters</h3><p>Stock prediction needs data from 60 days ago. Translation needs the subject from 20 words back. A plain RNN cannot reliably use context from more than ~10 steps — LSTM was designed to fix this.</p></div></div><svg viewBox=\"0 0 560 220\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:560px;display:block;margin:4px auto;\">\n  <rect width=\"560\" height=\"220\" fill=\"rgba(0,0,0,0.45)\" rx=\"10\"/>\n  <text x=\"280\" y=\"18\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"12\" font-weight=\"bold\" font-family=\"monospace\">The Vanishing Gradient Problem — Why Plain RNNs Forget</text>\n\n  <!-- Time step nodes along top -->\n  <text x=\"58\"  y=\"45\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.6)\" font-size=\"9\" font-family=\"monospace\">t=1</text>\n  <text x=\"148\" y=\"45\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.6)\" font-size=\"9\" font-family=\"monospace\">t=2</text>\n  <text x=\"238\" y=\"45\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.6)\" font-size=\"9\" font-family=\"monospace\">t=3</text>\n  <text x=\"328\" y=\"45\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.6)\" font-size=\"9\" font-family=\"monospace\">t=4</text>\n  <text x=\"418\" y=\"45\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.6)\" font-size=\"9\" font-family=\"monospace\">t=5</text>\n  <text x=\"500\" y=\"45\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.6)\" font-size=\"9\" font-family=\"monospace\">output</text>\n\n  <!-- RNN time steps (circles) with forward arrows -->\n  <circle cx=\"58\"  cy=\"90\" r=\"22\" fill=\"rgba(79,172,254,0.5)\"  stroke=\"#4facfe\" stroke-width=\"2.5\"/>\n  <circle cx=\"148\" cy=\"90\" r=\"22\" fill=\"rgba(79,172,254,0.38)\" stroke=\"#4facfe\" stroke-width=\"2\"/>\n  <circle cx=\"238\" cy=\"90\" r=\"22\" fill=\"rgba(79,172,254,0.26)\" stroke=\"#4facfe\" stroke-width=\"1.5\"/>\n  <circle cx=\"328\" cy=\"90\" r=\"22\" fill=\"rgba(79,172,254,0.16)\" stroke=\"#4facfe\" stroke-width=\"1.2\"/>\n  <circle cx=\"418\" cy=\"90\" r=\"22\" fill=\"rgba(79,172,254,0.08)\" stroke=\"#4facfe\" stroke-width=\"1\"/>\n  <circle cx=\"500\" cy=\"90\" r=\"16\" fill=\"rgba(67,233,123,0.2)\"  stroke=\"#43e97b\" stroke-width=\"2\"/>\n  <text x=\"500\" cy=\"90\" y=\"94\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"9\" font-family=\"monospace\">loss</text>\n\n  <!-- Forward arrows -->\n  <line x1=\"80\"  y1=\"90\" x2=\"126\" y2=\"90\" stroke=\"rgba(255,255,255,0.4)\" stroke-width=\"1.5\" marker-end=\"url(#fw2)\"/>\n  <line x1=\"170\" y1=\"90\" x2=\"216\" y2=\"90\" stroke=\"rgba(255,255,255,0.35)\" stroke-width=\"1.5\" marker-end=\"url(#fw2)\"/>\n  <line x1=\"260\" y1=\"90\" x2=\"306\" y2=\"90\" stroke=\"rgba(255,255,255,0.28)\" stroke-width=\"1.5\" marker-end=\"url(#fw2)\"/>\n  <line x1=\"350\" y1=\"90\" x2=\"396\" y2=\"90\" stroke=\"rgba(255,255,255,0.2)\"  stroke-width=\"1.5\" marker-end=\"url(#fw2)\"/>\n  <line x1=\"440\" y1=\"90\" x2=\"484\" y2=\"90\" stroke=\"rgba(255,255,255,0.15)\" stroke-width=\"1.5\" marker-end=\"url(#fw2)\"/>\n\n  <!-- Backward gradient arrows (getting smaller) -->\n  <text x=\"280\" y=\"108\" text-anchor=\"middle\" fill=\"rgba(245,87,108,0.65)\" font-size=\"9\" font-family=\"monospace\">← Gradient backpropagates (gets multiplied by &lt;1 at each step)</text>\n  <line x1=\"484\" y1=\"115\" x2=\"446\" y2=\"115\" stroke=\"#f5576c\" stroke-width=\"3\"   marker-end=\"url(#bk2)\"/>\n  <line x1=\"396\" y1=\"115\" x2=\"358\" y2=\"115\" stroke=\"#f5576c\" stroke-width=\"2.2\" marker-end=\"url(#bk2)\"/>\n  <line x1=\"306\" y1=\"115\" x2=\"268\" y2=\"115\" stroke=\"#f5576c\" stroke-width=\"1.5\" marker-end=\"url(#bk2)\"/>\n  <line x1=\"216\" y1=\"115\" x2=\"178\" y2=\"115\" stroke=\"#f5576c\" stroke-width=\"0.9\" marker-end=\"url(#bk2)\"/>\n  <line x1=\"126\" y1=\"115\" x2=\"88\"  y2=\"115\" stroke=\"#f5576c\" stroke-width=\"0.3\" marker-end=\"url(#bk2)\"/>\n\n  <!-- Gradient value labels -->\n  <text x=\"465\" y=\"134\" text-anchor=\"middle\" fill=\"#f5576c\" font-size=\"8.5\" font-family=\"monospace\">0.5</text>\n  <text x=\"375\" y=\"134\" text-anchor=\"middle\" fill=\"#f5576c\" font-size=\"8.5\" font-family=\"monospace\">0.25</text>\n  <text x=\"285\" y=\"134\" text-anchor=\"middle\" fill=\"#f5576c\" font-size=\"8.5\" font-family=\"monospace\">0.12</text>\n  <text x=\"195\" y=\"134\" text-anchor=\"middle\" fill=\"#f5576c\" font-size=\"8.5\" font-family=\"monospace\">0.06</text>\n  <text x=\"105\" y=\"134\" text-anchor=\"middle\" fill=\"#f5576c\" font-size=\"8.5\" font-family=\"monospace\">≈ 0</text>\n  <text x=\"58\"  y=\"148\" text-anchor=\"middle\" fill=\"rgba(245,87,108,0.7)\" font-size=\"9\" font-family=\"monospace\">forgotten!</text>\n\n  <!-- \"What the model remembers\" bar -->\n  <text x=\"280\" y=\"165\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.55)\" font-size=\"9.5\" font-family=\"monospace\">What the model remembers from each time step:</text>\n  <rect x=\"30\"  y=\"172\" width=\"44\" height=\"16\" fill=\"rgba(79,172,254,0.7)\" rx=\"3\"/>\n  <rect x=\"120\" y=\"172\" width=\"32\" height=\"16\" fill=\"rgba(79,172,254,0.5)\" rx=\"3\"/>\n  <rect x=\"210\" y=\"172\" width=\"20\" height=\"16\" fill=\"rgba(79,172,254,0.3)\" rx=\"3\"/>\n  <rect x=\"300\" y=\"172\" width=\"10\" height=\"16\" fill=\"rgba(79,172,254,0.2)\" rx=\"3\"/>\n  <rect x=\"390\" y=\"172\" width=\"4\"  height=\"16\" fill=\"rgba(79,172,254,0.1)\" rx=\"3\"/>\n  <text x=\"52\"  y=\"184\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"8\" font-family=\"monospace\">t=1</text>\n  <text x=\"136\" y=\"184\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"8\" font-family=\"monospace\">t=2</text>\n  <text x=\"220\" y=\"184\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"8\" font-family=\"monospace\">t=3</text>\n  <text x=\"305\" y=\"184\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"8\" font-family=\"monospace\">t=4</text>\n  <text x=\"393\" y=\"184\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"8\" font-family=\"monospace\">t=5</text>\n\n  <text x=\"280\" y=\"205\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.45)\" font-size=\"9.5\" font-family=\"monospace\">RNN remembers recent steps well but forgets distant context</text>\n  <text x=\"280\" y=\"218\" text-anchor=\"middle\" fill=\"rgba(67,233,123,0.7)\" font-size=\"9.5\" font-family=\"monospace\">LSTM fix: memory cell (C) flows with minimal interference → gradients preserved over 100s of steps</text>\n\n  <defs>\n    <marker id=\"fw2\" markerWidth=\"6\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\"><polygon points=\"0 0,6 2.5,0 5\" fill=\"rgba(255,255,255,0.4)\"/></marker>\n    <marker id=\"bk2\" markerWidth=\"6\" markerHeight=\"5\" refX=\"0\" refY=\"2.5\" orient=\"auto\"><polygon points=\"6 0,0 2.5,6 5\" fill=\"#f5576c\"/></marker>\n  </defs>\n</svg>"}, {"label": "Exploding Gradient Problem", "html": "<div class=\"section-tag\">Session 13 — RNN Problems</div>\n<h2 class=\"slide-heading\">💥 The Exploding Gradient Problem</h2>\n<div class=\"two-col\" style=\"margin-bottom:12px;\">\n  <div>\n    <div class=\"card card-accent\" style=\"--accent:#f5576c;margin-bottom:10px;\">\n      <strong>What is it?</strong><br>\n      The <em>opposite</em> of vanishing gradients. Instead of shrinking toward zero, gradients grow exponentially as they backpropagate through layers — multiplied by weights &gt; 1.0 at each step. The result: weight updates become astronomically large.\n    </div>\n    <div class=\"card card-accent\" style=\"--accent:#FFD166;\">\n      <strong>Why does multiplication cause explosion?</strong><br>\n      Each layer multiplies the gradient by its local gradient (related to the weight matrix). If those values are &gt; 1.0, the product grows: <code>1.2 × 1.2 × 1.2 × 1.2 × 1.2 = 2.49</code> after 5 layers — <code>×12</code> after 13 layers. In deep or long-sequence RNNs this becomes catastrophic.\n    </div>\n  </div>\n  <div>\n    <div class=\"card card-accent\" style=\"--accent:#C4B5FD;margin-bottom:10px;\">\n      <strong>What happens in practice?</strong><br>\n      Weight values grow so large they exceed the numeric range of a float (IEEE 754 overflow). The result: <code>NaN</code> values, <code>inf</code> weights, and the model completely breaking. Loss jumps to NaN. Training cannot continue.\n    </div>\n    <div class=\"tip\" style=\"margin-bottom:0;\">\n      ✅ <strong>Fix: Gradient Clipping</strong><br>\n      Before applying each weight update, clip the gradient vector to a maximum norm. In Keras:<br>\n      <code>optimizer = Adam(clipnorm=1.0)</code><br>\n      This caps the gradient magnitude without changing its direction — weights update meaningfully but never explode.\n    </div>\n  </div>\n</div>\n<div style=\"margin-bottom:10px;\"><svg viewBox='0 0 700 190' xmlns='http://www.w3.org/2000/svg' style='width:100%;max-height:190px;'>\n  <rect width='700' height='190' rx='12' fill='rgba(0,0,0,0.45)'/>\n  <!-- Title row -->\n  <text x='350' y='28' text-anchor='middle' fill='#f5576c' font-size='13' font-weight='bold'>EXPLODING GRADIENT — Gradient grows exponentially through layers</text>\n  <!-- Layers with growing arrows -->\n  <rect x='30' y='50' width='60' height='50' rx='8' fill='rgba(245,87,108,0.15)' stroke='#f5576c' stroke-width='1.5'/>\n  <text x='60' y='72' text-anchor='middle' fill='#f5576c' font-size='11' font-weight='bold'>Layer 5</text>\n  <text x='60' y='88' text-anchor='middle' fill='#aaa' font-size='9'>g=0.01</text>\n  <line x1='90' y1='75' x2='130' y2='75' stroke='#f5576c' stroke-width='2'/>\n  <polygon points='130,70 140,75 130,80' fill='#f5576c'/>\n\n  <rect x='140' y='45' width='70' height='60' rx='8' fill='rgba(245,87,108,0.25)' stroke='#f5576c' stroke-width='2'/>\n  <text x='175' y='70' text-anchor='middle' fill='#f5576c' font-size='11' font-weight='bold'>Layer 4</text>\n  <text x='175' y='86' text-anchor='middle' fill='#ffb3b3' font-size='9'>g=0.12</text>\n  <line x1='210' y1='75' x2='250' y2='75' stroke='#f5576c' stroke-width='4'/>\n  <polygon points='250,68 262,75 250,82' fill='#f5576c'/>\n\n  <rect x='265' y='38' width='80' height='74' rx='8' fill='rgba(245,87,108,0.35)' stroke='#f5576c' stroke-width='2.5'/>\n  <text x='305' y='68' text-anchor='middle' fill='#f5576c' font-size='11' font-weight='bold'>Layer 3</text>\n  <text x='305' y='84' text-anchor='middle' fill='#ff8080' font-size='9'>g=1.44</text>\n  <line x1='345' y1='75' x2='385' y2='75' stroke='#f5576c' stroke-width='7'/>\n  <polygon points='385,65 400,75 385,85' fill='#f5576c'/>\n\n  <rect x='400' y='28' width='90' height='95' rx='8' fill='rgba(245,87,108,0.5)' stroke='#f5576c' stroke-width='3'/>\n  <text x='445' y='62' text-anchor='middle' fill='white' font-size='11' font-weight='bold'>Layer 2</text>\n  <text x='445' y='78' text-anchor='middle' fill='#ffdddd' font-size='9'>g=17.3</text>\n  <line x1='490' y1='75' x2='530' y2='75' stroke='#f5576c' stroke-width='12'/>\n  <polygon points='530,60 548,75 530,90' fill='#f5576c'/>\n\n  <rect x='550' y='15' width='110' height='120' rx='8' fill='rgba(245,87,108,0.75)' stroke='#f5576c' stroke-width='4'/>\n  <text x='605' y='60' text-anchor='middle' fill='white' font-size='13' font-weight='bold'>Layer 1</text>\n  <text x='605' y='78' text-anchor='middle' fill='white' font-size='9'>g=207.6</text>\n  <text x='605' y='94' text-anchor='middle' fill='#ffdddd' font-size='9'>💥 OVERFLOW</text>\n  <text x='605' y='110' text-anchor='middle' fill='#ffdddd' font-size='9'>→ NaN values</text>\n\n  <!-- Label -->\n  <text x='30' y='158' fill='#4facfe' font-size='10.5'>← Gradient x 12 per step → exponential growth through multiply-heavy backprop path →</text>\n  <text x='350' y='178' text-anchor='middle' fill='#aaa' font-size='10'>Fix: Gradient Clipping — clip gradients to a max norm before each weight update</text>\n</svg></div>\n<div class=\"warn\" style=\"font-size:12px;\">⚠️ <strong>Vanishing vs Exploding:</strong> Vanishing = gradients → 0 → model can't learn long dependencies (slow death). Exploding = gradients → ∞ → model becomes numerically unstable (sudden crash). LSTMs solve vanishing. Clipping handles exploding. Together they make training stable.</div>"}, {"label": "What is LSTM?", "html": "<div class=\"section-tag\">The Solution</div><div class=\"slide-heading\">LSTM — Long Short-Term Memory 🧠</div><div class=\"two-col\" style=\"margin-bottom:8px;\"><div><strong>What is LSTM?</strong><br>A special type of RNN designed to learn and remember over <em>long</em> sequences. Invented in 1997 by Hochreiter &amp; Schmidhuber specifically to solve the vanishing gradient problem.<br><br><strong>The key innovation — two streams:</strong><br>• <strong>Cell state C(t)</strong> — the \"conveyor belt\" memory that flows through the entire sequence with only small interactions. This is how gradients are preserved.<br>• <strong>Hidden state H(t)</strong> — the short-term working memory passed between steps, like a regular RNN.</div><div><strong>3 gates control the memory:</strong><br>• <strong>Forget gate (F)</strong> — decides what to erase from C<br>• <strong>Input gate (I)</strong> — decides what new info to write into C<br>• <strong>Output gate (O)</strong> — decides what part of C to output as H<br><br><strong>Real-world analogy:</strong><br>Imagine reading a novel. You remember the main character's name (long-term C) throughout the whole book, while tracking who's speaking right now (short-term H). LSTM's gating mechanism does exactly this.</div></div><svg viewBox=\"0 0 560 310\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:560px;display:block;margin:4px auto;\">\n  <rect width=\"560\" height=\"310\" fill=\"rgba(0,0,0,0.45)\" rx=\"10\"/>\n  <text x=\"280\" y=\"18\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"12\" font-weight=\"bold\" font-family=\"monospace\">LSTM Cell — 4 Gates That Control Memory</text>\n\n  <!-- Outer cell box -->\n  <rect x=\"55\" y=\"28\" width=\"450\" height=\"200\" fill=\"rgba(255,255,255,0.03)\" stroke=\"rgba(255,255,255,0.25)\" stroke-width=\"2\" rx=\"12\"/>\n\n  <!-- ── TOP: Memory cell line (C_t-1 → C_t) ── -->\n  <!-- C_t-1 label -->\n  <text x=\"28\" y=\"62\" fill=\"rgba(255,255,255,0.7)\" font-size=\"10\" font-weight=\"bold\" font-family=\"sans-serif\">Memory</text>\n  <text x=\"28\" y=\"75\" fill=\"rgba(255,255,255,0.7)\" font-size=\"10\" font-weight=\"bold\" font-family=\"sans-serif\">C</text>\n  <text x=\"41\" y=\"78\" fill=\"rgba(255,255,255,0.5)\" font-size=\"8\" font-family=\"sans-serif\">t-1</text>\n  <!-- Memory line -->\n  <line x1=\"55\" y1=\"70\" x2=\"510\" y2=\"70\" stroke=\"rgba(255,255,255,0.5)\" stroke-width=\"2\"/>\n  <!-- C_t label -->\n  <text x=\"516\" y=\"75\" fill=\"#fff\" font-size=\"11\" font-weight=\"bold\" font-family=\"sans-serif\">C</text>\n  <text x=\"528\" y=\"78\" fill=\"rgba(255,255,255,0.5)\" font-size=\"8\" font-family=\"sans-serif\">t</text>\n  <!-- Arrow on C line -->\n  <polygon points=\"510,70 502,66 502,74\" fill=\"rgba(255,255,255,0.5)\"/>\n\n  <!-- Multiply circle 1 (forget × C_t-1) at x=135 -->\n  <circle cx=\"135\" cy=\"70\" r=\"13\" fill=\"rgba(255,255,255,0.08)\" stroke=\"rgba(255,255,255,0.4)\" stroke-width=\"1.5\"/>\n  <text x=\"135\" y=\"75\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.8)\" font-size=\"14\" font-weight=\"bold\" font-family=\"monospace\">⊙</text>\n\n  <!-- Add circle (input + candidate → C_t) at x=350 -->\n  <circle cx=\"350\" cy=\"70\" r=\"13\" fill=\"rgba(255,255,255,0.08)\" stroke=\"rgba(255,255,255,0.4)\" stroke-width=\"1.5\"/>\n  <text x=\"350\" y=\"76\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.8)\" font-size=\"16\" font-weight=\"bold\" font-family=\"monospace\">+</text>\n\n  <!-- Tanh circle (for output gate) at x=450 -->\n  <ellipse cx=\"450\" cy=\"70\" rx=\"22\" ry=\"13\" fill=\"rgba(255,255,255,0.08)\" stroke=\"rgba(255,255,255,0.4)\" stroke-width=\"1.5\"/>\n  <text x=\"450\" y=\"75\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.8)\" font-size=\"9.5\" font-family=\"monospace\">tanh</text>\n\n  <!-- Multiply circle 2 (output × tanh) at x=450, below the tanh: we'll put it on H_t line -->\n  <circle cx=\"450\" cy=\"185\" r=\"13\" fill=\"rgba(255,255,255,0.08)\" stroke=\"rgba(255,255,255,0.4)\" stroke-width=\"1.5\"/>\n  <text x=\"450\" y=\"190\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.8)\" font-size=\"14\" font-weight=\"bold\" font-family=\"monospace\">⊙</text>\n\n  <!-- Multiply circle 3 (input gate × candidate) at x=295 -->\n  <circle cx=\"295\" cy=\"135\" r=\"13\" fill=\"rgba(255,255,255,0.08)\" stroke=\"rgba(255,255,255,0.4)\" stroke-width=\"1.5\"/>\n  <text x=\"295\" y=\"140\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.8)\" font-size=\"14\" font-weight=\"bold\" font-family=\"monospace\">⊙</text>\n\n  <!-- Vertical line from mult circle 3 up to add circle -->\n  <line x1=\"295\" y1=\"122\" x2=\"295\" y2=\"95\" stroke=\"rgba(255,255,255,0.3)\" stroke-width=\"1.5\"/>\n  <line x1=\"295\" y1=\"95\" x2=\"350\" y2=\"83\" stroke=\"rgba(255,255,255,0.3)\" stroke-width=\"1.5\"/>\n  <polygon points=\"350,83 344,79 346,87\" fill=\"rgba(255,255,255,0.3)\"/>\n\n  <!-- Vertical line from forget gate up to mult circle 1 -->\n  <line x1=\"135\" y1=\"148\" x2=\"135\" y2=\"83\" stroke=\"rgba(255,255,255,0.3)\" stroke-width=\"1.5\"/>\n  <polygon points=\"135,83 131,91 139,91\" fill=\"rgba(255,255,255,0.3)\"/>\n\n  <!-- Line from input gate to mult circle 3 -->\n  <line x1=\"200\" y1=\"148\" x2=\"200\" y2=\"135\" stroke=\"rgba(255,255,255,0.3)\" stroke-width=\"1.5\"/>\n  <line x1=\"200\" y1=\"135\" x2=\"282\" y2=\"135\" stroke=\"rgba(255,255,255,0.3)\" stroke-width=\"1.5\"/>\n  <polygon points=\"282,135 275,131 275,139\" fill=\"rgba(255,255,255,0.3)\"/>\n\n  <!-- Line from candidate to mult circle 3 -->\n  <line x1=\"310\" y1=\"148\" x2=\"310\" y2=\"135\" stroke=\"rgba(255,255,255,0.3)\" stroke-width=\"1.5\"/>\n  <line x1=\"310\" y1=\"135\" x2=\"308\" y2=\"135\" stroke=\"rgba(255,255,255,0.3)\" stroke-width=\"1.5\"/>\n\n  <!-- Line from output gate up to mult circle 2 -->\n  <line x1=\"420\" y1=\"148\" x2=\"420\" y2=\"185\" stroke=\"rgba(255,255,255,0.3)\" stroke-width=\"1.5\"/>\n  <line x1=\"420\" y1=\"185\" x2=\"437\" y2=\"185\" stroke=\"rgba(255,255,255,0.3)\" stroke-width=\"1.5\"/>\n  <polygon points=\"437,185 430,181 430,189\" fill=\"rgba(255,255,255,0.3)\"/>\n\n  <!-- Line from tanh down to mult circle 2 -->\n  <line x1=\"450\" y1=\"83\" x2=\"450\" y2=\"172\" stroke=\"rgba(255,255,255,0.3)\" stroke-width=\"1.5\"/>\n  <polygon points=\"450,172 446,164 454,164\" fill=\"rgba(255,255,255,0.3)\"/>\n\n  <!-- ── GATE BOXES (row of 4) ── -->\n  <!-- Forget Gate -->\n  <rect x=\"105\" y=\"148\" width=\"60\" height=\"28\" fill=\"#2563eb\" rx=\"5\"/>\n  <text x=\"135\" y=\"160\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"8.5\" font-weight=\"bold\" font-family=\"sans-serif\">F</text>\n  <text x=\"143\" y=\"163\" fill=\"rgba(255,255,255,0.7)\" font-size=\"7\" font-family=\"sans-serif\">t</text>\n  <rect x=\"165\" y=\"148\" width=\"26\" height=\"28\" fill=\"#3b82f6\" rx=\"3\"/>\n  <text x=\"178\" y=\"166\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"9.5\" font-family=\"monospace\">σ</text>\n\n  <!-- Input Gate -->\n  <rect x=\"175\" y=\"148\" width=\"55\" height=\"28\" fill=\"#2563eb\" rx=\"5\"/>\n  <text x=\"202\" y=\"160\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"8.5\" font-weight=\"bold\" font-family=\"sans-serif\">I</text>\n  <text x=\"210\" y=\"163\" fill=\"rgba(255,255,255,0.7)\" font-size=\"7\" font-family=\"sans-serif\">t</text>\n  <rect x=\"230\" y=\"148\" width=\"26\" height=\"28\" fill=\"#3b82f6\" rx=\"3\"/>\n  <text x=\"243\" y=\"166\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"9.5\" font-family=\"monospace\">σ</text>\n\n  <!-- Candidate Memory -->\n  <rect x=\"265\" y=\"148\" width=\"72\" height=\"28\" fill=\"#2563eb\" rx=\"5\"/>\n  <text x=\"290\" y=\"158\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"8.5\" font-weight=\"bold\" font-family=\"sans-serif\">C̃</text>\n  <text x=\"300\" y=\"162\" fill=\"rgba(255,255,255,0.7)\" font-size=\"7\" font-family=\"sans-serif\">t</text>\n  <rect x=\"337\" y=\"148\" width=\"32\" height=\"28\" fill=\"#3b82f6\" rx=\"3\"/>\n  <text x=\"353\" y=\"166\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"9.5\" font-family=\"monospace\">tanh</text>\n\n  <!-- Output Gate -->\n  <rect x=\"390\" y=\"148\" width=\"62\" height=\"28\" fill=\"#2563eb\" rx=\"5\"/>\n  <text x=\"416\" y=\"160\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"8.5\" font-weight=\"bold\" font-family=\"sans-serif\">O</text>\n  <text x=\"426\" y=\"163\" fill=\"rgba(255,255,255,0.7)\" font-size=\"7\" font-family=\"sans-serif\">t</text>\n  <rect x=\"452\" y=\"148\" width=\"26\" height=\"28\" fill=\"#3b82f6\" rx=\"3\"/>\n  <text x=\"465\" y=\"166\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"9.5\" font-family=\"monospace\">σ</text>\n\n  <!-- Gate labels (above boxes) -->\n  <text x=\"135\" y=\"143\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.55)\" font-size=\"8.5\" font-family=\"sans-serif\">Forget gate</text>\n  <text x=\"213\" y=\"143\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.55)\" font-size=\"8.5\" font-family=\"sans-serif\">Input gate</text>\n  <text x=\"305\" y=\"143\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.55)\" font-size=\"8.5\" font-family=\"sans-serif\">Candidate memory</text>\n  <text x=\"430\" y=\"143\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.55)\" font-size=\"8.5\" font-family=\"sans-serif\">Output gate</text>\n\n  <!-- ── BOTTOM: Hidden state line (H_t-1 → Ht) ── -->\n  <!-- H_t-1 label -->\n  <text x=\"10\" y=\"193\" fill=\"rgba(255,255,255,0.7)\" font-size=\"9.5\" font-weight=\"bold\" font-family=\"sans-serif\">Hidden</text>\n  <text x=\"10\" y=\"206\" fill=\"rgba(255,255,255,0.7)\" font-size=\"9.5\" font-weight=\"bold\" font-family=\"sans-serif\">state H</text>\n  <text x=\"55\" y=\"209\" fill=\"rgba(255,255,255,0.5)\" font-size=\"7.5\" font-family=\"sans-serif\">t-1</text>\n  <!-- H line -->\n  <line x1=\"55\" y1=\"200\" x2=\"463\" y2=\"200\" stroke=\"rgba(255,255,255,0.3)\" stroke-width=\"1.5\"/>\n  <!-- H feeds into all 4 gates (dotted lines up) -->\n  <line x1=\"135\" y1=\"200\" x2=\"135\" y2=\"176\" stroke=\"rgba(255,255,255,0.2)\" stroke-width=\"1\" stroke-dasharray=\"3,2\"/>\n  <line x1=\"213\" y1=\"200\" x2=\"213\" y2=\"176\" stroke=\"rgba(255,255,255,0.2)\" stroke-width=\"1\" stroke-dasharray=\"3,2\"/>\n  <line x1=\"310\" y1=\"200\" x2=\"310\" y2=\"176\" stroke=\"rgba(255,255,255,0.2)\" stroke-width=\"1\" stroke-dasharray=\"3,2\"/>\n  <line x1=\"430\" y1=\"200\" x2=\"430\" y2=\"176\" stroke=\"rgba(255,255,255,0.2)\" stroke-width=\"1\" stroke-dasharray=\"3,2\"/>\n  <!-- H_t output -->\n  <line x1=\"463\" y1=\"200\" x2=\"510\" y2=\"200\" stroke=\"rgba(255,255,255,0.3)\" stroke-width=\"1.5\"/>\n  <line x1=\"450\" y1=\"198\" x2=\"463\" y2=\"200\" stroke=\"rgba(255,255,255,0.3)\" stroke-width=\"1.5\"/>\n  <polygon points=\"510,200 502,196 502,204\" fill=\"rgba(255,255,255,0.3)\"/>\n  <text x=\"516\" y=\"205\" fill=\"#fff\" font-size=\"11\" font-weight=\"bold\" font-family=\"sans-serif\">H</text>\n  <text x=\"528\" y=\"208\" fill=\"rgba(255,255,255,0.5)\" font-size=\"8\" font-family=\"sans-serif\">t</text>\n\n  <!-- X_t input label at bottom -->\n  <text x=\"240\" y=\"240\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.7)\" font-size=\"10\" font-weight=\"bold\" font-family=\"sans-serif\">Input  X</text>\n  <text x=\"282\" y=\"243\" fill=\"rgba(255,255,255,0.5)\" font-size=\"8\" font-family=\"sans-serif\">t</text>\n  <!-- X feeds into all gates -->\n  <line x1=\"135\" y1=\"230\" x2=\"135\" y2=\"176\" stroke=\"rgba(255,255,255,0.15)\" stroke-width=\"1\" stroke-dasharray=\"2,3\"/>\n  <line x1=\"213\" y1=\"230\" x2=\"213\" y2=\"176\" stroke=\"rgba(255,255,255,0.15)\" stroke-width=\"1\" stroke-dasharray=\"2,3\"/>\n  <line x1=\"280\" y1=\"230\" x2=\"280\" y2=\"176\" stroke=\"rgba(255,255,255,0.15)\" stroke-width=\"1\" stroke-dasharray=\"2,3\"/>\n  <line x1=\"415\" y1=\"230\" x2=\"415\" y2=\"176\" stroke=\"rgba(255,255,255,0.15)\" stroke-width=\"1\" stroke-dasharray=\"2,3\"/>\n\n  <!-- Bottom legend -->\n  <text x=\"280\" y=\"260\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.45)\" font-size=\"9\" font-family=\"monospace\">σ = sigmoid (0 to 1)  ·  ⊙ = element-wise multiply  ·  + = element-wise add</text>\n  <text x=\"280\" y=\"274\" text-anchor=\"middle\" fill=\"rgba(79,172,254,0.7)\" font-size=\"9\" font-family=\"monospace\">C (memory cell) flows along the top with only small multiplicative interactions → gradients preserved!</text>\n  <text x=\"280\" y=\"288\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.35)\" font-size=\"9\" font-family=\"monospace\">This is why LSTM solves the vanishing gradient problem that breaks plain RNNs</text>\n</svg>"}, {"label": "LSTM Gates Explained", "html": "<div class=\"section-tag\">Deep Dive</div><div class=\"slide-heading\">Inside the LSTM Cell — 4 Gates, 1 Goal: Selective Memory 🔑</div><p style=\"color:rgba(255,255,255,0.65);font-size:0.95em;margin:4px 0 10px;\">Every LSTM cell runs these 4 computations at <strong>every single time step</strong>. The gates learn what to remember and what to forget from the training data — you don't program the rules manually.</p><svg viewBox=\"0 0 560 240\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:560px;display:block;margin:4px auto;\">\n  <rect width=\"560\" height=\"240\" fill=\"rgba(0,0,0,0.45)\" rx=\"10\"/>\n  <text x=\"280\" y=\"18\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"12\" font-weight=\"bold\" font-family=\"monospace\">LSTM Gates — What Each One Does</text>\n\n  <!-- Gate 1: Forget Gate -->\n  <rect x=\"8\" y=\"28\" width=\"127\" height=\"185\" fill=\"rgba(245,87,108,0.06)\" stroke=\"rgba(245,87,108,0.3)\" rx=\"8\"/>\n  <rect x=\"18\" y=\"36\" width=\"107\" height=\"24\" fill=\"#2563eb\" rx=\"5\"/>\n  <text x=\"71\" y=\"52\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">🚪 Forget Gate</text>\n  <text x=\"71\" y=\"70\" text-anchor=\"middle\" fill=\"#f5576c\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">F_t = σ(W·[h,x]+b)</text>\n  <text x=\"71\" y=\"88\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.6)\" font-size=\"8.5\" font-family=\"monospace\">Output: 0 to 1</text>\n  <text x=\"71\" y=\"100\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.6)\" font-size=\"8.5\" font-family=\"monospace\">0 = forget completely</text>\n  <text x=\"71\" y=\"112\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.6)\" font-size=\"8.5\" font-family=\"monospace\">1 = keep perfectly</text>\n  <rect x=\"18\" y=\"120\" width=\"107\" height=\"50\" fill=\"rgba(245,87,108,0.1)\" stroke=\"rgba(245,87,108,0.2)\" rx=\"5\"/>\n  <text x=\"71\" y=\"134\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.7)\" font-size=\"8.5\" font-family=\"monospace\">Example:</text>\n  <text x=\"71\" y=\"146\" text-anchor=\"middle\" fill=\"#f5576c\" font-size=\"8.5\" font-family=\"monospace\">Translating \"he was\"</text>\n  <text x=\"71\" y=\"158\" text-anchor=\"middle\" fill=\"#f5576c\" font-size=\"8.5\" font-family=\"monospace\">→ forget old subject</text>\n  <text x=\"71\" y=\"175\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.4)\" font-size=\"8.5\" font-family=\"monospace\">Multiplies C_t-1</text>\n  <text x=\"71\" y=\"187\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.4)\" font-size=\"8.5\" font-family=\"monospace\">to erase old memories</text>\n  <text x=\"71\" y=\"205\" text-anchor=\"middle\" fill=\"rgba(255,209,102,0.7)\" font-size=\"8.5\" font-family=\"monospace\">Controls: WHAT TO FORGET</text>\n\n  <!-- Gate 2: Input Gate -->\n  <rect x=\"143\" y=\"28\" width=\"127\" height=\"185\" fill=\"rgba(67,233,123,0.06)\" stroke=\"rgba(67,233,123,0.3)\" rx=\"8\"/>\n  <rect x=\"153\" y=\"36\" width=\"107\" height=\"24\" fill=\"#2563eb\" rx=\"5\"/>\n  <text x=\"206\" y=\"52\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">📥 Input Gate</text>\n  <text x=\"206\" y=\"70\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">I_t = σ(W·[h,x]+b)</text>\n  <text x=\"206\" y=\"88\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.6)\" font-size=\"8.5\" font-family=\"monospace\">Output: 0 to 1</text>\n  <text x=\"206\" y=\"100\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.6)\" font-size=\"8.5\" font-family=\"monospace\">0 = block new info</text>\n  <text x=\"206\" y=\"112\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.6)\" font-size=\"8.5\" font-family=\"monospace\">1 = write new info</text>\n  <rect x=\"153\" y=\"120\" width=\"107\" height=\"50\" fill=\"rgba(67,233,123,0.08)\" stroke=\"rgba(67,233,123,0.2)\" rx=\"5\"/>\n  <text x=\"206\" y=\"134\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.7)\" font-size=\"8.5\" font-family=\"monospace\">Example:</text>\n  <text x=\"206\" y=\"146\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"8.5\" font-family=\"monospace\">New subject \"she\"</text>\n  <text x=\"206\" y=\"158\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"8.5\" font-family=\"monospace\">→ store new gender</text>\n  <text x=\"206\" y=\"175\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.4)\" font-size=\"8.5\" font-family=\"monospace\">Multiplied by C̃_t</text>\n  <text x=\"206\" y=\"187\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.4)\" font-size=\"8.5\" font-family=\"monospace\">to write new memory</text>\n  <text x=\"206\" y=\"205\" text-anchor=\"middle\" fill=\"rgba(255,209,102,0.7)\" font-size=\"8.5\" font-family=\"monospace\">Controls: WHAT TO STORE</text>\n\n  <!-- Gate 3: Candidate (Cell Gate) -->\n  <rect x=\"278\" y=\"28\" width=\"127\" height=\"185\" fill=\"rgba(255,209,102,0.06)\" stroke=\"rgba(255,209,102,0.3)\" rx=\"8\"/>\n  <rect x=\"288\" y=\"36\" width=\"107\" height=\"24\" fill=\"#2563eb\" rx=\"5\"/>\n  <text x=\"341\" y=\"52\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">💾 Candidate</text>\n  <text x=\"341\" y=\"70\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"9.5\" font-weight=\"bold\" font-family=\"monospace\">C̃_t = tanh(W·[h,x]+b)</text>\n  <text x=\"341\" y=\"88\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.6)\" font-size=\"8.5\" font-family=\"monospace\">Output: −1 to 1</text>\n  <text x=\"341\" y=\"100\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.6)\" font-size=\"8.5\" font-family=\"monospace\">Proposes new content</text>\n  <text x=\"341\" y=\"112\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.6)\" font-size=\"8.5\" font-family=\"monospace\">filtered by input gate</text>\n  <rect x=\"288\" y=\"120\" width=\"107\" height=\"50\" fill=\"rgba(255,209,102,0.08)\" stroke=\"rgba(255,209,102,0.2)\" rx=\"5\"/>\n  <text x=\"341\" y=\"134\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.7)\" font-size=\"8.5\" font-family=\"monospace\">Example:</text>\n  <text x=\"341\" y=\"146\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"8.5\" font-family=\"monospace\">Raw new content</text>\n  <text x=\"341\" y=\"158\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"8.5\" font-family=\"monospace\">created from input</text>\n  <text x=\"341\" y=\"175\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.4)\" font-size=\"8.5\" font-family=\"monospace\">C_t = F_t⊙C_t-1</text>\n  <text x=\"341\" y=\"187\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.4)\" font-size=\"8.5\" font-family=\"monospace\">      + I_t⊙C̃_t</text>\n  <text x=\"341\" y=\"205\" text-anchor=\"middle\" fill=\"rgba(255,209,102,0.7)\" font-size=\"8.5\" font-family=\"monospace\">Controls: WHAT TO PROPOSE</text>\n\n  <!-- Gate 4: Output Gate -->\n  <rect x=\"413\" y=\"28\" width=\"140\" height=\"185\" fill=\"rgba(139,92,246,0.06)\" stroke=\"rgba(139,92,246,0.3)\" rx=\"8\"/>\n  <rect x=\"423\" y=\"36\" width=\"120\" height=\"24\" fill=\"#2563eb\" rx=\"5\"/>\n  <text x=\"483\" y=\"52\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">📤 Output Gate</text>\n  <text x=\"483\" y=\"70\" text-anchor=\"middle\" fill=\"#C4B5FD\" font-size=\"9.5\" font-weight=\"bold\" font-family=\"monospace\">O_t = σ(W·[h,x]+b)</text>\n  <text x=\"483\" y=\"88\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.6)\" font-size=\"8.5\" font-family=\"monospace\">Output: 0 to 1</text>\n  <text x=\"483\" y=\"100\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.6)\" font-size=\"8.5\" font-family=\"monospace\">Decides what part of</text>\n  <text x=\"483\" y=\"112\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.6)\" font-size=\"8.5\" font-family=\"monospace\">memory to output</text>\n  <rect x=\"423\" y=\"120\" width=\"120\" height=\"50\" fill=\"rgba(139,92,246,0.08)\" stroke=\"rgba(139,92,246,0.2)\" rx=\"5\"/>\n  <text x=\"483\" y=\"134\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.7)\" font-size=\"8.5\" font-family=\"monospace\">Example:</text>\n  <text x=\"483\" y=\"146\" text-anchor=\"middle\" fill=\"#C4B5FD\" font-size=\"8.5\" font-family=\"monospace\">Which part of memory</text>\n  <text x=\"483\" y=\"158\" text-anchor=\"middle\" fill=\"#C4B5FD\" font-size=\"8.5\" font-family=\"monospace\">to pass to next step</text>\n  <text x=\"483\" y=\"175\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.4)\" font-size=\"8.5\" font-family=\"monospace\">H_t = O_t ⊙ tanh(C_t)</text>\n  <text x=\"483\" y=\"187\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.4)\" font-size=\"8.5\" font-family=\"monospace\">H_t = next hidden state</text>\n  <text x=\"483\" y=\"205\" text-anchor=\"middle\" fill=\"rgba(255,209,102,0.7)\" font-size=\"8.5\" font-family=\"monospace\">Controls: WHAT TO OUTPUT</text>\n\n  <!-- Bottom summary -->\n  <text x=\"280\" y=\"225\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.5)\" font-size=\"9.5\" font-family=\"monospace\">Together: Forget old → Propose new → Store new → Output relevant → New hidden state → repeat</text>\n</svg><div class=\"code-wrap\" style=\"margin-top:8px;\"><div class=\"code-header\"><span>lstm_keras.py</span><span>python</span></div><div style=\"padding:5px 14px;display:flex;gap:18px;flex-wrap:wrap;background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.07);font-size:10.5px;\"><span><span style=\"color:#4facfe;font-weight:700;\">📅 When: </span><span style=\"color:#8b949e;\">building sequence models for time series, NLP, or any ordered data</span></span><span><span style=\"color:#43e97b;font-weight:700;\">💡 Why: </span><span style=\"color:#8b949e;\">LSTM gates control what to remember and forget across long sequences</span></span><span><span style=\"color:#FFD166;font-weight:700;\">✏️ Try: </span><span style=\"color:#8b949e;\">change LSTM(64) to LSTM(128) — more capacity, more training time</span></span></div><pre><span class=\"kw\">from</span> tensorflow.keras <span class=\"kw\">import</span> Sequential\n<span class=\"kw\">from</span> tensorflow.keras.layers <span class=\"kw\">import</span> LSTM, Dense, Dropout\n\n<span class=\"cm\"># Input shape: (batch, time_steps, features)</span>\n<span class=\"cm\"># e.g. 60 days of data, 1 feature (close price)</span>\nmodel = Sequential([\n    LSTM(<span class=\"nm\">64</span>, return_sequences=<span class=\"kw\">True</span>,    <span class=\"cm\"># stack 2 LSTM layers</span>\n         input_shape=(<span class=\"nm\">60</span>, <span class=\"nm\">1</span>)),\n    Dropout(<span class=\"nm\">0.2</span>),\n    LSTM(<span class=\"nm\">32</span>, return_sequences=<span class=\"kw\">False</span>),  <span class=\"cm\"># final LSTM outputs one vector</span>\n    Dropout(<span class=\"nm\">0.2</span>),\n    Dense(<span class=\"nm\">1</span>)                            <span class=\"cm\"># predict next price</span>\n])\nmodel.compile(optimizer=<span class=\"st\">\"adam\"</span>, loss=<span class=\"st\">\"mse\"</span>)\nmodel.summary()   <span class=\"cm\"># shows gate parameters: 4 × (units² + units×features + units)</span></pre>\n<div style=\"background:rgba(255,255,255,0.04);border-top:2px solid rgba(255,255,255,0.08);padding:9px 14px;font-size:11px;\"><div style=\"color:#fff;font-weight:700;margin-bottom:6px;font-size:11.5px;\">🔍 What this block does</div><div style=\"color:#ccc;font-size:11.5px;margin-bottom:7px;line-height:1.55;\">Builds LSTM + Dense model in Keras with Dropout — ready for sequence input.</div><div style=\"display:flex;flex-direction:column;gap:1px;\"><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">Sequential()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ Keras model where layers stack one after another — data flows left to right</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">Dense()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ fully-connected layer — every neuron connects to every neuron in the next layer</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">Dropout()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ randomly deactivates X% of neurons each batch — prevents overfitting in neural networks</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">modelcompile()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ sets the loss function, optimiser, and metrics before training starts</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">LSTM()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ Long Short-Term Memory layer — remembers long sequences using forget/input/output gates</span></div></div></div></div><div class=\"tip\">💡 <code>return_sequences=True</code> passes the hidden state at <em>every</em> time step to the next layer. Use this when stacking LSTM layers. <code>False</code> (default) only passes the <em>last</em> step's output.</div>"}, {"label": "What is LSTM?", "html": "<div class=\"section-tag\">Architecture</div><div class=\"slide-heading\">What is LSTM? — Long Short-Term Memory 🧠</div><div class=\"big-concept\"><div class=\"bc-emoji\">🧠</div><h2>LSTM = a special RNN that can remember things for hundreds of time steps</h2><p>Regular RNNs suffer from vanishing gradients — they \"forget\" information from many steps ago. LSTM gates (forget, input, output) control what to remember and what to discard, enabling long-range dependencies.</p></div><div class=\"cards cards-3\" style=\"margin-top:10px;\"><div class=\"card card-accent\"><div class=\"card-icon\">🚪</div><h3>Forget Gate</h3><p>Decides which old information to throw away from cell state. \"I don't need last week's news to predict tomorrow's price.\"</p></div><div class=\"card card-accent\"><div class=\"card-icon\">📥</div><h3>Input Gate</h3><p>Decides what new information to store. \"Add today's earnings announcement to what I remember.\"</p></div><div class=\"card card-accent\"><div class=\"card-icon\">📤</div><h3>Output Gate</h3><p>Decides what to output based on cell state. \"Based on everything I remember, here's my prediction.\"</p></div></div>"}, {"label": "LSTM Real-World Applications", "html": "<div class=\"section-tag\">Session 13 — LSTM Applications</div>\n<h2 class=\"slide-heading\">🌍 Where LSTMs Are Used in the Real World</h2>\n<div style=\"margin-bottom:12px;\"><svg viewBox='0 0 700 160' xmlns='http://www.w3.org/2000/svg' style='width:100%;max-height:160px;'>\n  <rect width='700' height='160' rx='12' fill='rgba(0,0,0,0.45)'/>\n  <!-- 5 application boxes -->\n  <rect x='14' y='20' width='124' height='120' rx='10' fill='rgba(79,172,254,0.15)' stroke='#4facfe' stroke-width='1.5'/>\n  <text x='76' y='48' text-anchor='middle' font-size='22'>🗣️</text>\n  <text x='76' y='70' text-anchor='middle' fill='#4facfe' font-size='11' font-weight='bold'>Speech</text>\n  <text x='76' y='84' text-anchor='middle' fill='#4facfe' font-size='11' font-weight='bold'>Recognition</text>\n  <text x='76' y='100' text-anchor='middle' fill='#bbb' font-size='9.5'>Audio → text</text>\n  <text x='76' y='114' text-anchor='middle' fill='#bbb' font-size='9.5'>Siri, Alexa</text>\n  <text x='76' y='128' text-anchor='middle' fill='#bbb' font-size='9.5'>early voice AI</text>\n\n  <rect x='152' y='20' width='124' height='120' rx='10' fill='rgba(67,233,123,0.13)' stroke='#43e97b' stroke-width='1.5'/>\n  <text x='214' y='48' text-anchor='middle' font-size='22'>🌐</text>\n  <text x='214' y='70' text-anchor='middle' fill='#43e97b' font-size='11' font-weight='bold'>Machine</text>\n  <text x='214' y='84' text-anchor='middle' fill='#43e97b' font-size='11' font-weight='bold'>Translation</text>\n  <text x='214' y='100' text-anchor='middle' fill='#bbb' font-size='9.5'>EN → FR/ZH/MY</text>\n  <text x='214' y='114' text-anchor='middle' fill='#bbb' font-size='9.5'>Seq2seq LSTMs</text>\n  <text x='214' y='128' text-anchor='middle' fill='#bbb' font-size='9.5'>now: transformers</text>\n\n  <rect x='290' y='20' width='124' height='120' rx='10' fill='rgba(255,209,102,0.13)' stroke='#FFD166' stroke-width='1.5'/>\n  <text x='352' y='48' text-anchor='middle' font-size='22'>📈</text>\n  <text x='352' y='70' text-anchor='middle' fill='#FFD166' font-size='11' font-weight='bold'>Time Series</text>\n  <text x='352' y='84' text-anchor='middle' fill='#FFD166' font-size='11' font-weight='bold'>Forecasting</text>\n  <text x='352' y='100' text-anchor='middle' fill='#bbb' font-size='9.5'>Stock prices</text>\n  <text x='352' y='114' text-anchor='middle' fill='#bbb' font-size='9.5'>Weather patterns</text>\n  <text x='352' y='128' text-anchor='middle' fill='#bbb' font-size='9.5'>energy demand</text>\n\n  <rect x='428' y='20' width='124' height='120' rx='10' fill='rgba(196,181,253,0.15)' stroke='#C4B5FD' stroke-width='1.5'/>\n  <text x='490' y='48' text-anchor='middle' font-size='22'>🏥</text>\n  <text x='490' y='70' text-anchor='middle' fill='#C4B5FD' font-size='11' font-weight='bold'>Healthcare</text>\n  <text x='490' y='84' text-anchor='middle' fill='#C4B5FD' font-size='11' font-weight='bold'>Analysis</text>\n  <text x='490' y='100' text-anchor='middle' fill='#bbb' font-size='9.5'>Disease progression</text>\n  <text x='490' y='114' text-anchor='middle' fill='#bbb' font-size='9.5'>ICU monitoring</text>\n  <text x='490' y='128' text-anchor='middle' fill='#bbb' font-size='9.5'>EHR time series</text>\n\n  <rect x='566' y='20' width='120' height='120' rx='10' fill='rgba(245,87,108,0.13)' stroke='#f5576c' stroke-width='1.5'/>\n  <text x='626' y='48' text-anchor='middle' font-size='22'>💬</text>\n  <text x='626' y='70' text-anchor='middle' fill='#f5576c' font-size='11' font-weight='bold'>Sentiment</text>\n  <text x='626' y='84' text-anchor='middle' fill='#f5576c' font-size='11' font-weight='bold'>Analysis</text>\n  <text x='626' y='100' text-anchor='middle' fill='#bbb' font-size='9.5'>Review → pos/neg</text>\n  <text x='626' y='114' text-anchor='middle' fill='#bbb' font-size='9.5'>Social media</text>\n  <text x='626' y='128' text-anchor='middle' fill='#bbb' font-size='9.5'>NLP pre-BERT</text>\n</svg></div>\n<div class=\"two-col\">\n  <div>\n    <div class=\"card card-accent\" style=\"--accent:#4facfe;margin-bottom:8px;\">\n      <strong>🗣️ Speech Recognition</strong><br>\n      Early voice assistants (Siri, Alexa, Google Now) used LSTMs to transcribe spoken language into text. Audio is a time series — each millisecond-sample depends on the ones before it. LSTMs could model these short-term acoustic dependencies across a spoken word or phrase.\n    </div>\n    <div class=\"card card-accent\" style=\"--accent:#43e97b;margin-bottom:8px;\">\n      <strong>🌐 Machine Translation</strong><br>\n      Encoder–decoder LSTM architectures (seq2seq) were the backbone of Google Translate before 2017. The encoder LSTM compressed a sentence into a context vector; the decoder LSTM expanded it into the target language. Now replaced by Transformers (BERT, GPT) — but LSTMs pioneered the architecture.\n    </div>\n    <div class=\"card card-accent\" style=\"--accent:#f5576c;\">\n      <strong>💬 Sentiment Analysis &amp; Language Modelling</strong><br>\n      LSTMs read sequences of words and classify sentiment (positive/negative), generate next-word predictions, and power early chatbots. Pre-BERT, LSTM-based models were state-of-the-art on most NLP benchmarks.\n    </div>\n  </div>\n  <div>\n    <div class=\"card card-accent\" style=\"--accent:#FFD166;margin-bottom:8px;\">\n      <strong>📈 Time Series Forecasting</strong><br>\n      LSTMs <em>still dominate</em> many time series tasks: predicting stock prices, electricity demand, weather patterns, traffic flow, and retail sales. Why? They natively handle variable-length sequences and long-term dependencies that simple ARIMA models miss.\n    </div>\n    <div class=\"card card-accent\" style=\"--accent:#C4B5FD;margin-bottom:8px;\">\n      <strong>🏥 Healthcare — Disease Progression</strong><br>\n      Patient health records are time series: heart rate, blood pressure, lab results over days or months. LSTMs can model how these values change over time to predict disease progression, ICU deterioration risk, or treatment outcomes — giving clinicians an early warning system.\n    </div>\n    <div class=\"tip\">\n      ⏳ <strong>Why not always Transformers?</strong> For long sequences with large datasets, Transformers win. But for smaller datasets, short sequences, or edge devices with memory limits, LSTMs are lighter, faster to train, and still very effective.\n    </div>\n  </div>\n</div>"}, {"label": "Building an LSTM", "html": "<div class=\"section-tag\">Code</div><div class=\"slide-heading\">Build an LSTM for Stock Price Prediction 💻</div><div class=\"code-wrap\"><div class=\"code-header\"><span>lstm_stock.py</span><span>python</span></div><div style=\"padding:5px 14px;display:flex;gap:18px;flex-wrap:wrap;background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.07);font-size:10.5px;\"><span><span style=\"color:#4facfe;font-weight:700;\">📅 When: </span><span style=\"color:#8b949e;\">predicting future values from historical sequences — stocks, energy, weather</span></span><span><span style=\"color:#43e97b;font-weight:700;\">💡 Why: </span><span style=\"color:#8b949e;\">LSTM captures long-term patterns that simple RNNs lose</span></span><span><span style=\"color:#FFD166;font-weight:700;\">✏️ Try: </span><span style=\"color:#8b949e;\">change look_back=60 to 30 or 90 — see how window size affects accuracy</span></span></div><pre><span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n<span class=\"kw\">import</span> yfinance <span class=\"kw\">as</span> yf\n<span class=\"kw\">from</span> sklearn.preprocessing <span class=\"kw\">import</span> MinMaxScaler\n<span class=\"kw\">from</span> tensorflow.keras <span class=\"kw\">import</span> layers, Sequential\n\n<span class=\"cm\"># ── 1. Get data ───────────────────────────────────────────</span>\ndf = yf.Ticker(<span class=\"st\">\"AAPL\"</span>).history(period=<span class=\"st\">\"5y\"</span>)\nprices = df[<span class=\"st\">\"Close\"</span>].values.reshape(-<span class=\"nm\">1</span>, <span class=\"nm\">1</span>)\n\n<span class=\"cm\"># ── 2. Scale to [0,1] ─────────────────────────────────────</span>\nscaler = MinMaxScaler()\nscaled = scaler.fit_transform(prices)\n\n<span class=\"cm\"># ── 3. Create windowed sequences ──────────────────────────</span>\n<span class=\"cm\"># Use last 60 days to predict next day</span>\nL
