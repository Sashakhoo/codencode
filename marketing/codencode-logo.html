<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>codencode — Logo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700;800&family=Space+Mono:wght@400;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy: #0a0e1a;
    --cyan: #00d4e8;
    --gold: #f5c842;
    --dim-cyan: #00d4e833;
    --dim-gold: #f5c84233;
  }

  body {
    background: var(--navy);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'JetBrains Mono', monospace;
    gap: 80px;
    padding: 60px 40px;
  }

  /* ── VARIANT 1: Glitch + Binary Rain ── */
  .logo-v1 {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .binary-strip {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--cyan);
    opacity: 0.35;
    animation: blink-strip 3s steps(1) infinite;
  }

  @keyframes blink-strip {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 0.15; }
  }

  .wordmark {
    position: relative;
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 800;
    font-size: 52px;
    letter-spacing: -1px;
    color: #fff;
    text-transform: lowercase;
    line-height: 1;
  }

  .wordmark .accent { color: var(--cyan); }
  .wordmark .dot { color: var(--gold); }

  /* Glitch layers */
  .wordmark::before,
  .wordmark::after {
    content: attr(data-text);
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    font-family: inherit;
    font-weight: inherit;
    font-size: inherit;
    letter-spacing: inherit;
    color: #fff;
  }

  .wordmark::before {
    color: var(--cyan);
    clip-path: polygon(0 20%, 100% 20%, 100% 35%, 0 35%);
    transform: translateX(-3px);
    animation: glitch-1 4s steps(1) infinite;
    opacity: 0.8;
  }

  .wordmark::after {
    color: var(--gold);
    clip-path: polygon(0 60%, 100% 60%, 100% 75%, 0 75%);
    transform: translateX(3px);
    animation: glitch-2 4s steps(1) infinite;
    opacity: 0.8;
  }

  @keyframes glitch-1 {
    0%, 85%, 100% { transform: translateX(0); opacity: 0; }
    87% { transform: translateX(-4px); opacity: 0.8; clip-path: polygon(0 15%, 100% 15%, 100% 30%, 0 30%); }
    89% { transform: translateX(2px); opacity: 0.6; clip-path: polygon(0 60%, 100% 60%, 100% 70%, 0 70%); }
    91% { transform: translateX(-4px); opacity: 0.8; clip-path: polygon(0 25%, 100% 25%, 100% 40%, 0 40%); }
    93% { opacity: 0; }
  }

  @keyframes glitch-2 {
    0%, 85%, 100% { transform: translateX(0); opacity: 0; }
    88% { transform: translateX(4px); opacity: 0.8; clip-path: polygon(0 55%, 100% 55%, 100% 70%, 0 70%); }
    90% { transform: translateX(-2px); opacity: 0.5; clip-path: polygon(0 30%, 100% 30%, 100% 45%, 0 45%); }
    92% { transform: translateX(4px); opacity: 0.8; }
    94% { opacity: 0; }
  }

  .tagline {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 5px;
    color: var(--gold);
    text-transform: uppercase;
    opacity: 0.85;
    margin-top: 4px;
  }

  /* Bracket decorators */
  .brackets {
    font-size: 10px;
    letter-spacing: 6px;
    color: var(--cyan);
    opacity: 0.5;
    font-family: 'Space Mono', monospace;
    animation: bracket-pulse 2.5s ease-in-out infinite;
  }

  @keyframes bracket-pulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  /* ── VARIANT 2: Icon + Wordmark ── */
  .logo-v2 {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .icon-mark {
    position: relative;
    width: 64px;
    height: 64px;
    flex-shrink: 0;
  }

  .icon-mark svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .v2-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .v2-name {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 800;
    font-size: 38px;
    letter-spacing: -1px;
    line-height: 1;
    color: #fff;
  }

  .v2-name span { color: var(--cyan); }

  .v2-sub {
    font-size: 9px;
    letter-spacing: 4px;
    color: var(--gold);
    text-transform: uppercase;
    font-family: 'Space Mono', monospace;
    opacity: 0.8;
  }

  /* ── VARIANT 3: Compact Badge ── */
  .logo-v3 {
    display: flex;
    align-items: center;
    gap: 0;
    border: 1px solid var(--cyan);
    padding: 12px 24px;
    position: relative;
    overflow: hidden;
  }

  .logo-v3::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--dim-cyan), transparent 60%);
    pointer-events: none;
  }

  .logo-v3::after {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 60%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    animation: scan-line 3s linear infinite;
  }

  @keyframes scan-line {
    to { left: 200%; }
  }

  .badge-bracket {
    font-family: 'JetBrains Mono', monospace;
    font-size: 28px;
    font-weight: 300;
    color: var(--cyan);
    opacity: 0.7;
    line-height: 1;
  }

  .badge-name {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 1px;
    padding: 0 4px;
  }

  .badge-dot {
    width: 6px;
    height: 6px;
    background: var(--gold);
    border-radius: 50%;
    margin: 0 2px;
    box-shadow: 0 0 8px var(--gold);
    animation: dot-pulse 1.8s ease-in-out infinite;
  }

  @keyframes dot-pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.7); }
  }

  /* Section labels */
  .section-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 4px;
    color: #ffffff30;
    text-transform: uppercase;
    border-top: 1px solid #ffffff10;
    padding-top: 8px;
    width: 100%;
    text-align: center;
  }

  /* Scanline overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,212,232,0.015) 2px,
      rgba(0,212,232,0.015) 4px
    );
    pointer-events: none;
    z-index: 999;
  }

  /* Glow behind icon */
  .icon-glow {
    position: absolute;
    inset: -10px;
    background: radial-gradient(circle, var(--dim-cyan) 0%, transparent 70%);
    border-radius: 50%;
    animation: glow-pulse 3s ease-in-out infinite;
  }

  @keyframes glow-pulse {
    0%, 100% { opacity: 0.5; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.15); }
  }
</style>
</head>
<body>

<!-- VARIANT 1: Hero Glitch Wordmark -->
<div class="logo-v1">
  <div class="binary-strip">01100011 01101111 01100100 01100101</div>
  <div class="wordmark" data-text="codencode">
    <span class="accent">code</span><span class="dot">.</span>ncode
  </div>
  <div class="tagline">Experienced Multilingual Academy</div>
  <div class="brackets">[ _ ]</div>
</div>

<div class="section-label">variant 01 — glitch wordmark</div>

<!-- VARIANT 2: Icon + Horizontal -->
<div class="logo-v2">
  <div class="icon-mark">
    <div class="icon-glow"></div>
    <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="glow">
          <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
          <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <!-- Outer hex ring -->
      <polygon points="32,4 56,18 56,46 32,60 8,46 8,18"
        stroke="#00d4e8" stroke-width="1.5" fill="none" opacity="0.4"
        style="animation: hex-spin 8s linear infinite; transform-origin: 32px 32px"/>
      <!-- Inner hex -->
      <polygon points="32,12 50,22 50,42 32,52 14,42 14,22"
        stroke="#00d4e8" stroke-width="1" fill="#00d4e808"
        style="animation: hex-spin 8s linear infinite reverse; transform-origin: 32px 32px"/>
      <!-- Code brackets -->
      <text x="32" y="37" text-anchor="middle" font-family="JetBrains Mono" font-size="16" font-weight="800" fill="#ffffff" filter="url(#glow)">&lt;/&gt;</text>
      <!-- Corner dots -->
      <circle cx="32" cy="4" r="2.5" fill="#f5c842" style="animation: corner-blink 2s steps(1) infinite"/>
      <circle cx="56" cy="18" r="1.5" fill="#00d4e8" opacity="0.6"/>
      <circle cx="56" cy="46" r="1.5" fill="#00d4e8" opacity="0.6"/>
      <circle cx="32" cy="60" r="2.5" fill="#f5c842" style="animation: corner-blink 2s steps(1) 1s infinite"/>
      <circle cx="8" cy="46" r="1.5" fill="#00d4e8" opacity="0.6"/>
      <circle cx="8" cy="18" r="1.5" fill="#00d4e8" opacity="0.6"/>
    </svg>
  </div>
  <div class="v2-text">
    <div class="v2-name">cod<span>en</span>code</div>
    <div class="v2-sub">coding academy</div>
  </div>
</div>

<style>
  @keyframes hex-spin {
    to { transform: rotate(360deg); }
  }
  @keyframes corner-blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
  }
</style>

<div class="section-label">variant 02 — icon + wordmark</div>

<!-- VARIANT 3: Compact Badge -->
<div class="logo-v3">
  <span class="badge-bracket">{</span>
  <span class="badge-name">codencode</span>
  <div class="badge-dot"></div>
  <span class="badge-name">my</span>
  <span class="badge-bracket">}</span>
</div>

<div class="section-label">variant 03 — badge / compact</div>

</body>
</html>
