<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Present · codencode.my</title>
<link rel="icon" href="/favicon.ico">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: #eee;
    font: 14px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; user-select: none; }
  #stage iframe { width: 100%; height: 100%; border: 0; background: #000; }
  #msg { padding: 24px; text-align: center; color: #aaa; }
  #bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
    display: flex; gap: 6px; align-items: center; padding: 6px; border-radius: 12px;
    background: rgba(20,20,20,.82); box-shadow: 0 4px 20px rgba(0,0,0,.5);
    transition: opacity .3s; z-index: 5; }
  body.idle #bar { opacity: 0; pointer-events: none; }
  #bar button, #bar a { all: unset; cursor: pointer; padding: 7px 11px; border-radius: 8px;
    color: #ddd; font-size: 13px; white-space: nowrap; }
  #bar button:hover, #bar a:hover { background: rgba(255,255,255,.12); color: #fff; }
  #bar button:disabled { opacity: .35; cursor: default; background: none; }
  #count { padding: 0 8px; font: 500 12px ui-monospace, Consolas, monospace; color: #9aa; min-width: 64px; text-align: center; }
  #bar .sep { width: 1px; align-self: stretch; background: rgba(255,255,255,.15); margin: 4px 2px; }
  @media (max-width: 560px) { #bar { bottom: 8px; } #bar .wide { display: none; } }
</style>
</head>
<body>
<div id="stage"><div id="msg">Loading slides…</div></div>
<div id="bar" hidden>
  <button id="prev" title="Previous (←)">&#8592;</button>
  <span id="count"></span>
  <button id="next" title="Next (→ or Space)">&#8594;</button>
  <span class="sep"></span>
  <button id="mode" class="wide" hidden></button>
  <button id="fs" title="Full screen (F)">Full screen</button>
  <a id="close" href="/lms" title="Back to the LMS">Close</a>
</div>
<script>
(function () {
  const mid = (location.pathname.match(/\/present\/(\d+)/) || [])[1];
  const stage = document.getElementById('stage');
  const bar = document.getElementById('bar');
  const $ = id => document.getElementById(id);
  let slides = [], i = 0, d = null, embed = false;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  function render() {
    const useEmbed = embed || !slides.length;
    $('prev').hidden = $('next').hidden = $('count').hidden = useEmbed;
    if (useEmbed) {
      stage.innerHTML = `<iframe src="${esc(d.file_url)}" title="${esc(d.title)}" allow="fullscreen" allowfullscreen></iframe>`;
    } else {
      stage.innerHTML = `<img src="${esc(slides[i].image_url)}" alt="Slide ${i + 1}">`;
      $('count').textContent = `${i + 1} / ${slides.length}`;
      $('prev').disabled = i === 0;
      $('next').disabled = i === slides.length - 1;
      // Warm the next slide so moving on is instant.
      if (slides[i + 1]) new Image().src = slides[i + 1].image_url;
    }
    $('mode').textContent = embed ? 'Slides' : 'Interactive version';
    try { history.replaceState(null, '', useEmbed ? '#embed' : '#' + (i + 1)); } catch (e) {}
  }
  function go(n) {
    if (embed || !slides.length) return;
    const j = Math.max(0, Math.min(slides.length - 1, n));
    if (j !== i) { i = j; render(); }
  }
  function fullscreen() {
    if (document.fullscreenElement) return document.exitFullscreen();
    const r = document.documentElement.requestFullscreen;
    if (r) r.call(document.documentElement).catch(() => {});
  }

  $('prev').onclick = () => go(i - 1);
  $('next').onclick = () => go(i + 1);
  $('fs').onclick = fullscreen;
  $('mode').onclick = () => { embed = !embed; render(); };

  document.addEventListener('keydown', e => {
    const k = e.key;
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].includes(k)) { go(i + 1); e.preventDefault(); }
    else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(k)) { go(i - 1); e.preventDefault(); }
    else if (k === 'Home') go(0);
    else if (k === 'End') go(slides.length - 1);
    else if (k === 'f' || k === 'F') fullscreen();
  });
  stage.addEventListener('click', e => {
    if (e.target.tagName !== 'IMG') return;
    go(e.clientX > innerWidth / 2 ? i + 1 : i - 1);
  });
  // Hide the toolbar while presenting; show it again on mouse movement.
  let t = null;
  const wake = () => { document.body.classList.remove('idle'); clearTimeout(t);
    t = setTimeout(() => document.body.classList.add('idle'), 2500); };
  ['mousemove', 'touchstart', 'keydown'].forEach(ev => document.addEventListener(ev, wake, { passive: true }));

  fetch(`/api/lms/material/${mid}`, { credentials: 'same-origin' })
    .then(r => r.ok ? r.json() : r.json().then(j => Promise.reject(j.error || r.status), () => Promise.reject(r.status)))
    .then(data => {
      d = data;
      document.title = `${d.title} · Present`;
      slides = (d.slides || []).filter(s => s.image_url);
      $('mode').hidden = !(slides.length && d.file_type === 'embed');
      const h = location.hash.slice(1);
      if (h === 'embed' && !$('mode').hidden) embed = true;
      else if (/^\d+$/.test(h)) i = Math.max(0, Math.min(slides.length - 1, +h - 1));
      bar.hidden = false;
      render(); wake();
    })
    .catch(err => { stage.innerHTML = `<div id="msg">Couldn't open this lesson (${esc(err)}).<br><a href="/lms" style="color:#8fd">Back to the LMS</a></div>`; });
})();
</script>
</body>
</html>
